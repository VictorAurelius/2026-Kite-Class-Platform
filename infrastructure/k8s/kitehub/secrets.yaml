# KiteHub Secrets Template
# IMPORTANT: Replace base64-encoded values with actual secrets before applying
# Use: echo -n "your-secret" | base64

apiVersion: v1
kind: Secret
metadata:
  name: kitehub-database
  namespace: kitehub
type: Opaque
data:
  url: "REPLACE_WITH_BASE64" # jdbc:postgresql://host:5432/kitehub
  username: "REPLACE_WITH_BASE64"
  password: "REPLACE_WITH_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: kitehub-rabbitmq
  namespace: kitehub
type: Opaque
data:
  username: "REPLACE_WITH_BASE64"
  password: "REPLACE_WITH_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: kitehub-redis
  namespace: kitehub
type: Opaque
data:
  password: "REPLACE_WITH_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: kitehub-openai
  namespace: kitehub
type: Opaque
data:
  api-key: "REPLACE_WITH_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: kitehub-aws
  namespace: kitehub
type: Opaque
data:
  access-key-id: "REPLACE_WITH_BASE64"
  secret-access-key: "REPLACE_WITH_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: kitehub-jwt
  namespace: kitehub
type: Opaque
data:
  secret: "REPLACE_WITH_BASE64" # 256-bit key for JWT signing
