apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitehub-branding
  namespace: kitehub
  labels:
    app: kitehub-branding
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kitehub-branding
  template:
    metadata:
      labels:
        app: kitehub-branding
        version: v1.0.0
    spec:
      # GAP-470 (Wave 61 Bucket E) — non-root, hardened pod context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: branding
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/kitehub/branding:latest
        imagePullPolicy: Always
        # GAP-470 — container hardening: drop all Linux capabilities, ban privilege
        # escalation, mount root filesystem read-only (tmp/cache volumes mounted below).
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: kitehub-database
              key: url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: kitehub-database
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kitehub-database
              key: password
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: kitehub-config
              key: rabbitmq.host
        - name: SPRING_RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: kitehub-config
              key: rabbitmq.port
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: kitehub-rabbitmq
              key: username
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kitehub-rabbitmq
              key: password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kitehub-openai
              key: api-key
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: kitehub-aws
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: kitehub-aws
              key: secret-access-key
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: kitehub-config
              key: aws.region
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: kitehub-config
              key: s3.bucket
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # GAP-470 — writable scratch dirs because rootFS is read-only.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kitehub-branding
  namespace: kitehub
  labels:
    app: kitehub-branding
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: kitehub-branding
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kitehub-branding-hpa
  namespace: kitehub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kitehub-branding
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
