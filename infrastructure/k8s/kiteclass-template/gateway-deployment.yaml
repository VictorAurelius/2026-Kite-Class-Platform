# KiteClass Gateway Deployment Template
# Replace all {{VARIABLE}} placeholders before applying

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiteclass-gateway
  namespace: kiteclass-{{INSTANCE_ID}}
  labels:
    app: kiteclass-gateway
    instance-id: "{{INSTANCE_ID}}"
    version: "{{KITECLASS_VERSION}}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kiteclass-gateway
      instance-id: "{{INSTANCE_ID}}"
  template:
    metadata:
      labels:
        app: kiteclass-gateway
        instance-id: "{{INSTANCE_ID}}"
        version: "{{KITECLASS_VERSION}}"
    spec:
      containers:
      - name: gateway
        image: {{ECR_REGISTRY}}/kiteclass/gateway:{{KITECLASS_VERSION}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: INSTANCE_ID
          value: "{{INSTANCE_ID}}"
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: kiteclass-config
              key: redis.host
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: kiteclass-config
              key: redis.port
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kiteclass-jwt
              key: secret
        - name: CORE_SERVICE_URL
          value: "http://kiteclass-core:8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kiteclass-gateway
  namespace: kiteclass-{{INSTANCE_ID}}
  labels:
    app: kiteclass-gateway
    instance-id: "{{INSTANCE_ID}}"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: kiteclass-gateway
    instance-id: "{{INSTANCE_ID}}"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kiteclass-gateway-hpa
  namespace: kiteclass-{{INSTANCE_ID}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kiteclass-gateway
  minReplicas: 2
  maxReplicas: {{HPA_MAX_REPLICAS}}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
