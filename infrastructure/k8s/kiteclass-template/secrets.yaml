# KiteClass Instance Secrets Template
# IMPORTANT: These will be populated by KiteHub InstanceProvisioningService
# Do NOT commit actual secrets to version control

apiVersion: v1
kind: Secret
metadata:
  name: kiteclass-database
  namespace: kiteclass-{{INSTANCE_ID}}
  labels:
    app: kiteclass
    instance-id: "{{INSTANCE_ID}}"
type: Opaque
data:
  # These will be base64-encoded by KiteHub when creating the instance
  url: "{{DATABASE_URL_BASE64}}" # jdbc:postgresql://host:5432/kiteclass_{{INSTANCE_ID_SHORT}}
  username: "{{DATABASE_USERNAME_BASE64}}"
  password: "{{DATABASE_PASSWORD_BASE64}}"
---
apiVersion: v1
kind: Secret
metadata:
  name: kiteclass-jwt
  namespace: kiteclass-{{INSTANCE_ID}}
  labels:
    app: kiteclass
    instance-id: "{{INSTANCE_ID}}"
type: Opaque
data:
  # 256-bit secret for JWT signing (unique per instance)
  secret: "{{JWT_SECRET_BASE64}}"
