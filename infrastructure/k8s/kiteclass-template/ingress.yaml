# KiteClass Instance Ingress Template
# Exposes the instance at {{SUBDOMAIN}}.kitehub.me

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiteclass-ingress
  namespace: kiteclass-{{INSTANCE_ID}}
  labels:
    app: kiteclass
    instance-id: "{{INSTANCE_ID}}"
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://{{SUBDOMAIN}}.kitehub.me"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Rate Limiting (tier-based)
    nginx.ingress.kubernetes.io/limit-rps: "{{RATE_LIMIT_RPS}}"

    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "{{MAX_UPLOAD_SIZE}}" # 10m for FREE/BASIC, 100m for PREMIUM/ENTERPRISE

    # SSL/TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

spec:
  tls:
  - hosts:
    - "{{SUBDOMAIN}}.kitehub.me"
    secretName: kiteclass-tls-{{INSTANCE_ID}}
  rules:
  - host: "{{SUBDOMAIN}}.kitehub.me"
    http:
      paths:
      # Frontend (Next.js)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kiteclass-frontend
            port:
              number: 3000
      # API → direct to core (kiteclass-gateway removed per ADR-032 / GAP-001;
      # Phase 2 EKS routing redesign may add shared kite-gateway here)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: kiteclass-core
            port:
              number: 8081
