{{- $tierConfig := index .Values.tiers .Values.tier }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiteclass-core-{{ .Values.instanceId | trunc 8 }}
  labels:
    app: kiteclass-core
    instance: {{ .Values.instanceId }}
    tier: {{ .Values.tier }}
spec:
  replicas: {{ $tierConfig.replicas }}
  selector:
    matchLabels:
      app: kiteclass-core
      instance: {{ .Values.instanceId }}
  template:
    metadata:
      labels:
        app: kiteclass-core
        instance: {{ .Values.instanceId }}
        tier: {{ .Values.tier }}
    spec:
      # GAP-470 (Wave 61 Bucket E) — non-root, hardened pod context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: "{{ .Values.image.registry }}/kiteclass-core:{{ .Values.image.tag }}"
          # GAP-470 — container hardening.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: INSTANCE_ID
              value: {{ .Values.instanceId | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kiteclass-{{ .Values.instanceId | trunc 8 }}-secrets
                  key: db-password
          resources:
            requests:
              cpu: {{ $tierConfig.cpu.request }}
              memory: {{ $tierConfig.memory.request }}
            limits:
              cpu: {{ $tierConfig.cpu.limit }}
              memory: {{ $tierConfig.memory.limit }}
          # GAP-431 — startupProbe protects against Flyway migration cold-start delay
          # (15-45s typical). Window = failureThreshold × periodSeconds = 30 × 5s = 150s.
          # While startupProbe is failing, liveness/readiness probes are disabled, so a
          # slow Spring Boot + Flyway boot cannot trigger restart loops on first deploy.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          # GAP-470 — writable scratch dirs because rootFS is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
