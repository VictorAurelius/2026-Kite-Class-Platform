{{- range $name, $svc := dict "gateway" .Values.gateway "subscription" .Values.subscription "branding" .Values.branding "admin" .Values.admin "email" .Values.email "frontend" .Values.frontend }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitehub-{{ $name }}
  labels:
    app: kitehub-{{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: kitehub-{{ $name }}
  template:
    metadata:
      labels:
        app: kitehub-{{ $name }}
    spec:
      # GAP-470 (Wave 61 Bucket E) — non-root, hardened pod context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.image.registry }}/{{ $svc.image.name }}:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          # GAP-470 — container hardening: drop caps, ban privesc, read-only rootFS.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ $svc.port }}
          env:
            # GAP-503 / Wave 85 Bucket E — JVM container ergonomics (E-AC1).
            # MaxRAMPercentage=60.0 (override 75% per Bucket A simulation cell 5):
            #   - 60% of 2GB container limit (t3.small) → 1.2GB heap + 400MB non-heap
            #     = 1.6GB total, leaves 400MB headroom (avoid OOM thrash GAP-502).
            #   - 75% would leave ZERO headroom (1.5GB heap + 400MB non-heap = 1.9GB / 2GB).
            # InitialRAMPercentage matches MaxRAMPercentage to avoid heap resize churn.
            # UseContainerSupport: respect cgroup memory limit (default since JDK 10+ but explicit).
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=60.0"
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SERVER_PORT
              value: "{{ $svc.port }}"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $.Values.global.database.host }}:{{ $.Values.global.database.port }}/{{ $.Values.global.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ $.Values.global.database.username }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: jwt-secret
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: encryption-key
            {{- if eq $name "branding" }}
            # S3/CDN configuration for branding service
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: s3-secret-key
            - name: S3_BUCKET
              value: "{{ $.Values.global.s3.bucket }}"
            - name: AWS_REGION
              value: "{{ $.Values.global.s3.region }}"
            - name: S3_ENDPOINT
              value: ""  # Empty for real AWS S3 (not MinIO)
            - name: CDN_DOMAIN
              value: "cdn.kiteclass.com"  # Production CDN domain
            - name: S3_MOCK_MODE
              value: "false"  # Use real S3 in production
            - name: AI_PROVIDER
              value: "{{ $.Values.global.ai.provider }}"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: openai-api-key
            # GAP-386 / BR-QUALITY-001 — externalized quality-gate threshold.
            # Defaults to chart values.yaml branding.qualityGate.passThreshold (70).
            - name: QUALITY_GATE_PASS_THRESHOLD
              value: "{{ $.Values.branding.qualityGate.passThreshold | default 70 }}"
            {{- end }}
            {{- if eq $name "email" }}
            # AWS SES configuration for email service
            - name: EMAIL_PROVIDER
              value: "ses"
            - name: AWS_SES_REGION
              value: "{{ $.Values.global.aws.region }}"
            - name: AWS_SES_FROM_EMAIL
              value: "noreply@kiteclass.com"
            - name: AWS_SES_FROM_NAME
              value: "KiteClass Platform"
            - name: AWS_SES_MOCK_MODE
              value: "false"  # Use real SES in production
            # AWS credentials from secrets (or use IAM role)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: aws-access-key-id
                  optional: true  # Optional if using IAM role
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kitehub-secrets
                  key: aws-secret-access-key
                  optional: true  # Optional if using IAM role
            {{- end }}
          resources:
            requests:
              cpu: {{ $svc.resources.requests.cpu }}
              memory: {{ $svc.resources.requests.memory }}
            limits:
              cpu: {{ $svc.resources.limits.cpu }}
              memory: {{ $svc.resources.limits.memory }}
          # GAP-431 — startupProbe protects against Flyway migration cold-start delay.
          # GAP-503 / Wave 85 Bucket E: initialDelaySeconds bumped 30s → 120s matching
          # Wave 81 Bucket F observed Spring Boot startup 25-46s + JVM 60% memory ramp-up.
          # Window = initialDelay + (failureThreshold × periodSeconds) = 120 + 30 × 5s = 270s.
          # While startupProbe is failing, liveness/readiness probes are disabled, so a
          # slow Spring Boot + Flyway boot cannot trigger restart loops on first deploy.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 120
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          # GAP-470 — writable scratch dirs because rootFS is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "frontend" }}
            - name: nextjs-cache
              mountPath: /.next/cache
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "frontend" }}
        - name: nextjs-cache
          emptyDir: {}
        {{- end }}
{{- end }}
