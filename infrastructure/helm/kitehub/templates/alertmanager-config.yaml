{{- if .Values.monitoring.enabled }}
{{- /*
  Bind the deeply-nested subchart values to a short local variable so the
  template body stays readable. The subchart alias name contains hyphens, so
  we must use `index` once at the top instead of dot notation.
*/ -}}
{{- $am := (index .Values.monitoring "kube-prometheus-stack").alertmanager -}}
---
# GAP-144 / GAP-467 / ADR-022 — Alertmanager runtime configuration.
#
# This template renders the Alertmanager `alertmanager.yaml` config into a
# Secret consumed by the kube-prometheus-stack Alertmanager StatefulSet via
# `alertmanager.alertmanagerSpec.configSecret` (see values.yaml).
#
# Two modes, controlled by $am.receivers.production.enabled:
#
#   1. production.enabled=false (DEFAULT) — placeholder receivers pointing at
#      *.invalid hosts. Alertmanager starts cleanly; alerts SILENTLY DROP.
#      Foundation parity for dev / local installs without AWS credentials.
#
#   2. production.enabled=true — receivers reference files mounted from the
#      `alertmanager-receivers` Secret materialized by ExternalSecret (sourced
#      from AWS Secrets Manager per ADR-022). Slack via api_url_file,
#      PagerDuty via service_key_file, email via smtp_auth_password_file.
#
# Activation (production):
#   helm upgrade ... \
#     --set monitoring.enabled=true \
#     --set monitoring.alertmanager.receivers.production.enabled=true
#
# This template was extracted from values.yaml in Wave 57 Bucket A (GAP-467)
# because Helm v3 does NOT process Go templates in values.yaml -- the embedded
# go-template if-blocks broke helm lint chart-wide.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kitehub
  labels:
    app: kitehub
    component: alertmanager
    release: {{ .Release.Name }}
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_from: "alerts@kitehub.me"
      {{- if $am.receivers.production.enabled }}
      # AWS SES SMTP endpoint. Host + username sourced from
      # alertmanager-receivers Secret keys (smtp-host / smtp-username) via
      # ExternalSecret. Operators inject the values into values-<env>.yaml at
      # deploy time. See runbook
      # documents/05-guides/operations/runbooks/alertmanager-mock-fire-runbook.md §3.2.
      smtp_smarthost: {{ $am.smtp.smarthost | default (printf "email-smtp.%s.amazonaws.com:587" ($am.smtp.region | default "us-east-1")) | quote }}
      smtp_auth_username: {{ $am.smtp.authUsername | default "alerts@kitehub.me" | quote }}
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-receivers/smtp-password"
      {{- else }}
      # Placeholder — switched to AWS SES when receivers.production.enabled=true.
      smtp_smarthost: "smtp.placeholder.invalid:587"
      {{- end }}
      smtp_require_tls: true

    route:
      group_by: ["alertname", "severity", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "default-webhook"
      routes:
        - matchers:
            - severity = "critical"
          receiver: "critical-webhook"
          continue: true
        - matchers:
            - severity = "warning"
          receiver: "warning-email"

    receivers:
      {{- if $am.receivers.production.enabled }}
      # Production receivers — credentials read from files mounted from
      # alertmanager-receivers Secret (sourced via ExternalSecret + AWS SM).
      - name: "default-webhook"
        slack_configs:
          - api_url_file: "/etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url"
            channel: {{ $am.receivers.production.slack.channel | default "#alerts" | quote }}
            send_resolved: true
            title: "[{{ `{{ .Status | toUpper }}` }}] {{ `{{ .CommonLabels.alertname }}` }}"
            text: "{{ `{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}\n{{ end }}` }}"

      - name: "critical-webhook"
        pagerduty_configs:
          - service_key_file: "/etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key"
            send_resolved: true
            description: "{{ `{{ .CommonLabels.alertname }}` }}: {{ `{{ .CommonAnnotations.summary }}` }}"
            severity: "{{ `{{ if eq .CommonLabels.severity \"critical\" }}critical{{ else }}error{{ end }}` }}"
            client: "kitehub-alertmanager"

      - name: "warning-email"
        email_configs:
          - to: {{ $am.receivers.production.email.to | default "ops@kitehub.me" | quote }}
            send_resolved: true
            headers:
              Subject: "[{{ `{{ .Status | toUpper }}` }}] {{ `{{ .CommonLabels.alertname }}` }} — kitehub"
      {{- else }}
      # Foundation placeholders — *.invalid hosts mean alerts silently drop.
      # Switch to production receivers via receivers.production.enabled=true.
      - name: "default-webhook"
        webhook_configs:
          - url: "http://alertmanager-webhook-placeholder.invalid/default"
            send_resolved: true

      - name: "critical-webhook"
        webhook_configs:
          - url: "http://alertmanager-webhook-placeholder.invalid/critical"
            send_resolved: true

      - name: "warning-email"
        email_configs:
          - to: "ops@kitehub.me"
            send_resolved: true
      {{- end }}

    # Inhibition: suppress dependent alerts when ServiceDown is firing for
    # the same job (avoids alert storm). Verified for GAP-144 AC.
    inhibit_rules:
      - source_matchers:
          - alertname = "ServiceDown"
        target_matchers:
          - severity =~ "warning|critical"
        equal: ["job"]
      # HighErrorRate inhibited when ServiceDown is firing for the same job —
      # explicit pairing to satisfy GAP-144 AC; equivalent to the catch-all
      # above but documents the intent for reviewers.
      - source_matchers:
          - alertname = "ServiceDown"
        target_matchers:
          - alertname = "HighErrorRate"
        equal: ["job"]
{{- end }}
