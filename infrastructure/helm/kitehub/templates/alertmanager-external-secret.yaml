{{- if and .Values.monitoring.enabled .Values.monitoring.alertmanager.receivers.production.enabled }}
---
# GAP-144 / ADR-022 — Alertmanager production receiver credentials.
#
# External Secrets Operator (ESO) materializes a k8s Secret named
# `alertmanager-receivers` from AWS Secrets Manager. Alertmanager mounts the
# Secret as files and references them via *_file: directives in
# values.yaml -> monitoring.kube-prometheus-stack.alertmanager.config.
#
# Prerequisites (per cluster, one-time):
#   1. external-secrets-operator installed
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
#   2. ClusterSecretStore named per .Values.monitoring.alertmanager.receivers.production.secretStoreRef.name
#      pointing at AWS Secrets Manager in target region with IRSA permissions
#      (secretsmanager:GetSecretValue + DescribeSecret on
#      "kitehub/<env>/alertmanager/*").
#   3. Three AWS Secrets Manager secrets populated:
#      - kitehub/<env>/alertmanager/slack-webhook  (string — full Slack webhook URL)
#      - kitehub/<env>/alertmanager/pagerduty-key  (string — PagerDuty Events API routing key)
#      - kitehub/<env>/alertmanager/smtp-password  (string — SES SMTP password)
#
# Gating: this template renders ONLY when both
#   monitoring.enabled=true
#   monitoring.alertmanager.receivers.production.enabled=true
# Dev / local installs without AWS skip it entirely.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  labels:
    app: kitehub
    component: alertmanager
    release: {{ .Release.Name }}
spec:
  # Refresh every 1h — picks up rotation in AWS SM without pod restart.
  # Alertmanager re-reads *_file: paths on SIGHUP / next config reload.
  refreshInterval: {{ .Values.monitoring.alertmanager.receivers.production.refreshInterval | default "1h" | quote }}

  secretStoreRef:
    name: {{ .Values.monitoring.alertmanager.receivers.production.secretStoreRef.name | default "aws-secrets-manager" }}
    kind: {{ .Values.monitoring.alertmanager.receivers.production.secretStoreRef.kind | default "ClusterSecretStore" }}

  target:
    name: alertmanager-receivers
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: {{ printf "kitehub/%s/alertmanager/slack-webhook" (.Values.monitoring.alertmanager.receivers.production.environment | default "prod") | quote }}
    - secretKey: pagerduty-routing-key
      remoteRef:
        key: {{ printf "kitehub/%s/alertmanager/pagerduty-key" (.Values.monitoring.alertmanager.receivers.production.environment | default "prod") | quote }}
    - secretKey: smtp-password
      remoteRef:
        key: {{ printf "kitehub/%s/alertmanager/smtp-password" (.Values.monitoring.alertmanager.receivers.production.environment | default "prod") | quote }}
{{- end }}
