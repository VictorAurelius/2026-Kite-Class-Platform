{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
---
# PrometheusRule mirrors kitehub/docker/prometheus/alert-rules.yml so the same
# 7 alerts fire in production. Keep expressions in sync if you edit either file.
# Tracked in GAP-144 (alert tuning + secret wiring) for follow-up changes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kitehub-service-alerts
  labels:
    app: kitehub
    release: {{ .Release.Name }}
spec:
  groups:
    - name: kitehub-service-alerts
      rules:
        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ "{{ $labels.job }}" }} is down"
            description: "{{ "{{ $labels.job }}" }} (instance {{ "{{ $labels.instance }}" }}) has been unreachable for more than 1 minute."
            runbook_url: "/documents/05-guides/operations/runbooks/service-down.md"

        - alert: HighErrorRate
          expr: |
            (
              sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              /
              sum by (job) (rate(http_server_requests_seconds_count[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ "{{ $labels.job }}" }}"
            description: "{{ "{{ $labels.job }}" }} has more than 5% server error responses over the last 5 minutes (current value: {{ "{{ $value | humanizePercentage }}" }})."
            runbook_url: "/documents/05-guides/operations/runbooks/high-error-rate.md"

        - alert: HighResponseTime
          expr: |
            histogram_quantile(0.99,
              sum by (job, le) (rate(http_server_requests_seconds_bucket[5m]))
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p99 response time on {{ "{{ $labels.job }}" }}"
            description: "{{ "{{ $labels.job }}" }} p99 response time is above 2 seconds for the last 5 minutes (current value: {{ "{{ $value | humanizeDuration }}" }})."
            runbook_url: "/documents/05-guides/operations/runbooks/high-response-time.md"

        - alert: HighMemoryUsage
          expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High JVM heap usage on {{ "{{ $labels.job }}" }}"
            description: "JVM heap usage is {{ "{{ $value | humanizePercentage }}" }} on {{ "{{ $labels.instance }}" }}"
            runbook_url: "/documents/05-guides/operations/runbooks/high-memory-usage.md"

        - alert: DatabasePoolExhausted
          expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "DB connection pool near exhaustion on {{ "{{ $labels.job }}" }}"
            description: "Active connections are {{ "{{ $value | humanizePercentage }}" }} of max on {{ "{{ $labels.instance }}" }}"
            runbook_url: "/documents/05-guides/operations/runbooks/database-pool-exhausted.md"

        - alert: HighDiskUsage
          expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High disk usage on {{ "{{ $labels.instance }}" }}"
            description: "Disk usage is {{ "{{ $value | humanizePercentage }}" }} on {{ "{{ $labels.instance }}" }} ({{ "{{ $labels.mountpoint }}" }})"
            runbook_url: "/documents/05-guides/operations/runbooks/high-disk-usage.md"

        - alert: RabbitMQQueueBacklog
          expr: rabbitmq_queue_messages_ready > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ queue backlog on {{ "{{ $labels.queue }}" }}"
            description: "Queue {{ "{{ $labels.queue }}" }} has {{ "{{ $value }}" }} messages ready (threshold: 1000)"
            runbook_url: "/documents/05-guides/operations/runbooks/rabbitmq-queue-backlog.md"

    # GAP-217 — Wave 5 document-generation endpoints (Sub-PR 5.5).
    # Routing depends on Alertmanager deployment (GAP-120). Until that ships, these rules
    # fire silently; on-call still escalates via the generic alerts above.
    # Per-endpoint signals are needed because /api/v1/documents/* has different latency
    # SLOs than other endpoints (BR-DOC-PDF-007 budget: 2s p95 for invoice render).
    - name: kiteclass-document-generation-alerts
      rules:
        - alert: DocumentGenerationHighP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/documents/.*"}[5m]))
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: kiteclass-core
          annotations:
            summary: "Document generation p95 latency exceeds BR-DOC-PDF-007 budget"
            description: "POST /api/v1/documents/* p95 is above 2 seconds for 5 minutes (current value: {{ "{{ $value | humanizeDuration }}" }}). Likely cause: branding cache miss storm OR PDF font load regression."
            runbook_url: "/documents/05-guides/operations/runbooks/pdf-generation-font-not-found.md"

        - alert: DocumentGenerationHighErrorRate
          expr: |
            (
              sum (rate(http_server_requests_seconds_count{uri=~"/api/v1/documents/.*",status=~"5.."}[5m]))
              /
              sum (rate(http_server_requests_seconds_count{uri=~"/api/v1/documents/.*"}[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            service: kiteclass-core
          annotations:
            summary: "5xx rate on /api/v1/documents/* exceeds 1%"
            description: "Document generation endpoints returning {{ "{{ $value | humanizePercentage }}" }} server errors over 5 minutes. Common cause: missing DejaVuSans TTF in deployed image."
            runbook_url: "/documents/05-guides/operations/runbooks/pdf-generation-font-not-found.md"

        - alert: DocumentBrandingCacheMissStorm
          # Depends on Spring Cache Micrometer metrics (GAP-219 P1 sub-bullet 4).
          # Until those metrics are wired, this rule will not have data — it is filed
          # here to capture the alert intent alongside its peers.
          expr: rate(spring_cache_misses_total{cache="branding-by-tenant"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
            service: kiteclass-core
          annotations:
            summary: "branding-by-tenant cache miss rate elevated"
            description: "Cache miss rate above 10/s for 5 minutes — possible eviction storm or post-deploy cold start. Each miss hits PostgreSQL via BrandingService.getBranding()."
            runbook_url: "/documents/05-guides/operations/runbooks/branding-cache-miss-storm.md"

    # GAP-135 — per-SLO-tier API latency rules (Wave perf-D Agent D, 2026-04-26).
    # Tier budgets sourced from documents/05-guides/monitoring/api-performance-slo.md §2.
    # The `slo` label is supplied by class-level @Timed extraTags on
    # selected controllers (see GAP-135 follow-up gap for the rest).
    # Endpoints without the `slo` label fall back to the generic
    # HighResponseTime alert above.
    - name: api-latency-slo-alerts
      rules:
        - alert: ApiLatencyP95HighTierA
          expr: |
            histogram_quantile(0.95,
              sum by (le, slo, uri) (rate(http_server_requests_seconds_bucket{slo="tier-a"}[5m]))
            ) > 0.2
          for: 10m
          labels:
            severity: warning
            slo: tier-a
          annotations:
            summary: "Tier A endpoint p95 above 200 ms budget"
            description: "{{ "{{ $labels.uri }}" }} (slo=tier-a) p95 is {{ "{{ $value | humanizeDuration }}" }} for the last 10 minutes — exceeds 200 ms interactive-read budget. See documents/05-guides/monitoring/api-performance-slo.md."
            runbook_url: "/documents/05-guides/monitoring/api-performance-slo.md"

        - alert: ApiLatencyP95HighTierB
          expr: |
            histogram_quantile(0.95,
              sum by (le, slo, uri) (rate(http_server_requests_seconds_bucket{slo="tier-b"}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            slo: tier-b
          annotations:
            summary: "Tier B endpoint p95 above 500 ms budget"
            description: "{{ "{{ $labels.uri }}" }} (slo=tier-b) p95 is {{ "{{ $value | humanizeDuration }}" }} for the last 10 minutes — exceeds 500 ms list-page budget."
            runbook_url: "/documents/05-guides/monitoring/api-performance-slo.md"

        - alert: ApiLatencyP95HighTierC
          expr: |
            histogram_quantile(0.95,
              sum by (le, slo, uri) (rate(http_server_requests_seconds_bucket{slo="tier-c"}[5m]))
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            slo: tier-c
          annotations:
            summary: "Tier C endpoint p95 above 800 ms budget"
            description: "{{ "{{ $labels.uri }}" }} (slo=tier-c) p95 is {{ "{{ $value | humanizeDuration }}" }} for the last 10 minutes — exceeds 800 ms write budget."
            runbook_url: "/documents/05-guides/monitoring/api-performance-slo.md"

        - alert: ApiLatencyP95HighTierD
          expr: |
            histogram_quantile(0.95,
              sum by (le, slo, uri) (rate(http_server_requests_seconds_bucket{slo="tier-d"}[5m]))
            ) > 5
          for: 10m
          labels:
            severity: warning
            slo: tier-d
          annotations:
            summary: "Tier D endpoint p95 above 5 s budget"
            description: "{{ "{{ $labels.uri }}" }} (slo=tier-d) p95 is {{ "{{ $value | humanizeDuration }}" }} for the last 10 minutes — exceeds 5 s batch budget."
            runbook_url: "/documents/05-guides/monitoring/api-performance-slo.md"

        - alert: ApiLatencyP99CriticalTierA
          expr: |
            histogram_quantile(0.99,
              sum by (le, slo, uri) (rate(http_server_requests_seconds_bucket{slo="tier-a"}[5m]))
            ) > 0.4
          for: 5m
          labels:
            severity: critical
            slo: tier-a
          annotations:
            summary: "Tier A endpoint p99 critically high"
            description: "{{ "{{ $labels.uri }}" }} (slo=tier-a) p99 is {{ "{{ $value | humanizeDuration }}" }} — Tier A p99 budget is 400 ms. Likely cache miss storm or downstream timeout."
            runbook_url: "/documents/05-guides/monitoring/api-performance-slo.md"

    # GAP-122 — 12 platform-critical alerts (Wave 2026-04-28).
    # 4 critical (page on-call) + 8 warning (Slack). Group is appended NEW; do not edit existing
    # groups above. Mirrors kitehub/docker/prometheus/alert-rules.yml — keep both in sync.
    # Several rules depend on metrics not yet wired (METRIC PENDING) — rules will not produce
    # data until emitter / exporter lands. See wave plan
    # documents/03-planning/waves/wave-2026-04-28-gap-122-platform-alerts.md for full mapping.
    - name: kitehub-platform-alerts
      rules:
        # ── Critical (4) ─────────────────────────────────────────────────────────────

        # METRIC PENDING — depends on `tenant_isolation_violations_total` custom counter,
        # to be emitted from `BaseEntity` tenant-filter when a cross-tenant access is detected.
        - alert: MultiTenantDataLeak
          expr: increase(tenant_isolation_violations_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Tenant isolation violation detected"
            description: "{{ "{{ $value }}" }} cross-tenant access attempt(s) in the last 5 minutes on {{ "{{ $labels.job }}" }}. Data leak risk — investigate the offending request path immediately."
            runbook_url: "/documents/05-guides/operations/runbooks/multi-tenant-data-leak.md"

        # METRIC PENDING — requires `blackbox_exporter` deployment scraping public hostnames.
        - alert: CertExpiryImminent
          expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "TLS cert for {{ "{{ $labels.instance }}" }} expires in <14 days"
            description: "Certificate for {{ "{{ $labels.instance }}" }} expires in {{ "{{ $value | humanizeDuration }}" }}. Renew before expiry — every tenant fronted by this cert will fail TLS handshakes once it lapses."
            runbook_url: "/documents/05-guides/operations/runbooks/cert-expiry-imminent.md"

        # METRIC LIVE — `kite_backup_last_success_timestamp_seconds` (gauge) is emitted by
        # `scripts/backup-production.sh` via Pushgateway after each successful pre-deploy
        # RDS snapshot (GAP-430 Wave 41 Bucket A — fix for metric-name mismatch where the
        # script previously emitted only `kite_backup_snapshots_total`, leaving this alert
        # silent for ~all of Wave 33-40). See GAP-117 backup runbook + GAP-118 versioning
        # workflow for cadence sources.
        # Threshold 90000s = 25h (1h grace beyond the 24h scheduled cadence).
        # `absent()` arm fires if the gauge series itself disappears (script never ran or
        # Pushgateway lost the series), preventing a different silent-failure mode.
        - alert: BackupJobFailure
          expr: |
            (time() - max(kite_backup_last_success_timestamp_seconds) > 90000)
            or
            absent(kite_backup_last_success_timestamp_seconds)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backup job has not succeeded in >25h"
            description: "Last successful backup was {{ "{{ $value | humanizeDuration }}" }} ago — daily cadence is broken. Recovery RPO at risk."
            runbook_url: "/documents/05-guides/operations/runbooks/backup-job-failure.md"

        # METRIC PARTIAL — Spring Boot Actuator publishes `flyway_migrations` gauge tagged by
        # state via `FlywayInitializer`. The `state="failed"` series only appears once a
        # migration has failed at boot.
        - alert: FlywayMigrationFailure
          expr: flyway_migrations{state="failed"} > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Flyway migration failed on {{ "{{ $labels.job }}" }}"
            description: "{{ "{{ $value }}" }} failed migration(s) reported on {{ "{{ $labels.instance }}" }}. Service likely refusing to start clean — investigate Flyway history table + last migration script."
            runbook_url: "/documents/05-guides/operations/runbooks/flyway-migration-failure.md"

        # ── Warning (8) ──────────────────────────────────────────────────────────────

        # METRIC PENDING — depends on `ai_provider_requests_total` custom counter with
        # `outcome={success,failure}` label. Emit from `OllamaClient` / AI Adapter layer per
        # ai-branding-guidelines.md §3 (Adapter pattern wraps vendor-specific failures).
        - alert: AIProviderHighFailureRate
          expr: rate(ai_provider_requests_total{outcome="failure"}[5m]) / clamp_min(rate(ai_provider_requests_total[5m]), 1) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "AI provider failure rate >10% on {{ "{{ $labels.job }}" }}"
            description: "AI provider failure rate is {{ "{{ $value | humanizePercentage }}" }} over the last 5 minutes. Likely cause: Ollama down, model OOM, or upstream API throttling. Branding/AI features will degrade — circuit breaker should already be falling back to template path."
            runbook_url: "/documents/05-guides/operations/runbooks/ai-provider-high-failure-rate.md"

        # Depends on `rabbitmq_exporter` (same dependency as the existing RabbitMQQueueBacklog
        # alert in kitehub-service-alerts). Queue name pattern matches `*.dlq`, `*-dlq`,
        # `*.dead`, `*-dead` — current convention across kitehub services.
        - alert: EmailQueueDLQGrowing
          expr: rabbitmq_queue_messages_ready{queue=~".*[\\.\\-](dlq|dead)"} > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DLQ {{ "{{ $labels.queue }}" }} has >10 messages"
            description: "Queue {{ "{{ $labels.queue }}" }} accumulated {{ "{{ $value }}" }} messages — consumer is rejecting or messages exhausted retry budget. Inspect for poison-pill payload or downstream outage."
            runbook_url: "/documents/05-guides/operations/runbooks/email-queue-dlq-growing.md"

        - alert: SubscriptionWebhookFailure
          expr: (sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/webhooks/.*",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/webhooks/.*"}[5m])), 1)) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Webhook 5xx rate >5%"
            description: "Subscription/billing webhook endpoints returning {{ "{{ $value | humanizePercentage }}" }} server errors over 5 minutes. External providers (payment, email) may retry → eventual delivery — but persistent failure can break renewal/billing flows."
            runbook_url: "/documents/05-guides/operations/runbooks/subscription-webhook-failure.md"

        - alert: TenantProvisioningFailure
          expr: (sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/admin/provisioning.*",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/admin/provisioning.*"}[5m])), 1)) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tenant provisioning 5xx rate >5%"
            description: "/api/v1/admin/provisioning/* endpoints returning {{ "{{ $value | humanizePercentage }}" }} server errors over 5 minutes. New tenant signups failing — revenue impact. Likely Saga step failure or downstream branding/AI timeout."
            runbook_url: "/documents/05-guides/operations/runbooks/tenant-provisioning-failure.md"

        # METRIC PENDING — depends on `branding_quality_gate_total{result}` custom counter
        # emitted from `InstanceQualityReviewer` per ai-branding-guidelines.md §5.
        - alert: BrandingQualityGateFailRate
          expr: rate(branding_quality_gate_total{result="failed"}[10m]) / clamp_min(rate(branding_quality_gate_total[10m]), 1) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Branding quality gate fail rate >20%"
            description: "{{ "{{ $value | humanizePercentage }}" }} of branding quality gates failing over the last 10 minutes — likely AI provider regression, prompt template change, or template asset drift. New tenants will be marked FAILED rather than DEPLOYED."
            runbook_url: "/documents/05-guides/operations/runbooks/branding-quality-gate-fail-rate.md"

        - alert: JwtAuthFailureSpike
          expr: sum(rate(http_server_requests_seconds_count{status="401"}[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "JWT/auth 401 rate >10 req/s"
            description: "401 response rate is {{ "{{ $value }}" }} req/s over 5 minutes — possible credential-stuffing attack, expired keys, or JWT signing config drift. Cross-check ip distribution + tenantId distribution before action."
            runbook_url: "/documents/05-guides/operations/runbooks/jwt-auth-failure-spike.md"

        # METRIC PENDING — requires `redis_exporter` deployment scraping the shared Redis
        # instance (kite-redis). `redis_evicted_keys_total` is published when maxmemory +
        # LRU/LFU policy is configured.
        - alert: RedisEvictionRate
          expr: rate(redis_evicted_keys_total[1m]) > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis eviction rate >1k keys/s on {{ "{{ $labels.instance }}" }}"
            description: "Redis evicting {{ "{{ $value }}" }} keys/s — cache hit-rate will collapse, downstream services hit Postgres directly. Likely cause: maxmemory undersized OR cache miss storm OR runaway producer."
            runbook_url: "/documents/05-guides/operations/runbooks/redis-eviction-rate.md"

        - alert: RateLimitBreachSpike
          expr: sum(rate(http_server_requests_seconds_count{status="429"}[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Rate-limit 429 rate >5 req/s"
            description: "429 response rate is {{ "{{ $value }}" }} req/s over 5 minutes — either a single tenant abusing API OR rate-limit thresholds too tight for legitimate traffic. Cross-check by tenantId before throttling tweaks."
            runbook_url: "/documents/05-guides/operations/runbooks/rate-limit-breach-spike.md"

        # GAP-387 — beta tenant funnel observability (Wave 35 Bucket D).
        # Counters emitted from `BetaAccessService` per submitRequest / approveRequest /
        # rejectRequest / recordHoneypotRejection. See runbooks for triage steps.
        - alert: BetaSignupRateAnomaly
          expr: sum(rate(beta_signup_requests_total[5m])) > 0.83
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Beta signup rate anomaly >50/min sustained"
            description: "Beta signup submission rate is {{ "{{ $value }}" }} req/s over 5 minutes — possible marketing spike, bot ring, or PR-driven surge. Cross-check beta_honeypot_rejections_total + persona breakdown before acting."
            runbook_url: "/documents/05-guides/operations/runbooks/beta-signup-rate-anomaly.md"

        - alert: BetaHoneypotSpike
          expr: sum(rate(beta_honeypot_rejections_total[1h])) > 0.0028
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Beta honeypot rejection rate >10/hour"
            description: "Honeypot anti-bot trap fired at {{ "{{ $value }}" }} req/s over the last hour — bot scanning or distributed botnet probing the public beta-signup endpoint. Tighten gateway rate-limit or rotate honeypot field name."
            runbook_url: "/documents/05-guides/operations/runbooks/beta-honeypot-spike.md"

        # GAP-466 — Multi-tenant Postgres RLS defense-in-depth (Wave 56 Bucket A).
        # `postgres_logs_rls_violations_total` is emitted by the log-shipper sidecar that
        # parses Postgres CSV logs for `row violates row-level security policy "tenant_isolation"`.
        # Wiring of the log-shipper itself is tracked in GAP-115 (log aggregation pipeline);
        # promotion to production fires depends on GAP-115 closure.
        - alert: RLSPolicyViolation
          expr: rate(postgres_logs_rls_violations_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Postgres RLS policy violation detected"
            description: "tenant_isolation policy denied a query at {{ "{{ $value }}" }} req/s — possible developer regression OR active cross-tenant probe. Treat as P0 security incident."
            runbook_url: "/documents/05-guides/operations/runbooks/rls-policy-violation.md"
{{- end }}
