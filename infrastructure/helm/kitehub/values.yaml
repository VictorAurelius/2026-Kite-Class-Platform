# Default values for KiteHub platform
#
# This Helm chart is for AWS (EKS) deployment (backup option).
# Primary deployment: Oracle Cloud with Docker Compose.
# See: documents/03-planning/infrastructure/kitehub-oracle-cloud-deployment.md

global:
  image:
    registry: ""  # ECR registry URL (from terraform output)
    tag: "latest"
    pullPolicy: IfNotPresent

  database:
    host: ""      # RDS endpoint (from terraform output)
    port: 5432
    name: kitehub
    username: kitehub

  redis:
    host: ""      # ElastiCache endpoint (from terraform output)
    port: 6379

  rabbitmq:
    host: ""      # Amazon MQ endpoint
    port: 5672
    username: kitehub

  s3:
    bucket: ""    # S3 bucket name (from terraform output)
    region: ap-southeast-1

  ai:
    provider: openai  # AWS uses OpenAI API (Oracle uses Ollama)
    # openaiApiKey set via secret

  aws:
    region: ap-southeast-1  # Used by email service (SES) — required by deployment.yaml

# --- Services ---

gateway:
  replicas: 2
  image:
    name: kitehub-gateway
  port: 9000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  cors:
    allowedOrigins: "https://kitehub.me,https://www.kitehub.me"

subscription:
  replicas: 2
  image:
    name: kitehub-subscription
  port: 8080
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }

branding:
  replicas: 1
  image:
    name: kitehub-branding
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  # GAP-386 / BR-QUALITY-001 — AI Branding quality gate pass threshold (0..100).
  # Default 70 matches kitehub-branding application.yml + ai-branding-guidelines.md §5.
  # Override per environment / tier (e.g. FREE 65 / ENT 80) without rebuild.
  qualityGate:
    passThreshold: 70

admin:
  replicas: 1
  image:
    name: kitehub-admin
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

email:
  replicas: 1
  image:
    name: kitehub-email
  port: 8080
  resources:
    requests: { cpu: 125m, memory: 256Mi }
    limits:   { cpu: 250m, memory: 512Mi }

frontend:
  replicas: 2
  image:
    name: kitehub-frontend
  port: 3001
  resources:
    requests: { cpu: 125m, memory: 256Mi }
    limits:   { cpu: 250m, memory: 512Mi }

# --- Ingress ---
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ""  # ACM certificate ARN
  hosts:
    - host: kitehub.me
      paths: ["/"]
    - host: api.kitehub.me
      paths: ["/"]

# --- Monitoring (GAP-111 + GAP-120 foundation) ---
#
# Foundation only. Opt-in (enabled=false by default) to avoid breaking existing
# clusters. When enabled, deploys Prometheus + Alertmanager via kube-prometheus-stack
# subchart. Grafana / dashboards / production alert routing tracked in:
#   - GAP-143 (Grafana dashboards in Helm)
#   - GAP-144 (Alertmanager production receivers + secret wiring)
#   - GAP-145 (Loki log aggregation + tracing)
#
# Activation:
#   1. helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   2. helm dependency update infrastructure/helm/kitehub/
#   3. helm install ... --set monitoring.enabled=true
monitoring:
  enabled: false

  # ServiceMonitor objects scrape Spring Boot /actuator/prometheus on each service.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Ports below MUST match service.port values for each Spring Boot app.
    # Frontend (port 3001) excluded — no Prometheus endpoint exposed.
    services:
      - name: kitehub-gateway
        port: 9000
      - name: kitehub-subscription
        port: 8080
      - name: kitehub-branding
        port: 8080
      - name: kitehub-admin
        port: 8080
      - name: kitehub-email
        port: 8080

  # PrometheusRule wires the 7 alert rules from kitehub/docker/prometheus/alert-rules.yml
  # into the Prometheus Operator. Rule definitions intentionally mirror dev config
  # so the same expressions fire in both environments.
  prometheusRule:
    enabled: true

  # GAP-135 + GAP-143 + GAP-115 — Grafana dashboard ConfigMaps.
  # When dashboards.enabled=true the chart packages baseline dashboards
  # (api-latency, jvm-heap-gc, http-traffic, infra-pools, logs-overview)
  # as ConfigMaps labelled `grafana_dashboard=1` so Grafana sidecar
  # auto-imports them. Requires monitoring.grafana.enabled=true (sets the
  # sidecar via subchart).
  #
  # logs-overview (GAP-115 Phase 1) targets a Loki datasource (uid $DS_LOKI).
  # The Loki/Promtail stack itself ships Phase 2 — until then logs panels
  # render "No data" but dashboard URL is stable for the on-call runbook
  # (documents/05-guides/operations/runbooks/monitoring-dashboards.md).
  dashboards:
    enabled: false
    label:
      key: grafana_dashboard
      value: "1"

  # GAP-143 — Grafana visualization layer.
  # Opt-in flag — when true, enables kube-prometheus-stack.grafana subchart
  # (sets grafana.enabled=true below) AND auto-loads baseline dashboards
  # via sidecar discovery. Default off so foundation install (monitoring.enabled
  # alone) stays lean — operators flip this when ready to expose dashboards.
  #
  # Activation:
  #   helm install ... \
  #     --set monitoring.enabled=true \
  #     --set monitoring.grafana.enabled=true \
  #     --set monitoring.dashboards.enabled=true
  #
  # Admin password is read from a pre-existing Secret named `grafana-admin-password`
  # (key: admin-password). Provision via external-secrets / sealed-secrets — do
  # NOT embed credentials in this values file. If the Secret is missing, Grafana
  # falls back to the chart-default random password (recoverable via
  # `kubectl get secret kitehub-monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d`).
  grafana:
    enabled: false
    # Ingress is opt-in — disabled by default because OIDC auth wiring is
    # cluster-specific (see GAP-143 follow-up for OIDC SSO). When enabled
    # without OIDC, Grafana uses basic auth (admin / Secret password). For
    # production, prefer port-forward / cluster-internal access until OIDC
    # SSO lands.
    ingress:
      enabled: false
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        # Override certificate-arn in prod values file:
        alb.ingress.kubernetes.io/certificate-arn: ""
      host: "grafana.kitehub.me"
      path: "/"

  # Subchart values forwarded to kube-prometheus-stack. These are STUBS — production
  # tuning (storage class, retention, scaling) tracked in GAP-144.
  kube-prometheus-stack:
    fullnameOverride: kitehub-monitoring

    # GAP-143 — Grafana subchart.
    # Default off so foundation install (monitoring.enabled alone) stays lean.
    # Activate together with top-level flag:
    #   --set monitoring.grafana.enabled=true \
    #   --set monitoring.kube-prometheus-stack.grafana.enabled=true
    # (Helm subchart values can't be cross-referenced from parent, so both flags
    # must be set explicitly.)
    grafana:
      enabled: false
      # Admin password pulled from pre-existing Secret. Override the secret name
      # in prod values file if your secret is named differently.
      admin:
        existingSecret: "grafana-admin-password"
        userKey: admin-user
        passwordKey: admin-password
      # Sidecar auto-discovers dashboard ConfigMaps labelled grafana_dashboard=1.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          # Search across all namespaces so monitoring stack picks up dashboards
          # provisioned anywhere in the cluster (default: own namespace).
          searchNamespace: ALL
          # Restart Grafana when dashboards added/removed (avoids stale UI cache).
          provider:
            allowUiUpdates: true
        datasources:
          enabled: true
      # Default Prometheus datasource is auto-injected by kube-prometheus-stack
      # — no manual config needed. Verify after install:
      #   kubectl exec -n monitoring kitehub-monitoring-grafana-0 -- \
      #     curl -s http://localhost:3000/api/datasources
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 512Mi }

    # Defer cluster-level kube-state-metrics + node-exporter until needed.
    # Most kitehub alerts target service-level metrics, not cluster.
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    prometheusOperator:
      enabled: true

    prometheus:
      prometheusSpec:
        retention: 15d
        # Pick up PrometheusRule + ServiceMonitor objects without label selector.
        # Tighten in production via release-specific labels (GAP-144).
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # Storage stub. Override in prod values file with actual storageClassName.
        storageSpec: {}
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: 1000m, memory: 2Gi }

    alertmanager:
      enabled: true
      # GAP-467 / Wave 57 Bucket A — alertmanager runtime config is rendered by
      # templates/alertmanager-config.yaml into a Secret named
      # `alertmanager-kitehub`. Go-template rendering of alertmanager.yaml
      # lives there (templates/ is where Helm runs the template engine);
      # values.yaml must stay plain YAML per Helm v3 contract.
      #
      # Reference the rendered Secret here so kube-prometheus-stack mounts it
      # into Alertmanager instead of using the chart's auto-generated config.
      alertmanagerSpec:
        retention: 120h
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        # Use our externally-rendered Secret (see templates/alertmanager-config.yaml)
        # instead of the kube-prometheus-stack auto-generated config Secret.
        # Per kube-prometheus-stack convention, this string is the Secret name
        # (alertmanager-kitehub) which the chart mounts at /etc/alertmanager/config.
        configSecret: alertmanager-kitehub
        # GAP-144 / ADR-022 — mount the alertmanager-receivers Secret materialized
        # by ExternalSecret (templates/alertmanager-external-secret.yaml). Files
        # appear at /etc/alertmanager/secrets/alertmanager-receivers/<key> and are
        # referenced from the rendered config (templates/alertmanager-config.yaml)
        # via *_file: directives.
        #
        # Note (Wave 57 Bucket A / GAP-467): volumes/volumeMounts are listed
        # unconditionally here because (a) values.yaml must be plain YAML so we
        # cannot gate on a flag, and (b) Alertmanager tolerates a missing-Secret
        # volume mount at config-load time only when files are not yet referenced
        # (placeholder mode does not reference any *_file: paths). Operators who
        # disable monitoring.alertmanager.receivers.production.enabled in dev
        # clusters that lack the ExternalSecret can either (i) leave the
        # ExternalSecret template disabled (default — alertmanager-receivers
        # Secret never created → pod stays Pending on volume mount, which is the
        # desired loud failure for misconfigured prod), or (ii) supply a stub
        # Secret. The default dev mode disables monitoring.enabled entirely so
        # this whole subchart is skipped.
        volumes:
          - name: alertmanager-receivers
            secret:
              secretName: alertmanager-receivers
              optional: true
        volumeMounts:
          - name: alertmanager-receivers
            mountPath: /etc/alertmanager/secrets/alertmanager-receivers
            readOnly: true

      # GAP-144 / ADR-022 — production receiver opt-in flag + ESO integration.
      # The config block itself moved to templates/alertmanager-config.yaml in
      # Wave 57 Bucket A (GAP-467). Values below remain plain YAML data; the
      # template consumes them via .Values.monitoring.alertmanager.* paths.
      receivers:
        production:
          # Master gate. When true: ExternalSecret renders, Alertmanager mounts
          # the Secret, receivers switch from placeholders to *_file: paths.
          # Default false so foundation install (monitoring.enabled alone) keeps
          # the lean placeholder behaviour and dev/local clusters work without
          # AWS credentials.
          enabled: false
          # AWS SM key prefix segment — keys are
          # kitehub/<environment>/alertmanager/{slack-webhook|pagerduty-key|smtp-password}
          environment: "prod"
          # ESO ClusterSecretStore reference. Operators provision this once
          # per cluster (per ADR-022 prerequisites).
          secretStoreRef:
            name: "aws-secrets-manager"
            kind: "ClusterSecretStore"
          # Refresh interval for AWS SM → k8s Secret sync. 1h matches typical
          # rotation cadence; tighten if quarter-hour rotation needed.
          refreshInterval: "1h"
          slack:
            # Override per environment in values-prod.yaml.
            channel: "#alerts"
          email:
            # Override per environment in values-prod.yaml.
            to: "ops@kitehub.me"
      # SES SMTP endpoint config. Region used to construct
      # email-smtp.<region>.amazonaws.com:587 — defaults match global.aws.region
      # but kept independent so SES can live in a different region than RDS/S3.
      #
      # Wave 55 Bucket C (GAP-144): the canonical source of these values is the
      # alertmanager-receivers k8s Secret (keys smtp-host, smtp-username) sourced
      # via ExternalSecret from AWS Secrets Manager. Override per env using
      # values-<env>.yaml or --set when ESO has materialized the Secret. See
      # operations/runbooks/alertmanager-mock-fire-runbook.md §3.2 for the read
      # + populate recipe.
      smtp:
        # Optional explicit smarthost (host:port). When unset, falls back to
        # email-smtp.<region>.amazonaws.com:587 derived from .region below.
        smarthost: ""
        region: "us-east-1"
        authUsername: "alerts@kitehub.me"

# --- Logging (GAP-434 Phase 2 of GAP-115) ---
#
# Loki single-binary backend + Promtail DaemonSet + Grafana datasource auto-
# provisioning. Phase 1 (Wave 41 Bucket F) shipped the `kitehub-logs-overview`
# Grafana dashboard with placeholder Loki uid. This section wires the actual
# Loki backend so dashboard panels resolve.
#
# Architecture (single-binary mode — Phase 2a):
#   - Loki StatefulSet 1 replica (read+write+index in one process)
#   - BoltDB index on local PVC (24h hot)
#   - Chunks on S3 (90d cold per logs-format-standard.md §4)
#   - Promtail DaemonSet scrapes /var/log/containers/*.log per node
#   - Grafana datasource auto-provisioned via sidecar ConfigMap
#     (templates/grafana-datasource-loki.yaml — uid `loki`)
#
# Activation:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm dependency update infrastructure/helm/kitehub/
#   helm install ... \
#     --set monitoring.enabled=true \
#     --set monitoring.grafana.enabled=true \
#     --set loki.enabled=true \
#     --set loki.s3.bucket=<bucket-from-terraform-output>
#
# S3 bucket: NEVER hardcoded — supplied via env-var/terraform output. The
# `loki.s3.bucket` value flows into the loki-stack subchart's
# storage_config.aws.bucketnames. Empty default + `enabled: false` means
# foundation install (no Loki) ships clean.
#
# Phase 2b (microservices mode) deferred until log volume warrants the
# operational complexity — single-binary handles ≥10MB/sec ingestion on
# modest hardware, well above Phase 1 BETA invite-only projection.
loki:
  enabled: false

  # S3 bucket for chunk storage. MUST be supplied at install time:
  #   --set loki.s3.bucket=<from-terraform-output>
  # OR via env-var sourced values file. Empty default + `enabled: false`
  # means foundation install ships clean.
  s3:
    bucket: ""             # populated from terraform output / env-var
    region: "ap-southeast-1"

  # Subchart values forwarded to grafana/loki-stack. Single-binary mode
  # configured via loki.config below; Promtail DaemonSet enabled by default
  # in the subchart (we leave it on, just adjust scrape config).
  loki-stack:
    fullnameOverride: kitehub-loki

    # Loki single-binary StatefulSet (read+write+index together)
    loki:
      enabled: true
      isDefault: false   # we provision datasource via separate template (uid: loki)
      persistence:
        enabled: true
        size: 10Gi       # BoltDB index + 24h hot WAL — bumped per env if needed
      # logs-format-standard.md §4 retention: 90d cold (S3) — chunk_retain_period
      # below is in-memory cache window only; bucket lifecycle policy enforces 90d.
      config:
        auth_enabled: false
        server:
          http_listen_port: 3100
        ingester:
          chunk_idle_period: 30m
          chunk_block_size: 262144
          chunk_retain_period: 1m
          max_transfer_retries: 0
          lifecycler:
            ring:
              kvstore:
                store: inmemory
              replication_factor: 1
        schema_config:
          configs:
            - from: 2026-01-01
              store: boltdb-shipper
              object_store: s3
              schema: v11
              index:
                prefix: kitehub_index_
                period: 24h
        storage_config:
          boltdb_shipper:
            active_index_directory: /data/loki/boltdb-shipper-active
            cache_location: /data/loki/boltdb-shipper-cache
            cache_ttl: 24h
            shared_store: s3
          aws:
            # Bucket name flows from .Values.loki.s3.bucket via override at install
            # time. The loki-stack chart accepts these keys verbatim. Region echoes
            # global.aws.region for cost (avoid cross-region transfer).
            s3: ""
            bucketnames: ""           # SET via --set loki.s3.bucket=... → loki.loki-stack.loki.config.storage_config.aws.bucketnames
            region: "ap-southeast-1"
            s3forcepathstyle: false
            insecure: false
        limits_config:
          enforce_metric_name: false
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          retention_period: 2160h     # 90d retention (matches §4 cold tier)
        chunk_store_config:
          max_look_back_period: 2160h
        table_manager:
          retention_deletes_enabled: true
          retention_period: 2160h
        compactor:
          working_directory: /data/loki/compactor
          shared_store: s3
          retention_enabled: true
          retention_delete_delay: 2h

    # Promtail DaemonSet — scrapes /var/log/containers/*.log on each node,
    # parses structured JSON (per logs-format-standard.md §2), forwards to
    # Loki Distributor at http://kitehub-loki:3100/loki/api/v1/push.
    promtail:
      enabled: true
      config:
        clients:
          - url: http://kitehub-loki:3100/loki/api/v1/push
        snippets:
          # Parse structured JSON logs emitted per logs-format-standard.md §2.
          # Required fields: timestamp, level, service, message + MDC fields
          # (tenantId, traceId, spanId, userId). Promtail extracts them as
          # Loki labels/fields so LogQL queries like
          #   {service="kitehub-subscription"} | json | tenantId="tenant-abc"
          # resolve at query time.
          pipelineStages:
            - cri: {}
            - json:
                expressions:
                  level: level
                  service: service
                  message: message
                  tenantId: tenantId
                  traceId: traceId
                  spanId: spanId
                  userId: userId
            - labels:
                level:
                service:
                tenantId:

    # Disable bundled Grafana — we use the kube-prometheus-stack Grafana
    # (provisioned via monitoring.grafana.enabled=true). Datasource for Loki
    # is provided by templates/grafana-datasource-loki.yaml ConfigMap which
    # the existing Grafana sidecar discovers via grafana_datasource=1 label.
    grafana:
      enabled: false
    prometheus:
      enabled: false
    fluent-bit:
      enabled: false
    filebeat:
      enabled: false
    logstash:
      enabled: false
