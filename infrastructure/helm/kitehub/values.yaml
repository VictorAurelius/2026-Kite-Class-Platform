# Default values for KiteHub platform
#
# This Helm chart is for AWS (EKS) deployment (backup option).
# Primary deployment: Oracle Cloud with Docker Compose.
# See: documents/03-planning/infrastructure/kitehub-oracle-cloud-deployment.md

global:
  image:
    registry: ""  # ECR registry URL (from terraform output)
    tag: "latest"
    pullPolicy: IfNotPresent

  database:
    host: ""      # RDS endpoint (from terraform output)
    port: 5432
    name: kitehub
    username: kitehub

  redis:
    host: ""      # ElastiCache endpoint (from terraform output)
    port: 6379

  rabbitmq:
    host: ""      # Amazon MQ endpoint
    port: 5672
    username: kitehub

  s3:
    bucket: ""    # S3 bucket name (from terraform output)
    region: ap-southeast-1

  ai:
    provider: openai  # AWS uses OpenAI API (Oracle uses Ollama)
    # openaiApiKey set via secret

  aws:
    region: ap-southeast-1  # Used by email service (SES) — required by deployment.yaml

# --- Services ---

gateway:
  replicas: 2
  image:
    name: kitehub-gateway
  port: 9000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  cors:
    allowedOrigins: "https://kiteclass.com,https://www.kiteclass.com"

subscription:
  replicas: 2
  image:
    name: kitehub-subscription
  port: 8080
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }

branding:
  replicas: 1
  image:
    name: kitehub-branding
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  # GAP-386 / BR-QUALITY-001 — AI Branding quality gate pass threshold (0..100).
  # Default 70 matches kitehub-branding application.yml + ai-branding-guidelines.md §5.
  # Override per environment / tier (e.g. FREE 65 / ENT 80) without rebuild.
  qualityGate:
    passThreshold: 70

admin:
  replicas: 1
  image:
    name: kitehub-admin
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

email:
  replicas: 1
  image:
    name: kitehub-email
  port: 8080
  resources:
    requests: { cpu: 125m, memory: 256Mi }
    limits:   { cpu: 250m, memory: 512Mi }

frontend:
  replicas: 2
  image:
    name: kitehub-frontend
  port: 3001
  resources:
    requests: { cpu: 125m, memory: 256Mi }
    limits:   { cpu: 250m, memory: 512Mi }

# --- Ingress ---
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ""  # ACM certificate ARN
  hosts:
    - host: kiteclass.com
      paths: ["/"]
    - host: api.kiteclass.com
      paths: ["/"]

# --- Monitoring (GAP-111 + GAP-120 foundation) ---
#
# Foundation only. Opt-in (enabled=false by default) to avoid breaking existing
# clusters. When enabled, deploys Prometheus + Alertmanager via kube-prometheus-stack
# subchart. Grafana / dashboards / production alert routing tracked in:
#   - GAP-143 (Grafana dashboards in Helm)
#   - GAP-144 (Alertmanager production receivers + secret wiring)
#   - GAP-145 (Loki log aggregation + tracing)
#
# Activation:
#   1. helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   2. helm dependency update infrastructure/helm/kitehub/
#   3. helm install ... --set monitoring.enabled=true
monitoring:
  enabled: false

  # ServiceMonitor objects scrape Spring Boot /actuator/prometheus on each service.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Ports below MUST match service.port values for each Spring Boot app.
    # Frontend (port 3001) excluded — no Prometheus endpoint exposed.
    services:
      - name: kitehub-gateway
        port: 9000
      - name: kitehub-subscription
        port: 8080
      - name: kitehub-branding
        port: 8080
      - name: kitehub-admin
        port: 8080
      - name: kitehub-email
        port: 8080

  # PrometheusRule wires the 7 alert rules from kitehub/docker/prometheus/alert-rules.yml
  # into the Prometheus Operator. Rule definitions intentionally mirror dev config
  # so the same expressions fire in both environments.
  prometheusRule:
    enabled: true

  # GAP-135 + GAP-143 + GAP-115 — Grafana dashboard ConfigMaps.
  # When dashboards.enabled=true the chart packages baseline dashboards
  # (api-latency, jvm-heap-gc, http-traffic, infra-pools, logs-overview)
  # as ConfigMaps labelled `grafana_dashboard=1` so Grafana sidecar
  # auto-imports them. Requires monitoring.grafana.enabled=true (sets the
  # sidecar via subchart).
  #
  # logs-overview (GAP-115 Phase 1) targets a Loki datasource (uid $DS_LOKI).
  # The Loki/Promtail stack itself ships Phase 2 — until then logs panels
  # render "No data" but dashboard URL is stable for the on-call runbook
  # (documents/05-guides/operations/runbooks/monitoring-dashboards.md).
  dashboards:
    enabled: false
    label:
      key: grafana_dashboard
      value: "1"

  # GAP-143 — Grafana visualization layer.
  # Opt-in flag — when true, enables kube-prometheus-stack.grafana subchart
  # (sets grafana.enabled=true below) AND auto-loads baseline dashboards
  # via sidecar discovery. Default off so foundation install (monitoring.enabled
  # alone) stays lean — operators flip this when ready to expose dashboards.
  #
  # Activation:
  #   helm install ... \
  #     --set monitoring.enabled=true \
  #     --set monitoring.grafana.enabled=true \
  #     --set monitoring.dashboards.enabled=true
  #
  # Admin password is read from a pre-existing Secret named `grafana-admin-password`
  # (key: admin-password). Provision via external-secrets / sealed-secrets — do
  # NOT embed credentials in this values file. If the Secret is missing, Grafana
  # falls back to the chart-default random password (recoverable via
  # `kubectl get secret kitehub-monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d`).
  grafana:
    enabled: false
    # Ingress is opt-in — disabled by default because OIDC auth wiring is
    # cluster-specific (see GAP-143 follow-up for OIDC SSO). When enabled
    # without OIDC, Grafana uses basic auth (admin / Secret password). For
    # production, prefer port-forward / cluster-internal access until OIDC
    # SSO lands.
    ingress:
      enabled: false
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        # Override certificate-arn in prod values file:
        alb.ingress.kubernetes.io/certificate-arn: ""
      host: "grafana.kiteclass.com"
      path: "/"

  # Subchart values forwarded to kube-prometheus-stack. These are STUBS — production
  # tuning (storage class, retention, scaling) tracked in GAP-144.
  kube-prometheus-stack:
    fullnameOverride: kitehub-monitoring

    # GAP-143 — Grafana subchart.
    # Default off so foundation install (monitoring.enabled alone) stays lean.
    # Activate together with top-level flag:
    #   --set monitoring.grafana.enabled=true \
    #   --set monitoring.kube-prometheus-stack.grafana.enabled=true
    # (Helm subchart values can't be cross-referenced from parent, so both flags
    # must be set explicitly.)
    grafana:
      enabled: false
      # Admin password pulled from pre-existing Secret. Override the secret name
      # in prod values file if your secret is named differently.
      admin:
        existingSecret: "grafana-admin-password"
        userKey: admin-user
        passwordKey: admin-password
      # Sidecar auto-discovers dashboard ConfigMaps labelled grafana_dashboard=1.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          # Search across all namespaces so monitoring stack picks up dashboards
          # provisioned anywhere in the cluster (default: own namespace).
          searchNamespace: ALL
          # Restart Grafana when dashboards added/removed (avoids stale UI cache).
          provider:
            allowUiUpdates: true
        datasources:
          enabled: true
      # Default Prometheus datasource is auto-injected by kube-prometheus-stack
      # — no manual config needed. Verify after install:
      #   kubectl exec -n monitoring kitehub-monitoring-grafana-0 -- \
      #     curl -s http://localhost:3000/api/datasources
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 512Mi }

    # Defer cluster-level kube-state-metrics + node-exporter until needed.
    # Most kitehub alerts target service-level metrics, not cluster.
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    prometheusOperator:
      enabled: true

    prometheus:
      prometheusSpec:
        retention: 15d
        # Pick up PrometheusRule + ServiceMonitor objects without label selector.
        # Tighten in production via release-specific labels (GAP-144).
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # Storage stub. Override in prod values file with actual storageClassName.
        storageSpec: {}
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: 1000m, memory: 2Gi }

    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        # GAP-144 / ADR-022 — mount the alertmanager-receivers Secret materialized
        # by ExternalSecret (templates/alertmanager-external-secret.yaml). Files
        # appear at /etc/alertmanager/secrets/alertmanager-receivers/<key> and are
        # referenced from receivers.config below via *_file: directives. Volume
        # only mounts when receivers.production.enabled=true (the Secret only
        # exists then); foundation deploys with enabled=false skip both.
        {{- if and .Values.monitoring.enabled .Values.monitoring.alertmanager.receivers.production.enabled }}
        volumes:
          - name: alertmanager-receivers
            secret:
              secretName: alertmanager-receivers
        volumeMounts:
          - name: alertmanager-receivers
            mountPath: /etc/alertmanager/secrets/alertmanager-receivers
            readOnly: true
        {{- end }}

      # GAP-144 / ADR-022 — Alertmanager receiver config.
      #
      # Two modes, controlled by .Values.monitoring.alertmanager.receivers.production.enabled:
      #
      #   1. production.enabled=false (DEFAULT) — placeholder receivers pointing
      #      at *.invalid hosts. Alertmanager starts cleanly; alerts SILENTLY
      #      DROP. Foundation parity (existing dev / local installs unchanged).
      #
      #   2. production.enabled=true — receivers reference files mounted from
      #      the alertmanager-receivers Secret (ExternalSecret materializes
      #      it from AWS Secrets Manager per ADR-022). Slack via api_url_file,
      #      PagerDuty via service_key_file, email via global.smtp_auth_password_file.
      #      Activate via:
      #        helm upgrade ... \
      #          --set monitoring.enabled=true \
      #          --set monitoring.alertmanager.receivers.production.enabled=true
      #      after ESO + ClusterSecretStore + AWS SM secrets are provisioned
      #      (see infrastructure/helm/README.md "Alertmanager production receivers").
      config:
        global:
          resolve_timeout: 5m
          smtp_from: "alerts@kiteclass.com"
          {{- if .Values.monitoring.alertmanager.receivers.production.enabled }}
          # AWS SES SMTP endpoint. Region defaults to us-east-1; override per env.
          smtp_smarthost: "email-smtp.{{ .Values.monitoring.alertmanager.smtp.region | default "us-east-1" }}.amazonaws.com:587"
          smtp_auth_username: "{{ .Values.monitoring.alertmanager.smtp.authUsername | default "alerts@kiteclass.com" }}"
          smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-receivers/smtp-password"
          {{- else }}
          # Placeholder — switched to AWS SES when receivers.production.enabled=true.
          smtp_smarthost: "smtp.placeholder.invalid:587"
          {{- end }}
          smtp_require_tls: true

        route:
          group_by: ["alertname", "severity", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "default-webhook"
          routes:
            - matchers:
                - severity = "critical"
              receiver: "critical-webhook"
              continue: true
            - matchers:
                - severity = "warning"
              receiver: "warning-email"

        receivers:
          {{- if .Values.monitoring.alertmanager.receivers.production.enabled }}
          # Production receivers — credentials read from files mounted from
          # alertmanager-receivers Secret (sourced via ExternalSecret + AWS SM).
          - name: "default-webhook"
            slack_configs:
              - api_url_file: "/etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url"
                channel: "{{ .Values.monitoring.alertmanager.receivers.production.slack.channel | default "#alerts" }}"
                send_resolved: true
                title: "[{{ `{{ .Status | toUpper }}` }}] {{ `{{ .CommonLabels.alertname }}` }}"
                text: "{{ `{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}\n{{ end }}` }}"

          - name: "critical-webhook"
            pagerduty_configs:
              - service_key_file: "/etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key"
                send_resolved: true
                description: "{{ `{{ .CommonLabels.alertname }}` }}: {{ `{{ .CommonAnnotations.summary }}` }}"
                severity: "{{ `{{ if eq .CommonLabels.severity \"critical\" }}critical{{ else }}error{{ end }}` }}"
                client: "kitehub-alertmanager"

          - name: "warning-email"
            email_configs:
              - to: "{{ .Values.monitoring.alertmanager.receivers.production.email.to | default "ops@kiteclass.com" }}"
                send_resolved: true
                headers:
                  Subject: "[{{ `{{ .Status | toUpper }}` }}] {{ `{{ .CommonLabels.alertname }}` }} — kitehub"
          {{- else }}
          # Foundation placeholders — *.invalid hosts mean alerts silently drop.
          # Switch to production receivers via receivers.production.enabled=true.
          - name: "default-webhook"
            webhook_configs:
              - url: "http://alertmanager-webhook-placeholder.invalid/default"
                send_resolved: true

          - name: "critical-webhook"
            webhook_configs:
              - url: "http://alertmanager-webhook-placeholder.invalid/critical"
                send_resolved: true

          - name: "warning-email"
            email_configs:
              - to: "ops@kiteclass.com"
                send_resolved: true
          {{- end }}

        # Inhibition: suppress dependent alerts when ServiceDown is firing for
        # the same job (avoids alert storm). Verified for GAP-144 AC.
        inhibit_rules:
          - source_matchers:
              - alertname = "ServiceDown"
            target_matchers:
              - severity =~ "warning|critical"
            equal: ["job"]
          # HighErrorRate inhibited when ServiceDown is firing for the same job —
          # explicit pairing to satisfy GAP-144 AC; equivalent to the catch-all
          # above but documents the intent for reviewers.
          - source_matchers:
              - alertname = "ServiceDown"
            target_matchers:
              - alertname = "HighErrorRate"
            equal: ["job"]

      # GAP-144 / ADR-022 — production receiver opt-in flag + ESO integration.
      receivers:
        production:
          # Master gate. When true: ExternalSecret renders, Alertmanager mounts
          # the Secret, receivers switch from placeholders to *_file: paths.
          # Default false so foundation install (monitoring.enabled alone) keeps
          # the lean placeholder behaviour and dev/local clusters work without
          # AWS credentials.
          enabled: false
          # AWS SM key prefix segment — keys are
          # kitehub/<environment>/alertmanager/{slack-webhook|pagerduty-key|smtp-password}
          environment: "prod"
          # ESO ClusterSecretStore reference. Operators provision this once
          # per cluster (per ADR-022 prerequisites).
          secretStoreRef:
            name: "aws-secrets-manager"
            kind: "ClusterSecretStore"
          # Refresh interval for AWS SM → k8s Secret sync. 1h matches typical
          # rotation cadence; tighten if quarter-hour rotation needed.
          refreshInterval: "1h"
          slack:
            # Override per environment in values-prod.yaml.
            channel: "#alerts"
          email:
            # Override per environment in values-prod.yaml.
            to: "ops@kiteclass.com"
      # SES SMTP endpoint config. Region used to construct
      # email-smtp.<region>.amazonaws.com:587 — defaults match global.aws.region
      # but kept independent so SES can live in a different region than RDS/S3.
      smtp:
        region: "us-east-1"
        authUsername: "alerts@kiteclass.com"
