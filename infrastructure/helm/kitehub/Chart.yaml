apiVersion: v2
name: kitehub
description: KiteHub Platform - Multi-tenant SaaS management
type: application
version: 1.1.0
appVersion: "1.0.0"

# Optional dependencies. Enable via values.yaml -> monitoring.enabled=true.
# Run `helm dependency update infrastructure/helm/kitehub/` before install
# when monitoring.enabled=true.
dependencies:
  - name: kube-prometheus-stack
    version: "58.7.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
    alias: monitoring
