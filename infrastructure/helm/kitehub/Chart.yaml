apiVersion: v2
name: kitehub
description: KiteHub Platform - Multi-tenant SaaS management
type: application
version: 1.2.0
appVersion: "1.0.0"

# Optional dependencies. Enable via values.yaml flags.
# Run `helm dependency update infrastructure/helm/kitehub/` before install
# when any optional dependency is enabled.
dependencies:
  - name: kube-prometheus-stack
    version: "58.7.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
    alias: monitoring
  # GAP-434 Phase 2 — Loki/Promtail stack (single-binary mode + Promtail DaemonSet
  # + Grafana datasource auto-provisioning). loki-stack 2.10.2 is the last release
  # of the bundled chart; single-binary mode is suitable for Phase 1 BETA invite-only
  # volume per `logs-format-standard.md` §4 (90d cold S3 retention).
  #
  # Activation:
  #   helm repo add grafana https://grafana.github.io/helm-charts
  #   helm dependency update infrastructure/helm/kitehub/
  #   helm install ... --set loki.enabled=true \
  #     --set loki.loki.config.storage_config.aws.bucketnames=$LOKI_S3_BUCKET
  - name: loki-stack
    version: "2.10.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
