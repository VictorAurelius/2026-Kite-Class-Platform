# =============================================================================
# Wave 82 Bucket B — nginx reverse proxy cho FE self-host trên EC2 t3.small
# =============================================================================
#
# Mục đích: terminate TLS, gzip/brotli compression, security headers,
# proxy traffic vào 2 Next.js standalone backend chạy qua PM2.
#
# Topology:
#   kitehub.me          (apex) → 127.0.0.1:4701  (kitehub-frontend, marketing)
#   app.kitehub.me      (FE)   → 127.0.0.1:4700  (kiteclass-frontend, tenant app)
#
# Cert: Let's Encrypt wildcard *.kitehub.me + kitehub.me qua DNS-01 challenge
# (GAP-567, certbot-dns-01-setup.sh). Cert path:
#   /etc/letsencrypt/live/kitehub.me/fullchain.pem
#   /etc/letsencrypt/live/kitehub.me/privkey.pem
#
# Cross-link:
#   - ADR-031 §Decision (FE self-host trên EC2 t3.small)
#   - GAP-566 (PM2 max_memory_restart=1.2G per app, t3.small RAM tuning)
#   - GAP-567 (Certbot DNS-01 + 30d expiry monitor)
#   - .claude/rules/aws-sg-description-ascii.md (F6 SG description discipline)
#
# Triển khai trên EC2:
#   sudo cp infrastructure/fe-host/nginx-fe.conf /etc/nginx/conf.d/fe-host.conf
#   sudo nginx -t                # syntax check
#   sudo systemctl reload nginx  # zero-downtime reload
#
# =============================================================================


# -----------------------------------------------------------------------------
# Real IP từ Cloudflare proxy
# -----------------------------------------------------------------------------
# CF đứng trước EC2 (proxied A record). $remote_addr mặc định = CF edge IP,
# không phải client thật. Khai báo CF IPv4/IPv6 ranges để nginx parse
# CF-Connecting-IP header thành $remote_addr thực. List ranges cập nhật từ
# https://www.cloudflare.com/ips/. Refresh quarterly hoặc khi CF thay đổi.

# IPv4 ranges (Cloudflare)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 ranges (Cloudflare)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;


# -----------------------------------------------------------------------------
# Compression: gzip cho mọi browser; brotli cho browser hỗ trợ (precedence cao)
# -----------------------------------------------------------------------------
# brotli nén tốt hơn gzip ~15-20% cho text/JS/CSS — quan trọng cho FE Vietnam
# user trên 3G/4G mạng yếu. brotli module có thể chưa enable mặc định trên
# Amazon Linux 2023 nginx; nếu chưa có thì giữ gzip-only — không lỗi.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  text/xml
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/xml+rss
  application/ld+json
  application/manifest+json
  font/ttf
  font/otf
  image/svg+xml;

# brotli (chỉ active nếu ngx_brotli module đã build vào nginx)
# brotli on;
# brotli_comp_level 6;
# brotli_types
#   text/plain text/css text/javascript application/javascript
#   application/json image/svg+xml font/ttf font/otf;


# -----------------------------------------------------------------------------
# Custom log format: bao gồm upstream timing để debug FE perf issues
# -----------------------------------------------------------------------------
# $upstream_response_time: thời gian Next.js backend trả response
# $request_time: thời gian tổng từ first byte request → last byte response
# $http_cf_ray: Cloudflare Ray ID để correlate với CF dashboard logs

log_format fe_proxy '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time urt=$upstream_response_time '
                   'host=$host cf_ray=$http_cf_ray';


# -----------------------------------------------------------------------------
# Upstream backends — PM2-managed Next.js standalone processes
# -----------------------------------------------------------------------------
# keepalive: nginx giữ idle connection vào upstream → giảm TCP handshake
# cho high-traffic. 32 connection đủ cho t3.small Phase 1 BETA cohort.

upstream kitehub_frontend {
  server 127.0.0.1:4701;
  keepalive 32;
}

upstream kiteclass_frontend {
  server 127.0.0.1:4700;
  keepalive 32;
}


# -----------------------------------------------------------------------------
# Server block 1: HTTP port 80 — redirect mọi traffic sang HTTPS
# -----------------------------------------------------------------------------
# Không serve content trên HTTP. ACME HTTP-01 challenge KHÔNG dùng ở đây vì
# certbot DNS-01 (GAP-567) — toàn bộ port 80 chỉ làm việc duy nhất:
# 301 redirect → HTTPS. Race condition giữa nginx + certbot biến mất.

server {
  listen 80;
  listen [::]:80;
  server_name kitehub.me app.kitehub.me www.kitehub.me;

  # 301 permanent redirect: browser cache, search engine update.
  # $request_uri giữ nguyên path + query string khi flip sang HTTPS.
  return 301 https://$host$request_uri;
}


# -----------------------------------------------------------------------------
# Common SSL config — reuse qua include trong từng HTTPS server block
# -----------------------------------------------------------------------------
# Tách include vì 3 server block (apex / app / www) cùng dùng 1 cert wildcard.
# File này NHÚNG trực tiếp các directive — không tạo include riêng để giữ
# nginx-fe.conf single-file deploy.


# -----------------------------------------------------------------------------
# Server block 2: HTTPS kitehub.me (apex) → kitehub-frontend (port 4701)
# -----------------------------------------------------------------------------
# Marketing site, landing page, beta-status page (Wave 78 ISR).
# Bundle nặng nhất — gzip/brotli quan trọng.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name kitehub.me www.kitehub.me;

  # ---- SSL cert (Let's Encrypt wildcard via DNS-01, GAP-567) ----
  ssl_certificate     /etc/letsencrypt/live/kitehub.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kitehub.me/privkey.pem;

  # TLS 1.2 + 1.3 only — bỏ TLS 1.0/1.1 (deprecated, PCI-DSS yêu cầu)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;  # TLS 1.3 client chọn cipher tốt hơn
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  # OCSP stapling: cache cert status → giảm latency TLS handshake
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ---- Security headers (defense in depth) ----
  # HSTS 1 năm + preload: browser FORCE HTTPS từ cache, không cần redirect.
  # includeSubDomains: áp dụng cho mọi subdomain *.kitehub.me.
  # preload: opt-in vào Chrome HSTS preload list (cần submit thủ công 1 lần).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Chống MIME-sniffing (browser không tự "đoán" Content-Type khác declared)
  add_header X-Content-Type-Options "nosniff" always;

  # Chống clickjacking — chỉ cho phép page nhúng iframe từ cùng origin
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Referrer policy: gửi origin-only cho cross-origin request
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Permissions Policy: disable feature không dùng (camera/mic/payment)
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # ---- Content-Security-Policy (CSP) ----
  # Phase 1 BETA placeholder — Bucket C sẽ refine sau khi audit FE assets.
  # 'unsafe-inline' tạm thời cho Next.js inline scripts (nonce-based refinement TBD).
  # Cross-link: kitehub.me marketing có Stripe/CF Analytics/SES embeds future.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.kitehub.me https://www.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

  # ---- Access + error logs ----
  access_log /var/log/nginx/kitehub-me-access.log fe_proxy;
  error_log  /var/log/nginx/kitehub-me-error.log warn;

  # ---- Body size: cho phép upload nhỏ (logo branding ~5MB cap) ----
  client_max_body_size 8M;

  # ---- Proxy timeouts: Next.js ISR regen có thể chậm 30s under load ----
  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # ---- Reverse proxy → kitehub-frontend ----
  location / {
    proxy_pass http://kitehub_frontend;

    # Pass through original host + real client IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # HTTP/1.1 keepalive với upstream (đã khai báo trong upstream block)
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Buffering: enable cho static asset; disable cho SSE/streaming response.
    # Next.js không stream mặc định → buffering on giữ default tốt nhất.
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
  }

  # ---- Next.js static assets (_next/static) — long cache, immutable ----
  # File hash trong tên (e.g. main.<hash>.js) → cache forever an toàn.
  location /_next/static/ {
    proxy_pass http://kitehub_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 1 năm cache, immutable (browser KHÔNG revalidate)
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ---- Healthcheck endpoint cho CloudWatch + monitoring ----
  # Next.js không expose /healthz mặc định — proxy luôn vào, nếu 200 = healthy.
  location = /healthz {
    proxy_pass http://kitehub_frontend/;
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
  }
}


# -----------------------------------------------------------------------------
# Server block 3: HTTPS app.kitehub.me → kiteclass-frontend (port 4700)
# -----------------------------------------------------------------------------
# Tenant app — login, dashboard, attendance, payment UI. CSP nghiêm hơn
# (no inline-eval cho production).

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name app.kitehub.me;

  ssl_certificate     /etc/letsencrypt/live/kitehub.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kitehub.me/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ---- Security headers (giống apex, CSP riêng) ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # CSP: tenant app connect tới BE gateway riêng (kh-backend / kiteclass-core).
  # Update Bucket B sau khi FE settle BE base URL.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.kitehub.me; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

  access_log /var/log/nginx/app-kitehub-me-access.log fe_proxy;
  error_log  /var/log/nginx/app-kitehub-me-error.log warn;

  client_max_body_size 16M;  # tenant app có upload attachment lớn hơn

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  location / {
    proxy_pass http://kiteclass_frontend;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
  }

  location /_next/static/ {
    proxy_pass http://kiteclass_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # PWA assets cần Cache-Control riêng (kiteclass-frontend next.config.js
  # đã set headers, nhưng nginx có thể override nếu cần). Default: pass through.
  location = /sw.js {
    proxy_pass http://kiteclass_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js đã set Cache-Control: max-age=0 cho /sw.js (next.config.js)
  }

  location = /healthz {
    proxy_pass http://kiteclass_frontend/;
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
  }
}


# -----------------------------------------------------------------------------
# Server block 4: catch-all — reject request không match Host trên
# -----------------------------------------------------------------------------
# Bảo vệ khỏi Host header injection: request với Host lạ (curl --resolve,
# port scan với fake Host) sẽ nhận 444 (nginx close connection không trả body).

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/kitehub.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kitehub.me/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 444;
}
