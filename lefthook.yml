# Lefthook config — local pre-commit gate for script quality
#
# Closes GAP-194 Phase 2 (pre-commit hook AC). Mirrors what
# `.github/workflows/script-quality.yml` enforces in CI so violations
# fail fast on the developer's machine before push.
#
# Activate (one-time): `lefthook install`
# Bypass (emergency only): `git commit --no-verify`
#
# See `documents/05-guides/local-dev/local-dev-pre-commit.md` for setup, fallback
# instructions, and rationale.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck -S warning {staged_files}
    ruff:
      glob: "*.py"
      run: ruff check {staged_files}
    # GAP-265 — UI kits landing parity (Tier 3 enforcement, Wave Review Process Improvement).
    # Runs Tier 1 script when any file under ui_kits/ is staged. Catches the
    # 2026-04-29 incident pattern (kit folder added without landing card update)
    # before push instead of waiting for CI.
    ui-kits-parity:
      glob: "documents/02-architecture/design-system/ui_kits/**/*"
      run: bash documents/02-architecture/design-system/ui_kits/_shared/scripts/check-ui-kits-landing.sh
