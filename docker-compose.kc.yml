# KC stack production compose — Phase 1 BETA per ADR-025
#
# Deploys to kc-app EC2 (i-04f65503ace7febe4) m7i-flex.large 8GB.
# Frontend self-hosted on this EC2 (2 Next.js standalone per ADR-031 / ec2-kc-app.tf);
# KC backend services deferred Phase 7 (GAP-445) — this compose ships them deploy-ready.
#
# Stack:
#   redis (256MB cap) — KC session/cache
#   rabbitmq (256MB cap) — KC events
#   kiteclass-core: 8081 internal — business logic
#   kitehub-banner-renderer: 3000 — Playwright HTML→WebP sidecar (GAP-1407;
#     co-located here for 8GB headroom; kh-backend branding calls cross-VPC via
#     BANNER_RENDERER_URL → this EC2 private IP:3000)
#
# kiteclass-gateway REMOVED per ADR-032 (GAP-1408) — shared kite-gateway routes (ADR-023).
#
# RAM budget m7i-flex.large 8GB:
#   redis ~150MB, rabbitmq ~512MB
#   kiteclass-core ~768MB peak (384 heap + native)
#   kitehub-banner-renderer ~512MB peak (Node + Chromium)
#   OS + Docker ~512MB
#   Total ~2.5GB → 5.5GB headroom
#
# Run on EC2: bash scripts/deploy-kc.sh

x-kc-service-defaults: &kc-service-defaults
  restart: unless-stopped
  networks: [kite-net]
  env_file: [/etc/kite/.env]
  logging:
    driver: awslogs
    options:
      awslogs-region: ap-southeast-1
      awslogs-group: /aws/ec2/kite-prod-kc
      awslogs-create-group: 'true'

services:
  redis:
    image: redis:7-alpine
    container_name: kite-redis
    restart: unless-stopped
    networks: [kite-net]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 320M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kite-rabbitmq
    restart: unless-stopped
    networks: [kite-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M

  kiteclass-core:
    <<: *kc-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kiteclass-core:${KITE_VERSION}
    container_name: kiteclass-core
    environment:
      JAVA_OPTS: "-Xmx384m -Xms192m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8081
      # S3 storage (MinIO->S3 production parity). Blank endpoint -> SDK default
      # regional endpoint; blank access/secret -> EC2 instance role via S3Config
      # DefaultCredentialsProvider. Bucket grant in terraform-aws/iam.tf.
      STORAGE_S3_ENDPOINT: ""
      STORAGE_S3_PUBLIC_ENDPOINT: ""
      STORAGE_S3_REGION: ap-southeast-1
      STORAGE_S3_ACCESS_KEY: ""
      STORAGE_S3_SECRET_KEY: ""
      STORAGE_S3_BUCKET: kiteclass-files-production-906286017800
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 768M

  # GAP-1407 — Playwright banner-renderer sidecar, co-located here (kc-app 8GB
  # headroom) because kh-backend t3.medium 4GB is full. kitehub-branding on
  # kh-backend reaches this via BANNER_RENDERER_URL=http://<kc-app-private-ip>:3000/render
  # (cross-VPC; SG rule in security-groups.tf allows kh-backend → kc-app:3000).
  kitehub-banner-renderer:
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-banner-renderer:${KITE_VERSION}
    container_name: kitehub-banner-renderer
    restart: unless-stopped
    networks: [kite-net]
    ports:
      - "3000:3000"  # exposed to VPC for cross-EC2 branding calls
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 600M

networks:
  kite-net:
    name: kite-net
    driver: bridge
