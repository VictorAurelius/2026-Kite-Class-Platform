# Production deploy compose — Phase 1 BETA invite-only (Architecture B per ADR-025)
#
# Scope: 5 KH backend services + redis + rabbitmq self-hosted, deployed to
# kh-backend EC2 (i-0b65c3947d36cae61). Postgres = RDS external. S3 = AWS
# external. Email = Resend external (RESEND_API_KEY in env).
#
# KC stack (kiteclass-core + gateway + frontend) deferred to Phase 7 polish
# wave per GAP-444. Vercel still serves KC frontend at kiteclass.vercel.app.
#
# Image refs: pinned to ${KITE_VERSION} env var (set by deploy-prod.sh).
# ECR namespace: kite/<service> per CLAUDE.md Docker Naming Convention.
#
# RAM partitioning per ADR-025 §"Negative consequences" t3.medium 4GB:
#   redis    256MB cap
#   rabbitmq 256MB cap
#   gateway  256MB heap (-Xmx256m)
#   each KH service 384MB heap (5×384 = 1.92GB)
#   OS + Docker  ~512MB
#   Total ~3.2GB → headroom ~800MB
#
# Run on EC2: bash scripts/deploy-prod.sh

version: '3.8'

x-kh-service-defaults: &kh-service-defaults
  restart: unless-stopped
  networks:
    - kite-net
  env_file:
    - /etc/kite/.env
  logging:
    driver: awslogs
    options:
      awslogs-region: ap-southeast-1
      awslogs-group: /aws/ec2/kite-prod
      awslogs-create-group: 'true'

services:
  # --- Self-hosted infrastructure ---
  redis:
    image: redis:7-alpine
    container_name: kite-redis
    restart: unless-stopped
    networks:
      - kite-net
    # No --requirepass: empty REDIS_PASSWORD env caused parse error
    # ('redis-server --requirepass ' missing value → redis exits unhealthy).
    # Phase 1 BETA: redis on internal Docker network only, not exposed to ALB
    # or public — auth not required at this scope. Add password Phase 7 polish
    # when KH services include AUTH command in their redis client config.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 320M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kite-rabbitmq
    restart: unless-stopped
    networks:
      - kite-net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # --- KH backend services ---
  kitehub-subscription:
    <<: *kh-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-subscription:${KITE_VERSION}
    container_name: kitehub-subscription
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      # GAP-510 P0 — force Spring to bind 8080 to match gateway-routed URIs;
      # application.yml default (8081) breaks cross-service routing.
      SERVER_PORT: 8080
      # GAP-508 P0 — verify-email + beta-signup links sent in transactional emails
      # default ${VERIFICATION_BASE_URL:http://localhost:3001} would generate dead local links
      VERIFICATION_BASE_URL: "https://kitehub.me"
      # GAP-801 — beta-invite signup link base (kitehub.beta.signup-base-url); default
      # http://localhost:3001 would dead-link in prod. FE claim-code route /beta-signup/code.
      KITEHUB_BETA_SIGNUP_BASE_URL: "https://kitehub.me"
      # KC-2 pre-walk FM-1 — staff-invitation accept link base (kitehub.staff.invitation.base-url);
      # default http://localhost:3001 would dead-link in prod. FE route /staff/accept-invite.
      KITEHUB_STAFF_INVITATION_BASE_URL: "https://kitehub.me"
      # GAP-508 P0 — subscription → email service inter-service RPC (gateway routes via internal docker network)
      EMAIL_SERVICE_URL: "http://kitehub-email:8080"
      # Wave flow-kh3-3 — SePay payment webhook Apikey auth + beta-mode symbolic amount.
      # SEPAY_API_KEY flows in via env_file (/etc/kite/.env, written by fetch-secrets.sh
      # from AWS Secrets Manager kitehub/production/sepay-api-key). Explicit passthrough
      # below documents the binding + lets the secret reach the container even if env_file
      # ordering changes. Binds to kitehub.payment.sepay.api-key.
      SEPAY_API_KEY: "${SEPAY_API_KEY}"
      # Beta-mode payment override (kitehub.payment.beta-mode.*). Production keeps OFF by
      # default — flip BETA_PAYMENT_OVERRIDE=true only to force the symbolic
      # BETA_PAYMENT_AMOUNT_VND (10000 = 10k VND, bank minimum per failure-mode audit
      # 2026-06-04) at createPayment time. Public config, no secret.
      BETA_PAYMENT_OVERRIDE: "${BETA_PAYMENT_OVERRIDE:-false}"
      BETA_PAYMENT_AMOUNT_VND: "${BETA_PAYMENT_AMOUNT_VND:-10000}"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # GAP-510 P0 — healthcheck on unified 8080 port (was per-service 8081 default)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s
    deploy:
      resources:
        limits:
          memory: 640M

  kitehub-branding:
    <<: *kh-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-branding:${KITE_VERSION}
    container_name: kitehub-branding
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      # GAP-510 P0 — force Spring to bind 8080 to match gateway-routed URIs;
      # application.yml default (8083) breaks cross-service routing.
      SERVER_PORT: 8080
      # GAP-1407 — banner-renderer co-located on kc-app EC2 (8GB); branding reaches
      # it cross-VPC. BANNER_RENDERER_URL set in /etc/kite/.env to
      # http://<kc-app-private-ip>:3000/render. Blank → StubBannerRenderer fallback.
      BANNER_RENDERER_URL: ${BANNER_RENDERER_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # GAP-510 P0 — healthcheck on unified 8080 port (was per-service 8083 default)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s
    deploy:
      resources:
        limits:
          memory: 640M

  kitehub-email:
    <<: *kh-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-email:${KITE_VERSION}
    container_name: kitehub-email
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      # GAP-510 P0 — force Spring to bind 8080 to match gateway-routed URIs;
      # application.yml default (8084) breaks cross-service routing.
      SERVER_PORT: 8080
      # GAP-506 Sub-B: disable mail health indicator — Phase 1 BETA uses Resend HTTP API (ADR-025 Stream A), not SMTP.
      # Default Spring mail health probes kite-mailhog:1025 (dev SMTP) → DOWN → composite 503 → unhealthy.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      # GAP-508 P0 — provider must NOT default to 'mock' in production
      # (default ${EMAIL_PROVIDER:mock} would silently swallow all outbound emails)
      EMAIL_PROVIDER: "resend"
      # GAP-508 P0 — From address; default ${AWS_SES_FROM_EMAIL:noreply@localhost} would be invalid.
      # (Resend uses its own sender config but this provides legacy SES path fallback safety.)
      AWS_SES_FROM_EMAIL: "noreply@kitehub.me"
      AWS_SES_FROM_NAME: "KiteHub Beta"
      # NOTE: RESEND_API_KEY must come from /etc/kite/.env populated via fetch-secrets.sh.
      # Currently UNSET (verified 2026-05-13 Plan 1 self-test) — see GAP-508 Phase 2 action.
    depends_on:
      rabbitmq:
        condition: service_healthy
    # GAP-510 P0 — healthcheck on unified 8080 port (was per-service 8084 default)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s
    deploy:
      resources:
        limits:
          memory: 512M

  kitehub-admin:
    <<: *kh-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-admin:${KITE_VERSION}
    container_name: kitehub-admin
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      # GAP-510 P0 — force Spring to bind 8080 to match gateway-routed URIs;
      # application.yml default (8083) breaks cross-service routing.
      SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    # GAP-510 P0 — healthcheck on unified 8080 port (was per-service 8083 default)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s
    deploy:
      resources:
        limits:
          memory: 640M

  kitehub-gateway:
    <<: *kh-service-defaults
    image: 906286017800.dkr.ecr.ap-southeast-1.amazonaws.com/kite/kitehub-gateway:${KITE_VERSION}
    container_name: kitehub-gateway
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: production
      # Force gateway to listen on 8080 to match ALB target group port
      # (application.yml default = ${SERVER_PORT:9000} = 9000 if env unset).
      SERVER_PORT: 8080
      # GAP-507 CORS — production origins (default localhost-only triggers
      # 403 preflight from kitehub.me FE → API on api.kitehub.me)
      # Wave 87 Bucket D (GAP-523 CORS scope): bổ sung app subdomain +
      # Vercel primary hostname để cover các deployment FE đang dùng.
      # Note: Spring Cloud Gateway `allowedOrigins` không hỗ trợ wildcard "*";
      # preview deploy wildcard cần `allowedOriginPatterns` riêng — defer
      # nếu Phase 1 BETA cần Vercel preview chains.
      CORS_ALLOWED_ORIGINS: "https://kitehub.me,https://www.kitehub.me,https://app.kitehub.me,https://kitehub.vercel.app,https://kitehub-victoraurelius-projects.vercel.app"
    ports:
      - "8080:8080"  # ALB target group kh_backend points here
    depends_on:
      kitehub-subscription:
        condition: service_started
      kitehub-branding:
        condition: service_started
      kitehub-admin:
        condition: service_started
      kitehub-email:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  kite-net:
    name: kite-net
    driver: bridge
