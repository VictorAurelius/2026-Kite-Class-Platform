# =============================================================================
# PRODUCTION PROFILE - kiteclass-gateway
# =============================================================================
# Activated by: SPRING_PROFILES_ACTIVE=production
# Wave 85 Bucket E (GAP-503): Tier 2 config — JVM 60% + HikariCP (no Tomcat: reactive).
# Closes audit-spring-profiles.sh finding for kiteclass-gateway (silent profile skip).

spring:
  # GAP-503 / Wave 85 Bucket E — HikariCP right-size (E-AC3 alarm guards exhaustion).
  # Gateway uses Spring Cloud Gateway (reactive Netty) — no Tomcat config applicable.
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.kiteclass.gateway: INFO
    org.springframework.cloud.gateway: WARN
