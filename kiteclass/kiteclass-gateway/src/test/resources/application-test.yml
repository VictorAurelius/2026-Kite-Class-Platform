# Test profile configuration
# NOTE: This profile uses Testcontainers with PostgreSQL for integration tests.
# R2DBC datasource is automatically configured by @ServiceConnection in TestContainersConfiguration.
# Tests will be skipped if Docker is not available (e.g., WSL without Docker Desktop).

# Disable Resilience4j for tests to avoid configuration conflicts
resilience4j:
  circuitbreaker:
    enabled: false
  timelimiter:
    enabled: false

spring:
  # R2DBC datasource auto-configured by @ServiceConnection from PostgreSQL Testcontainer
  # No manual r2dbc.url configuration needed

  flyway:
    enabled: true  # Enable Flyway to run migrations on Testcontainer
    # Flyway datasource auto-configured by @ServiceConnection from PostgreSQL Testcontainer

  # Disable Redis connection attempts in tests
  data:
    redis:
      host: localhost
      port: 16379  # Non-standard port that won't be used
      timeout: 1ms  # Fail fast if connection attempted
      connect-timeout: 1ms

  # Disable Mail sender in tests
  mail:
    host: localhost
    port: 1025  # Non-standard port
    properties:
      mail:
        smtp:
          connectiontimeout: 1
          timeout: 1

email:
  from: test@kiteclass.com
  base-url: http://localhost:3000
  reset-token-expiration: 3600000

# Logging for tests
logging:
  level:
    root: INFO
    com.kiteclass: DEBUG
    org.springframework.mail: DEBUG
