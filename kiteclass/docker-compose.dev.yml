version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kiteclass-postgres
    environment:
      POSTGRES_DB: kiteclass_dev
      POSTGRES_USER: kiteclass
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE-ME-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiteclass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiteclass-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kiteclass-redis
    ports:
      - "6379:6379"
    # Disable persistence for dev (no volumes, no saves)
    # volumes:
    #   - redis_data:/data
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiteclass-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kiteclass-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: kiteclass
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE-ME-dev-only}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiteclass-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: kiteclass-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-dev-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE-ME-dev-only}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kiteclass-network

  # MinIO Bucket Initialization
  minio-init:
    image: minio/mc:latest
    container_name: kiteclass-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minio-dev-user} $${MINIO_ROOT_PASSWORD:-CHANGE-ME-dev-only};
      mc mb myminio/kiteclass-files --ignore-existing;
      mc anonymous set download myminio/kiteclass-files;
      exit 0;
      "
    networks:
      - kiteclass-network

  # Core Service
  core:
    build:
      context: ./kiteclass-core
      dockerfile: Dockerfile
    container_name: kiteclass-core
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kiteclass_dev
      SPRING_DATASOURCE_USERNAME: kiteclass
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE-ME-dev-only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: kiteclass
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE-ME-dev-only}
      # Internal API secret for HMAC authentication
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-CHANGE-ME-dev-only-hmac-secret}
      # MinIO/S3 Configuration
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio-dev-user}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE-ME-dev-only}
      STORAGE_S3_BUCKET: kiteclass-files
      # Disable Flyway (Gateway manages all migrations)
      SPRING_FLYWAY_ENABLED: false
      # Disable Hibernate schema validation (tables created by Gateway)
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kiteclass-network
    restart: unless-stopped

  # Gateway service (kiteclass-gateway) removed Wave 96 per ADR-032.
  # Routing handled by shared kite-gateway (per ADR-023); auth/JWT/migrations moved into kiteclass-core.

  # Nginx Reverse Proxy (CORS workaround)
  nginx:
    image: nginx:alpine
    container_name: kiteclass-nginx
    ports:
      - "8090:8090"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - kiteclass-network
    restart: unless-stopped

  # Frontend (Development mode with hot reload)
  frontend:
    build:
      context: ./kiteclass-frontend
      dockerfile: Dockerfile.dev
    container_name: kiteclass-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    volumes:
      # Mount entire project for hot reload (Next.js needs access to all config files)
      - ./kiteclass-frontend:/app
      # Exclude node_modules and .next to use container versions
      - /app/node_modules
      - /app/.next
    depends_on:
      core:
        condition: service_healthy
    networks:
      - kiteclass-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kiteclass-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring
    networks:
      - kiteclass-network

  # Grafana (Dashboard)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: kiteclass-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE-ME-dev-only}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
    networks:
      - kiteclass-network

networks:
  kiteclass-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
