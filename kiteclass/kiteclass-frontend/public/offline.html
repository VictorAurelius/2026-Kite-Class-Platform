<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đang offline — KiteClass</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #ffffff;
        color: #1f2937;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        max-width: 32rem;
        text-align: center;
        color: #4b5563;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        background: #3b82f6;
        color: white;
        border: 0;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Bạn đang offline</h1>
    <p>
      KiteClass cần kết nối Internet để tải nội dung mới. Nội dung đã xem có
      thể vẫn xem được nếu bạn quay lại trang trước.
    </p>
    <button onclick="window.location.reload()">Thử lại</button>
  </body>
</html>
