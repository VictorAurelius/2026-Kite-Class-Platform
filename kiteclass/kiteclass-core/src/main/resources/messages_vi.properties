# Error Messages - Vietnamese
# Format: {ERROR_CODE}=Message with {0}, {1} placeholders

# ============================================================================
# Student Module Error Codes
# ============================================================================

# Entity Not Found
STUDENT_NOT_FOUND=Không tìm thấy học viên với ID: {0}

# Duplicate Resource
STUDENT_EMAIL_EXISTS=Email học viên đã tồn tại: {0}
STUDENT_PHONE_EXISTS=Số điện thoại học viên đã tồn tại: {0}

# Validation
STUDENT_CANNOT_DELETE=Không thể xóa học viên đang có lớp học hoạt động

# ============================================================================
# Teacher Module Error Codes
# ============================================================================

# Entity Not Found
TEACHER_NOT_FOUND=Không tìm thấy giáo viên với ID: {0}

# Duplicate Resource
TEACHER_EMAIL_EXISTS=Email giáo viên đã tồn tại: {0}

# Validation
TEACHER_CANNOT_DELETE=Không thể xóa giáo viên đang có khóa học hoặc lớp học

# ============================================================================
# Course Module Error Codes
# ============================================================================

# Entity Not Found
COURSE_NOT_FOUND=Không tìm thấy khóa học với ID: {0}

# Duplicate Resource
COURSE_CODE_EXISTS=Mã khóa học đã tồn tại: {0}

# Status Validation
COURSE_CANNOT_DELETE_STATUS=Không thể xóa khóa học với trạng thái {0}. Chỉ có thể xóa khóa học ở trạng thái DRAFT.
COURSE_INVALID_PUBLISH_STATE=Chỉ có thể publish khóa học ở trạng thái DRAFT. Trạng thái hiện tại: {0}
COURSE_INVALID_ARCHIVE_STATE=Chỉ có thể archive khóa học ở trạng thái PUBLISHED. Trạng thái hiện tại: {0}

# Update Restrictions
COURSE_INVALID_UPDATE_ARCHIVED=Không thể cập nhật khóa học đã lưu trữ (ARCHIVED). Khóa học ở trạng thái này chỉ được đọc.
COURSE_INVALID_UPDATE_PUBLISHED=Khóa học đã PUBLISHED chỉ có thể cập nhật: description, syllabus, objectives, price, coverImageUrl. Không thể thay đổi: name, durationWeeks, totalSessions, prerequisites, targetAudience.

# Required Fields
COURSE_MISSING_REQUIRED_FIELDS=Không thể publish khóa học. Thiếu các trường bắt buộc: {0}

# Active Classes Check
COURSE_CANNOT_DELETE_CLASSES=Không thể xóa khóa học có lớp học đang hoạt động

# ============================================================================
# Class Module Error Codes
# ============================================================================

# Entity Not Found
CLASS_NOT_FOUND=Không tìm thấy lớp học với ID: {0}

# Duplicate Resource
CLASS_NAME_EXISTS=Tên lớp học đã tồn tại trong khóa học này: {0}
CLASS_CODE_EXISTS=Mã lớp học đã được sử dụng: {0}

# Status Validation (BR-CLASS-006)
CLASS_READ_ONLY=Không thể chỉnh sửa lớp học với trạng thái {0}. Lớp học đã hoàn thành hoặc đã hủy chỉ được đọc.
CLASS_CANNOT_START=Chỉ có thể bắt đầu lớp học ở trạng thái SCHEDULED. Trạng thái hiện tại: {0}
CLASS_CANNOT_COMPLETE=Chỉ có thể hoàn thành lớp học đang diễn ra. Trạng thái hiện tại: {0}
CLASS_CANNOT_CANCEL=Không thể hủy lớp học với trạng thái {0}. Chỉ có thể hủy lớp ở trạng thái SCHEDULED hoặc IN_PROGRESS.
CLASS_CANNOT_DELETE=Chỉ có thể xóa lớp học ở trạng thái SCHEDULED. Trạng thái hiện tại: {0}
CLASS_HAS_STUDENTS=Không thể xóa lớp học đã có học sinh ({0} học sinh). Hãy hủy lớp học thay vì xóa.

# Schedule Validation
CLASS_SCHEDULE_LOCKED=Không thể thay đổi lịch học hoặc ngày của lớp đang diễn ra.
CLASS_INVALID_DATES=Ngày kết thúc phải sau ngày bắt đầu.
CLASS_NO_DATES=Lớp học phải có ngày bắt đầu và kết thúc trước khi tạo lịch học.
CLASS_INVALID_TIME=Giờ kết thúc phải sau giờ bắt đầu.

# Business Rules
CLASS_COURSE_ARCHIVED=Không thể tạo lớp học cho khóa học đã lưu trữ (ARCHIVED).
CLASS_CAPACITY_VIOLATION=Số học sinh tối đa không thể nhỏ hơn số học sinh hiện tại: {0}
CLASS_CODE_GENERATION_FAILED=Không thể tạo mã lớp học duy nhất sau nhiều lần thử. Vui lòng thử lại.

# ============================================================================
# Generic Error Codes
# ============================================================================

# Validation
VALIDATION_ERROR=Dữ liệu không hợp lệ
VALIDATION_REQUIRED=Trường bắt buộc: {0}
VALIDATION_FORMAT=Sai định dạng: {0}
VALIDATION_RANGE=Giá trị ngoài phạm vi cho phép: {0}

# System Errors
SYSTEM_INTERNAL_ERROR=Lỗi hệ thống. Vui lòng thử lại sau.
SYSTEM_SERVICE_UNAVAILABLE=Dịch vụ tạm thời không khả dụng
INVALID_ARGUMENT=Tham số không hợp lệ

# Multi-Tenant Security
TENANT_NOT_SET=Không tìm thấy ngữ cảnh tenant cho luồng hiện tại. Vui lòng cung cấp header X-Tenant-Id trong request.

