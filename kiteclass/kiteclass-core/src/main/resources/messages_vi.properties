# Field Names - Vietnamese
# ============================================================================

# Course Fields
field.course.name=Tên khóa học
field.course.description=Mô tả
field.course.syllabus=Giáo trình
field.course.objectives=Mục tiêu học tập
field.course.durationWeeks=Thời lượng (tuần)
