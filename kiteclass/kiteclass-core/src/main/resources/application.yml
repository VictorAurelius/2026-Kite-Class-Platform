spring:
  application:
    name: kiteclass-core

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA & Hibernate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kiteclass_dev}
    username: ${SPRING_DATASOURCE_USERNAME:kiteclass}
    password: ${SPRING_DATASOURCE_PASSWORD:kiteclass123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        # Enable Spring-managed JPA entity listeners (for EntityPersistenceListener)
        resource:
          bean:
            container: org.springframework.orm.jpa.support.SpringBeanContainer
    open-in-view: false
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:kiteclass}
    password: ${SPRING_RABBITMQ_PASSWORD:kiteclass123}

server:
  port: 8081

# Logging
logging:
  level:
    root: INFO
    com.kiteclass: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Internal API Security
internal:
  api:
    secret: ${INTERNAL_API_SECRET:changeme-in-production-must-match-gateway}

# Storage Configuration (S3/MinIO)
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key-id: ${STORAGE_S3_ACCESS_KEY:minioadmin}
    secret-access-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_S3_BUCKET:kiteclass-files}
    path-style-access-enabled: true
