spring:
  application:
    name: kiteclass-core

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA & Hibernate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kiteclass_dev}
    username: ${SPRING_DATASOURCE_USERNAME:kiteclass}
    password: ${SPRING_DATASOURCE_PASSWORD:kiteclass123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        # Enable Spring-managed JPA entity listeners (for EntityPersistenceListener)
        resource:
          bean:
            container: org.springframework.orm.jpa.support.SpringBeanContainer
    open-in-view: false
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:kiteclass}
    password: ${SPRING_RABBITMQ_PASSWORD:kiteclass123}

server:
  port: 8081

# Logging
logging:
  level:
    root: INFO
    com.kiteclass: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Internal API Security
internal:
  api:
    secret: ${INTERNAL_API_SECRET:changeme-in-production-must-match-gateway}

# Storage Configuration (S3/MinIO)
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key-id: ${STORAGE_S3_ACCESS_KEY:minioadmin}
    secret-access-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_S3_BUCKET:kiteclass-files}
    path-style-access-enabled: true

# Payment Gateway Configuration
payment:
  vnpay:
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
  momo:
    api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
  zalopay:
    api-url: ${ZALOPAY_API_URL:https://sb-openapi.zalopay.vn/v2/create}
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
  return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/return}
  notify-url: ${PAYMENT_NOTIFY_URL:http://localhost:8081/api/v1/payments/webhook}

# Contact Configuration
contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:admin@kiteclass.com}

# AI Provider Configuration (Wave 3 Sub-PR 3.2, ADR-008)
ai:
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    default-model: ${AI_OLLAMA_MODEL:gemma2}

# Resilience4j — AI call protection (Circuit Breaker + Bulkhead + Retry)
resilience4j:
  circuitbreaker:
    instances:
      ai:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  bulkhead:
    instances:
      ai:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
  retry:
    instances:
      ai:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.kiteclass.core.module.ai.client.AIException
        ignoreExceptions:
          - com.kiteclass.core.module.ai.client.NonRetryableAIException

# Outbox publisher (Wave 3 Sub-PR 3.1, ADR-007)
outbox:
  publisher:
    interval-ms: 5000

# Content moderation (Wave 4 Sub-PR 4.1, GAP-018, ADR-010)
moderation:
  stage1:
    enabled: true
    nsfw-threshold: 0.7
  stage2:
    auto-fallback-to-template: true

# Legal / IP Protection (Wave 4 Sub-PR 4.3, ADR-012)
legal:
  trademark:
    # Seed banned-keyword list for proactive trademark scan
    # (TrademarkCheckService — intended for wiring into Wave 3 GenerateLogoStep).
    # Tenant-level overrides and USPTO-API integration deferred.
    banned-keywords:
      - "Nike"
      - "Adidas"
      - "Apple Inc"

# Data retention + GDPR deletion (Wave 4 Sub-PR 4.4, ADR-013)
retention:
  deletion:
    # 7-day grace window per ADR-013 / BR-RET-001
    grace-period-days: 7
    # HMAC key for pseudonymizing PII fields on RETAIN_WITH_PSEUDO entities.
    # MUST be overridden via RETENTION_PSEUDONYMIZE_SECRET in prod (>=32 bytes).
    pseudonymize-secret: ${RETENTION_PSEUDONYMIZE_SECRET:CHANGE_ME_32_BYTE_MIN}
