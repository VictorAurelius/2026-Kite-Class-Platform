spring:
  application:
    name: kiteclass-core

  # Wave 82 Bucket F5: REST API service — disable default static resource handler so POST to non-existent path returns 404 (NoHandlerFoundException) not 500 (NoResourceFoundException)
  web:
    resources:
      add-mappings: false

  # GAP-796: nem NoHandlerFoundException cho route khong ton tai de GlobalExceptionHandler map thanh 404 (thay vi 500 catch-all)
  mvc:
    throw-exception-if-no-handler-found: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Multipart upload limits (GAP-051 bulk import xlsx)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      enabled: true

  # JPA & Hibernate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kiteclass_dev}
    username: ${SPRING_DATASOURCE_USERNAME:kiteclass}
    password: ${SPRING_DATASOURCE_PASSWORD:kiteclass123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      # Wave 85 Bucket B B-AC6 (P0 CRITICAL): RESET app.current_tenant_id on every
      # new connection added to the pool. Defense-in-depth against cross-tenant leak
      # via stale GUC carry-over on connection reuse (Postgres GUC persists across
      # SET LOCAL boundary on close-not-disconnect — pool reuse path).
      #
      # `SET LOCAL` from TenantAwareDataSourceInterceptor auto-clears at txn commit/rollback
      # which is the primary defense; this is the SECONDARY defense for any non-tx code path
      # (raw JDBC, native query outside @Transactional, etc.).
      #
      # `SELECT 1;` placeholder is needed because HikariCP `connection-init-sql` must
      # return a row; combining the RESET + SELECT in a single statement keeps the
      # connection-pool init cost to a single round-trip.
      connection-init-sql: "SELECT set_config('app.current_tenant_id', '', false), set_config('app.is_platform_admin', 'false', false);"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        # GAP-133 — JDBC batching for bulk inserts/updates (e.g. GAP-051 student
        # bulk import). Without these properties Hibernate's default batch_size=0
        # disables batching entirely, so every persist() emits its own INSERT.
        # 50 is the canonical sweet spot for PostgreSQL; order_inserts/_updates
        # group same-table operations so prepared statements are reused.
        # batch_versioned_data must be true because BaseEntity uses @Version.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # Enable Spring-managed JPA entity listeners (for EntityPersistenceListener)
        resource:
          bean:
            container: org.springframework.orm.jpa.support.SpringBeanContainer
    open-in-view: false
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:kiteclass}
    password: ${SPRING_RABBITMQ_PASSWORD:kiteclass123}

server:
  port: 8081

# Logging
logging:
  level:
    root: INFO
    com.kiteclass: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        # GAP-476: flyway endpoint exposed, admin-gated by FlywayEndpointAuthFilter
        # (checks X-User-Roles header for ADMIN — gateway forwards post-auth).
        include: health,info,prometheus,metrics,flyway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    flyway:
      # Admin-only access enforced via FlywayEndpointAuthFilter (X-User-Roles=ADMIN).
      enabled: true
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Sampling 10% in prod, override OTEL_SAMPLING_PROBABILITY=1.0 in staging/dev.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Internal API Security
internal:
  api:
    secret: ${INTERNAL_API_SECRET:changeme-in-production-must-match-gateway}

# Storage Configuration (S3/MinIO)
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key-id: ${STORAGE_S3_ACCESS_KEY:minioadmin}
    secret-access-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_S3_BUCKET:kiteclass-files}
    path-style-access-enabled: true

# Child-protection storage (Wave 18b3 GAP-322b Phase 1B remainder).
# Reuses the storage.s3.* credentials + endpoint but routes vetting evidence
# to a dedicated bucket so RBAC + 7-year retention lifecycle policies stay
# scoped to the special-protection class of data (PDPL Decree 13/2023 Art 16
# + BR-VETTING-004).
childprotection:
  minio:
    bucket: ${CHILDPROTECTION_MINIO_BUCKET:kiteclass-vetting}

# Payment Gateway Configuration
payment:
  vnpay:
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
  momo:
    api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
  zalopay:
    api-url: ${ZALOPAY_API_URL:https://sb-openapi.zalopay.vn/v2/create}
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
  return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/return}
  notify-url: ${PAYMENT_NOTIFY_URL:http://localhost:8081/api/v1/payments/webhook}

# Contact Configuration
contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:admin@kiteclass.com}

# AI Provider Configuration (Wave 3 Sub-PR 3.2, ADR-008)
ai:
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    default-model: ${AI_OLLAMA_MODEL:gemma2}

# Branding resource routing (GAP-106 — externalize BR-RES-005 threshold)
# See documents/01-business/kiteclass/resource-classification/rules.md
branding:
  routing:
    # BR-RES-005: template-first routing toggle. Set to false ONLY for debug /
    # load-test scenarios. Production MUST leave this true.
    template-first: ${BRANDING_TEMPLATE_FIRST:true}
    # Metric alert threshold for the branding.routing.ai_ratio gauge.
    # 0.20 = 20% FULL_AI share max; Grafana alerts when exceeded.
    max-ai-ratio: ${BRANDING_MAX_AI_RATIO:0.20}

# Resilience4j — AI call protection (Circuit Breaker + Bulkhead + Retry)
resilience4j:
  circuitbreaker:
    instances:
      ai:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  bulkhead:
    instances:
      ai:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
  retry:
    instances:
      ai:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.kiteclass.core.module.ai.client.AIException
        ignoreExceptions:
          - com.kiteclass.core.module.ai.client.NonRetryableAIException

# Outbox publisher (Wave 3 Sub-PR 3.1, ADR-007)
outbox:
  publisher:
    interval-ms: 5000

# Security hardening (Wave 4 Sub-PR 4.2, ADR-011)
security:
  svg:
    enabled: true
  url:
    allowlist:
      # Comma-separated domain patterns (use *.example.com for subdomain wildcard).
      default: ""
      # Comma-separated regex patterns matching full URLs for null-tenant public calls.
      public-api-patterns: "^https://api\\.(ollama|openai|anthropic)\\.com/.*"
  csrf:
    # Default dev secret (32+ chars). MUST be overridden via SECURITY_CSRF_SECRET in prod.
    # The special values "insecure-default" and "PLEASE_OVERRIDE_IN_PROD_32_BYTE_MIN" are
    # rejected at startup by DoubleSubmitCsrfTokenProvider (fail-loud).
    secret: ${SECURITY_CSRF_SECRET:dev-only-csrf-secret-do-not-use-in-production-0123456789}
    ttl-hours: 4

# Content moderation (Wave 4 Sub-PR 4.1, GAP-018, ADR-010)
moderation:
  stage1:
    enabled: true
    nsfw-threshold: 0.7
  stage2:
    auto-fallback-to-template: true

# Legal / IP Protection (Wave 4 Sub-PR 4.3, ADR-012)
legal:
  trademark:
    # Seed banned-keyword list for proactive trademark scan
    # (TrademarkCheckService — intended for wiring into Wave 3 GenerateLogoStep).
    # Tenant-level overrides and USPTO-API integration deferred.
    banned-keywords:
      - "Nike"
      - "Adidas"
      - "Apple Inc"

# Data retention + GDPR deletion (Wave 4 Sub-PR 4.4, ADR-013)
retention:
  deletion:
    # 7-day grace window per ADR-013 / BR-RET-001
    grace-period-days: 7
    # HMAC key for pseudonymizing PII fields on RETAIN_WITH_PSEUDO entities.
    # MUST be overridden via RETENTION_PSEUDONYMIZE_SECRET in prod (>=32 bytes).
    pseudonymize-secret: ${RETENTION_PSEUDONYMIZE_SECRET:CHANGE_ME_32_BYTE_MIN}

# Automated Quality Gate (Wave 4 Sub-PR 4.5, GAP-012, ai-branding-guidelines.md §5)
# InstanceQualityReviewer aggregates 5 checks into a 0–100 score; DEPLOY blocked
# below pass-threshold.
quality-gate:
  pass-threshold: 70

# Parent portal (Wave 2, GAP-052a) — identity + invitation.
# Feature flag stays false by default until Wave 5 lands the full dashboard
# widgets and the PDPL wording on parent data is finalised.
kiteclass:
  parent-portal:
    enabled: ${PARENT_PORTAL_ENABLED:false}
    invitation-ttl-hours: 24
    redeem-base-url: ${PARENT_PORTAL_REDEEM_BASE_URL:https://app.kiteclass.vn/parent-invite/}
    # Hourly sweep (ms) — override for tests via @TestPropertySource.
    expire-sweep-ms: 3600000

# Class reschedule notification (Wave beta-readiness-4 Bucket D — GAP-291).
# Per cross-bucket LOCKED decision §3.6 (Wave plan):
#   - Default DISABLED — ClassRescheduledNoOpConsumer logs only.
#   - Phase 1.5+ enables email path via ClassRescheduledEmailConsumer.
#   - Notification classification = OPERATIONAL (bypass marketing_consented gate).
# Default `false` is the production-correct value (Phase 1 BETA email-fallback Phase 1.5+);
# NOT a suspect-default per `production-env-config-registry.md` §2 (no dev-only hostname).
kite:
  class:
    reschedule:
      notify:
        enabled: ${KITE_CLASS_RESCHEDULE_NOTIFY_ENABLED:false}
