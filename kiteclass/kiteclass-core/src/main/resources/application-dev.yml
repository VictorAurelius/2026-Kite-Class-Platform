# Dev profile — local development with seed data.
#
# Activates BrandingDataSeeder (@Profile("dev")) which idempotently inserts
# 1 DEPLOYED FrontendInstance + 3 BrandingResources + 1 QualityReport + 1 outbox
# event so the FE wizard demo can run end-to-end without invoking real AI clients.
#
# Run with: --spring.profiles.active=dev
#
# Schema: GAP-244 (V46__align_audit_columns_to_bigint.sql) closed the
# created_by/updated_by VARCHAR↔Long mismatch, so dev now follows the same
# Flyway + ddl-auto: validate path as production. No local override needed.

spring:
  jpa:
    show-sql: false  # toggle to true for local SQL inspection

logging:
  level:
    com.kiteclass.core.dev.seeder: INFO
