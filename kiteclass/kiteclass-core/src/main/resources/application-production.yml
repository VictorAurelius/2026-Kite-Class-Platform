# =============================================================================
# PRODUCTION PROFILE - kiteclass-core
# =============================================================================
# Activated by: SPRING_PROFILES_ACTIVE=production
# Wave 85 Bucket E (GAP-503): Tier 2 config — JVM 60% + Tomcat + HikariCP.
# Closes audit-spring-profiles.sh finding for kiteclass-core (silent profile skip).
#
# Characteristics:
#   - Tighten logging (no SQL, no debug)
#   - Hide stacktrace + error message
#   - Scope actuator exposure
#   - HikariCP + Tomcat thread pool right-sized for t3.small + RDS db.t3.micro

spring:
  jpa:
    show-sql: false

  # GAP-503 / Wave 85 Bucket E — HikariCP right-size (E-AC3 alarm guards exhaustion).
  # 7 services × 10 connections = 70 total < RDS db.t3.micro cap 87 (max_connections).
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  error:
    include-stacktrace: never
    include-message: never
  # GAP-503 / Wave 85 Bucket E — Tomcat thread pool right-size (E-AC2 alarm).
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000

logging:
  level:
    root: WARN
    com.kiteclass: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
