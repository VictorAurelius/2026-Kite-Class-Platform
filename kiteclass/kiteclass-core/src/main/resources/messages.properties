# Course Module Error Codes
# ============================================================================

# Entity Not Found
COURSE_NOT_FOUND=Course not found with ID: {0}

# Duplicate Resource
COURSE_CODE_EXISTS=Course code already exists: {0}

# Status Validation
COURSE_CANNOT_DELETE_STATUS=Cannot delete course with status {0}. Only DRAFT courses can be deleted.
COURSE_INVALID_PUBLISH_STATE=Can only publish courses in DRAFT status. Current status: {0}
COURSE_INVALID_ARCHIVE_STATE=Can only archive courses in PUBLISHED status. Current status: {0}

# Update Restrictions
COURSE_INVALID_UPDATE_ARCHIVED=Cannot update ARCHIVED courses. Archived courses are read-only.
COURSE_INVALID_UPDATE_PUBLISHED=PUBLISHED courses can only update: description, syllabus, objectives, price, coverImageUrl. Cannot update: name, durationWeeks, totalSessions, prerequisites, targetAudience.

# Required Fields
COURSE_MISSING_REQUIRED_FIELDS=Cannot publish course. Missing required fields: {0}

# Active Classes Check
COURSE_CANNOT_DELETE_CLASSES=Cannot delete course with active classes

# ============================================================================
# Class Module Error Codes
# ============================================================================

# Entity Not Found
CLASS_NOT_FOUND=Class not found with ID: {0}

# Duplicate Resource
CLASS_NAME_EXISTS=Class name already exists in this course: {0}
CLASS_CODE_EXISTS=Class code already in use: {0}

# Status Validation (BR-CLASS-006)
CLASS_READ_ONLY=Cannot modify class with status {0}. Completed and cancelled classes are read-only.
CLASS_CANNOT_START=Can only start a class in SCHEDULED status. Current status: {0}
CLASS_CANNOT_COMPLETE=Can only complete a class in IN_PROGRESS status. Current status: {0}
CLASS_CANNOT_CANCEL=Cannot cancel a class with status {0}. Only SCHEDULED or IN_PROGRESS classes can be cancelled.
CLASS_CANNOT_DELETE=Can only delete SCHEDULED classes. Current status: {0}
CLASS_HAS_STUDENTS=Cannot delete class with enrolled students. Current enrollment: {0}. Cancel the class instead.

# Schedule Validation
CLASS_SCHEDULE_LOCKED=Cannot change schedule or dates for an IN_PROGRESS class.
CLASS_INVALID_DATES=End date must be after start date.
CLASS_NO_DATES=Class must have start date and end date before creating a schedule.
CLASS_INVALID_TIME=End time must be after start time.

# Business Rules
CLASS_COURSE_ARCHIVED=Cannot create a class for an ARCHIVED course.
CLASS_CAPACITY_VIOLATION=Max students cannot be less than current enrollment: {0}
CLASS_CODE_GENERATION_FAILED=Failed to generate a unique class code after multiple attempts. Please try again.

