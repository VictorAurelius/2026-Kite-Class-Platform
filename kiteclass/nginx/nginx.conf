events {
    worker_connections 1024;
}

http {
    # Upstream to Gateway service
    upstream gateway {
        server gateway:8080;
    }

    # Map to set CORS headers
    map $request_method $cors_method {
        OPTIONS 11;
        GET 1;
        POST 1;
        PUT 1;
        DELETE 1;
        PATCH 1;
        default 0;
    }

    server {
        listen 8090;
        server_name localhost;

        # Proxy all requests to Gateway
        location / {
            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Tenant-Id, X-Request-Id, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' '3600' always;
                add_header 'Content-Length' '0';
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # Hide any CORS headers from upstream (Gateway) to avoid duplicates
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            proxy_hide_header 'Access-Control-Expose-Headers';
            proxy_hide_header 'Access-Control-Max-Age';

            # CORS headers for regular requests (only from Nginx)
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Tenant-Id, X-Request-Id, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for Server-Sent Events
            proxy_buffering off;
        }
    }
}
