groups:
  - name: kiteclass-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."
          runbook_url: "/documents/05-guides/operations/runbooks/service-down.md"

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "5xx error rate is above 5% for more than 5 minutes (current: {{ $value | humanizePercentage }})."
          runbook_url: "/documents/05-guides/operations/runbooks/high-error-rate.md"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time on {{ $labels.instance }}"
          description: "95th percentile response time is above 2 seconds for more than 5 minutes (current: {{ $value }}s)."
          runbook_url: "/documents/05-guides/operations/runbooks/high-response-time.md"

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High heap memory usage on {{ $labels.instance }}"
          description: "JVM heap usage is above 85% for more than 5 minutes (current: {{ $value | humanizePercentage }})."
          runbook_url: "/documents/05-guides/operations/runbooks/high-memory-usage.md"

      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion on {{ $labels.instance }}"
          description: "HikariCP active connections are above 90% of max for more than 2 minutes (current: {{ $value | humanizePercentage }})."
          runbook_url: "/documents/05-guides/operations/runbooks/database-pool-exhausted.md"

  # GAP-217 — Wave 5 document-generation endpoints (Sub-PR 5.5).
  # Mirrors infrastructure/helm/kitehub/templates/prometheusrule.yaml second group.
  # Routing depends on Alertmanager (GAP-120); rules fire silently until that ships.
  - name: kiteclass-document-generation-alerts
    rules:
      - alert: DocumentGenerationHighP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/v1/documents/.*"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: kiteclass-core
        annotations:
          summary: "Document generation p95 latency exceeds BR-DOC-PDF-007 budget"
          description: "POST /api/v1/documents/* p95 is above 2 seconds for 5 minutes (current: {{ $value | humanizeDuration }}). Likely cause: branding cache miss storm OR PDF font load regression."
          runbook_url: "documents/05-guides/runbooks/pdf-generation-font-not-found.md"

      - alert: DocumentGenerationHighErrorRate
        expr: |
          (
            sum (rate(http_server_requests_seconds_count{uri=~"/api/v1/documents/.*",status=~"5.."}[5m]))
            /
            sum (rate(http_server_requests_seconds_count{uri=~"/api/v1/documents/.*"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          service: kiteclass-core
        annotations:
          summary: "5xx rate on /api/v1/documents/* exceeds 1%"
          description: "Document generation endpoints returning {{ $value | humanizePercentage }} server errors over 5 minutes. Common cause: missing DejaVuSans TTF in deployed image."
          runbook_url: "documents/05-guides/runbooks/pdf-generation-font-not-found.md"

      - alert: DocumentBrandingCacheMissStorm
        # Depends on Spring Cache Micrometer metrics (GAP-219 P1 sub-bullet 4).
        # Until those metrics are wired, this rule has no data source — filed alongside
        # peers to capture intent.
        expr: rate(spring_cache_misses_total{cache="branding-by-tenant"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: kiteclass-core
        annotations:
          summary: "branding-by-tenant cache miss rate elevated"
          description: "Cache miss rate above 10/s for 5 minutes — possible eviction storm or post-deploy cold start. Each miss hits PostgreSQL via BrandingService.getBranding()."
