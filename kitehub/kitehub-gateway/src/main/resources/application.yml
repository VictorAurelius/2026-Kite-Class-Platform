spring:
  application:
    name: kite-gateway

  cloud:
    gateway:
      # CORS Configuration for frontend
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000,http://kitehub-frontend:3001,http://kiteclass-frontend:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Auth APIs - handled by Subscription Service
        # GAP-514 — OWASP A07 hardening: per-endpoint RequestRateLimiter on every auth
        # surface (login/refresh/verify-email/resend) to bound brute-force +
        # credential-stuffing + Resend-quota-burn vectors. Rates per
        # `pre-launch-auth-hardening-checklist.md` §2.1.
        # Specific paths MUST precede the `auth` catch-all so they win on path match.
        - id: auth-register
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/register
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-login
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-refresh
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/refresh
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-verify-email
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/verify-email
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-resend-verification
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/resend-verification
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@emailKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Platform APIs - Instance Management (Subscription Service)
        - id: platform-instances
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/instances/**
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # GAP-512 — /api/instances/{id}/domain/verify (DomainVerifyController, kitehub-subscription)
        # Orphan — no prior gateway route covered.
        - id: kitehub-instance-domain-verify
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/instances/**
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # Platform APIs - Public Config (no auth required)
        - id: platform-config
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/config/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Platform APIs - Subscription Service
        - id: platform-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/subscriptions/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Platform APIs - Payment Service
        - id: platform-payment
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        # Platform APIs - Branding Service
        # GAP-259 — tenant-keyed rate limit on the AI cost surface so that one tenant
        # behind a NAT cannot starve co-tenants. Burst tuned for wizard usage; per-tier
        # multiplier deferred to GAP-260 (custom RedisRateLimiter required).
        - id: platform-branding
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/api/platform/branding/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${BRANDING_RATE_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${BRANDING_RATE_BURST:60}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantKeyResolver}"
            - name: CircuitBreaker
              args:
                name: brandingCircuitBreaker
                fallbackUri: forward:/fallback/branding

        # GAP-512 — /api/platform/admin/emails + /instances owned by kitehub-subscription
        # (EmailHistoryController, EmailStatsController, InstanceForceConvertController, etc.)
        # Must precede platform-admin catch-all.
        - id: platform-admin-emails-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/emails/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: platform-admin-instances-force-convert-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/instances/{id}/force-convert
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        - id: platform-admin-instances-rollback-migration-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/instances/{id}/rollback-migration
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # Platform APIs - Admin Service
        - id: platform-admin
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/api/platform/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # Platform APIs - Email Service
        - id: platform-email
          uri: http://kitehub-email:8080
          predicates:
            - Path=/api/platform/emails/**
          filters:
            - name: CircuitBreaker
              args:
                name: emailCircuitBreaker
                fallbackUri: forward:/fallback/email

        # Swagger UI routes - per-service API documentation
        - id: subscription-docs
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/docs/subscription/**
          filters:
            - RewritePath=/docs/subscription(?<segment>/?.*), ${segment}

        - id: branding-docs
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/docs/branding/**
          filters:
            - RewritePath=/docs/branding(?<segment>/?.*), ${segment}

        - id: admin-docs
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/docs/admin/**
          filters:
            - RewritePath=/docs/admin(?<segment>/?.*), ${segment}

        - id: email-docs
          uri: http://kitehub-email:8080
          predicates:
            - Path=/docs/email/**
          filters:
            - RewritePath=/docs/email(?<segment>/?.*), ${segment}

        # GAP-514 — rate-limit on public beta signup endpoint (must precede catch-all)
        - id: kitehub-auth-v1-request-beta-access
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/request-beta-access
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-509 — kitehub auth v1 (beta signup + verification) routes
        # to subscription service. Must precede instance-apis catch-all so
        # /api/v1/auth/** is captured before falling through to kiteclass-core.
        - id: kitehub-auth-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-512 — beta-requests admin endpoints live in kitehub-subscription
        # (BetaAccessController.adminListBetaRequests/approveBetaRequest/rejectBetaRequest)
        # Must precede kitehub-admin-v1 catch-all.
        - id: kitehub-admin-beta-requests-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/admin/beta-requests/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-509 — kitehub admin v1 (beta-requests approve/reject) routes
        # to admin service. Must precede instance-apis catch-all.
        - id: kitehub-admin-v1
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # GAP-512 — kitehub consent/dsar/notification/branding under /api/v1/**
        # Must precede instance-apis catch-all to avoid forwarding to kiteclass-core.
        - id: kitehub-consent-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/consent/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-dsar-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/dsar/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-notification-preferences-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/notification-preferences/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-branding-v1
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/api/v1/branding/**
          filters:
            - name: CircuitBreaker
              args:
                name: brandingCircuitBreaker
                fallbackUri: forward:/fallback/branding

        # Instance APIs - Route to KiteClass Core (via TenantResolver)
        - id: instance-apis
          uri: ${KITECLASS_CORE_URL:http://kiteclass-core:8080}
          predicates:
            - Path=/api/v1/**
          filters:
            - TenantResolver
            - name: CircuitBreaker
              args:
                name: instanceCircuitBreaker
                fallbackUri: forward:/fallback/instance

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Gateway-Version, 1.0

  # Database configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:}  # No default - must be provided via env var
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # GAP-133 — JDBC batching. The gateway uses JPA only for rate-limit
        # bookkeeping, but batching is cheap and consistent with sibling services.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Redis configuration for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

# Server configuration
server:
  port: ${SERVER_PORT:9000}

# Rate limiting by tier
kitehub:
  domain:
    base: ${BASE_DOMAIN:.kiteclass.com}
  rate-limit:
    default-limit: 100
    limits:
      FREE: 100
      BASIC: 500
      PREMIUM: 2000
      ENTERPRISE: 10000
    # GAP-259 — tier-aware burst multiplier. Data-only in this release; consumed by the
    # tier-aware RedisRateLimiter scheduled in GAP-260 follow-up.
    tier-multiplier:
      FREE: 1.0
      BASIC: 1.0
      PREMIUM: 3.0
      ENTERPRISE: 10.0

# Circuit breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      authCircuitBreaker:
        baseConfig: default
      instancesCircuitBreaker:
        baseConfig: default
      subscriptionCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      brandingCircuitBreaker:
        baseConfig: default
      adminCircuitBreaker:
        baseConfig: default
      emailCircuitBreaker:
        baseConfig: default
      instanceCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 60

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Gateway is the trace-injection edge: instruments Spring Cloud Gateway routes and
  # propagates traceparent headers to downstream services.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging
logging:
  level:
    com.kitehub.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO
