spring:
  application:
    name: kitehub-gateway

  cloud:
    gateway:
      # CORS Configuration for frontend
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3001"
              - "http://localhost:3000"
              - "http://kitehub-frontend:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Auth APIs - handled by Subscription Service
        - id: auth
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Platform APIs - Instance Management (Subscription Service)
        - id: platform-instances
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/instances/**
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # Platform APIs - Subscription Service
        - id: platform-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/subscriptions/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Platform APIs - Payment Service
        - id: platform-payment
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        # Platform APIs - Branding Service
        - id: platform-branding
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/api/platform/branding/**
          filters:
            - name: CircuitBreaker
              args:
                name: brandingCircuitBreaker
                fallbackUri: forward:/fallback/branding

        # Platform APIs - Admin Service
        - id: platform-admin
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/api/platform/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # Platform APIs - Email Service
        - id: platform-email
          uri: http://kitehub-email:8080
          predicates:
            - Path=/api/platform/emails/**
          filters:
            - name: CircuitBreaker
              args:
                name: emailCircuitBreaker
                fallbackUri: forward:/fallback/email

        # Instance APIs - Route to KiteClass instances
        # TODO: Implement TenantResolverGatewayFilterFactory
        # - id: instance-apis
        #   uri: http://kiteclass-gateway:8080
        #   predicates:
        #     - Path=/api/v1/**
        #   filters:
        #     - TenantResolver
        #     - name: CircuitBreaker
        #       args:
        #         name: instanceCircuitBreaker
        #         fallbackUri: forward:/fallback/instance

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Gateway-Version, 1.0

  # Database configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:kitehub_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis configuration for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

# Server configuration
server:
  port: ${SERVER_PORT:9000}

# Rate limiting by tier
kitehub:
  rate-limit:
    default-limit: 100
    limits:
      FREE: 100
      BASIC: 500
      PREMIUM: 2000
      ENTERPRISE: 10000

# Circuit breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      authCircuitBreaker:
        baseConfig: default
      instancesCircuitBreaker:
        baseConfig: default
      subscriptionCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      brandingCircuitBreaker:
        baseConfig: default
      adminCircuitBreaker:
        baseConfig: default
      emailCircuitBreaker:
        baseConfig: default
      instanceCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 60

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging
logging:
  level:
    com.kitehub.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO
