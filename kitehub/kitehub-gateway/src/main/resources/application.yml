spring:
  application:
    name: kite-gateway

  cloud:
    gateway:
      # CORS Configuration for frontend
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000,http://kitehub-frontend:3001,http://kiteclass-frontend:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Auth APIs - handled by Subscription Service
        # GAP-514 — OWASP A07 hardening: per-endpoint RequestRateLimiter on every auth
        # surface (login/refresh/verify-email/resend) to bound brute-force +
        # credential-stuffing + Resend-quota-burn vectors. Rates per
        # `pre-launch-auth-hardening-checklist.md` §2.1.
        # Specific paths MUST precede the `auth` catch-all so they win on path match.
        # GAP-928 Phase 2: tenant-creating write endpoint -- uses
        # authWriteCircuitBreaker (slow-call detection disabled) so a slow
        # 2FA verify on /api/auth/** cannot trip the breaker that gates
        # user registration.
        - id: auth-register
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/register
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authWriteCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-login
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-refresh
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/refresh
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-verify-email
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/verify-email
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-resend-verification
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/resend-verification
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@emailKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Wave 78 Bucket C / GAP-514 close-out — preemptive rate-limit on
        # /api/auth/password-reset-request per `pre-launch-auth-hardening-checklist.md`
        # §2.1 (1/sec replenish, 2 burst, email-keyed to bound spam-via-reset).
        # Subscription service does not yet implement the password-reset feature;
        # until the route lands the gateway forwards to subscription which returns
        # 404 — but the rate-limit guard is in place defense-in-depth so the rate
        # cannot be bypassed once the feature ships.
        - id: auth-password-reset-request
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/password-reset-request
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@emailKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Platform APIs - Instance Management (Subscription Service)
        - id: platform-instances
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/instances/**
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # GAP-512 — /api/instances/{id}/domain/verify (DomainVerifyController, kitehub-subscription)
        # Orphan — no prior gateway route covered.
        - id: kitehub-instance-domain-verify
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/instances/**
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # Platform APIs - Public Config (no auth required)
        - id: platform-config
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/config/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Platform APIs - Subscription Service
        - id: platform-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/subscriptions/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Platform APIs - Payment Service
        - id: platform-payment
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        # Platform APIs - Payment Webhooks (SePay — Wave flow-kh3-2/3)
        # POST /api/platform/webhooks/payment carries `Authorization: Apikey <key>`
        # (NOT a JWT) — SePay merchant gateway calls this on payment notification.
        # NO RequestRateLimiter: SePay retries on non-200 + has its own delivery
        # cadence; rate-limiting webhook delivery like user traffic would drop
        # legitimate retries → missed payment confirmations. CircuitBreaker still
        # guards against downstream subscription-service outage. Idempotency is
        # enforced server-side via UNIQUE on payments.transaction_id (per
        # documents/01-business/kitehub/subscription-billing/api-contract.md UC-SUB-08).
        # Gateway JwtAuthenticationGatewayFilter whitelists /api/platform/webhooks/**
        # as a public path (Apikey-only request must not be rejected as missing JWT).
        - id: platform-webhooks
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/webhooks/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        # Platform APIs - Branding Service
        # GAP-259 — tenant-keyed rate limit on the AI cost surface so that one tenant
        # behind a NAT cannot starve co-tenants. Burst tuned for wizard usage; per-tier
        # multiplier deferred to GAP-260 (custom RedisRateLimiter required).
        - id: platform-branding
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/api/platform/branding/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${BRANDING_RATE_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${BRANDING_RATE_BURST:60}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantKeyResolver}"
            - name: CircuitBreaker
              args:
                name: brandingCircuitBreaker
                fallbackUri: forward:/fallback/branding

        # GAP-512 — /api/platform/admin/emails + /instances owned by kitehub-subscription
        # (EmailHistoryController, EmailStatsController, InstanceForceConvertController, etc.)
        # Must precede platform-admin catch-all.
        - id: platform-admin-emails-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/emails/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: platform-admin-instances-force-convert-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/instances/{id}/force-convert
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        - id: platform-admin-instances-rollback-migration-subscription
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/platform/admin/instances/{id}/rollback-migration
          filters:
            - name: CircuitBreaker
              args:
                name: instancesCircuitBreaker
                fallbackUri: forward:/fallback/instances

        # Platform APIs - Admin Service
        - id: platform-admin
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/api/platform/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # Platform APIs - Email Service
        - id: platform-email
          uri: http://kitehub-email:8080
          predicates:
            - Path=/api/platform/emails/**
          filters:
            - name: CircuitBreaker
              args:
                name: emailCircuitBreaker
                fallbackUri: forward:/fallback/email

        # Swagger UI routes - per-service API documentation
        - id: subscription-docs
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/docs/subscription/**
          filters:
            - RewritePath=/docs/subscription(?<segment>/?.*), ${segment}

        - id: branding-docs
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/docs/branding/**
          filters:
            - RewritePath=/docs/branding(?<segment>/?.*), ${segment}

        - id: admin-docs
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/docs/admin/**
          filters:
            - RewritePath=/docs/admin(?<segment>/?.*), ${segment}

        - id: email-docs
          uri: http://kitehub-email:8080
          predicates:
            - Path=/docs/email/**
          filters:
            - RewritePath=/docs/email(?<segment>/?.*), ${segment}

        # GAP-514 — rate-limit on public beta signup endpoint (must precede catch-all)
        - id: kitehub-auth-v1-request-beta-access
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/request-beta-access
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-547 (Wave 79 Bucket A) — 2FA endpoints versioned at /api/v1/auth/2fa/*
        # with backward-compat alias /api/auth/2fa/* (30-day deprecation per
        # BR-AUTH-2FA-007; alias 410 Gone after 2026-06-14). Rate limits per
        # `documents/01-business/kitehub/auth-2fa/api-contract.md` §Rate limits.
        # Must precede kitehub-auth-v1 catch-all + auth catch-all so specific
        # path predicates win on path match.
        - id: kitehub-auth-v1-2fa-verify
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/2fa/verify
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: kitehub-auth-v1-2fa-recovery-regenerate
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/2fa/recovery-codes/regenerate
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: kitehub-auth-v1-2fa
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/2fa/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-547 backward-compat alias: /api/auth/2fa/** (deprecated path).
        # Mirrored rate limits; specific subpaths precede the catch-all.
        - id: auth-2fa-verify-alias
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/2fa/verify
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-2fa-recovery-regenerate-alias
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/2fa/recovery-codes/regenerate
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-2fa-alias
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/auth/2fa/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-551 (Wave 79 Bucket A) — feedback widget public endpoint owned by
        # kitehub-subscription. Previously fell through to /api/v1/** instance-apis
        # catch-all → kiteclass-core (404). Explicit route + rate limit per
        # `documents/01-business/kitehub/feedback/api-contract.md` §Rate limits.
        # Must precede instance-apis catch-all.
        - id: kitehub-feedback-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/feedback
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # GAP-928 Phase 2 — tenant-creating write endpoint carved out from
        # the kitehub-auth-v1 catch-all below. POST /api/v1/auth/beta-signup
        # creates a brand-new tenant + OWNER user; runtime on a cold local
        # stack is legitimately 1-5s. Phase 1 loosened the shared authRoute
        # config but the breaker is still shared with read paths under
        # /api/auth/** (2FA verify, login, refresh, etc.), so a slow read
        # call can still trip the breaker and lock out an in-flight write.
        # Wave flow-kh1 re-walk 2026-06-04 06:18-06:19 UTC reproduced that
        # exact lockout (slow 2FA at 06:18:53 -> OPEN breaker -> beta-signup
        # at 06:19:29 returns false 503 even though subscription committed
        # the tenant + OWNER row at 06:19:29). This route uses the dedicated
        # authWriteCircuitBreaker whose authWriteRoute config disables
        # slow-call detection.
        #
        # Route declared BEFORE kitehub-auth-v1 so Spring Cloud Gateway
        # matches it first (route order = declaration order).
        - id: kitehub-auth-v1-beta-signup
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/beta-signup
            - Method=POST
          filters:
            - name: CircuitBreaker
              args:
                name: authWriteCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-509 — kitehub auth v1 (beta signup + verification) routes
        # to subscription service. Must precede instance-apis catch-all so
        # /api/v1/auth/** is captured before falling through to kiteclass-core.
        - id: kitehub-auth-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # GAP-512 — beta-requests admin endpoints live in kitehub-subscription
        # (BetaAccessController.adminListBetaRequests/approveBetaRequest/rejectBetaRequest)
        # Must precede kitehub-admin-v1 catch-all.
        - id: kitehub-admin-beta-requests-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/admin/beta-requests/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Wave 79 admin-impersonate endpoints on kitehub-subscription
        # (ImpersonationController @RequestMapping("/api/v1/admin/impersonate")).
        # Wave 82 Bucket F4 fix (audit-gateway-routes.sh): must precede /api/v1/admin/**
        # since impersonate lives on kitehub-subscription, not kitehub-admin.
        - id: kitehub-admin-impersonate
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/admin/impersonate/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # GAP-509 — kitehub admin v1 (beta-requests approve/reject) routes
        # to admin service. Must precede instance-apis catch-all.
        - id: kitehub-admin-v1
          uri: http://kitehub-admin:8080
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # GAP-512 — kitehub consent/dsar/notification/branding under /api/v1/**
        # Must precede instance-apis catch-all to avoid forwarding to kiteclass-core.
        - id: kitehub-consent-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/consent/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-dsar-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/dsar/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-notification-preferences-v1
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/notification-preferences/**
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        - id: kitehub-branding-v1
          uri: http://kitehub-branding:8080
          predicates:
            - Path=/api/v1/branding/**
          filters:
            - name: CircuitBreaker
              args:
                name: brandingCircuitBreaker
                fallbackUri: forward:/fallback/branding

        # GAP-539 (Wave 78) — Public beta-status endpoint on kitehub-subscription.
        # Wave 82 Bucket F4 fix: route was missing → fell through to instance-apis
        # catch-all → TenantResolver rejected as 400 (no tenant header on public path).
        - id: kitehub-beta-status
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/beta-status
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Wave A Bucket B (GAP-786) REVERSES Wave meta-6 routing decision after
        # Decision Day 1 investigation 2026-05-28 surfaced cross-DB blocker:
        # - kiteclass-core (port 5432, kiteclass_dev DB) vs kitehub-subscription
        #   (port 5433, kitehub DB) cannot share JPA UserRepository trivially.
        # - kitehub-subscription staff path ALREADY creates user on accept
        #   (production-proven pre-Wave meta-6 — StaffInvitationController:242
        #   calls userRepository.save). kiteclass-core MVP path Bug #17 confirmed
        #   broken (StaffInvitationServiceImpl:159-164 "BLOCKED ON GAP-786, user
        #   provisioning on accept NOT IMPLEMENTED, password dropped").
        # - Bug #14 email path (GAP-787) Bucket A adds @RabbitListener trong
        #   kitehub-email subscribed to kitehub-subscription's email.send queue —
        #   aligns naturally when staff-invitations routes to kitehub-subscription.
        # User confirmed reversal 2026-05-28 Day 2 architecture lock (Wave A
        # plan §5.2). kiteclass-core staff module → deprecate (separate subtask).
        # GAP-790 — staff-invitations PUBLIC token paths (recipient clicks email link,
        # no JWT / no subdomain). These MUST precede the Owner-scoped staff-invitations
        # route below so they win on path match and SKIP TenantResolver — the recipient
        # carries no tenant context, so TenantResolver would reject with 400. Tenant is
        # derived server-side from the token's invitation row instead. permitAll in
        # kitehub-subscription SecurityConfig (StaffInvitationController §"Public endpoints").
        - id: staff-invitations-public-token
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/staff-invitations/by-token/**,/api/v1/staff-invitations/*/accept
          filters:
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # GAP-790 — Owner-scoped staff-invitations (create/list/resend/delete) ADD
        # TenantResolver (mirror instance-apis catch-all). This specific path matches
        # before /api/v1/** catch-all, so it previously bypassed TenantResolver →
        # 403 TENANT_CONTEXT_MISSING when client omits X-Tenant-Id. TenantResolver's
        # JWT tenantId claim fallback (GAP-711) resolves tenant from Owner JWT
        # (enriched per GAP-704) for localhost/apex access.
        - id: staff-invitations
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/staff-invitations/**
          filters:
            - TenantResolver
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Onboarding progress lives in kitehub-subscription
        # (OnboardingProgressController @RequestMapping("/api/v1/onboarding-progress")).
        # Wave 104.5 GAP-714 fix: was falling through /api/v1/** catch-all
        # → kiteclass-core which has no handler → NoHandlerFoundException → 500.
        - id: kitehub-onboarding-progress
          uri: http://kitehub-subscription:8080
          predicates:
            - Path=/api/v1/onboarding-progress/**,/api/v1/onboarding-progress
          filters:
            # GAP-790 sweep — same bug class as staff-invitations: tenant-scoped route
            # more specific than /api/v1/** catch-all, previously bypassed TenantResolver.
            # OnboardingProgressController is Owner-scoped (GET/PUT both require tenant via
            # X-Tenant-Id OR JWT tenantId claim) with no public sub-paths, so add
            # TenantResolver directly. Gateway-level resolution mirrors instance-apis +
            # adds the instance ACTIVE/TRIAL status check the controller fallback lacks.
            - TenantResolver
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # GAP-809 — PUBLIC tenant landing page (anonymous visitors, no JWT / no subdomain).
        # tenantId is in the PATH (/api/v1/tenants/{id}/landing) so the route is already
        # tenant-scoped; it MUST precede the /api/v1/** catch-all so it wins on path match
        # and SKIPS TenantResolver (which would 400 on localhost/SSR with no subdomain).
        # kiteclass-core LandingPageController resolves tenant from the path UUID.
        - id: public-tenant-landing
          uri: ${KITECLASS_CORE_URL:http://kiteclass-core:8080}
          predicates:
            - Path=/api/v1/tenants/*/landing
          filters:
            - name: CircuitBreaker
              args:
                name: instanceCircuitBreaker
                fallbackUri: forward:/fallback/instance

        # GAP-813 (Wave tenant-domain-1 Bucket B) — PUBLIC tenant resolve by subdomain.
        # FE middleware calls GET /api/v1/public/tenants/by-subdomain/{slug} to map a
        # Host header subdomain to a tenant UUID before requesting tenant-scoped APIs.
        # Anonymous (no JWT, no subdomain Host); rate-limited 30 req/min/IP to defend
        # enumeration scans. MUST precede /api/v1/** catch-all so it wins on path match
        # and SKIPS TenantResolver (no Host-based tenant resolution needed —
        # subdomain is in the URL path).
        - id: public-tenant-resolve
          uri: ${SUBSCRIPTION_SERVICE_URL:http://kitehub-subscription:8080}
          predicates:
            - Path=/api/v1/public/tenants/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: subscriptionCircuitBreaker
                fallbackUri: forward:/fallback/subscription

        # Instance APIs - Route to KiteClass Core (via TenantResolver)
        - id: instance-apis
          uri: ${KITECLASS_CORE_URL:http://kiteclass-core:8080}
          predicates:
            - Path=/api/v1/**
          filters:
            - TenantResolver
            - name: CircuitBreaker
              args:
                name: instanceCircuitBreaker
                fallbackUri: forward:/fallback/instance

      # Default filters applied to all routes
      # GAP-814 (Wave tenant-domain-1 Bucket A) — strip client-supplied identity
      # headers BEFORE any business filter. Gateway is the SOLE authority that
      # may set X-Tenant-Id / X-User-Id; downstream services trust these as
      # gateway-resolved. Without this strip, a client can spoof
      # `X-Tenant-Id: <other-tenant>` on any route NOT covered by TenantResolver
      # (e.g. /api/v1/staff-invitations/by-token/**, /api/v1/tenants/*/landing,
      # /api/auth/**) → cross-tenant IDOR. The strip is global default-filter so
      # it applies to EVERY route. JwtAuthenticationGatewayFilter (GAP-604) then
      # re-injects X-User-Id from verified JWT; TenantHeaderGuardFilter
      # (GAP-814) re-injects X-Tenant-Id from verified JWT claim; TenantResolver
      # GatewayFilterFactory continues to re-set X-Tenant-Id from Host header
      # on instance-api routes (precedence: TenantResolver per-route override
      # → guard JWT-claim fallback → stripped null on public routes).
      default-filters:
        - RemoveRequestHeader=X-Tenant-Id
        - RemoveRequestHeader=X-User-Id
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Gateway-Version, 1.0

  # Database configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:}  # No default - must be provided via env var
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # GAP-133 — JDBC batching. The gateway uses JPA only for rate-limit
        # bookkeeping, but batching is cheap and consistent with sibling services.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Redis configuration for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

# Server configuration
server:
  port: ${SERVER_PORT:9000}

# Rate limiting by tier
kitehub:
  domain:
    base: ${BASE_DOMAIN:.kiteclass.com}
  rate-limit:
    default-limit: 100
    limits:
      FREE: 100
      BASIC: 500
      PREMIUM: 2000
      ENTERPRISE: 10000
    # GAP-259 — tier-aware burst multiplier. Data-only in this release; consumed by the
    # tier-aware RedisRateLimiter scheduled in GAP-260 follow-up.
    tier-multiplier:
      FREE: 1.0
      BASIC: 1.0
      PREMIUM: 3.0
      ENTERPRISE: 10.0

# Circuit breaker configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      # GAP-928 Phase 1 — Wave flow-kh1 G2 walk 2026-06-04 04:47:33-34 UTC:
      # invitee g2test-an-4 saw 503 on POST /api/v1/auth/beta-signup at
      # 04:47:34 while subscription DB had already committed status
      # SIGNED_UP + provisioned tenant g2test-an-4 + inserted OWNER user
      # row at 04:47:33 (DB-confirmed). The default 5-call sliding window
      # + tight slowCallDurationThreshold trips the breaker on a single
      # slow-but-successful tenant provisioning request after the kitehub-
      # subscription / kiteclass-core restarts earlier in the same session
      # (GAP-925 + GAP-866 rebuilds). Tenant provisioning on a cold local
      # stack realistically takes 2-5s. Loosen thresholds for the auth
      # route only so the breaker tolerates write-heavy first calls.
      # Phase 2 (carve dedicated route for /api/v1/auth/beta-signup with
      # no slow-call counting) + Phase 3 (fallback controller logs
      # upstream status + body fingerprint) tracked in GAP-928 §Open
      # Items.
      authRoute:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 20
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 10s
        slowCallRateThreshold: 80
        eventConsumerBufferSize: 10
      # GAP-928 Phase 2 — Wave flow-kh1 re-walk 2026-06-04 06:18-06:19 UTC
      # reproduced the false 503 even with Phase 1 thresholds applied. The
      # shared authCircuitBreaker tripped at 06:18:53 on a slow 2FA verify
      # call, then the invitee's beta-signup POST at 06:19:29 hit the OPEN
      # breaker. The subscription module had already committed the new
      # tenant + OWNER user row at 06:19:29 (DB-confirmed); the gateway
      # fallback fired at 06:19:30 returning false 503; the invitee retried
      # 5x and got 404 INVALID_TOKEN because completeBetaSignup nulled the
      # invite_token on the successful first call.
      #
      # The shared circuit breaker across /api/auth/** is the real defect:
      # read paths (2FA verify, login) cohabit with write paths (beta-signup,
      # register) on one breaker. A slow read tripping locks out subsequent
      # writes that would otherwise succeed.
      #
      # authWriteRoute disables slow-call detection entirely
      # (slowCallRateThreshold=100% so even all-slow does not trip) and
      # keeps only hard failure-rate detection at 50%. Tenant provisioning
      # (validate token -> flip status -> register user -> provision
      # instance -> publish outbox event) on a cold local stack can
      # legitimately run 1-5s; under the shared authRoute config every such
      # call counted as a slow-fail. Write-endpoint users will now fall back
      # only on genuine upstream failures, not on slow successes.
      authWriteRoute:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 20
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        # Slow-call detection EFFECTIVELY DISABLED for write endpoints —
        # rate=100 means breaker never trips on slow-only, threshold left
        # at 60s safety ceiling for genuine hangs.
        slowCallDurationThreshold: 60s
        slowCallRateThreshold: 100
        eventConsumerBufferSize: 10
    instances:
      # GAP-928 Phase 1: authCircuitBreaker uses dedicated authRoute config
      # (slowCallDurationThreshold 10s, minimumNumberOfCalls 20,
      # slowCallRateThreshold 80%) so slow-but-successful tenant
      # provisioning on /api/v1/auth/** does not trip a false 503.
      authCircuitBreaker:
        baseConfig: authRoute
      # GAP-928 Phase 2: dedicated breaker for tenant-creating write
      # endpoints (POST /api/v1/auth/beta-signup + POST /api/v1/auth/register)
      # so a slow read on /api/auth/** (2FA verify, login) cannot trip the
      # breaker that gates the write path.
      authWriteCircuitBreaker:
        baseConfig: authWriteRoute
      instancesCircuitBreaker:
        baseConfig: default
      subscriptionCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      brandingCircuitBreaker:
        baseConfig: default
      adminCircuitBreaker:
        baseConfig: default
      emailCircuitBreaker:
        baseConfig: default
      instanceCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 60

  # GAP-932 (2026-06-04 Wave flow-kh1 G2 re-walk): Spring Cloud Circuit Breaker
  # auto-wraps each call with a TimeLimiter. Default timeoutDuration=1s causes
  # the gateway to time out on tenant-provisioning POSTs that legitimately take
  # 2-5s (DatabaseProvisioningService creates a physical kiteclass DB + Flyway
  # migrate) — the upstream eventually returns 201 but gateway has already
  # fired /fallback/auth → user sees false 503. GAP-928 Phase 1/2 tuned the
  # CircuitBreaker's slowCallRateThreshold but TimeLimiter is a SEPARATE
  # component. Configure a per-instance TimeLimiter for the auth-write +
  # instance routes so slow but successful provisioning completes.
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
      authWriteRoute:
        # Tenant provisioning on a cold local stack runs ~2-5s; production
        # remote Postgres + Flyway can be slower. Use a generous ceiling.
        timeoutDuration: 60s
        cancelRunningFuture: false
      instanceRoute:
        timeoutDuration: 30s
        cancelRunningFuture: false
    instances:
      authWriteCircuitBreaker:
        baseConfig: authWriteRoute
      instanceCircuitBreaker:
        baseConfig: instanceRoute

# GAP-604 (Wave 89 Bucket A): JWT signing secret cho JwtAuthenticationGatewayFilter.
# Phải match JWT_SECRET trong kitehub-subscription (issuer side) để gateway verify
# được tokens subscription issue. Khi không set → filter throws IllegalStateException
# tại startup (fail-fast, không silent skip). Per `pre-launch-secrets-hardening-checklist.md`
# §2.1: env-var pull only, không hardcode default. Per `production-env-config-registry.md`
# §3.1: registry tracks JWT_SECRET coverage qua AWS Secrets Manager.
jwt:
  secret: ${JWT_SECRET:}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Gateway is the trace-injection edge: instruments Spring Cloud Gateway routes and
  # propagates traceparent headers to downstream services.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging
logging:
  level:
    com.kitehub.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO
