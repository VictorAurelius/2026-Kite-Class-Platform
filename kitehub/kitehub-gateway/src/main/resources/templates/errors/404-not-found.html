<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Không tìm thấy — {{displayName}}</title>
    <style>
        :root {
            --brand-primary: {{primaryColor}};
            --brand-secondary: {{secondaryColor}};
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            color: #1f2937;
        }
        .card {
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 16px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-top: 6px solid var(--brand-primary);
        }
        .logo { max-height: 56px; margin-bottom: 16px; }
        h1 {
            font-size: 28px;
            margin: 0 0 8px;
            color: var(--brand-primary);
        }
        p { color: #4b5563; line-height: 1.6; }
        .status-code {
            font-size: 80px;
            font-weight: 800;
            color: var(--brand-primary);
            opacity: 0.2;
            margin-top: -16px;
            margin-bottom: -8px;
        }
        .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 28px;
            background: var(--brand-primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .meta { margin-top: 24px; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="card">
    <div class="status-code">404</div>
    {{logoBlock}}
    <h1>Không tìm thấy trang</h1>
    <p>Trang bạn đang tìm không tồn tại hoặc đã bị di chuyển.</p>
    <a href="/" class="cta">Về trang chủ</a>
    <div class="meta">{{displayName}} · {{timestamp}}</div>
</div>
</body>
</html>
