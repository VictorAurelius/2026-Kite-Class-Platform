spring:
  application:
    name: kitehub-admin

  # Wave 82 Bucket F5: REST API service — disable default static resource handler so POST to non-existent path returns 404 (NoHandlerFoundException) not 500 (NoResourceFoundException)
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:}  # No default - must be provided via env var
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # GAP-133 — JDBC batching for bulk operations (admin imports, bulk
        # tenant updates). batch_versioned_data=true required for @Version.
        jdbc:
          time_zone: UTC
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # GAP-132 — pin cache abstraction to Caffeine (in-memory, fast). Prevents silent
  # fallback to ConcurrentMapCacheManager if CacheConfig Bean wiring is ever skipped.
  cache:
    type: caffeine

  # GAP-237 — cross-service cache invalidation. Admin subscribes to
  # kitehub.events.exchange (TopicExchange) for instance.* / subscription.*
  # routing keys; payload arrives as JSON, gets republished as in-process
  # SubscriptionDataChangedEvent so existing AdminCacheInvalidationListener
  # (GAP-126) evicts admin-dashboard + revenue-report caches.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 60000
          multiplier: 3.0
          max-interval: 540000

kitehub:
  admin:
    cache:
      # GAP-132 — seed TTL for admin caches (Caffeine)
      dashboard-ttl-seconds: ${ADMIN_DASHBOARD_CACHE_TTL_SECONDS:300}
      revenue-ttl-seconds: ${ADMIN_REVENUE_CACHE_TTL_SECONDS:3600}
    cross-service-cache-invalidation:
      # GAP-237 — toggle the AMQP listener. Defaults OFF until the
      # kitehub-subscription Outbox dispatcher (deferred per
      # project_outbox_per_module_pattern.md) is wired up — flip to true via
      # env var when the producer side starts publishing to
      # kitehub.events.exchange. Tests run with RabbitAutoConfiguration
      # excluded so the flag has no effect there.
      enabled: ${ADMIN_CROSS_SERVICE_CACHE_INVALIDATION_ENABLED:false}

server:
  port: ${SERVER_PORT:8083}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Sampling 10% in prod, override OTEL_SAMPLING_PROBABILITY=1.0 in staging/dev.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Storage config required by BackupStorageService bean (pulled from kitehub-subscription
# via @ComponentScan; without this block, S3Config@ConfigurationProperties("storage.s3")
# resolves to null and S3Client construction fails with "region must not be null").
# Wave 36 GAP-389 added BackupStorageService dependency; admin needs same defaults.
storage:
  s3:
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BACKUP_BUCKET:kite-backups}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}

logging:
  level:
    com.kitehub.admin: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
