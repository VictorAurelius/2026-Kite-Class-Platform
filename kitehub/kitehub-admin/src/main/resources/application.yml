spring:
  application:
    name: kitehub-admin
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:}  # No default - must be provided via env var
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # GAP-133 — JDBC batching for bulk operations (admin imports, bulk
        # tenant updates). batch_versioned_data=true required for @Version.
        jdbc:
          time_zone: UTC
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # GAP-132 — pin cache abstraction to Caffeine (in-memory, fast). Prevents silent
  # fallback to ConcurrentMapCacheManager if CacheConfig Bean wiring is ever skipped.
  cache:
    type: caffeine

kitehub:
  admin:
    cache:
      # GAP-132 — seed TTL for admin caches (Caffeine)
      dashboard-ttl-seconds: ${ADMIN_DASHBOARD_CACHE_TTL_SECONDS:300}
      revenue-ttl-seconds: ${ADMIN_REVENUE_CACHE_TTL_SECONDS:3600}

server:
  port: ${SERVER_PORT:8083}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.kitehub.admin: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
