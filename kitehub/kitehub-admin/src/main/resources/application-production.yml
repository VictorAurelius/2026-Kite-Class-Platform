# =============================================================================
# PRODUCTION PROFILE - kitehub-admin
# =============================================================================
# Activated by: SPRING_PROFILES_ACTIVE=production
# Wave 82 Bucket F6 (post-F4 audit-spring-profiles.sh finding): closes Spring
# profile silent-skip risk per production-env-config-registry.md §11.3 — base
# application.yml has com.kitehub.admin: DEBUG + org.hibernate.SQL: DEBUG +
# BasicBinder: TRACE which leak PII (bound params) to logs in production.
#
# Characteristics:
#   - Tighten logging (DEBUG → INFO, TRACE → WARN; no SQL params)
#   - Hide stacktrace + error message in API responses
#   - Scope actuator exposure (drop metrics from public)
#   - Hide health details unless authorized

spring:
  jpa:
    show-sql: false

  # GAP-503 / Wave 85 Bucket E — HikariCP right-size (E-AC3 alarm guards exhaustion).
  # 7 services × 10 connections = 70 total < RDS db.t3.micro cap 87 (max_connections).
  # connection-timeout 30s + wait-count > 5 sustained 1min triggers CloudWatch alarm.
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  # GAP-503 / Wave 85 Bucket E — Tomcat thread pool right-size (E-AC2 alarm guards).
  # 200 max threads × 7 services = 1400 capacity; accept-count buffers burst.
  # connection-timeout 20s prevents thread exhaustion under slow clients.
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.kitehub: INFO
    com.kitehub.admin: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: WARN
