# Test configuration for KiteHub Admin Service
# Uses H2 in PostgreSQL compatibility mode

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  # Disable RabbitMQ auto-configuration in tests (admin pulls subscription's
  # event publishing + consumers transitively, same as the subscription test
  # profile — without this, ApplicationContext fails to load when no broker
  # is present).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt:
  secret: abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ01

encryption:
  master-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  algorithm: AES-256-GCM

database:
  lifecycle:
    enabled: false

captcha:
  enabled: false

# Webhook secret (subscription module requires on context load)
webhook:
  payment:
    secret: "test-webhook-secret-for-admin-context-load"

# S3/MinIO — mock mode for tests (admin transitively picks up
# subscription.config.S3Config which blows up without a region; mock-mode
# disables the real S3Client bean via @ConditionalOnProperty). GAP-147.
storage:
  s3:
    mock-mode: true
    bucket: kite-test-backups
    region: ap-southeast-1
    access-key: test-access-key
    secret-key: test-secret-key

# Backup configuration (subscription module requires on context load)
backup:
  retention-count: 3
  pg-dump-path: pg_dump

kitehub:
  admin:
    api-key: ""  # Empty = dev mode (no auth required in tests)
    cross-service-cache-invalidation:
      # GAP-237 — disable the AMQP topology in tests (RabbitAutoConfiguration is
      # already excluded above; this flag also suppresses RabbitListenerConfig
      # so no Connection/Queue/Binding beans are created).
      enabled: false
  email:
    use-queue: false
  email-verification:
    enabled: false
  email-service:
    enabled: false
