name: kite-platform-hubonly

# KiteHub Platform Only (no KiteClass)
# Use this for testing KiteHub features without KiteClass

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES (shared: kite- prefix)
  # ============================================================================

  kite-postgres:
    image: postgres:15-alpine
    container_name: kite-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitehub}
      POSTGRES_USER: ${POSTGRES_USER:-kitehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - kite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2g}
          cpus: '${POSTGRES_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-512m}

  kite-redis:
    image: redis:7-alpine
    container_name: kite-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${REDIS_MEM_RESERVE:-128m}

  kite-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kite-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kitehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEM_LIMIT:-1g}
          cpus: '${RABBITMQ_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${RABBITMQ_MEM_RESERVE:-256m}

  kite-minio:
    image: minio/minio:latest
    container_name: kite-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kitehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9100:9000"
      - "9191:9091"
    volumes:
      - kite-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-512m}
          cpus: '${MINIO_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${MINIO_MEM_RESERVE:-128m}

  kite-mailhog:
    image: mailhog/mailhog:latest
    container_name: kite-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 64m

  # ============================================================================
  # KITEHUB PLATFORM SERVICES (kitehub- prefix)
  # ============================================================================

  kitehub-subscription:
    build:
      context: .
      dockerfile: kitehub-subscription/Dockerfile
    image: kitehub-subscription:latest
    container_name: kitehub-subscription
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      DATABASE_LIFECYCLE_ENABLED: "true"
      DATABASE_MASTER_HOST: kite-postgres
      DATABASE_MASTER_PORT: 5432
      DATABASE_ADMIN_URL: jdbc:postgresql://kite-postgres:5432/postgres
      DATABASE_ADMIN_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8081:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${SUBSCRIPTION_MEM_LIMIT:-1g}
          cpus: '${SUBSCRIPTION_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${SUBSCRIPTION_MEM_RESERVE:-256m}

  kitehub-branding:
    build:
      context: .
      dockerfile: kitehub-branding/Dockerfile
    image: kitehub-branding:latest
    container_name: kitehub-branding
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kitehub}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_ENDPOINT: http://kite-minio:9000
      S3_BUCKET: kitehub-assets
      AWS_REGION: ap-southeast-1
      S3_MOCK_MODE: "false"
      CDN_DOMAIN: localhost:9100
    ports:
      - "8083:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
      kite-minio:
        condition: service_healthy
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BRANDING_MEM_LIMIT:-2g}
          cpus: '${BRANDING_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${BRANDING_MEM_RESERVE:-512m}

  kitehub-email:
    build:
      context: .
      dockerfile: kitehub-email/Dockerfile
    image: kitehub-email:latest
    container_name: kitehub-email
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: kite-mailhog
      SMTP_PORT: 1025
    ports:
      - "8084:8080"
    depends_on:
      kite-rabbitmq:
        condition: service_healthy
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EMAIL_MEM_LIMIT:-1g}
          cpus: '${EMAIL_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${EMAIL_MEM_RESERVE:-256m}

  kitehub-admin:
    build:
      context: .
      dockerfile: kitehub-admin/Dockerfile
    image: kitehub-admin:latest
    container_name: kitehub-admin
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8085:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${ADMIN_MEM_LIMIT:-1g}
          cpus: '${ADMIN_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${ADMIN_MEM_RESERVE:-256m}

  kite-gateway:
    build:
      context: .
      dockerfile: kitehub-gateway/Dockerfile
    image: kite-gateway:latest
    container_name: kite-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: kite-redis
      REDIS_PORT: 6379
      SERVER_PORT: 9000
      SUBSCRIPTION_SERVICE_URL: http://kitehub-subscription:8080
      BRANDING_SERVICE_URL: http://kitehub-branding:8080
      EMAIL_SERVICE_URL: http://kitehub-email:8080
      ADMIN_SERVICE_URL: http://kitehub-admin:8080
    ports:
      - "9000:9000"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kitehub-subscription:
        condition: service_started
      kitehub-branding:
        condition: service_started
      kitehub-email:
        condition: service_started
      kitehub-admin:
        condition: service_started
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT:-512m}
          cpus: '${GATEWAY_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${GATEWAY_MEM_RESERVE:-128m}

  kitehub-frontend:
    build:
      context: ./kitehub-frontend
      dockerfile: Dockerfile
    image: kitehub-frontend:latest
    container_name: kitehub-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://kite-gateway:9000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
    depends_on:
      - kite-gateway
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KITEHUB_FRONTEND_MEM_LIMIT:-512m}
          cpus: '${KITEHUB_FRONTEND_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${KITEHUB_FRONTEND_MEM_RESERVE:-128m}

volumes:
  kite-postgres-data:
    driver: local
  kite-minio-data:
    driver: local

networks:
  kite-network:
    driver: bridge
