# KiteHub Production Nginx Configuration
# Used on Oracle Cloud VM 2 (frontend + reverse proxy)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

    # Upstream: backend gateway (VM 1)
    upstream gateway {
        server ${GATEWAY_HOST:-10.0.1.10}:9000;  # VM 1 private IP
    }

    # Upstream: frontend (local)
    upstream frontend {
        server 127.0.0.1:3001;
    }

    upstream kiteclass-frontend {
        server 127.0.0.1:3000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name kitehub.me api.kitehub.me;
        return 301 https://$host$request_uri;
    }

    # Main site
    server {
        listen 443 ssl http2;
        server_name kitehub.me;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API
    server {
        listen 443 ssl http2;
        server_name api.kitehub.me;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
