spring:
  # Disable auto-configurations that require external services in test context.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 0

# AI configuration for tests
ai:
  provider: mock
  # Disable fair-queue topology + listeners in tests — no RabbitMQ available.
  queue:
    fair-queue-enabled: false

openai:
  api:
    key: sk-mock-key
    base-url: https://api.openai.com/v1
  models:
    vision: gpt-4-vision-preview
    dalle: dall-e-3
    text: gpt-4-turbo
  rate-limit:
    requests-per-minute: 10
  timeout:
    seconds: 5

# Storage mock
storage:
  s3:
    access-key: mock-access-key
    secret-key: mock-secret-key
    region: us-east-1
    bucket: test-bucket
    endpoint: ""
    cdn-domain: localhost
    mock-mode: true

logging:
  level:
    com.kitehub.branding: DEBUG
