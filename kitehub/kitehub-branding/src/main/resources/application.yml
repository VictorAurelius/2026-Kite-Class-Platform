spring:
  application:
    name: kitehub-branding

server:
  port: 8083

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:sk-mock-key-for-local-testing}
    base-url: https://api.openai.com/v1
  models:
    vision: gpt-4-vision-preview
    dalle: dall-e-3
    text: gpt-4-turbo
  rate-limit:
    requests-per-minute: 10
  timeout:
    seconds: 60

# Storage Configuration
storage:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:mock-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:mock-secret-key}
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${S3_BUCKET:kitehub-assets}
    endpoint: ${S3_ENDPOINT:} # For MinIO/LocalStack
    cdn-domain: ${CDN_DOMAIN:cdn.kiteclass.com}
    mock-mode: ${S3_MOCK_MODE:true} # true for local dev, false for production

# Logging
logging:
  level:
    com.kitehub.branding: DEBUG
    org.springframework.web: INFO
