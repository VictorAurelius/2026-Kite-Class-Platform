spring:
  application:
    name: kitehub-branding

  # Wave 82 Bucket F5: REST API service — disable default static resource handler so POST to non-existent path returns 404 (NoHandlerFoundException) not 500 (NoResourceFoundException)
  web:
    resources:
      add-mappings: false

  # Wizard walk (GAP-1135) — logo/portrait uploads exceed the 1MB servlet default → 413.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${DATABASE_USERNAME:kitehub}
    password: ${DATABASE_PASSWORD:kitehub_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # GAP-133 — JDBC batching for bulk insert paths (template seed loads,
        # branding job result rows, AI usage logs). batch_versioned_data=true
        # required because BaseEntity uses @Version.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Redis — backs distributed AI rate limiter + concurrency semaphore (GAP-005a).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  # GAP-132 (Wave 9.5-B fan-out) — pin cache abstraction to Caffeine (in-memory, fast).
  # Prevents silent fallback to ConcurrentMapCacheManager if CacheConfig Bean wiring is
  # ever skipped. Template gallery + rate-limit reads benefit from short-lived caching.
  cache:
    type: caffeine

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

kitehub:
  branding:
    cache:
      # GAP-132 (Wave 9.5-B) — seed TTLs for branding Caffeine caches.
      template-ttl-seconds: ${BRANDING_TEMPLATE_CACHE_TTL_SECONDS:300}
      rate-limit-ttl-seconds: ${BRANDING_RATE_LIMIT_CACHE_TTL_SECONDS:900}
    deploy-stream:
      # Wave 36 GAP-393-B — SSE backpressure: cap concurrent subscribers per job.
      # Defends against a single misbehaving client opening unbounded streams.
      max-emitters-per-job: ${BRANDING_DEPLOY_STREAM_MAX_EMITTERS:20}
      # Poller + heartbeat intervals (existing fields surfaced for visibility).
      poll-ms: ${BRANDING_DEPLOY_STREAM_POLL_MS:2000}
      heartbeat-ms: ${BRANDING_DEPLOY_STREAM_HEARTBEAT_MS:30000}

# GAP-386 / BR-QUALITY-001 — AI Branding quality gate pass threshold.
# 12-factor §III "Store config in environment" externalization. Default 70/100
# matches scaffold v0 baseline (per ai-branding-guidelines.md §5). Tier-specific
# overrides expected post-deployment via Helm + env var QUALITY_GATE_PASS_THRESHOLD.
quality-gate:
  pass-threshold: ${QUALITY_GATE_PASS_THRESHOLD:70}

server:
  port: 8083

# AI Provider Configuration
# provider: "ollama" (local) or "openai" (cloud)
ai:
  provider: ${AI_PROVIDER:openai}
  rate-limit:
    free-per-day: 3
    basic-per-day: 10
    # GAP-1137: canonical SUB-22 PREMIUM regen = 30 (was 50 — drift fixed).
    premium-per-day: 30
    enterprise-per-day: -1
    # GAP-1137: FULL_AI (paid GPT image-gen) monthly cost quota per instance.
    # PREMIUM = limited (then TEMPLATE fallback); ENTERPRISE = unlimited (-1).
    # FREE/BASIC are not FULL_AI-eligible (GenerationMode.forTier → TEMPLATE).
    fullai-premium-per-month: ${AI_FULLAI_PREMIUM_PER_MONTH:5}
    fullai-enterprise-per-month: -1
  # GAP-258 — Per-tier input prompt size cap (estimated tokens, char/4 heuristic).
  # Defends against cost-attack: small request count, very large prompts.
  # Set to -1 for unlimited.
  input:
    free-max-tokens: ${AI_INPUT_FREE_MAX_TOKENS:2000}
    basic-max-tokens: ${AI_INPUT_BASIC_MAX_TOKENS:4000}
    premium-max-tokens: ${AI_INPUT_PREMIUM_MAX_TOKENS:8000}
    enterprise-max-tokens: ${AI_INPUT_ENTERPRISE_MAX_TOKENS:16000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://kite-ollama:11434}
    text-model: ${OLLAMA_TEXT_MODEL:llama3.1:8b}
    vision-model: ${OLLAMA_VISION_MODEL:llava:13b}
    timeout-seconds: ${OLLAMA_TIMEOUT:120}

  # Gemini free-tier provider (GAP-1135 / ADR-037 Amendment). Pinned text/HTML copy
  # provider. Empty GEMINI_API_KEY → GeminiClient MOCK mode (graceful no-key fallback;
  # production secret provisioned via fetch-secrets.sh → /etc/kite/.env at deploy).
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    # gemini-1.5-flash retired from v1beta generateContent (404). Pinned gemini-2.0-flash
    # returns 429 RESOURCE_EXHAUSTED on free tier (version-pinned models need billing);
    # gemini-flash-latest rolling alias has free-tier quota AND never deprecates. Override
    # via GEMINI_TEXT_MODEL/GEMINI_VISION_MODEL. Discovered 2026-06-10 local AI walk.
    text-model: ${GEMINI_TEXT_MODEL:gemini-flash-latest}
    vision-model: ${GEMINI_VISION_MODEL:gemini-flash-latest}
    timeout-seconds: ${GEMINI_TIMEOUT:60}

  # Fair-queue scheduler (GAP-005a Wave 3 Phase 1)
  queue:
    # Feature flag — disable to revert to the legacy single queue (backward compat).
    fair-queue-enabled: ${AI_FAIR_QUEUE_ENABLED:true}
    # Weighted round-robin weights (Enterprise:Pro:Free = 3:2:1).
    tier-weights:
      enterprise: 3
      pro: 2
      free: 1
    # Max in-flight jobs per tenant per tier (Redis semaphore cap).
    concurrency:
      free: 1
      pro: 3
      enterprise: 10
    # SLA targets (p95 wait in seconds).
    sla:
      free-p95-seconds: 180
      pro-p95-seconds: 60
      enterprise-p95-seconds: 30
    # Backpressure — free tier degrades when enterprise backlog exceeds threshold.
    backpressure:
      enterprise-backlog-threshold: 50

# Resilience4j circuit breaker around AI providers (GAP-005a).
resilience4j:
  circuitbreaker:
    instances:
      ai-provider:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
  # GAP-1356: bound concurrent AI image-generation calls (10-30s each) so a branding
  # request burst can't exhaust the Tomcat thread pool. Mirrors kiteclass-core `ai`
  # bulkhead. maxWaitDuration 0 = reject immediately when full (CB fallback handles it).
  bulkhead:
    instances:
      ai-provider:
        maxConcurrentCalls: 10
        maxWaitDuration: 0

# OpenAI Configuration (used when ai.provider=openai)
openai:
  api:
    key: ${OPENAI_API_KEY:sk-mock-key-for-local-testing}
    base-url: https://api.openai.com/v1
  models:
    vision: gpt-4-vision-preview
    # G1 walk 2026-06-12: dall-e-3 deprecated cho project keys mới → gpt-image-1.
    dalle: ${OPENAI_IMAGE_MODEL:gpt-image-1}
    text: gpt-4-turbo
  rate-limit:
    requests-per-minute: 10
  timeout:
    seconds: 60

# Banner rasterise sidecar (GAP-1135). When renderer-url is set, the TEMPLATE
# banner HTML is POSTed to the kitehub-banner-renderer Playwright sidecar and
# rasterised to WebP; PlaywrightBannerRenderer (@Primary) activates. Blank (prod
# default until sidecar deployed there) → StubBannerRenderer placeholder fallback.
branding:
  banner:
    renderer-url: ${BANNER_RENDERER_URL:}
    renderer-timeout-seconds: ${BANNER_RENDERER_TIMEOUT:30}
  # GAP-1135 / GAP-1147 (branding-100 Bucket E): FULL_AI banner image-gen wiring flag.
  # true = preview/deploy may call the real GPT image generator when FULL_AI is granted.
  # Safe by default: the controller additionally requires a REAL provider key (not mock
  # mode) before granting — when OPENAI_API_KEY is a placeholder (sk-mock) FULL_AI still
  # resolves to NOT_AVAILABLE with NO quota charge (GAP-1218 consumer-trust guard).
  full-ai:
    image-gen-enabled: ${BRANDING_FULL_AI_IMAGE_GEN_ENABLED:true}

# Storage Configuration
storage:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:mock-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:mock-secret-key}
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${S3_BUCKET:kitehub-assets}
    endpoint: ${S3_ENDPOINT:} # For MinIO/LocalStack (internal, used for upload PutObject)
    public-endpoint: ${S3_PUBLIC_ENDPOINT:} # Browser-reachable host for presigned GET URLs (MinIO host port); blank → falls back to endpoint
    cdn-domain: ${CDN_DOMAIN:localhost:9100} # Safe default for local dev
    mock-mode: ${S3_MOCK_MODE:true} # true for local dev, false for production

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Sampling 10% in prod, override OTEL_SAMPLING_PROBABILITY=1.0 in staging/dev.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging
logging:
  level:
    com.kitehub.branding: DEBUG
    org.springframework.web: INFO
