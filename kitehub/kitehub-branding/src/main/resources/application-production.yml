# =============================================================================
# PRODUCTION PROFILE - kitehub-branding
# =============================================================================
# Activated by: SPRING_PROFILES_ACTIVE=production
# Wave 82 Bucket F6 (post-F4 audit-spring-profiles.sh finding): closes Spring
# profile silent-skip risk per production-env-config-registry.md §11.3.
#
# Characteristics:
#   - Tighten logging (no SQL, no debug)
#   - Hide stacktrace + error message
#   - Scope actuator exposure
#   - Hide health details unless authorized

spring:
  jpa:
    show-sql: false

  # GAP-503 / Wave 85 Bucket E — HikariCP right-size (E-AC3 alarm guards exhaustion).
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  error:
    include-stacktrace: never
    include-message: never
  # GAP-503 / Wave 85 Bucket E — Tomcat thread pool right-size (E-AC2 alarm).
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000

logging:
  level:
    root: WARN
    com.kitehub: INFO
    com.kitehub.branding: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
