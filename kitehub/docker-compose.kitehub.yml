name: kitehub

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  kitehub-postgres:
    image: postgres:15-alpine
    container_name: kitehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitehub}
      POSTGRES_USER: ${POSTGRES_USER:-kitehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run ./scripts/setup.sh}
    ports:
      - "5433:5432"
    volumes:
      - kitehub-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-redis:
    image: redis:7-alpine
    container_name: kitehub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kitehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kitehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-minio:
    image: minio/minio:latest
    container_name: kitehub-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kitehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9100:9000"
      - "9191:9091"
    volumes:
      - kitehub-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-mailhog:
    image: mailhog/mailhog:latest
    container_name: kitehub-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - kitehub-network

  kitehub-minio-setup:
    image: minio/mc:latest
    container_name: kitehub-minio-setup
    depends_on:
      kitehub-minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      mc alias set kitehub http://kitehub-minio:9000 ${MINIO_ROOT_USER:-kitehub} ${MINIO_ROOT_PASSWORD:?required};
      mc mb kitehub/kitehub-assets --ignore-existing;
      mc anonymous set public kitehub/kitehub-assets;
      echo 'MinIO bucket kitehub-assets created successfully';
      "
    networks:
      - kitehub-network

  # ============================================================================
  # MONITORING SERVICES
  # ============================================================================

  kitehub-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kitehub-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kitehub-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kitehub-network
    restart: unless-stopped
    profiles:
      - monitoring

  kitehub-grafana:
    image: grafana/grafana:10.4.0
    container_name: kitehub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: 3002
    volumes:
      - kitehub-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3002"
    depends_on:
      - kitehub-prometheus
    networks:
      - kitehub-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================================================
  # AI SERVICES (Local Development)
  # ============================================================================

  kitehub-ollama:
    image: ollama/ollama:latest
    container_name: kitehub-ollama
    ports:
      - "11434:11434"
    volumes:
      - kitehub-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kitehub-network
    profiles:
      - ai-local

  kitehub-ollama-setup:
    image: ollama/ollama:latest
    container_name: kitehub-ollama-setup
    depends_on:
      kitehub-ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling AI models for local development...';
      OLLAMA_HOST=http://kitehub-ollama:11434 ollama pull llama3.1:8b;
      echo 'Text model (llama3.1:8b) ready';
      echo 'Skipping vision model (llava:13b) - pull manually if needed: ollama pull llava:13b';
      echo 'All models ready!';
      "
    networks:
      - kitehub-network
    profiles:
      - ai-local

  # ============================================================================
  # BASE IMAGE - Build first, used by all backend services
  # ============================================================================

  kitehub-base:
    build:
      context: .
      dockerfile: kitehub-base/Dockerfile
    image: kitehub-base:latest
    container_name: kitehub-base
    command: ["echo", "Base image built successfully"]
    profiles:
      - build-only

  # ============================================================================
  # PLATFORM SERVICES
  # ============================================================================

  kitehub-subscription:
    build:
      context: .
      dockerfile: kitehub-subscription/Dockerfile
    image: kitehub-subscription:latest
    container_name: kitehub-subscription
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      DATABASE_LIFECYCLE_ENABLED: "true"
      DATABASE_MASTER_HOST: kitehub-postgres
      DATABASE_MASTER_PORT: 5432
      DATABASE_ADMIN_URL: jdbc:postgresql://kitehub-postgres:5432/postgres
      DATABASE_ADMIN_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
    ports:
      - "8081:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-branding:
    build:
      context: .
      dockerfile: kitehub-branding/Dockerfile
    image: kitehub-branding:latest
    container_name: kitehub-branding
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://kitehub-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OLLAMA_BASE_URL: http://kitehub-ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.1:8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kitehub}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_ENDPOINT: http://kitehub-minio:9000
      S3_BUCKET: kitehub-assets
      AWS_REGION: ap-southeast-1
      S3_MOCK_MODE: "false"
      CDN_DOMAIN: localhost:9100
    ports:
      - "8083:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
      kitehub-minio:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-email:
    build:
      context: .
      dockerfile: kitehub-email/Dockerfile
    image: kitehub-email:latest
    container_name: kitehub-email
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      AWS_SES_REGION: ap-southeast-1
      AWS_SES_FROM_EMAIL: noreply@kiteclass.com
      AWS_SES_MOCK_MODE: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: kitehub-mailhog
      SMTP_PORT: 1025
    ports:
      - "8084:8080"
    depends_on:
      kitehub-rabbitmq:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-admin:
    build:
      context: .
      dockerfile: kitehub-admin/Dockerfile
    image: kitehub-admin:latest
    container_name: kitehub-admin
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
      # Security secrets (shared with subscription service)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
    ports:
      - "8085:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-gateway:
    build:
      context: .
      dockerfile: kitehub-gateway/Dockerfile
    image: kitehub-gateway:latest
    container_name: kitehub-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://kitehub-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: kitehub-redis
      REDIS_PORT: 6379
      SERVER_PORT: 9000
      SUBSCRIPTION_SERVICE_URL: http://kitehub-subscription:8080
      BRANDING_SERVICE_URL: http://kitehub-branding:8080
      EMAIL_SERVICE_URL: http://kitehub-email:8080
      ADMIN_SERVICE_URL: http://kitehub-admin:8080
      KITECLASS_CORE_URL: http://kiteclass-core:8080
    ports:
      - "9000:9000"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-subscription:
        condition: service_started
      kitehub-branding:
        condition: service_started
      kitehub-email:
        condition: service_started
      kitehub-admin:
        condition: service_started
      kiteclass-core:
        condition: service_started
    networks:
      - kitehub-network
    restart: unless-stopped

  # ============================================================================
  # KITECLASS CORE SERVICE (Shared multi-tenant instance)
  # ============================================================================

  kiteclass-core:
    build:
      context: ../kiteclass/kiteclass-core
      dockerfile: Dockerfile
    image: kiteclass-core:latest
    container_name: kiteclass-core
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/kiteclass_shared
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: kitehub-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      STORAGE_S3_ENDPOINT: http://kitehub-minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kitehub}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    ports:
      - "8088:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kitehub-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND SERVICE
  # ============================================================================

  kitehub-frontend:
    build:
      context: ./kitehub-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
        NEXT_PUBLIC_KITECLASS_URL_PATTERN: http://localhost:3000?tenant={subdomain}
    image: kitehub-frontend:latest
    container_name: kitehub-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
    depends_on:
      - kitehub-gateway
    networks:
      - kitehub-network
    restart: unless-stopped

  # ============================================================================
  # KITECLASS FRONTEND (Student/Teacher UI)
  # ============================================================================

  kiteclass-frontend:
    build:
      context: ../kiteclass/kiteclass-frontend
      dockerfile: Dockerfile
    image: kiteclass-frontend:latest
    container_name: kiteclass-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:9000/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      - kitehub-gateway
    networks:
      - kitehub-network
    restart: unless-stopped

volumes:
  kitehub-postgres-data:
    driver: local
  kitehub-minio-data:
    driver: local
  kitehub-ollama-models:
    driver: local
  kitehub-prometheus-data:
    driver: local
  kitehub-grafana-data:
    driver: local

networks:
  kitehub-network:
    driver: bridge
