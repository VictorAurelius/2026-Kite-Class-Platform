name: kitehub

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  kitehub-postgres:
    image: postgres:15-alpine
    container_name: kitehub-postgres
    environment:
      POSTGRES_DB: kitehub
      POSTGRES_USER: kitehub
      POSTGRES_PASSWORD: kitehub_dev_password
    ports:
      - "5433:5432"
    volumes:
      - kitehub-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitehub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-redis:
    image: redis:7-alpine
    container_name: kitehub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kitehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kitehub
      RABBITMQ_DEFAULT_PASS: kitehub_dev_password
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  kitehub-minio:
    image: minio/minio:latest
    container_name: kitehub-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: kitehub
      MINIO_ROOT_PASSWORD: kitehub_dev_password
    ports:
      - "9100:9000"
      - "9191:9091"
    volumes:
      - kitehub-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitehub-network

  # Init container: Creates MinIO bucket on first run, then exits
  # Status "Exited (0)" is expected - means setup completed successfully
  kitehub-minio-setup:
    image: minio/mc:latest
    container_name: kitehub-minio-setup
    depends_on:
      kitehub-minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      mc alias set kitehub http://kitehub-minio:9000 kitehub kitehub_dev_password;
      mc mb kitehub/kitehub-assets --ignore-existing;
      mc anonymous set public kitehub/kitehub-assets;
      echo 'MinIO bucket kitehub-assets created successfully';
      "
    networks:
      - kitehub-network

  # ============================================================================
  # BASE IMAGE - Build first, used by all backend services
  # ============================================================================

  kitehub-base:
    build:
      context: .
      dockerfile: kitehub-base/Dockerfile
    image: kitehub-base:latest
    container_name: kitehub-base
    # This is a build-only service, no runtime container needed
    command: ["echo", "Base image built successfully"]
    profiles:
      - build-only

  # ============================================================================
  # PLATFORM SERVICES - All extend kitehub-base
  # ============================================================================

  kitehub-subscription:
    build:
      context: .
      dockerfile: kitehub-subscription/Dockerfile
    image: kitehub-subscription:latest
    container_name: kitehub-subscription
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/kitehub
      SPRING_DATASOURCE_USERNAME: kitehub
      SPRING_DATASOURCE_PASSWORD: kitehub_dev_password
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: kitehub
      SPRING_RABBITMQ_PASSWORD: kitehub_dev_password
      # Database provisioning config
      DATABASE_LIFECYCLE_ENABLED: "true"
      DATABASE_MASTER_HOST: kitehub-postgres
      DATABASE_MASTER_PORT: 5432
      DATABASE_ADMIN_URL: jdbc:postgresql://kitehub-postgres:5432/postgres
      DATABASE_ADMIN_USERNAME: kitehub
      DATABASE_ADMIN_PASSWORD: kitehub_dev_password
      ENCRYPTION_MASTER_KEY: tOHICYANHtUnqfwWc+MwtOnvzf/Pnwz/2ZXsnWEtRuU=
    ports:
      - "8081:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-branding:
    build:
      context: .
      dockerfile: kitehub-branding/Dockerfile
    image: kitehub-branding:latest
    container_name: kitehub-branding
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://kitehub-postgres:5432/kitehub
      DATABASE_USERNAME: kitehub
      DATABASE_PASSWORD: kitehub_dev_password
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: kitehub
      SPRING_RABBITMQ_PASSWORD: kitehub_dev_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      AWS_ACCESS_KEY_ID: kitehub
      AWS_SECRET_ACCESS_KEY: kitehub_dev_password
      S3_ENDPOINT: http://kitehub-minio:9000
      S3_BUCKET: kitehub-assets
      AWS_REGION: ap-southeast-1
      S3_MOCK_MODE: "false"
      CDN_DOMAIN: localhost:9100
    ports:
      - "8083:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
      kitehub-minio:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-email:
    build:
      context: .
      dockerfile: kitehub-email/Dockerfile
    image: kitehub-email:latest
    container_name: kitehub-email
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: kitehub
      SPRING_RABBITMQ_PASSWORD: kitehub_dev_password
      AWS_SES_REGION: ap-southeast-1
      AWS_SES_FROM_EMAIL: noreply@kiteclass.com
      EMAIL_MOCK_MODE: "true"
    ports:
      - "8084:8080"
    depends_on:
      kitehub-rabbitmq:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-admin:
    build:
      context: .
      dockerfile: kitehub-admin/Dockerfile
    image: kitehub-admin:latest
    container_name: kitehub-admin
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/kitehub
      SPRING_DATASOURCE_USERNAME: kitehub
      SPRING_DATASOURCE_PASSWORD: kitehub_dev_password
      SPRING_REDIS_HOST: kitehub-redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8085:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
    networks:
      - kitehub-network
    restart: unless-stopped

  kitehub-gateway:
    build:
      context: .
      dockerfile: kitehub-gateway/Dockerfile
    image: kitehub-gateway:latest
    container_name: kitehub-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://kitehub-postgres:5432/kitehub
      DATABASE_USERNAME: kitehub
      DATABASE_PASSWORD: kitehub_dev_password
      REDIS_HOST: kitehub-redis
      REDIS_PORT: 6379
      SERVER_PORT: 9000
      SUBSCRIPTION_SERVICE_URL: http://kitehub-subscription:8080
      BRANDING_SERVICE_URL: http://kitehub-branding:8080
      EMAIL_SERVICE_URL: http://kitehub-email:8080
      ADMIN_SERVICE_URL: http://kitehub-admin:8080
      KITECLASS_CORE_URL: http://kiteclass-core:8080
    ports:
      - "9000:9000"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-subscription:
        condition: service_started
      kitehub-branding:
        condition: service_started
      kitehub-email:
        condition: service_started
      kitehub-admin:
        condition: service_started
      kiteclass-core:
        condition: service_started
    networks:
      - kitehub-network
    restart: unless-stopped

  # ============================================================================
  # KITECLASS CORE SERVICE (Shared multi-tenant instance)
  # ============================================================================

  kiteclass-core:
    build:
      context: ../kiteclass
      dockerfile: kiteclass-core/Dockerfile
    image: kiteclass-core:latest
    container_name: kiteclass-core
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitehub-postgres:5432/kiteclass_shared
      SPRING_DATASOURCE_USERNAME: kitehub
      SPRING_DATASOURCE_PASSWORD: kitehub_dev_password
      SPRING_DATA_REDIS_HOST: kitehub-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kitehub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: kitehub
      SPRING_RABBITMQ_PASSWORD: kitehub_dev_password
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      STORAGE_S3_ENDPOINT: http://kitehub-minio:9000
      STORAGE_S3_ACCESS_KEY: kitehub
      STORAGE_S3_SECRET_KEY: kitehub_dev_password
      INTERNAL_API_SECRET: kitehub-internal-secret-dev
    ports:
      - "8088:8080"
    depends_on:
      kitehub-postgres:
        condition: service_healthy
      kitehub-redis:
        condition: service_healthy
      kitehub-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - kitehub-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND SERVICE
  # ============================================================================

  kitehub-frontend:
    build:
      context: ./kitehub-frontend
      dockerfile: Dockerfile
    image: kitehub-frontend:latest
    container_name: kitehub-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://kitehub-gateway:9000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
    depends_on:
      - kitehub-gateway
    networks:
      - kitehub-network
    restart: unless-stopped

volumes:
  kitehub-postgres-data:
    driver: local
  kitehub-minio-data:
    driver: local

networks:
  kitehub-network:
    driver: bridge
