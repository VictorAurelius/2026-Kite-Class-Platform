name: kite-platform

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES (shared: kite- prefix)
  # ============================================================================

  kite-postgres:
    image: postgres:15-alpine
    container_name: kite-postgres
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitehub}
      POSTGRES_USER: ${POSTGRES_USER:-kitehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run ./scripts/setup.sh}
    ports:
      - "5433:5432"
    volumes:
      - kite-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2g}
          cpus: '${POSTGRES_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-512m}

  kite-redis:
    image: redis:7-alpine
    container_name: kite-redis
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    # E-AC2 Wave 86 (PR #1445 Cat 5 Infra sweep): enforce maxmemory + LRU eviction
    # Default Redis policy = noeviction → cache stampede risk khi memory đầy → RDS spike.
    # 256mb baseline match t3.micro context (REDIS_MEM_LIMIT=512m); allkeys-lru
    # evicts least-recently-used keys khi đạt maxmemory thay vì reject writes.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${REDIS_MEM_RESERVE:-128m}

  kite-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kite-rabbitmq
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kitehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEM_LIMIT:-1g}
          cpus: '${RABBITMQ_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${RABBITMQ_MEM_RESERVE:-256m}

  kite-minio:
    image: minio/minio:latest
    container_name: kite-minio
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kitehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9100:9000"
      - "9191:9091"
    volumes:
      - kite-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-512m}
          cpus: '${MINIO_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${MINIO_MEM_RESERVE:-128m}

  kite-mailhog:
    image: mailhog/mailhog:latest
    container_name: kite-mailhog
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "full"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 64m

  kite-minio-setup:
    image: minio/mc:latest
    container_name: kite-minio-setup
    profiles: ["infra-only", "branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    depends_on:
      kite-minio:
        condition: service_healthy
    restart: on-failure
    # GAP-118 §Development (MinIO) AC: enable bucket versioning to recover
    # AI-generated assets / template SVGs from accidental delete or overwrite.
    # `mc version enable` is idempotent — safe to re-run.
    entrypoint: >
      /bin/sh -c "
      mc alias set kite http://kite-minio:9000 ${MINIO_ROOT_USER:-kitehub} ${MINIO_ROOT_PASSWORD:?required};
      mc mb kite/kitehub-assets --ignore-existing;
      mc anonymous set public kite/kitehub-assets;
      mc version enable kite/kitehub-assets;
      echo 'MinIO bucket kitehub-assets created with versioning enabled';
      "
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
        reservations:
          memory: 32m

  # ---------------------------------------------------------------------------
  # GAP-118 §Development (MinIO) — optional backup mirror sidecar
  # ---------------------------------------------------------------------------
  # Continuously mirrors kitehub-assets bucket -> external host volume so a
  # corrupted MinIO data volume can be restored from local backup. Disabled by
  # default (opt-in via `--profile backup`). Restore path documented in
  # documents/05-guides/deploy/restore-procedure.md (GAP-117).
  #
  # Enable: `docker compose --profile backup up -d kite-minio-backup`
  # Backup location: ./minio-backup/ (host-bind volume); rotate / archive externally.
  #
  # Trade-offs: continuous mirror = ~2x local storage, near-zero RPO for dev
  # accidents. Production uses S3 cross-region replication (terraform-aws/s3-ecr.tf)
  # — this sidecar is dev/local-only.
  # ---------------------------------------------------------------------------
  kite-minio-backup:
    image: minio/mc:latest
    container_name: kite-minio-backup
    profiles: ["backup"]
    depends_on:
      kite-minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      mc alias set kite http://kite-minio:9000 ${MINIO_ROOT_USER:-kitehub} ${MINIO_ROOT_PASSWORD:?required};
      echo 'Starting continuous mirror kite/kitehub-assets -> /backup';
      exec mc mirror --watch --overwrite --remove kite/kitehub-assets /backup/kitehub-assets;
      "
    volumes:
      - ./minio-backup:/backup
    networks:
      - kite-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
        reservations:
          memory: 32m

  # ============================================================================
  # MONITORING SERVICES (shared: kite- prefix)
  # ============================================================================

  kite-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kite-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kite-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kite-network
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m

  kite-grafana:
    image: grafana/grafana:10.4.0
    container_name: kite-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: 3002
    volumes:
      - kite-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3002"
    depends_on:
      - kite-prometheus
    networks:
      - kite-network
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m

  # ============================================================================
  # AI SERVICES (shared: kite- prefix)
  # ============================================================================

  kite-ollama:
    image: ollama/ollama:latest
    container_name: kite-ollama
    ports:
      - "11434:11434"
    volumes:
      - kite-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kite-network
    profiles: ["ai-local", "branding-only"]
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-8g}
          cpus: '${OLLAMA_CPU_LIMIT:-4.0}'
        reservations:
          memory: ${OLLAMA_MEM_RESERVE:-2g}

  kite-ollama-setup:
    image: ollama/ollama:latest
    container_name: kite-ollama-setup
    depends_on:
      kite-ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling AI models for local development...';
      OLLAMA_HOST=http://kite-ollama:11434 ollama pull llama3.1:8b;
      echo 'Text model (llama3.1:8b) ready';
      echo 'Skipping vision model (llava:13b) - pull manually if needed: ollama pull llava:13b';
      echo 'All models ready!';
      "
    networks:
      - kite-network
    profiles: ["ai-local", "branding-only"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m

  # ============================================================================
  # BASE IMAGE - Build first, used by all backend services (shared: kite- prefix)
  # ============================================================================

  kite-base:
    build:
      context: .
      dockerfile: kitehub-base/Dockerfile
    image: kite-base:latest
    container_name: kite-base
    command: ["echo", "Base image built successfully"]
    profiles:
      - build-only
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
        reservations:
          memory: 32m

  # ============================================================================
  # KITEHUB PLATFORM SERVICES (kitehub- prefix)
  # ============================================================================

  kitehub-subscription:
    build:
      context: .
      dockerfile: kitehub-subscription/Dockerfile
    image: kitehub-subscription:latest
    container_name: kitehub-subscription
    profiles: ["beta-funnel", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${SUBSCRIPTION_JAVA_OPTS:--Xmx512m -Xms256m -XX:MaxMetaspaceSize=192m -XX:MaxRAMPercentage=60}
      SPRING_DATASOURCE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      DATABASE_LIFECYCLE_ENABLED: "true"
      DATABASE_MASTER_HOST: kite-postgres
      DATABASE_MASTER_PORT: 5432
      DATABASE_ADMIN_URL: jdbc:postgresql://kite-postgres:5432/postgres
      DATABASE_ADMIN_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
      # Wave 104.5 GAP-705/706 enablement: align challenge-secret across subscription+gateway
      # (subscription issues challenge tokens; gateway verifies them — symmetric secret required).
      JWT_CHALLENGE_SECRET: ${JWT_CHALLENGE_SECRET:-dev-challenge-secret-pad-pad-pad-pad-pad}
      # GAP-801: beta-invite email signup link base (kitehub.beta.signup-base-url).
      # Local → FE at localhost:3001 so email links resolve to the local stack, not prod.
      # Prod overrides to https://kitehub.me (docker-compose.production.yml / fetch-secrets).
      KITEHUB_BETA_SIGNUP_BASE_URL: ${KITEHUB_BETA_SIGNUP_BASE_URL:-http://localhost:3001}
      # Wave flow-kh3 Finding #4 pre-walk fix: VietQRService.@Value default falls back to false
      # so without this override the container would call the real https://api.vietqr.io/v2/generate
      # endpoint from the local stack. application.yml top-level binding already defaults to true,
      # but we set the env explicitly so it survives any future @Value-vs-yml drift + makes the
      # intent obvious in compose. Prod overrides via docker-compose.production.yml + fetch-secrets.
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
      # Beta-mode payment override (kitehub.payment.beta-mode.* — application.yml:232-233).
      # KH-3 G2 SePay walk needs BETA_PAYMENT_OVERRIDE=true to charge the symbolic 10.000đ.
      # Default false → prod-safe (production never charges the beta symbolic amount). Wired here
      # so the KH-3 G2 recipe env is reproducible (previously ad-hoc-injected, not in compose).
      BETA_PAYMENT_OVERRIDE: ${BETA_PAYMENT_OVERRIDE:-false}
      BETA_PAYMENT_AMOUNT_VND: ${BETA_PAYMENT_AMOUNT_VND:-10000}
      # SePay webhook Apikey (GAP-975/976). Dev default enables local Test-Mode
      # webhook verification (PaymentWebhookController authenticates via
      # "Authorization: Apikey <key>"). Prod overrides via fetch-secrets.sh →
      # AWS Secrets Manager kitehub/production/sepay-api-key (parity already shipped).
      SEPAY_API_KEY: ${SEPAY_API_KEY:-dev-sepay-test-key-local}
      # VietQR merchant bank account the SePay-path QR points to (acqId = BIN 6-digit,
      # NOT short code like "VCB"). Generic placeholders by default; the KH-3 G2 walker
      # overrides VIETQR_* in their shell at rebuild so their real account stays local
      # (never committed — repo is public). application.yml reads these property keys.
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-VCB}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-1234567890}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-CONG TY KITECLASS}
    ports:
      - "8081:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${SUBSCRIPTION_MEM_LIMIT:-1g}
          cpus: '${SUBSCRIPTION_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${SUBSCRIPTION_MEM_RESERVE:-256m}

  kitehub-branding:
    build:
      context: .
      dockerfile: kitehub-branding/Dockerfile
    image: kitehub-branding:latest
    container_name: kitehub-branding
    profiles: ["branding-only", "branding-only-no-ai", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${BRANDING_JAVA_OPTS:--Xmx768m -Xms384m -XX:MaxMetaspaceSize=192m -XX:MaxRAMPercentage=60}
      # GAP-1108 #4 — env-aware deploy landing URL. Local shows a localhost preview
      # path (?tenant= fallback on kiteclass-frontend :3000 per tenant-domain-landing
      # §7) instead of production domain. Prod default (MockProvisioningService) =
      # https://{slug}.kiteclass.vn (mock placeholder; real DNS/render GAP-811/1077).
      KITEHUB_BRANDING_FRONTEND_BASE_URL_TEMPLATE: "http://localhost:3000/?tenant={slug}"
      DATABASE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      # Branding app reads ${REDIS_HOST}/${REDIS_PORT} (Spring 3 + custom env names) — NOT SPRING_REDIS_HOST.
      # Wave 103 Bucket E discovered the mismatch — container fell back to localhost → connection refused.
      REDIS_HOST: kite-redis
      REDIS_PORT: 6379
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OLLAMA_BASE_URL: http://kite-ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.1:8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kitehub}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_ENDPOINT: http://kite-minio:9000
      S3_BUCKET: kitehub-assets
      AWS_REGION: ap-southeast-1
      S3_MOCK_MODE: "false"
      CDN_DOMAIN: localhost:9100
      # GAP-1135 — banner rasterise sidecar. Set => PlaywrightBannerRenderer (@Primary)
      # renders real WebP via the Node/Playwright sidecar; unset => StubBannerRenderer
      # placeholder. Local dev points at the sidecar service by name.
      BANNER_RENDERER_URL: ${BANNER_RENDERER_URL:-http://kitehub-banner-renderer:3000/render}
    ports:
      - "8083:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
      kite-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BRANDING_MEM_LIMIT:-2g}
          cpus: '${BRANDING_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${BRANDING_MEM_RESERVE:-512m}

  # GAP-1135 — HTML→WebP banner rasterise sidecar (Node + Playwright + sharp).
  # Keeps the JVM branding image light; branding POSTs composed HTML, gets WebP.
  kitehub-banner-renderer:
    build:
      context: ./kitehub-banner-renderer
      dockerfile: Dockerfile
    image: kitehub-banner-renderer:latest
    container_name: kitehub-banner-renderer
    profiles: ["branding-only", "branding-only-no-ai", "full"]
    environment:
      PORT: 3000
    networks:
      - kite-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BANNER_RENDERER_MEM_LIMIT:-1g}
          cpus: '${BANNER_RENDERER_CPU_LIMIT:-1.0}'

  kitehub-email:
    build:
      context: .
      dockerfile: kitehub-email/Dockerfile
    image: kitehub-email:latest
    container_name: kitehub-email
    profiles: ["beta-funnel", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${EMAIL_JAVA_OPTS:--Xmx512m -Xms256m -XX:MaxMetaspaceSize=192m -XX:MaxRAMPercentage=60}
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      AWS_SES_REGION: ap-southeast-1
      AWS_SES_FROM_EMAIL: noreply@kiteclass.com
      AWS_SES_MOCK_MODE: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: kite-mailhog
      SMTP_PORT: 1025
      # GAP-580 (Wave local-doable-5) — cross-restart email dedup. EmailIdempotencyGuard
      # uses SETNX in kite-redis so idempotency state outlives container restart.
      REDIS_HOST: kite-redis
      REDIS_PORT: 6379
    ports:
      - "8084:8080"
    depends_on:
      kite-rabbitmq:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EMAIL_MEM_LIMIT:-1g}
          cpus: '${EMAIL_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${EMAIL_MEM_RESERVE:-256m}

  kitehub-admin:
    build:
      context: .
      dockerfile: kitehub-admin/Dockerfile
    image: kitehub-admin:latest
    container_name: kitehub-admin
    profiles: ["beta-funnel", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${ADMIN_JAVA_OPTS:--Xmx512m -Xms256m -XX:MaxMetaspaceSize=192m -XX:MaxRAMPercentage=60}
      SPRING_DATASOURCE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_REDIS_HOST: kite-redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Security secrets (shared with subscription service)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
    ports:
      - "8085:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${ADMIN_MEM_LIMIT:-1g}
          cpus: '${ADMIN_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${ADMIN_MEM_RESERVE:-256m}

  kite-gateway:
    build:
      context: .
      dockerfile: kitehub-gateway/Dockerfile
    image: kite-gateway:latest
    container_name: kite-gateway
    profiles: ["branding-only", "branding-only-no-ai", "beta-funnel", "kc-only", "full"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: ${GATEWAY_JAVA_OPTS:--Xmx384m -Xms192m -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60}
      DATABASE_URL: jdbc:postgresql://kite-postgres:5432/${POSTGRES_DB:-kitehub}
      DATABASE_USERNAME: ${POSTGRES_USER:-kitehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: kite-redis
      REDIS_PORT: 6379
      SERVER_PORT: 9000
      SUBSCRIPTION_SERVICE_URL: http://kitehub-subscription:8080
      BRANDING_SERVICE_URL: http://kitehub-branding:8080
      EMAIL_SERVICE_URL: http://kitehub-email:8080
      ADMIN_SERVICE_URL: http://kitehub-admin:8080
      KITECLASS_CORE_URL: http://kiteclass-core:8080
      # Security secrets (shared với subscription + admin per Wave 89 Bucket A GAP-604)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
      # Wave 104.5 GAP-705/706 enablement: gateway needs challenge-secret to verify
      # HS256 challenge tokens issued by kitehub-subscription ChallengeTokenService.
      # Default matches application.yml local-dev fallback for symmetry.
      JWT_CHALLENGE_SECRET: ${JWT_CHALLENGE_SECRET:-dev-challenge-secret-pad-pad-pad-pad-pad}
    ports:
      - "9000:9000"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kitehub-subscription:
        condition: service_healthy
        required: false
      kitehub-branding:
        condition: service_healthy
        required: false
      kitehub-email:
        condition: service_healthy
        required: false
      kitehub-admin:
        condition: service_healthy
        required: false
      kiteclass-core:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT:-512m}
          cpus: '${GATEWAY_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${GATEWAY_MEM_RESERVE:-128m}

  # ============================================================================
  # KITECLASS CORE SERVICE (kiteclass- prefix)
  # ============================================================================

  kiteclass-core:
    build:
      context: ../kiteclass/kiteclass-core
      dockerfile: Dockerfile
    image: kiteclass-core:latest
    container_name: kiteclass-core
    profiles: ["kc-only", "full"]
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: ${KITECLASS_CORE_JAVA_OPTS:--Xmx768m -Xms384m -XX:MaxMetaspaceSize=192m -XX:MaxRAMPercentage=60}
      SPRING_DATASOURCE_URL: jdbc:postgresql://kite-postgres:5432/kiteclass_shared
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kitehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: kite-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kite-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-kitehub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      STORAGE_S3_ENDPOINT: http://kite-minio:9000
      # Browser-reachable endpoint for presigned branding URLs (GAP-804 Bug #13).
      # Host port mapping kite-minio 9100->9000; browser on host resolves localhost:9100.
      STORAGE_S3_PUBLIC_ENDPOINT: http://localhost:9100
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kitehub}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      # Wave auth-1 (Option B): KC mints HS512 JWT for PARENT/TEACHER/STUDENT login.
      # Same shared secret the gateway validates with (GAP-705). Production parity:
      # kiteclass-core prod env must fetch JWT_SECRET via fetch-secrets.sh (Bucket C follow-up).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run ./scripts/setup.sh}
      # Wave auth-1 Bucket B: enable parent invitation/redeem (was Wave 2 default-off
      # gate). Redeem now provisions the login credential — required for parent login.
      PARENT_PORTAL_ENABLED: ${PARENT_PORTAL_ENABLED:-true}
    ports:
      - "8088:8080"
    depends_on:
      kite-postgres:
        condition: service_healthy
      kite-redis:
        condition: service_healthy
      kite-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KITECLASS_CORE_MEM_LIMIT:-1g}
          cpus: '${KITECLASS_CORE_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${KITECLASS_CORE_MEM_RESERVE:-256m}

  # ============================================================================
  # FRONTEND SERVICES
  # ============================================================================

  kitehub-frontend:
    build:
      # GAP-418: Dockerfile expects repo-root context (Wave 37 PR #936 refactor for
      # multi-arch + ECR push CI). Compose context updated to match — without this,
      # `docker-compose build kitehub-frontend` fails with "/kitehub/kitehub-frontend
      # not found" because the relative subdir context can't see repo-level files
      # like pnpm-workspace.yaml + packages/shared-ui.
      context: ..
      dockerfile: kitehub/kitehub-frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
        NEXT_PUBLIC_KITECLASS_URL_PATTERN: http://localhost:3000?tenant={subdomain}
        # Beta payment banner (GAP-977) — KH-3 G2 SePay walk shows the 10.000đ beta notice.
        # Build-time inlined by Next.js; default false → banner hidden in prod build.
        NEXT_PUBLIC_BETA_PAYMENT_OVERRIDE: ${NEXT_PUBLIC_BETA_PAYMENT_OVERRIDE:-false}
    image: kitehub-frontend:latest
    container_name: kitehub-frontend
    profiles: ["branding-only", "branding-only-no-ai", "beta-funnel", "full"]
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
    depends_on:
      - kite-gateway
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KITEHUB_FRONTEND_MEM_LIMIT:-512m}
          cpus: '${KITEHUB_FRONTEND_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${KITEHUB_FRONTEND_MEM_RESERVE:-128m}

  # ============================================================================
  # KITECLASS FRONTEND (Student/Teacher UI)
  # ============================================================================

  kiteclass-frontend:
    build:
      # GAP-418: same fix as kitehub-frontend above — Dockerfile copies use
      # repo-root paths (/app/kiteclass/kiteclass-frontend/...).
      context: ..
      dockerfile: kiteclass/kiteclass-frontend/Dockerfile
    image: kiteclass-frontend:latest
    container_name: kiteclass-frontend
    profiles: ["kc-only", "full"]
    environment:
      NODE_ENV: production
      PORT: 3000
      # Browser-side base (host docker port mapping).
      # baseURL KHÔNG bao gồm /api/v1 — auth endpoints (/api/auth/*) không có /v1.
      # Landing + v1 endpoints tự thêm /api/v1 prefix tại callsite.
      NEXT_PUBLIC_API_URL: http://localhost:9000
      # Server-side base (Docker network DNS) — Wave 105 RST UI walk
      # 2026-05-23 surfaced SSR ECONNREFUSED localhost:9000 from inside container.
      INTERNAL_API_URL: http://kite-gateway:9000
      # Demo: default tenant for the public homepage (Sky Education instance e8ff87e1).
      # Production model = one FE deploy per tenant carries its own NEXT_PUBLIC_TENANT_ID;
      # Server Components read this at runtime for nav/footer + landing default (GAP-808).
      NEXT_PUBLIC_TENANT_ID: e8ff87e1-69fc-4842-a263-7385c68b4ffb
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      - kite-gateway
    networks:
      - kite-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KITECLASS_FRONTEND_MEM_LIMIT:-512m}
          cpus: '${KITECLASS_FRONTEND_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${KITECLASS_FRONTEND_MEM_RESERVE:-128m}

volumes:
  kite-postgres-data:
    driver: local
  kite-minio-data:
    driver: local
  kite-ollama-models:
    driver: local
  kite-prometheus-data:
    driver: local
  kite-grafana-data:
    driver: local

networks:
  kite-network:
    driver: bridge
