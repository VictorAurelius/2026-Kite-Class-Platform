# Test configuration for kitehub-subscription
# Overrides main application.yml for integration tests

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  # Disable RabbitMQ auto-configuration in tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Disable email queue in integration tests (no RabbitMQ available)
kitehub:
  admin:
    api-key: ""  # Empty = dev mode (no auth required in tests)
  email:
    use-queue: false

# JWT configuration for tests
jwt:
  secret: "test-jwt-secret-key-for-integration-tests-must-be-at-least-32-chars-long"

# Encryption configuration for tests
encryption:
  # Fixed test key (32 bytes, base64-encoded) - ensures consistent encryption/decryption
  # IMPORTANT: This is for TESTING ONLY, never use in production
  master-key: "0t3EshARw42BpdWNO4a2hjDZxVqOgPYUCfSKyOI0KFA="
  algorithm: AES-256-GCM

# Webhook configuration for tests
webhook:
  payment:
    secret: "test-webhook-secret-for-integration-tests"

# Database master configuration
database:
  master:
    host: localhost
    port: 5433
  admin:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  lifecycle:
    # Disable actual database lifecycle in tests
    enabled: false

# S3/MinIO storage configuration — mock mode for tests
storage:
  s3:
    mock-mode: true
    bucket: kite-test-backups
    region: ap-southeast-1
    access-key: test-access-key
    secret-key: test-secret-key

# Backup configuration
backup:
  retention-count: 3
  pg-dump-path: pg_dump

# Logging
logging:
  level:
    root: INFO
    com.kitehub: DEBUG
