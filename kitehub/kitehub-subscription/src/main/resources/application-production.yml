# =============================================================================
# PRODUCTION PROFILE - Strict security, minimal logging
# =============================================================================
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# Requirements (app will FAIL to start without these):
#   - JWT_SECRET (min 32 chars)
#   - ENCRYPTION_MASTER_KEY (32 bytes, Base64)
#   - SPRING_DATASOURCE_PASSWORD
#   - DATABASE_ADMIN_PASSWORD
#
# Characteristics:
#   - Minimal logging (no SQL, no debug)
#   - Strict security
#   - No mock services
#   - Real database provisioning required

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        use_sql_comments: false

  # GAP-503 / Wave 85 Bucket E — HikariCP right-size (E-AC3 alarm guards exhaustion).
  # 7 services × 10 connections = 70 total < RDS db.t3.micro cap 87 (max_connections).
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  # GAP-503 / Wave 85 Bucket E — Tomcat thread pool right-size (E-AC2 alarm guards).
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.kitehub: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Production: real DB provisioning required
database:
  lifecycle:
    enabled: true

# Production: Enable captcha to prevent spam
captcha:
  enabled: true

# GAP-934 Wave flow-kh1 G3 parity audit 2026-06-04: email verification
# defaults to false in application.yml so local dev can skip the SES
# round-trip. Production MUST enable it so each new account gets a
# verification token, the email is sent via SES (per kitehub-email
# production config), and the invitee proves control of the address
# before login is allowed. Without this override, a stolen invite token
# would let an attacker complete signup using any email — even one they
# do not control.
email:
  verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
