spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    root: WARN
    com.kitehub: DEBUG
    org.testcontainers: INFO
