spring:
  application:
    name: kitehub-subscription

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${SPRING_DATASOURCE_USERNAME:kitehub}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}

# JWT configuration
jwt:
  secret: ${JWT_SECRET:#{null}}

# Email verification
kitehub:
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    base-url: ${VERIFICATION_BASE_URL:http://localhost:3001}
  email-service:
    url: ${EMAIL_SERVICE_URL:http://kitehub-email:8080}
    enabled: ${EMAIL_SERVICE_ENABLED:true}

# hCaptcha
captcha:
  enabled: ${CAPTCHA_ENABLED:false}
  site-key: ${HCAPTCHA_SITE_KEY:10000000-ffff-ffff-ffff-000000000001}
  secret-key: ${HCAPTCHA_SECRET_KEY:0x0000000000000000000000000000000000000000}
  verify-url: https://hcaptcha.com/siteverify

# Database provisioning
database:
  master:
    host: ${DATABASE_MASTER_HOST:localhost}
    port: ${DATABASE_MASTER_PORT:5433}
  admin:
    url: ${DATABASE_ADMIN_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DATABASE_ADMIN_USERNAME:postgres}
    password: ${DATABASE_ADMIN_PASSWORD:}
  lifecycle:
    enabled: ${DATABASE_LIFECYCLE_ENABLED:false}

# Encryption
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:}
  algorithm: AES-256-GCM

# Webhook
webhook:
  payment:
    secret: ${WEBHOOK_PAYMENT_SECRET:}

# Email service
email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8083}

# Payment
payment:
  vietqr:
    api-url: ${VIETQR_API_URL:https://api.vietqr.io/v2/generate}
    api-key: ${VIETQR_API_KEY:}
    mock-mode: ${PAYMENT_MOCK_MODE:true}
    bank-code: ${VIETQR_BANK_CODE:VCB}
    account-number: ${VIETQR_ACCOUNT_NUMBER:}
    account-name: ${VIETQR_ACCOUNT_NAME:}
    template: ${VIETQR_TEMPLATE:compact}
