spring:
  application:
    name: kitehub-subscription

  # Wave 82 Bucket F5: REST API service — disable default static resource handler so POST to non-existent path returns 404 (NoHandlerFoundException) not 500 (NoResourceFoundException)
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kitehub}
    username: ${SPRING_DATASOURCE_USERNAME:kitehub}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Wave 85 Bucket B B-AC6 (P0 CRITICAL): RESET app.current_tenant_id +
      # app.is_platform_admin on every new physical connection created in pool.
      # Defense-in-depth against cross-tenant leak via stale GUC. See kc-core
      # application.yml + V59 migration header for full rationale.
      connection-init-sql: "SELECT set_config('app.current_tenant_id', '', false), set_config('app.is_platform_admin', 'false', false);"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # GAP-133 — JDBC batching: 50-row batches, ordered to maximise prepared
        # statement reuse. batch_versioned_data=true required because BaseEntity
        # uses @Version (optimistic locking).
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 60000
          multiplier: 3.0
          max-interval: 540000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Disable checksum validation to allow migrations that were previously applied
    # with checksums stored as -1 (result of prior flyway repair runs)
    validate-on-migrate: false

  # GAP-132 — pin cache abstraction to Caffeine (in-memory, fast). Avoids a silent
  # fallback to ConcurrentMapCacheManager if CacheConfig Bean wiring is ever skipped.
  cache:
    type: caffeine

# GAP-605 — outbox dispatcher poll + backoff config (Wave 91 Bucket A)
outbox:
  dispatcher:
    enabled: ${OUTBOX_DISPATCHER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_DISPATCHER_POLL_INTERVAL_MS:10000}
    backoff-min-minutes: ${OUTBOX_DISPATCHER_BACKOFF_MIN_MINUTES:5}
    batch-size: ${OUTBOX_DISPATCHER_BATCH_SIZE:50}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Sampling 10% in prod, override OTEL_SAMPLING_PROBABILITY=1.0 in staging/dev.
  # OTLP endpoint defaults to empty (disables exporter); set OTEL_EXPORTER_OTLP_ENDPOINT
  # to e.g. http://tempo:4318 to enable trace export.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# JWT configuration (GAP-520 — dual-key rotation support)
# - jwt.secret (legacy / current) is REQUIRED. It is the signing key + the primary
#   verification key.
# - jwt.previous-secret is OPTIONAL. When set, tokens signed by the previous key
#   are still verified — this honors refresh tokens issued before a key rotation.
#   Remove (or leave empty) once the refresh-token TTL window has elapsed.
# See documents/05-guides/operations/jwt-rotation-runbook.md.
jwt:
  secret: ${JWT_SECRET_CURRENT:${JWT_SECRET:}}
  previous-secret: ${JWT_SECRET_PREVIOUS:}
  # GAP-516 Wave 72b — challenge tokens (5-min TTL) issued during the 2FA dance
  # between POST /api/auth/login and POST /api/auth/2fa/{verify,enroll-*}. MUST
  # be different from jwt.secret so a leaked access token cannot impersonate a
  # challenge token (and vice versa).
  challenge-secret: ${JWT_CHALLENGE_SECRET:dev-challenge-secret-pad-pad-pad-pad-pad}

# Email verification
kitehub:
  admin:
    api-key: ${ADMIN_API_KEY:}
  auth:
    # GAP-516 Wave 72b — AES-256 key for encrypting TOTP secrets at rest. 32
    # bytes required in production; the default placeholder padding keeps dev
    # boots green. Phase 1.5+ migrates to AWS KMS (see
    # pre-launch-secrets-hardening-checklist.md §2.4).
    totp:
      encryption-key: ${TOTP_ENCRYPTION_KEY:dev-key-32-chars-pad-pad-pad-pad-pad}
    # GAP-548 Wave 79 — password-reset token TTL (minutes). Aligns with
    # email-deliverability + replay-protection trade-off; sister-rule for
    # gateway rate-limit (1/sec email-keyed) shipped Wave 78 (PR #1354).
    password-reset:
      token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:60}
  trial:
    duration-days: 14
    max-per-owner: 1
    warning-days: 3,1
    midpoint-day: 7
  subscription:
    grace-period-days: 3
    warning-days: 7,3,1
    cache:
      # GAP-132 — seed TTL for subscription + instance summary caches (Caffeine)
      ttl-seconds: ${SUBSCRIPTION_CACHE_TTL_SECONDS:300}
  data-retention:
    trial: 7
    free: 7
    basic: 30
    premium: 60
    enterprise: 90
    warning-count: 2
  # GAP-555 (Wave 79 Bucket A) — wire 22 config keys for feedback / onboarding /
  # beta-status / support domains documented in documents/01-business/kitehub/*/rules.md.
  # Defaults mirror rules.md "Default" column; production overrides land via env
  # vars per production-env-config-registry.md v1.1.1.
  # GAP-600 Wave 92 Bucket C — beta_access_request abort cleanup scheduler
  # Sweeps stale PENDING rows older than threshold → marks ABORTED (NOT delete;
  # audit trail preserved). Re-submit từ user cùng email được phép.
  beta:
    cleanup:
      enabled: ${BETA_CLEANUP_ENABLED:true}
      stale-threshold-hours: ${BETA_CLEANUP_STALE_THRESHOLD_HOURS:24}
      poll-cron: ${BETA_CLEANUP_POLL_CRON:0 0 */6 * * *}
  feedback:
    rating-range-min: ${FEEDBACK_RATING_MIN:1}
    rating-range-max: ${FEEDBACK_RATING_MAX:5}
    comment-min-chars: ${FEEDBACK_COMMENT_MIN:5}
    comment-max-chars: ${FEEDBACK_COMMENT_MAX:2000}
    public-rate-limit-per-min-per-ip: ${FEEDBACK_PUB_RATE:10}
    auth-rate-limit-per-min-per-user: ${FEEDBACK_AUTH_RATE:30}
    categories: ${FEEDBACK_CATEGORIES:BUG,USABILITY,FEATURE_REQUEST,GENERAL}
    survey-scheduler-enabled: ${FEEDBACK_SURVEY_SCHEDULER_ENABLED:true}
    survey-cron: ${FEEDBACK_SURVEY_CRON:0 0 9 * * *}
  onboarding:
    step-ids: ${ONBOARDING_STEP_IDS:PROFILE_SETUP,INVITE_TEAM,IMPORT_DATA,CREATE_FIRST_CLASS,EXPLORE_FEATURES}
    put-rate-limit-per-min: ${ONBOARDING_PUT_RATE:60}
  beta-status:
    content-source: ${BETA_STATUS_CONTENT_SOURCE:classpath:beta-status/beta-status.md}
    cache-ttl-seconds: ${BETA_STATUS_CACHE_TTL:300}
    rate-limit-per-min-per-ip: ${BETA_STATUS_RATE:60}
  support:
    subject-min-chars: ${SUPPORT_SUBJECT_MIN:5}
    subject-max-chars: ${SUPPORT_SUBJECT_MAX:200}
    body-min-chars: ${SUPPORT_BODY_MIN:10}
    body-max-chars: ${SUPPORT_BODY_MAX:5000}
    public-rate-limit-per-min-per-ip: ${SUPPORT_PUB_RATE:5}
    auth-rate-limit-per-min-per-user: ${SUPPORT_AUTH_RATE:20}
    categories: ${SUPPORT_CATEGORIES:AUTH_ISSUE,BILLING,BUG,FEATURE_REQUEST,DATA_ISSUE,OTHER}
    priorities: ${SUPPORT_PRIORITIES:LOW,NORMAL,HIGH,URGENT}
    ticket-number-prefix: ${SUPPORT_TICKET_PREFIX:KH-}
    sla-first-response-hours: ${SUPPORT_SLA_HOURS:24}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    base-url: ${VERIFICATION_BASE_URL:http://localhost:3001}
  email-service:
    url: ${EMAIL_SERVICE_URL:http://kitehub-email:8080}
    enabled: ${EMAIL_SERVICE_ENABLED:true}
  email:
    use-queue: ${EMAIL_USE_QUEUE:true}
    type-toggles:
      trial-warning: ${EMAIL_TOGGLE_TRIAL_WARNING:true}
      trial-expired: ${EMAIL_TOGGLE_TRIAL_EXPIRED:true}
      trial-midpoint: ${EMAIL_TOGGLE_TRIAL_MIDPOINT:true}
      renewal-reminder: ${EMAIL_TOGGLE_RENEWAL:true}
      suspension-notification: ${EMAIL_TOGGLE_SUSPENSION:true}
      retention-warning: ${EMAIL_TOGGLE_RETENTION_WARNING:true}
      retention-final-warning: ${EMAIL_TOGGLE_RETENTION_FINAL:true}
      data-deleted: ${EMAIL_TOGGLE_DATA_DELETED:true}
      welcome: ${EMAIL_TOGGLE_WELCOME:true}
      onboarding-tips: ${EMAIL_TOGGLE_ONBOARDING:true}
      subscription-expired: ${EMAIL_TOGGLE_SUB_EXPIRED:true}
      subscription-created: ${EMAIL_TOGGLE_SUB_CREATED:true}
  domain:
    verification:
      timeout-hours: 48
      mock-mode: ${DOMAIN_VERIFICATION_MOCK:true}

# hCaptcha
captcha:
  enabled: ${CAPTCHA_ENABLED:false}
  site-key: ${HCAPTCHA_SITE_KEY:10000000-ffff-ffff-ffff-000000000001}
  secret-key: ${HCAPTCHA_SECRET_KEY:0x0000000000000000000000000000000000000000}
  verify-url: https://hcaptcha.com/siteverify

# Database provisioning
database:
  master:
    host: ${DATABASE_MASTER_HOST:localhost}
    port: ${DATABASE_MASTER_PORT:5433}
  admin:
    url: ${DATABASE_ADMIN_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DATABASE_ADMIN_USERNAME:postgres}
    password: ${DATABASE_ADMIN_PASSWORD:}
  lifecycle:
    enabled: ${DATABASE_LIFECYCLE_ENABLED:false}

# Encryption
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:}
  algorithm: AES-256-GCM

# Webhook
webhook:
  payment:
    secret: ${WEBHOOK_PAYMENT_SECRET:}

# Email service
# Note: duplicate of `email-service.url` (line 195) — consumed by EmailConsumer + EmailServiceClient.
# Both keys must point to same default to avoid Docker-network/localhost drift.
# Consolidation tracked GAP-713 follow-up scope.
email:
  service:
    url: ${EMAIL_SERVICE_URL:http://kitehub-email:8080}

# Payment
payment:
  vietqr:
    api-url: ${VIETQR_API_URL:https://api.vietqr.io/v2/generate}
    api-key: ${VIETQR_API_KEY:}
    mock-mode: ${PAYMENT_MOCK_MODE:true}
    bank-code: ${VIETQR_BANK_CODE:VCB}
    account-number: ${VIETQR_ACCOUNT_NUMBER:}
    account-name: ${VIETQR_ACCOUNT_NAME:}
    template: ${VIETQR_TEMPLATE:compact}

# S3/MinIO storage for backups
storage:
  s3:
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BACKUP_BUCKET:kite-backups}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    mock-mode: ${S3_MOCK_MODE:true}

# Backup configuration
backup:
  retention-count: ${BACKUP_RETENTION_COUNT:7}
  pg-dump-path: ${PG_DUMP_PATH:pg_dump}
