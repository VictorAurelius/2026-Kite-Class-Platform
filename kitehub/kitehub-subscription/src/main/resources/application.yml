spring:
  application:
    name: kitehub-subscription

  datasource:
    url: jdbc:postgresql://localhost:5433/kitehub
    username: kitehub
    password: kitehub_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.kitehub: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Database master configuration for provisioning tenant databases
database:
  master:
    host: localhost
    port: 5433
  admin:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: ${POSTGRES_ADMIN_PASSWORD:}
  lifecycle:
    # Enable actual database creation/deletion (false for MVP/testing)
    enabled: ${DATABASE_LIFECYCLE_ENABLED:false}

# Encryption configuration for sensitive data (database passwords)
encryption:
  # Master encryption key (32 bytes, Base64-encoded)
  # Generate new key: EncryptionService.generateMasterKey()
  # IMPORTANT: Store in environment variable, not in code
  master-key: ${ENCRYPTION_MASTER_KEY:}
  algorithm: AES-256-GCM

# Webhook configuration for payment notifications
webhook:
  payment:
    # Shared secret for HMAC-SHA256 signature verification
    # IMPORTANT: Store in environment variable, not in code
    secret: ${WEBHOOK_PAYMENT_SECRET:}

# Email service configuration
email:
  service:
    # URL of KiteHub Email Service (internal service-to-service communication)
    url: ${EMAIL_SERVICE_URL:http://localhost:8083}
