<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trial Sắp Hết Hạn</title>
    <style th:inline="text">
        :root {
            --brand-primary: [[${branding?.primaryColor ?: '#3B82F6'}]];
            --brand-secondary: [[${branding?.secondaryColor ?: '#1E40AF'}]];
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #F9FAFB;
        }
        .header {
            background: var(--brand-primary);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .header img.logo {
            max-height: 60px;
            margin-bottom: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .content {
            background: #ffffff;
            padding: 30px;
            border: 1px solid #ddd;
        }
        .warning {
            background: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 15px;
            margin: 20px 0;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--brand-primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img class="logo" th:if="${branding?.logoUrl}" th:src="${branding.logoUrl}" alt="Logo"/>
        <h1 th:text="${branding?.displayName ?: 'KiteHub'}">KiteHub</h1>
    </div>

    <div class="content">
        <p>Xin chào,</p>

        <div class="warning">
            <p>
                Trial của <strong th:text="${organizationName}">Organization</strong>
                sẽ hết hạn trong <strong th:text="${daysRemaining}">3</strong> ngày.
            </p>
        </div>

        <p>Nâng cấp trước khi hết hạn để không bị gián đoạn.</p>

        <a th:href="${upgradeUrl}" class="button">Nâng cấp ngay</a>

        <p style="margin-top: 30px;">
            <strong th:text="|Đội ngũ ${branding?.displayName ?: 'KiteHub'}|">Đội ngũ KiteHub</strong>
        </p>
    </div>

    <div class="footer">
        <p th:text="|© 2026 ${branding?.displayName ?: 'KiteHub'}. All rights reserved.|">© 2026 KiteHub.</p>
        <p>
            Nếu bạn cần hỗ trợ, liên hệ
            <a th:href="|mailto:${branding?.contactEmail ?: 'support@kitehub.me'}|"
               th:text="${branding?.contactEmail ?: 'support@kitehub.me'}">support@kitehub.me</a>.
        </p>
    </div>
</body>
</html>
