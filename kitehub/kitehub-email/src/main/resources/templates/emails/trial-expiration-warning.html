<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trial Sắp Hết Hạn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #F9FAFB;
        }
        .header {
            background: #3B82F6;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .content {
            background: #ffffff;
            padding: 30px;
            border: 1px solid #ddd;
        }
        .warning {
            background: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 15px;
            margin: 20px 0;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #3B82F6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>KiteHub</h1>
    </div>

    <div class="content">
        <p>Xin chào,</p>

        <div class="warning">
            <p>Trial của <strong th:text="${organizationName}">Organization</strong> sẽ hết hạn trong <strong th:text="${daysRemaining}">3</strong> ngày.</p>
        </div>

        <p>Nâng cấp trước khi hết hạn để không bị gián đoạn.</p>

        <a th:href="${upgradeUrl}" class="button">Nâng cấp ngay</a>

        <p style="margin-top: 30px;"><strong>Đội ngũ KiteHub</strong></p>
    </div>

    <div class="footer">
        <p>&copy; 2026 KiteHub. All rights reserved.</p>
        <p>Nếu bạn không muốn nhận email này, vui lòng liên hệ support.</p>
    </div>
</body>
</html>
