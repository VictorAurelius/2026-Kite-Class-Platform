spring:
  application:
    name: kitehub-email

  # Thymeleaf for email templates
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # SMTP Configuration (for MailHog local dev or real SMTP)
  mail:
    host: ${SMTP_HOST:kite-mailhog}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8084

# Email provider: "smtp" (MailHog/real SMTP) or "ses" (AWS SES) or "mock" (log only)
email:
  provider: ${EMAIL_PROVIDER:mock}

# AWS SES Configuration
aws:
  ses:
    region: ${AWS_SES_REGION:ap-southeast-1}
    from-email: ${AWS_SES_FROM_EMAIL:noreply@localhost}  # Safe local default
    from-name: ${AWS_SES_FROM_NAME:Local Dev Platform}  # Safe local default
    mock-mode: ${AWS_SES_MOCK_MODE:true}  # true for local dev, false for production
    # Credentials from environment or IAM role
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# KiteHub email service — tenant branding propagation (GAP-021 Wave 4)
kitehub:
  email:
    # Feature flag — set false to keep legacy hardcoded colors in templates
    branding-enabled: ${KITEHUB_EMAIL_BRANDING_ENABLED:true}
    branding:
      # Upstream URL for kiteclass-core branding package API
      core-base-url: ${KITEHUB_EMAIL_BRANDING_CORE_URL:http://kiteclass-core:8080}
      # Timeout for branding lookups before falling back to defaults
      timeout-seconds: ${KITEHUB_EMAIL_BRANDING_TIMEOUT_SECONDS:3}
      # Bind the branding.updated RabbitMQ listener. Disable in tests without broker.
      rabbit-enabled: ${KITEHUB_EMAIL_BRANDING_RABBIT_ENABLED:true}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.kitehub.email: DEBUG
    org.springframework.web: INFO
    software.amazon.awssdk: INFO
