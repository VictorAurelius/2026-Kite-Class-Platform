spring:
  application:
    name: kitehub-email

  # GAP-580 cross-restart email dedup — Redis backs EmailIdempotencyGuard.
  # Local dev uses kite-redis container (port 6380 host → 6379 container);
  # production uses managed ElastiCache via REDIS_HOST/REDIS_PORT env.
  data:
    redis:
      host: ${REDIS_HOST:kite-redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  # Thymeleaf for email templates
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # SMTP Configuration (for MailHog local dev or real SMTP)
  mail:
    host: ${SMTP_HOST:kite-mailhog}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8084

# Email provider: "smtp" (MailHog/real SMTP) or "ses" (AWS SES) or "mock" (log only)
email:
  provider: ${EMAIL_PROVIDER:mock}

# AWS SES Configuration
aws:
  ses:
    region: ${AWS_SES_REGION:ap-southeast-1}
    from-email: ${AWS_SES_FROM_EMAIL:noreply@localhost}  # Safe local default
    from-name: ${AWS_SES_FROM_NAME:Local Dev Platform}  # Safe local default
    mock-mode: ${AWS_SES_MOCK_MODE:true}  # true for local dev, false for production
    # Credentials from environment or IAM role
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    # Bounce + complaint feedback loops (SNS topics — see email-ses-setup-runbook.md §Bounce/Complaint)
    bounce:
      topic-arn: ${AWS_SES_BOUNCE_TOPIC_ARN:}        # e.g. arn:aws:sns:ap-southeast-1:123456789012:ses-bounces
    complaint:
      topic-arn: ${AWS_SES_COMPLAINT_TOPIC_ARN:}     # e.g. arn:aws:sns:ap-southeast-1:123456789012:ses-complaints
    # Application-side sending rate caps (must be ≤ SES account quota)
    rate:
      max-per-second: ${AWS_SES_RATE_MAX_PER_SECOND:10}
      max-per-day: ${AWS_SES_RATE_MAX_PER_DAY:50000}

# KiteHub email service — tenant branding propagation (GAP-021 Wave 4)
kitehub:
  email:
    # Feature flag — set false to keep legacy hardcoded colors in templates
    branding-enabled: ${KITEHUB_EMAIL_BRANDING_ENABLED:true}
    branding:
      # Upstream URL for kiteclass-core branding package API
      core-base-url: ${KITEHUB_EMAIL_BRANDING_CORE_URL:http://kiteclass-core:8080}
      # Timeout for branding lookups before falling back to defaults
      timeout-seconds: ${KITEHUB_EMAIL_BRANDING_TIMEOUT_SECONDS:3}
      # Bind the branding.updated RabbitMQ listener. Disable in tests without broker.
      rabbit-enabled: ${KITEHUB_EMAIL_BRANDING_RABBIT_ENABLED:true}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Wave 77 Bucket B (closes GAP-502 remaining 20% for email scope / GAP-506 Sub-B):
      # expose probe groups so the docker-compose healthcheck can target
      # /actuator/health/liveness (only RabbitMQ + JVM heap matter for liveness —
      # vendor flakiness must NOT flap the container).
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,kiteHubEmail
          show-details: always
        readiness:
          include: readinessState,kiteHubEmail
          show-details: always
  # GAP-506 Sub-B: mail health indicator disabled because Phase 1 BETA uses
  # Resend HTTP API (per ADR-025 Stream A), not SMTP. Default mail health
  # tries SMTP TCP connect to kite-mailhog:1025 (dev SMTP catcher, not deployed
  # in production) → fails → composite health 503 → docker unhealthy → masks
  # actual service capability. Email sending capability tracked via Resend API
  # response codes + send-failure metrics, not Spring mail health indicator.
  health:
    mail:
      enabled: false
    # Wave 77 Bucket B: enable LivenessState + ReadinessState ApplicationAvailability
    # signals — paired with the custom `kiteHubEmail` HealthIndicator in liveness/readiness groups.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # GAP-112: Distributed tracing via Micrometer Tracing + OTLP exporter.
  # Sampling 10% in prod, override OTEL_SAMPLING_PROBABILITY=1.0 in staging/dev.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Zalo Official Account messaging (Wave local-doable-11 Bucket B — GAP-063 Phase 1 scaffold).
# Phase 1 ships mock-only — `ZaloOAMockClient` returns deterministic canned responses
# so the platform boots without any Zalo OA business-account credentials. The live
# implementation (`ZaloOAHttpClient`) and real OAuth wiring land in Wave 12+ once the
# Zalo OA business account is verified (see zalo-oa-setup-runbook.md — Bucket C).
# Per local-fix-production-parity-check.md §2 — when `provider=live` ships, AWS
# Secrets Manager declarations for ZALO_ACCESS_TOKEN + ZALO_OA_ID MUST land same PR
# (terraform-aws/secrets.tf + fetch-secrets.sh + env-vars-registry.md).
zalo:
  provider: ${ZALO_PROVIDER:mock}                # mock | live
  oa-id: ${ZALO_OA_ID:}                          # numeric OA id from Zalo (live only)
  access-token: ${ZALO_ACCESS_TOKEN:}            # OA access token (live only)
  api-base-url: ${ZALO_API_BASE_URL:https://openapi.zalo.me}
  timeout-seconds: ${ZALO_TIMEOUT_SECONDS:5}

# Logging
logging:
  level:
    com.kitehub.email: DEBUG
    org.springframework.web: INFO
    software.amazon.awssdk: INFO
