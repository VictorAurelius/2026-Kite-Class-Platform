# GitLab CI/CD Pipeline — Kite Class Platform
#
# Migration target post-2026-05-14 GitHub account suspension.
# Self-hosted runner: kite-dev-wsl2-shell (Ubuntu 24.04 WSL2, shell executor).
#
# Pipeline structure:
#   - smoke-test: validate runner pickup + toolchain availability (this PR)
#   - script-quality: validators (next translation)
#   - kitehub-ci: Java build + tests (next translation)
#   - terraform-plan: infra dry-run (next translation)
#
# Translation source: .github/workflows/*.yml (preserved for ref)

stages:
  - smoke

variables:
  # PATH extension cho fnm-managed node + user-local bins
  # Runner runs as user nguyenvankiet; fnm uses per-version paths
  NODE_VERSION: "22.22.2"
  PATH_EXT: "/home/nguyenvankiet/.local/share/fnm/node-versions/v22.22.2/installation/bin:/home/nguyenvankiet/.local/bin:$PATH"

default:
  before_script:
    - export PATH="$PATH_EXT"
    - echo "Runner $CI_RUNNER_DESCRIPTION on $(hostname); user=$(whoami); pwd=$(pwd)"

smoke-test:
  stage: smoke
  script:
    - echo "=== Pipeline metadata ==="
    - echo "Branch $CI_COMMIT_REF_NAME at $CI_COMMIT_SHA"
    - echo "MR $CI_MERGE_REQUEST_IID (if any)"
    - echo "Runner $CI_RUNNER_DESCRIPTION executor=$CI_RUNNER_EXECUTABLE_ARCH"
    - uname -a
    - echo ""
    - echo "=== Toolchain ==="
    - which java && java -version 2>&1 | head -2
    - which mvn && mvn --version 2>&1 | head -2
    - which node && node --version
    - which pnpm && pnpm --version
    - which python3 && python3 --version
    - which docker && docker --version 2>&1 || echo "docker not in CI PATH (OK)"
    - which shellcheck && shellcheck --version 2>&1 | head -2
    - which yq 2>&1 || echo "yq not installed (may need for some validators)"
    - which jq && jq --version
    - echo ""
    - echo "=== Maven cache ==="
    - ls -la ~/.m2/repository 2>&1 | head -3 || echo "no maven cache (will populate on first build)"
    - du -sh ~/.m2 2>/dev/null || true
    - echo ""
    - echo "=== Repo state ==="
    - git log -1 --pretty=fuller
    - git diff HEAD~1 HEAD --stat 2>&1 | head -10
    - echo ""
    - echo "=== Validator scripts available ==="
    - ls scripts/check-*.sh 2>&1 | head -10
    - echo ""
    - echo "✓ Smoke test PASS — runner pickup works + toolchain verified"
