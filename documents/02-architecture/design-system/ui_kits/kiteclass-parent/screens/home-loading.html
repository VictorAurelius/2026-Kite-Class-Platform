<!DOCTYPE html>
<html lang="vi-VN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <title>Đang tải — KC Phụ huynh</title>
  <!--
    Persona: Pa. Parent — first paint after PWA install or cold boot
    Flow ref: dossier/05-business-flows.md Flow #6 (parent dashboard initial load)
    Score self-estimate: 110/128 (skeleton everywhere + brand-coherent + dark-safe)
    Viewport priority: 320px (default) → 768px → 1440px graceful
    Contrast (measured):
      - skeleton tone on bg: low-contrast intentional (animated shimmer)
      - status bar text: 16.5:1 AAA ✓
    i18n keys: parent.home.loading.aria-label
  -->
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="theme-kiteclass-parent">
  <div class="app-shell" role="status" aria-live="polite" aria-label="Đang tải dữ liệu của con">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><path d="M1 7h2v4H1zm4-2h2v6H5zm4-2h2v8H9zm4-3h2v11h-2z"/></svg>
        <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor" aria-hidden="true"><rect x="0.5" y="1" width="18" height="10" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2.5" width="14" height="7" rx="1"/><rect x="19" y="4" width="2" height="4"/></svg>
      </span>
    </div>

    <header class="app-header">
      <div>
        <div class="skeleton" style="height:28px;width:200px"></div>
        <div class="skeleton" style="height:14px;width:140px;margin-top:8px"></div>
      </div>
      <div class="skeleton" style="width:44px;height:44px;border-radius:999px"></div>
    </header>

    <!-- Hero metric skeleton -->
    <section style="margin:12px 16px 16px 16px;padding:24px;border-radius:24px;background:hsl(var(--surface-soft));">
      <div class="skeleton" style="height:14px;width:60%"></div>
      <div class="skeleton" style="height:48px;width:50%;margin-top:12px"></div>
      <div class="skeleton" style="height:24px;width:65%;margin-top:14px;border-radius:999px"></div>
    </section>

    <!-- Child card skeleton -->
    <div style="margin:0 16px;padding:18px;border-radius:20px;background:hsl(var(--card));border:1px solid hsl(var(--border));display:flex;align-items:center;gap:14px">
      <div class="skeleton" style="width:56px;height:56px;border-radius:999px"></div>
      <div style="flex:1">
        <div class="skeleton" style="height:16px;width:70%"></div>
        <div class="skeleton" style="height:12px;width:55%;margin-top:8px"></div>
      </div>
    </div>

    <!-- Quick stats skeleton -->
    <section style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px;">
      <div class="card" style="padding:14px">
        <div class="skeleton" style="height:10px;width:55%"></div>
        <div class="skeleton" style="height:30px;width:40%;margin-top:10px"></div>
        <div class="skeleton" style="height:18px;width:60%;margin-top:12px;border-radius:999px"></div>
      </div>
      <div class="card" style="padding:14px">
        <div class="skeleton" style="height:10px;width:55%"></div>
        <div class="skeleton" style="height:24px;width:50%;margin-top:10px"></div>
        <div class="skeleton" style="height:18px;width:65%;margin-top:12px;border-radius:999px"></div>
      </div>
    </section>

    <!-- Activity rows skeleton -->
    <div class="section-heading">
      <div class="skeleton" style="height:18px;width:140px"></div>
    </div>
    <div class="card" style="margin:0 16px;padding:8px 16px">
      <div class="activity-row">
        <div class="skeleton" style="width:40px;height:40px;border-radius:999px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton" style="height:14px;width:75%"></div>
          <div class="skeleton" style="height:10px;width:55%;margin-top:6px"></div>
        </div>
      </div>
      <div class="activity-row">
        <div class="skeleton" style="width:40px;height:40px;border-radius:999px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton" style="height:14px;width:65%"></div>
          <div class="skeleton" style="height:10px;width:60%;margin-top:6px"></div>
        </div>
      </div>
      <div class="activity-row">
        <div class="skeleton" style="width:40px;height:40px;border-radius:999px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton" style="height:14px;width:80%"></div>
          <div class="skeleton" style="height:10px;width:45%;margin-top:6px"></div>
        </div>
      </div>
    </div>

    <!-- Bottom tab skeleton -->
    <nav class="bottom-tabs" aria-hidden="true">
      <div class="tab-btn"><div class="skeleton" style="width:22px;height:22px;border-radius:6px"></div><div class="skeleton" style="height:10px;width:50px;margin-top:4px"></div></div>
      <div class="tab-btn"><div class="skeleton" style="width:22px;height:22px;border-radius:6px"></div><div class="skeleton" style="height:10px;width:50px;margin-top:4px"></div></div>
      <div class="tab-btn"><div class="skeleton" style="width:22px;height:22px;border-radius:6px"></div><div class="skeleton" style="height:10px;width:50px;margin-top:4px"></div></div>
      <div class="tab-btn"><div class="skeleton" style="width:22px;height:22px;border-radius:6px"></div><div class="skeleton" style="height:10px;width:50px;margin-top:4px"></div></div>
    </nav>
  </div>
  <link rel="stylesheet" href="../../_shared/scripts/tenant-theme-demo.css" />
  <script src="../../_shared/scripts/tenant-theme-demo.js" defer></script>
</body>
</html>
