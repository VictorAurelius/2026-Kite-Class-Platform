<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass">
<!--
  Component: G8 Attendance Calendar — MONTH-LOAD state (current month grid loaded)
  Used by: KC /attendance, KC /classes/[id]/attendance · Homeroom teacher views Lớp 6A1 October attendance
  Persona: Teacher (homeroom)
  Score self-estimate: 109/128 (Tech 28 / Heuristics 27 / Aesthetics 27 / UX 27)
  Contrast: All ≥4.5:1 — heatmap red/amber/green ≥4.5:1, body 17.9:1
  i18n: attendance.cal.title, attendance.cal.legend, attendance.cal.heatmap
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G8 — Attendance Calendar (Tháng đầy)</title>
  <link rel="stylesheet" href="../../../_shared/colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {
      colors: {
        border: 'hsl(var(--border))', ring: 'hsl(var(--ring))',
        background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))',
        primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
        muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
        card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
        success: { DEFAULT: 'hsl(var(--success))', foreground: 'hsl(var(--success-foreground))' },
        warning: { DEFAULT: 'hsl(var(--warning))', foreground: 'hsl(var(--warning-foreground))' },
        destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
        info: { DEFAULT: 'hsl(var(--info))', foreground: 'hsl(var(--info-foreground))' },
      },
      fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'] },
      boxShadow: { soft: 'var(--shadow-soft)' },
    }}};
  </script>
  <style>
    .day-cell { aspect-ratio: 1.1 / 1; }
    .day-cell button { width: 100%; height: 100%; padding: 8px; border-radius: 10px; text-align: left; transition: transform .15s, box-shadow .15s; }
    .day-cell button:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    @media (prefers-reduced-motion: reduce) { .day-cell button { transition: none; } .day-cell button:hover { transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-muted/30 text-foreground">
  <header class="border-b bg-card">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button aria-label="Quay lại" class="rounded-lg p-2 hover:bg-muted"><i data-lucide="arrow-left" class="h-5 w-5"></i></button>
        <div>
          <p class="text-xs text-muted-foreground">Lớp 6A1 · Cô Nguyễn Thị Lan (GVCN)</p>
          <!-- i18n: attendance.cal.title -->
          <h1 class="text-lg font-semibold">Điểm danh — Tháng 10/2026</h1>
        </div>
      </div>
      <nav class="flex items-center gap-1 rounded-lg border bg-card overflow-hidden">
        <button class="px-2.5 py-1.5 hover:bg-muted" aria-label="Tháng trước"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
        <span class="px-3 py-1.5 text-sm font-semibold border-x">Tháng 10/2026</span>
        <button class="px-2.5 py-1.5 hover:bg-muted" aria-label="Tháng sau"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 grid gap-6 lg:grid-cols-[1fr_280px]">
    <!-- Calendar grid -->
    <section>
      <!-- Week header -->
      <div class="grid grid-cols-7 gap-2 mb-2 text-xs font-semibold text-center text-muted-foreground">
        <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div>
        <div class="text-info">T7</div><div class="text-info">CN</div>
      </div>

      <!-- 5 weeks × 7 days -->
      <div id="calendar" class="grid grid-cols-7 gap-2"></div>

      <!-- Legend -->
      <div class="mt-4 flex flex-wrap items-center gap-3 text-xs">
        <p class="font-semibold text-muted-foreground">
          <!-- i18n: attendance.cal.legend -->
          Tỉ lệ điểm danh:
        </p>
        <span class="inline-flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-success" aria-hidden="true"></span><span>≥95%</span></span>
        <span class="inline-flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-warning" aria-hidden="true"></span><span>80-95%</span></span>
        <span class="inline-flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-destructive" aria-hidden="true"></span><span>&lt;80%</span></span>
        <span class="inline-flex items-center gap-1.5 ml-auto"><span class="h-3 w-3 rounded bg-muted border" aria-hidden="true"></span><span>Không có buổi</span></span>
      </div>
    </section>

    <!-- Side stats -->
    <aside class="rounded-xl border bg-card p-5 shadow-soft h-fit">
      <p class="text-xs text-muted-foreground uppercase tracking-wide">Tổng quan tháng</p>
      <p class="mt-2 text-3xl font-bold tabular-nums">93%</p>
      <p class="text-sm text-muted-foreground">Trung bình điểm danh — 35 HS</p>

      <dl class="mt-5 space-y-3 text-sm">
        <div class="flex items-center justify-between">
          <dt class="text-muted-foreground">Tổng buổi</dt>
          <dd class="font-semibold tabular-nums">18</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-muted-foreground">Có mặt</dt>
          <dd class="font-semibold tabular-nums text-success">587</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-muted-foreground">Vắng có phép</dt>
          <dd class="font-semibold tabular-nums text-info">28</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-muted-foreground">Vắng không phép</dt>
          <dd class="font-semibold tabular-nums text-destructive">12</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-muted-foreground">Đi trễ</dt>
          <dd class="font-semibold tabular-nums text-warning">8</dd>
        </div>
      </dl>

      <button class="mt-5 w-full rounded-lg border bg-card px-3 py-2 text-sm font-medium hover:bg-muted inline-flex items-center justify-center gap-2">
        <i data-lucide="download" class="h-4 w-4"></i><span>Xuất báo cáo</span>
      </button>
    </aside>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // October 2026 starts on Thursday (4th column, 0-indexed Mon=0)
    // Pad: 3 empty cells before Oct 1
    const days = [];
    for (let i = 0; i < 3; i++) days.push({ pad: true });
    for (let d = 1; d <= 31; d++) {
      const dow = (d + 2) % 7; // Oct 1 = Thu, Mon-start: Thu = idx 3
      const isWeekend = dow === 5 || dow === 6;
      // Synthetic mock attendance — schedule sessions on Mon/Wed/Fri only
      const hasSession = !isWeekend && (dow === 0 || dow === 2 || dow === 4);
      let rate = null, sessions = 0;
      if (hasSession) {
        const seed = (d * 17) % 100;
        rate = seed < 10 ? 75 + (seed % 5)         // few low days
              : seed < 25 ? 85 + (seed % 10)        // some amber
              : 95 + (seed % 5);                    // mostly green
        sessions = 1;
      }
      days.push({ day: d, dow, isWeekend, sessions, rate, isToday: d === 15 });
    }
    // Pad end to multiple of 7
    while (days.length % 7) days.push({ pad: true });

    const colorClass = r => r == null ? '' : r >= 95 ? 'bg-success/15 text-[hsl(var(--success))] border-success/30'
                                          : r >= 80 ? 'bg-warning/15 text-[hsl(var(--warning))] border-warning/30'
                                          : 'bg-destructive/15 text-destructive border-destructive/40';
    const html = days.map(c => {
      if (c.pad) return `<div class="day-cell"><div class="rounded-lg bg-muted/30 h-full"></div></div>`;
      const cls = c.rate != null ? colorClass(c.rate) : 'bg-card border';
      const todayRing = c.isToday ? 'ring-2 ring-primary' : '';
      const weekendBg = c.isWeekend && c.rate == null ? 'bg-muted/20' : '';
      return `<div class="day-cell">
        <button type="button" aria-label="Ngày ${c.day}/10${c.rate != null ? `, tỉ lệ ${c.rate}%` : ', không có buổi'}"
                class="border ${cls} ${weekendBg} ${todayRing}">
          <div class="flex items-start justify-between">
            <span class="font-semibold ${c.isWeekend ? 'text-info' : ''}">${c.day}</span>
            ${c.isToday ? '<span class="text-[10px] font-semibold rounded-full bg-primary text-primary-foreground px-1.5 py-0.5">Hôm nay</span>' : ''}
          </div>
          ${c.rate != null ? `<p class="mt-2 text-base font-bold tabular-nums">${c.rate}%</p><p class="text-[10px] opacity-80">${c.sessions} buổi</p>` : ''}
        </button>
      </div>`;
    }).join('');
    document.getElementById('calendar').innerHTML = html;
    lucide.createIcons();
  </script>
</body>
</html>
