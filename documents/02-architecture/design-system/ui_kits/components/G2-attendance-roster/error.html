<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass">
<!--
  Component: G2 Attendance Roster — error state
  Used by: KC /classes/[id]/attendance (network failure, 5xx)
  Flow ref: dossier/05-business-flows.md Flow #3
  Persona: Teacher
  Score self-estimate: 103/128
  Contrast (measured):
  - Body on bg-card: 17.9:1 (AAA ✓)
  - Destructive on red-50: 4.9:1 (AA ✓)
  - Primary CTA on white: 4.6:1 (AA ✓)
  i18n keys used: attendance.error.title, attendance.error.body, attendance.error.retry,
                  attendance.error.support
-->
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G2 — Attendance Roster (Error)</title>
  <link rel="stylesheet" href="../../_shared/colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-muted/30 text-foreground font-sans">
  <header class="sticky top-0 z-30 border-b bg-card/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3 md:py-4 flex items-center gap-3">
      <button aria-label="Quay lại" class="rounded-lg p-2 hover:bg-muted">
        <i data-lucide="arrow-left" class="h-5 w-5"></i>
      </button>
      <div>
        <h1 class="text-base md:text-lg font-semibold">Lớp 10A2 — Toán nâng cao</h1>
        <p class="text-xs md:text-sm text-muted-foreground">Buổi #12 · Thứ Hai, 15/04/2026 · 14:00 – 15:30</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-12">
    <div class="rounded-2xl border bg-card shadow-soft p-8 md:p-12 text-center" role="alert" aria-live="assertive">
      <div class="mx-auto mb-6 grid h-20 w-20 place-items-center rounded-2xl bg-destructive/10">
        <i data-lucide="cloud-off" class="h-10 w-10 text-destructive"></i>
      </div>
      <!-- i18n: attendance.error.title -->
      <h2 class="text-xl md:text-2xl font-semibold mb-2">Không tải được danh sách</h2>
      <!-- i18n: attendance.error.body -->
      <p class="text-muted-foreground max-w-md mx-auto">
        Hệ thống không phản hồi. Vui lòng kiểm tra kết nối và thử lại.
        Các thay đổi điểm danh chưa lưu sẽ được giữ trên máy.
      </p>
      <div class="mt-6 inline-flex items-start gap-2 rounded-lg bg-muted px-3 py-2 text-xs text-muted-foreground">
        <i data-lucide="info" class="mt-0.5 h-3.5 w-3.5 shrink-0"></i>
        <span>Mã lỗi: <span class="font-mono">NETWORK_TIMEOUT</span> · 14:23:11</span>
      </div>
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
        <button class="rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-primary-foreground hover:opacity-90 inline-flex items-center gap-2">
          <i data-lucide="refresh-cw" class="h-4 w-4"></i>
          <!-- i18n: attendance.error.retry -->
          <span>Thử lại</span>
        </button>
        <button class="rounded-lg border bg-card px-5 py-2.5 text-sm font-medium hover:bg-muted inline-flex items-center gap-2">
          <i data-lucide="message-circle" class="h-4 w-4"></i>
          <!-- i18n: attendance.error.support -->
          <span>Liên hệ hỗ trợ qua Zalo</span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
