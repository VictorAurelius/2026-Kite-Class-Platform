<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass">
<!--
  Component: G2 Attendance Roster — loading state
  Used by: KC /classes/[id]/attendance (initial fetch)
  Flow ref: dossier/05-business-flows.md Flow #3
  Persona: Teacher
  Score self-estimate: 102/128
  Contrast (measured): muted/50 skeleton on bg-card — N/A (decorative, not text)
  i18n keys used: a11y.loading
-->
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G2 — Attendance Roster (Loading)</title>
  <link rel="stylesheet" href="../../_shared/colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    .skeleton { background: hsl(var(--muted)); animation: pulse 1.6s ease-in-out infinite; border-radius: 6px; }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; opacity: .6; } }
  </style>
</head>
<body class="min-h-screen bg-muted/30 font-sans">
  <header class="sticky top-0 z-30 border-b bg-card/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3 md:py-4 flex items-center gap-3">
      <div class="skeleton h-9 w-9 rounded-lg"></div>
      <div class="flex-1 space-y-1.5">
        <div class="skeleton h-4 w-48"></div>
        <div class="skeleton h-3 w-72"></div>
      </div>
      <div class="hidden md:flex gap-2">
        <div class="skeleton h-9 w-32 rounded-lg"></div>
        <div class="skeleton h-9 w-24 rounded-lg"></div>
      </div>
    </div>
    <div class="mx-auto max-w-5xl px-4 pb-3 flex flex-wrap gap-2">
      <div class="skeleton h-6 w-24 rounded-full"></div>
      <div class="skeleton h-6 w-28 rounded-full"></div>
      <div class="skeleton h-6 w-24 rounded-full"></div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-2 md:px-4 py-4" role="status" aria-busy="true" aria-live="polite">
    <span class="sr-only">Đang tải danh sách học sinh…</span>
    <ul class="space-y-2">
      <!-- 5 skeleton rows -->
      <script>
        for (let i = 0; i < 5; i++) {
          document.write(`
            <li class="rounded-xl border bg-card px-3 md:px-4 py-3 flex items-center gap-3">
              <div class="skeleton h-10 w-10 rounded-full"></div>
              <div class="flex-1 space-y-2">
                <div class="skeleton h-4 w-40"></div>
                <div class="skeleton h-3 w-56"></div>
              </div>
              <div class="flex items-center gap-1.5">
                <div class="skeleton h-11 w-11 rounded-lg"></div>
                <div class="skeleton h-11 w-11 rounded-lg"></div>
                <div class="skeleton h-11 w-11 rounded-lg"></div>
                <div class="skeleton h-11 w-11 rounded-lg"></div>
              </div>
            </li>`);
        }
      </script>
    </ul>
  </main>
</body>
</html>
