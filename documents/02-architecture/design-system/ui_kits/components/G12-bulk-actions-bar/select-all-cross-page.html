<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass">
<!--
  Component: G12 Bulk Actions Bar — select-all-cross-page state
  Used by: When user checks master checkbox → selects current page (10) → prompt to select across all pages (247)
  Persona: Admin
  Score self-estimate: 109/128
  Contrast (measured):
  - Body on bg-card: 17.9:1 (AAA ✓)
  - Info banner text on info/10: 4.7:1 (AA ✓)
  - Primary CTA on info bg: 4.6:1 (AA ✓)
  i18n keys used: bulk.crossPage.banner, bulk.crossPage.cta.selectAll, bulk.crossPage.cta.thisPageOnly
-->
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G12 — Bulk Actions Bar (Cross-page Select)</title>
  <link rel="stylesheet" href="../../_shared/colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{
      border:'hsl(var(--border))', background:'hsl(var(--background))', foreground:'hsl(var(--foreground))',
      primary:{DEFAULT:'hsl(var(--primary))',foreground:'hsl(var(--primary-foreground))'},
      muted:{DEFAULT:'hsl(var(--muted))',foreground:'hsl(var(--muted-foreground))'},
      destructive:{DEFAULT:'hsl(var(--destructive))',foreground:'hsl(var(--destructive-foreground))'},
      card:{DEFAULT:'hsl(var(--card))',foreground:'hsl(var(--card-foreground))'},
      success:{DEFAULT:'hsl(var(--success))',foreground:'hsl(var(--success-foreground))'},
      warning:{DEFAULT:'hsl(var(--warning))',foreground:'hsl(var(--warning-foreground))'},
      info:{DEFAULT:'hsl(var(--info))',foreground:'hsl(var(--info-foreground))'},
    }, boxShadow:{soft:'var(--shadow-soft)','soft-lg':'var(--shadow-soft-lg)'} }}};
  </script>
</head>
<body class="min-h-screen bg-muted/30 text-foreground font-sans pb-32">
  <header class="border-b bg-card">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-3">
      <h1 class="text-lg font-semibold">Học sinh</h1>
      <span class="rounded-full bg-muted px-2 py-0.5 text-xs text-muted-foreground">247 mục</span>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <!-- Cross-page select banner -->
    <div class="rounded-xl border border-info/30 bg-info/5 px-4 py-3 mb-3 flex flex-wrap items-center gap-3" role="status" aria-live="polite">
      <i data-lucide="info" class="h-5 w-5 shrink-0 text-[hsl(var(--info))]"></i>
      <p class="text-sm flex-1 min-w-0">
        <!-- i18n: bulk.crossPage.banner -->
        Đã chọn <strong>10 học sinh</strong> trên trang này.
        <button class="ml-1 underline text-[hsl(var(--info))] font-semibold hover:no-underline">
          <!-- i18n: bulk.crossPage.cta.selectAll -->
          Chọn tất cả 247 học sinh phù hợp với bộ lọc?
        </button>
      </p>
      <button class="text-sm text-muted-foreground hover:text-foreground inline-flex items-center gap-1">
        <i data-lucide="x" class="h-3.5 w-3.5"></i>
        <!-- i18n: bulk.crossPage.cta.thisPageOnly -->
        <span>Chỉ trang này</span>
      </button>
    </div>

    <div class="rounded-xl border bg-card shadow-soft overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-muted/40 border-b">
            <tr>
              <th class="px-4 py-3 w-10">
                <input type="checkbox" checked aria-label="Chọn tất cả trong trang"
                  class="h-4 w-4 rounded border-2 border-muted-foreground/30 accent-[hsl(var(--primary))]" />
              </th>
              <th class="text-left font-semibold px-4 py-3">Học sinh</th>
              <th class="text-left font-semibold px-4 py-3">Lớp</th>
              <th class="text-left font-semibold px-4 py-3">Ngày đăng ký</th>
              <th class="text-right font-semibold px-4 py-3">Học phí</th>
              <th class="text-left font-semibold px-4 py-3">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Bar shows 10 selected (current page only by default) -->
  <div class="fixed bottom-4 inset-x-4 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 z-40 max-w-3xl mx-auto"
       role="region" aria-label="Thanh thao tác hàng loạt" aria-live="polite">
    <div class="rounded-2xl border bg-card/95 backdrop-blur shadow-soft-lg p-3 flex flex-wrap items-center gap-2">
      <span class="inline-flex items-center gap-2 rounded-lg bg-primary/10 text-primary px-3 py-1.5 text-sm font-semibold shrink-0">
        <span class="grid h-6 min-w-6 place-items-center rounded-full bg-primary px-1.5 text-xs text-primary-foreground tabular-nums">10</span>
        <span>mục đã chọn</span>
      </span>
      <div class="h-6 w-px bg-border hidden md:block"></div>
      <div class="flex flex-wrap gap-1.5 flex-1 min-w-0">
        <button class="rounded-lg border bg-card px-3 py-1.5 text-sm font-medium hover:bg-muted inline-flex items-center gap-1.5"><i data-lucide="download" class="h-4 w-4"></i><span>Xuất Excel</span></button>
        <button class="rounded-lg border bg-card px-3 py-1.5 text-sm font-medium hover:bg-muted inline-flex items-center gap-1.5"><i data-lucide="archive" class="h-4 w-4"></i><span>Lưu trữ</span></button>
        <button class="rounded-lg border bg-card px-3 py-1.5 text-sm font-medium hover:bg-muted inline-flex items-center gap-1.5"><i data-lucide="users" class="h-4 w-4"></i><span>Chuyển lớp</span></button>
        <button class="rounded-lg border border-destructive/30 bg-destructive/5 px-3 py-1.5 text-sm font-medium text-destructive hover:bg-destructive/10 inline-flex items-center gap-1.5"><i data-lucide="trash-2" class="h-4 w-4"></i><span>Xóa</span></button>
      </div>
      <button class="rounded-lg p-2 hover:bg-muted text-muted-foreground" aria-label="Bỏ chọn"><i data-lucide="x" class="h-4 w-4"></i></button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // All 10 rows on current page selected
    const students = [
      { name:'Bùi Anh Khoa',    code:'HS-2026-001', cls:'Lớp 10A2', enrolled:'10/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Đặng Thị Bích',   code:'HS-2026-014', cls:'Lớp 10A2', enrolled:'12/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Đỗ Hoàng Long',   code:'HS-2026-022', cls:'Lớp 11B1', enrolled:'05/03/2026', fee:'1.800.000đ', status:'active' },
      { name:'Hoàng Minh Trí',  code:'HS-2026-031', cls:'Lớp 12A1', enrolled:'01/03/2026', fee:'2.000.000đ', status:'pending' },
      { name:'Lê Minh Tuấn',    code:'HS-2026-005', cls:'Lớp 10A2', enrolled:'08/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Lê Thị Phương',   code:'HS-2026-018', cls:'Lớp 10A2', enrolled:'10/03/2026', fee:'1.500.000đ', status:'pending' },
      { name:'Nguyễn Anh Khôi', code:'HS-2026-009', cls:'Lớp 11B2', enrolled:'04/03/2026', fee:'1.800.000đ', status:'active' },
      { name:'Nguyễn Văn An',   code:'HS-2026-012', cls:'Lớp 10A2', enrolled:'15/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Phạm Thị Mai',    code:'HS-2026-014', cls:'Lớp 10A1', enrolled:'02/03/2026', fee:'1.500.000đ', status:'inactive' },
      { name:'Trần Thị Hương',  code:'HS-2026-019', cls:'Lớp 10A2', enrolled:'11/03/2026', fee:'1.500.000đ', status:'active' },
    ];
    const STATUS = { active:{label:'Đang học',cls:'bg-success/10 text-[hsl(var(--success))]'}, pending:{label:'Chờ đóng học phí',cls:'bg-warning/10 text-[hsl(var(--warning))]'}, inactive:{label:'Đã nghỉ',cls:'bg-muted text-muted-foreground'} };
    function av(name){ const i=name.split(' ').slice(-2).map(s=>s[0]).join('').toUpperCase(); let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360; return `<div class="grid h-9 w-9 place-items-center rounded-full text-xs font-semibold text-white" style="background:hsl(${h} 60% 50%)" aria-hidden="true">${i}</div>`; }
    document.getElementById('rows').innerHTML = students.map(s => `
      <tr class="bg-primary/5 hover:bg-primary/10">
        <td class="px-4 py-3"><input type="checkbox" checked aria-label="Chọn ${s.name}" class="h-4 w-4 rounded border-2 border-muted-foreground/30 accent-[hsl(var(--primary))]" /></td>
        <td class="px-4 py-3"><div class="flex items-center gap-3">${av(s.name)}<div><p class="font-medium">${s.name}</p><p class="text-xs text-muted-foreground font-mono">${s.code}</p></div></div></td>
        <td class="px-4 py-3">${s.cls}</td>
        <td class="px-4 py-3 text-muted-foreground">${s.enrolled}</td>
        <td class="px-4 py-3 text-right font-mono tabular-nums">${s.fee}</td>
        <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${STATUS[s.status].cls}">${STATUS[s.status].label}</span></td>
      </tr>
    `).join('');
    lucide.createIcons();
  </script>
</body>
</html>
