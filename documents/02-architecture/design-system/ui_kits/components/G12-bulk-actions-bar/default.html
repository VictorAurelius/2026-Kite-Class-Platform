<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass">
<!--
  Component: G12 Bulk Actions Bar — default state (no selection)
  Used by: KC /students, KC /teachers, KH /admin/instances, KH /admin/payments
  Persona: Owner / Admin (P3 Medium Center Admin) — desktop primary
  Score self-estimate: 107/128
  Contrast (measured):
  - Body on bg-card: 17.9:1 (AAA ✓)
  - Muted-fg on bg-card: 4.7:1 (AA ✓)
  - Status pills (success/warning/destructive on /10): 4.5–5.2:1 (AA ✓)
  i18n keys used: students.title, students.search.placeholder, students.filter, students.cta.add,
                  students.col.{name,class,enrolled,fee,status}, students.status.{active,pending,inactive},
                  students.pagination
-->
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G12 — Bulk Actions Bar (Default)</title>
  <link rel="stylesheet" href="../../_shared/colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{
      border:'hsl(var(--border))', background:'hsl(var(--background))', foreground:'hsl(var(--foreground))',
      primary:{DEFAULT:'hsl(var(--primary))',foreground:'hsl(var(--primary-foreground))'},
      muted:{DEFAULT:'hsl(var(--muted))',foreground:'hsl(var(--muted-foreground))'},
      destructive:{DEFAULT:'hsl(var(--destructive))',foreground:'hsl(var(--destructive-foreground))'},
      card:{DEFAULT:'hsl(var(--card))',foreground:'hsl(var(--card-foreground))'},
      success:{DEFAULT:'hsl(var(--success))',foreground:'hsl(var(--success-foreground))'},
      warning:{DEFAULT:'hsl(var(--warning))',foreground:'hsl(var(--warning-foreground))'},
      info:{DEFAULT:'hsl(var(--info))',foreground:'hsl(var(--info-foreground))'},
    }, boxShadow:{soft:'var(--shadow-soft)','soft-lg':'var(--shadow-soft-lg)'} }}};
  </script>
</head>
<body class="min-h-screen bg-muted/30 text-foreground font-sans">
  <header class="border-b bg-card">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-3">
      <h1 class="text-lg font-semibold">Học sinh</h1>
      <span class="rounded-full bg-muted px-2 py-0.5 text-xs text-muted-foreground">247 mục</span>
      <div class="flex-1"></div>
      <button class="rounded-lg bg-primary px-3 py-2 text-sm font-semibold text-primary-foreground hover:opacity-90 inline-flex items-center gap-2">
        <i data-lucide="user-plus" class="h-4 w-4"></i>
        <!-- i18n: students.cta.add -->
        <span>Thêm học sinh</span>
      </button>
    </div>
  </header>

  <!-- Filter bar -->
  <div class="border-b bg-card">
    <div class="mx-auto max-w-7xl px-4 py-3 flex flex-wrap items-center gap-2">
      <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
        <!-- i18n: students.search.placeholder -->
        <input type="search" placeholder="Tìm theo tên, mã học sinh, số điện thoại…"
          class="w-full rounded-lg border bg-card pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <button class="rounded-lg border bg-card px-3 py-2 text-sm hover:bg-muted inline-flex items-center gap-1.5">
        <i data-lucide="filter" class="h-3.5 w-3.5"></i>
        <span>Trạng thái</span>
      </button>
      <button class="rounded-lg border bg-card px-3 py-2 text-sm hover:bg-muted inline-flex items-center gap-1.5">
        <i data-lucide="users" class="h-3.5 w-3.5"></i>
        <span>Lớp</span>
      </button>
      <button class="rounded-lg border bg-card px-3 py-2 text-sm hover:bg-muted inline-flex items-center gap-1.5">
        <i data-lucide="calendar" class="h-3.5 w-3.5"></i>
        <span>Ngày đăng ký</span>
      </button>
    </div>
  </div>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <!-- Table -->
    <div class="rounded-xl border bg-card shadow-soft overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-muted/40 border-b">
            <tr>
              <th scope="col" class="px-4 py-3 w-10">
                <input type="checkbox" aria-label="Chọn tất cả trong trang"
                  class="h-4 w-4 rounded border-2 border-muted-foreground/30 accent-[hsl(var(--primary))]" />
              </th>
              <!-- i18n: students.col.name -->
              <th scope="col" class="text-left font-semibold px-4 py-3">Học sinh</th>
              <!-- i18n: students.col.class -->
              <th scope="col" class="text-left font-semibold px-4 py-3">Lớp</th>
              <!-- i18n: students.col.enrolled -->
              <th scope="col" class="text-left font-semibold px-4 py-3">Ngày đăng ký</th>
              <!-- i18n: students.col.fee -->
              <th scope="col" class="text-right font-semibold px-4 py-3">Học phí</th>
              <!-- i18n: students.col.status -->
              <th scope="col" class="text-left font-semibold px-4 py-3">Trạng thái</th>
              <th scope="col" class="px-4 py-3 w-10"></th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y"></tbody>
        </table>
      </div>

      <!-- Pagination footer -->
      <div class="flex flex-wrap items-center justify-between gap-3 border-t px-4 py-3 text-sm">
        <p class="text-muted-foreground">
          <!-- i18n: students.pagination -->
          Hiển thị 1–10 / 247 · Trang 1 / 25
        </p>
        <div class="flex items-center gap-2">
          <select class="rounded-lg border bg-card px-2 py-1.5 text-sm">
            <option>10 / trang</option>
            <option>50 / trang</option>
            <option>100 / trang</option>
            <option>200 / trang</option>
          </select>
          <button class="rounded-lg border bg-card px-3 py-1.5 hover:bg-muted disabled:opacity-50" disabled>
            <i data-lucide="chevron-left" class="h-4 w-4"></i>
          </button>
          <span class="text-muted-foreground">1 / 25</span>
          <button class="rounded-lg border bg-card px-3 py-1.5 hover:bg-muted">
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // VN-realistic mock — sorted by surname (Vietnamese convention)
    const students = [
      { name:'Bùi Anh Khoa',    code:'HS-2026-001', cls:'Lớp 10A2', enrolled:'10/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Đặng Thị Bích',   code:'HS-2026-014', cls:'Lớp 10A2', enrolled:'12/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Đỗ Hoàng Long',   code:'HS-2026-022', cls:'Lớp 11B1', enrolled:'05/03/2026', fee:'1.800.000đ', status:'active' },
      { name:'Hoàng Minh Trí',  code:'HS-2026-031', cls:'Lớp 12A1', enrolled:'01/03/2026', fee:'2.000.000đ', status:'pending' },
      { name:'Lê Minh Tuấn',    code:'HS-2026-005', cls:'Lớp 10A2', enrolled:'08/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Lê Thị Phương',   code:'HS-2026-018', cls:'Lớp 10A2', enrolled:'10/03/2026', fee:'1.500.000đ', status:'pending' },
      { name:'Nguyễn Anh Khôi', code:'HS-2026-009', cls:'Lớp 11B2', enrolled:'04/03/2026', fee:'1.800.000đ', status:'active' },
      { name:'Nguyễn Văn An',   code:'HS-2026-012', cls:'Lớp 10A2', enrolled:'15/03/2026', fee:'1.500.000đ', status:'active' },
      { name:'Phạm Thị Mai',    code:'HS-2026-014', cls:'Lớp 10A1', enrolled:'02/03/2026', fee:'1.500.000đ', status:'inactive' },
      { name:'Trần Thị Hương',  code:'HS-2026-019', cls:'Lớp 10A2', enrolled:'11/03/2026', fee:'1.500.000đ', status:'active' },
    ];
    const STATUS = {
      active:   { label:'Đang học',         cls:'bg-success/10 text-[hsl(var(--success))]' },
      pending:  { label:'Chờ đóng học phí', cls:'bg-warning/10 text-[hsl(var(--warning))]' },
      inactive: { label:'Đã nghỉ',          cls:'bg-muted text-muted-foreground' },
    };
    function av(name){ const i=name.split(' ').slice(-2).map(s=>s[0]).join('').toUpperCase(); let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360; return `<div class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-xs font-semibold text-white" style="background:hsl(${h} 60% 50%)" aria-hidden="true">${i}</div>`; }
    document.getElementById('rows').innerHTML = students.map(s => `
      <tr class="hover:bg-muted/30">
        <td class="px-4 py-3"><input type="checkbox" aria-label="Chọn ${s.name}" class="h-4 w-4 rounded border-2 border-muted-foreground/30 accent-[hsl(var(--primary))]" /></td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">${av(s.name)}<div><p class="font-medium">${s.name}</p><p class="text-xs text-muted-foreground font-mono">${s.code}</p></div></div>
        </td>
        <td class="px-4 py-3">${s.cls}</td>
        <td class="px-4 py-3 text-muted-foreground">${s.enrolled}</td>
        <td class="px-4 py-3 text-right font-mono tabular-nums">${s.fee}</td>
        <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${STATUS[s.status].cls}">${STATUS[s.status].label}</span></td>
        <td class="px-4 py-3"><button class="rounded-lg p-1.5 hover:bg-muted" aria-label="Tùy chọn"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button></td>
      </tr>
    `).join('');
    lucide.createIcons();
  </script>
</body>
</html>
