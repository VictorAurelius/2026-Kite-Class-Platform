<!DOCTYPE html>
<html lang="vi" class="theme-kiteclass dark">
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Báo cáo dark — KiteClass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css" />
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-background text-foreground antialiased">

<header class="border-b border-border bg-card sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 lg:px-6 h-14 flex items-center justify-between">
    <a href="../index.html" class="font-bold text-lg text-primary">KiteClass <span class="text-xs muted font-medium px-2 py-0.5 rounded-full border border-border">Giáo viên</span></a>
    <div class="text-sm muted">Cô Trần Thu Hà</div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 lg:px-6 py-4">
  <h1 class="h1 mb-1">Báo cáo chuyên cần</h1>
  <p class="muted body-sm mb-4">Tổng hợp các lớp Cô đang phụ trách · 14/04/2026</p>

  <div class="flex border-b border-border mb-4 gap-1">
    <button class="px-4 py-2 text-sm font-medium border-b-2 border-primary text-foreground">Hôm nay</button>
    <button class="px-4 py-2 text-sm muted hover:text-foreground border-b-2 border-transparent">Tuần này</button>
    <button class="px-4 py-2 text-sm muted hover:text-foreground border-b-2 border-transparent">Tháng này</button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">
    <div class="rounded-2xl border border-border bg-card p-3"><div class="text-xs muted">Tổng học sinh</div><div class="text-2xl font-bold tabular-nums">75</div><div class="text-xs muted">3 lớp</div></div>
    <div class="rounded-2xl border border-border bg-card p-3"><div class="text-xs muted flex items-center gap-1"><span class="att-chip att-p">P</span></div><div class="text-2xl font-bold tabular-nums" style="color: hsl(var(--att-present))">66</div><div class="sparkbar mt-1"><i style="height: 60%"></i><i style="height: 80%"></i><i style="height: 70%"></i><i style="height: 85%"></i><i style="height: 90%"></i><i style="height: 88%"></i></div></div>
    <div class="rounded-2xl border border-border bg-card p-3"><div class="text-xs muted flex items-center gap-1"><span class="att-chip att-v">V</span></div><div class="text-2xl font-bold tabular-nums" style="color: hsl(var(--att-excused))">5</div><div class="sparkbar mt-1"><i style="height: 30%"></i><i style="height: 50%"></i><i style="height: 40%"></i><i style="height: 30%"></i><i style="height: 20%"></i><i style="height: 35%"></i></div></div>
    <div class="rounded-2xl border border-border bg-card p-3"><div class="text-xs muted flex items-center gap-1"><span class="att-chip att-m">M</span></div><div class="text-2xl font-bold tabular-nums" style="color: hsl(var(--att-absent))">3</div><div class="sparkbar mt-1"><i style="height: 40%"></i><i style="height: 30%"></i><i style="height: 50%"></i><i style="height: 25%"></i><i style="height: 35%"></i><i style="height: 30%"></i></div></div>
    <div class="rounded-2xl border border-border bg-card p-3"><div class="text-xs muted flex items-center gap-1"><span class="att-chip att-l">L</span></div><div class="text-2xl font-bold tabular-nums" style="color: hsl(var(--att-late))">1</div><div class="sparkbar mt-1"><i style="height: 20%"></i><i style="height: 30%"></i><i style="height: 25%"></i><i style="height: 15%"></i><i style="height: 25%"></i><i style="height: 18%"></i></div></div>
    <div class="rounded-2xl border-2 border-primary/30 bg-primary/5 p-3"><div class="text-xs text-primary font-medium">Chuyên cần</div><div class="text-2xl font-bold tabular-nums text-primary">88<span class="text-base">%</span></div><div class="text-xs" style="color: hsl(var(--att-present))">↑ 2.3%</div></div>
  </div>

  <div class="rounded-2xl border border-border bg-card overflow-hidden shadow-soft">
    <table class="w-full text-sm">
      <thead class="border-b border-border text-left bg-muted/40">
        <tr>
          <th class="px-4 py-2">Lớp</th>
          <th class="px-3 py-2 text-center">Sĩ số</th>
          <th class="px-3 py-2 text-center">Tỷ lệ</th>
          <th class="px-3 py-2 text-right"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-border">
        <tr><td class="px-4 py-3"><div class="font-medium">Lớp 10A2 - Toán NC</div><div class="text-xs muted">GVCN</div></td><td class="px-3 py-3 text-center tabular-nums">25</td><td class="px-3 py-3 text-center tabular-nums font-semibold">88%</td><td class="px-3 py-3 text-right"><a href="reports-detail-class.html" class="text-primary hover:underline text-xs">Chi tiết →</a></td></tr>
        <tr><td class="px-4 py-3"><div class="font-medium">Lớp 10A1 - Toán</div></td><td class="px-3 py-3 text-center tabular-nums">28</td><td class="px-3 py-3 text-center tabular-nums font-semibold">93%</td><td class="px-3 py-3 text-right"><a href="#" class="text-primary hover:underline text-xs">Chi tiết →</a></td></tr>
        <tr><td class="px-4 py-3"><div class="font-medium">Lớp 11B1 - Văn</div></td><td class="px-3 py-3 text-center tabular-nums">22</td><td class="px-3 py-3 text-center tabular-nums font-semibold" style="color: hsl(var(--att-late))">82%</td><td class="px-3 py-3 text-right"><a href="#" class="text-primary hover:underline text-xs">Chi tiết →</a></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
  <link rel="stylesheet" href="../../_shared/scripts/tenant-theme-demo.css" />
  <script src="../../_shared/scripts/tenant-theme-demo.js" defer></script>
</body>
</html>
