<!doctype html>
<html lang="vi">
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiteHub UI kit</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [view, setView] = useState(() => localStorage.getItem('kh-view') || 'marketing');
  useEffect(() => { localStorage.setItem('kh-view', view); }, [view]);
  useEffect(() => { window.lucide && lucide.createIcons(); });

  return (
    <>
      <div className="kh-tabs" data-screen-label="00 Switcher">
        <button className={view==='marketing'?'is-active':''} onClick={()=>setView('marketing')}>Landing</button>
        <button className={view==='app'?'is-active':''} onClick={()=>setView('app')}>Dashboard</button>
      </div>
      {view === 'marketing' ? (
        <div data-screen-label="01 Marketing landing">
          <MarketingHeader />
          <Hero />
          <Features />
          <Pricing />
          <FAQ />
          <Footer />
        </div>
      ) : (
        <div data-screen-label="02 Customer dashboard">
          <CustomerDashboard />
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
