<!DOCTYPE html>
<html lang="vi" class="theme-kitehub">
<!--
  Persona: P2 Center Owner — billing loading
  Score self-estimate: 108/128
  Contrast: skeleton on bg-card 4.7:1 AA ✓
  GAP-429 fix: preserved billing summary card (plan + balance from cache) during fetch + explicit loading hints per section.
-->
<head>
<link rel="icon" type="image/svg+xml" href="../../_shared/assets/favicon.svg">
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiteHub · Hóa đơn (đang tải)</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body aria-busy="true">
  <nav class="state-tabs">
    <a href="billing-default.html">Default</a>
    <a href="billing-loading.html" data-active="true">Loading</a>
    <a href="billing-empty.html">Empty</a>
    <a href="billing-payment.html">Payment</a>
    <a href="billing-dark.html">Dark</a>
  </nav>
  <div class="shell">
    <aside class="shell__nav stack-4">
      <div class="flex items-center gap-2 mb-4">
        <span class="gradient-text" style="font-size: var(--text-xl);">KiteHub</span>
      </div>
      <span class="skeleton" style="height: 32px; width: 80%;"></span>
      <span class="skeleton" style="height: 32px; width: 70%;"></span>
      <span class="skeleton" style="height: 32px; width: 75%;"></span>
    </aside>
    <main class="shell__main stack-6">
      <h1 style="font-size: var(--text-2xl); font-weight: 700;">Hóa đơn &amp; thanh toán</h1>

      <!-- GAP-429: billing summary card PRESERVED during fetch (plan + balance known from cache) -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 card-base stack-2" style="padding: 1.25rem;">
          <div class="flex items-center justify-between">
            <span class="text-sm muted-strong">Gói hiện tại</span>
            <span class="tag tag--accent" style="font-size: 10px;">PRO</span>
          </div>
          <div style="font-size: var(--text-xl); font-weight: 700;">Gói Pro · 1.500.000đ/tháng</div>
          <div class="text-sm muted-strong flex items-center gap-2">
            <i data-lucide="calendar" class="w-4 h-4"></i>Gia hạn tiếp theo: 15/05/2026
          </div>
        </div>
        <div class="card-base stack-2" style="padding: 1.25rem;">
          <span class="text-sm muted-strong">Số dư khả dụng</span>
          <div style="font-size: var(--text-xl); font-weight: 700; color: hsl(var(--accent));">2.350.000đ</div>
          <span class="text-xs muted-strong">Cập nhật lần cuối · cache</span>
        </div>
      </div>

      <!-- GAP-429: only the deferred section (invoice history) shows skeleton + explicit hint -->
      <div class="card-base stack-3" style="padding: 1.25rem;" aria-busy="true">
        <div class="flex items-center gap-2">
          <i data-lucide="loader" class="w-4 h-4 muted-strong" style="animation: pulse 1.5s ease-in-out infinite;"></i>
          <span class="text-sm font-medium">Đang tải lịch sử hóa đơn...</span>
        </div>
        <span class="skeleton" style="height: 40px; width: 100%;"></span>
        <span class="skeleton" style="height: 40px; width: 100%;"></span>
        <span class="skeleton" style="height: 40px; width: 100%;"></span>
        <span class="skeleton" style="height: 40px; width: 100%;"></span>
        <span class="skeleton" style="height: 40px; width: 100%;"></span>
      </div>
      <p class="text-xs muted-strong text-center" role="status" aria-live="polite">Số dư &amp; gói cước hiển thị từ cache · lịch sử hóa đơn đang tải mới...</p>
    </main>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
