# Dependabot configuration — ONE PR PER SERVICE per week.
#
# Each ecosystem bundles ALL **patch** version updates into a single group
# PR. Max 6 PRs total per Monday run (1 per ecosystem × 6).
#
# Pre-MVP dependency lock (2026-04-30): minor bumps blocked until MVP soft
# launch ready. See GAP-283. Patch + security still flow through.
#
# History:
# - 2026-04-21: first enable flooded 28 PRs in 3 min — reverted to security-only.
# - 2026-04-24 (pilot): kiteclass-core maven with 5 groups — produced 5 PRs,
#   merged green.
# - 2026-04-24 (expand): all 6 ecosystems with 4-5 groups each — produced
#   28 PRs because many deps fell outside the named groups (lombok, springdoc,
#   jacoco, tika, aws-sdk for kitehub, etc.) and got individual PRs.
# - 2026-04-24 (simplify): collapse each ecosystem to a single `all-deps`
#   group matching `*`. One PR per service, max 6 total.
# - 2026-04-30 (pre-MVP lock): dropped `minor` from `update-types`. Patch-only
#   weekly bumps. Triggered by 4 simultaneous failures (PR #715/#716/#717/#718)
#   surfacing real breakage from minor bumps (AWS SDK 2.44 KH Admin breaking,
#   typescript-eslint Lint regression, Frontend Tests & Build via Next.js RSC).
#   Restore minor bumps after MVP launch via dedicated triage wave.
#
# Trade-off of 1-PR-per-service: atomic blast radius. If one dep in the bundle
# breaks CI, the whole PR blocks. Solo-dev mode accepts this cost for the
# noise reduction.
#
# Escape hatch: if a specific dep needs isolation, add a named group BEFORE
# `all-deps` — Dependabot matches the first group that fits.
#
# Related:
# - Plan: documents/03-planning/plans/plan-dependabot-rollout-2026-04.md
# - Memory: feedback_dependabot_first_run.md (3-stage enable policy)
# - Memory: feedback_nextjs_rsc_array_regression.md (why `next` is pinned)
version: 2

updates:
  # ==========================================================================
  # MAVEN — 3 projects
  # ==========================================================================

  - package-ecosystem: maven
    directory: "/kitehub"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - kitehub
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        # Pre-MVP lock 2026-04-30: patch-only (blocks minor bumps).
        # See GAP-283 — revisit after MVP soft launch ready (~4-6 weeks).
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # GAP-213: Spring Cloud 2025.1.x removed `spring-cloud-starter-gateway`
      # (renamed to `spring-cloud-starter-gateway-server-webflux`). Staying on
      # 2025.0.x until the rename migration ships as a dedicated PR.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-core"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        # Pre-MVP lock 2026-04-30: patch-only (blocks minor bumps).
        # See GAP-283 — revisit after MVP soft launch ready (~4-6 weeks).
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # ognl pinned to 3.3.x for Thymeleaf 3.1.x compatibility. Bumping to 3.4.x
      # breaks PdfGenerator with NoSuchMethodError on OgnlContext constructor
      # (different signature). Closed PR #572 reproduced this. Memory:
      # feedback_thymeleaf_ognl_pin.md.
      - dependency-name: "ognl:ognl"
        versions: [">=3.4.0"]

