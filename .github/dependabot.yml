      - frontend
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        # Pre-MVP lock 2026-04-30: patch-only (blocks minor bumps).
        # See GAP-283 — revisit after MVP soft launch ready (~4-6 weeks).
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"

  # ==========================================================================
  # GITHUB ACTIONS — all workflows
  # ==========================================================================

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # GitHub-actions ecosystem ALLOWS major bumps (unlike Maven/npm) because:
      #   1) actions/* are first-party GitHub repos with extensive backwards-compat
      #      testing — major bumps tend to be runtime updates (Node 20 → Node 24)
      #      not breaking API changes.
      #   2) Surface area is small (~5–10 actions); a single failed bump is easy
      #      to revert.
      #   3) GitHub Actions runners DEPRECATE old Node versions on a hard schedule
      #      (e.g., Node 20 → 24 by 2026-09-16). Without major bumps, our workflows
      #      will trigger CI annotation warnings until manual intervention.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  # ==========================================================================
  # DOCKER — base image patch bumps (Wave 86 E P0 — per pre-launch-dependency-hardening-checklist.md §2.7)
  # ==========================================================================
  # Wave 86 PR #1445 Cat 1 sweep surfaced docker ecosystem missing — base images
  # not monitored cho CVE/security patches. Pre-launch Cat 1 dep-hardening rubric
  # §2.7 mandates docker coverage. Each service dir below contains a `Dockerfile`
  # that Dependabot will scan for FROM directive updates.
  #
  # Patch-only update-types per pre-MVP lock policy (consistent với maven/npm).
  # Major base-image bumps (eclipse-temurin:21 → :25) defer to dedicated triage
  # wave post-launch.
  #
  # 11 Dockerfile total — 9 service-dir + 2 frontend dev variant (kiteclass-frontend
  # has both Dockerfile + Dockerfile.dev; Dependabot scans both via same directory).

  - package-ecosystem: docker
    directory: "/kiteclass/kiteclass-core"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-base-images:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Wave 91 closure (2026-05-18): Java 26 preview not aligned with Spring Boot
      # 3.x stable (max Java 23). Pin maven base ≤ Java 17 LTS until Java 25 LTS
      # ships + Spring certifies support. Revisit Q3 2026.
      - dependency-name: "maven"
        versions: ["3.9-eclipse-temurin-1[89]-*", "3.9-eclipse-temurin-2[0-9]-*"]

  - package-ecosystem: docker
    directory: "/kiteclass/kiteclass-frontend"
