# Dependabot configuration — all ecosystems on version-update mode.
#
# History:
# - 2026-04-21: first enable flooded 28 PRs in 3 min (see
#   documents/04-quality/analyses/2026-04-21-dependabot-first-run-incident.md)
#   → reverted to security-only.
# - 2026-04-24 (morning): pilot enabled for kiteclass-core with grouping +
#   semver-major ignore. Monday-equivalent run produced exactly 5 grouped PRs
#   (spring-boot, apache-commons, aws-sdk, document-generation, testing),
#   all merged green within an hour. Pilot acceptance criteria met.
# - 2026-04-24 (afternoon): expansion to ALL 6 ecosystems. Each ecosystem
#   inherits the pilot pattern (grouped + semver-major ignore + weekly).
#
# Related:
# - GAP-202 (/repo-status skill security checks)
# - GAP-203 (pom.xml CVE fixes — original Dependabot driver)
# - Memory: feedback_dependabot_first_run.md (3-stage enable policy)
# - Memory: feedback_nextjs_rsc_array_regression.md (why `next` is pinned)
# - Memory: feedback_dependabot_pnpm_transitive.md (pnpm transitive caveat)
version: 2

updates:
  # ==========================================================================
  # MAVEN — 3 projects
  # ==========================================================================

  - package-ecosystem: maven
    directory: "/kitehub"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kitehub
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework:*"
          - "org.springframework.security:*"
      apache-commons:
        patterns:
          - "commons-*"
          - "org.apache.commons:*"
      testing:
        patterns:
          - "org.testcontainers:*"
          - "org.junit.jupiter:*"
          - "org.assertj:*"
          - "org.mockito*"
          - "io.github.resilience4j:*"
          - "org.springframework.security:spring-security-test"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-core"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework:*"
          - "org.springframework.security:*"
      apache-commons:
        patterns:
          - "commons-*"
          - "org.apache.commons:*"
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      document-generation:
        patterns:
          - "com.openhtmltopdf:*"
          - "org.apache.poi:*"
          - "ognl:*"
      testing:
        patterns:
          - "org.testcontainers:*"
          - "org.junit.jupiter:*"
          - "org.assertj:*"
          - "org.mockito*"
          - "io.github.resilience4j:*"
          - "org.springframework.security:spring-security-test"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-gateway"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework:*"
          - "org.springframework.security:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.jupiter:*"
          - "org.assertj:*"
          - "org.mockito*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ==========================================================================
  # NPM — 2 frontends
  # ==========================================================================

  - package-ecosystem: npm
    directory: "/kitehub/kitehub-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - frontend
      - kitehub
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      next-ecosystem:
        patterns:
          - "next-*"
          - "@next/*"
          - "@vercel/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-*"
          - "@react-*"
          - "@types/react*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"
          - "msw"
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "prettier-*"
          - "typescript"
          - "@types/*"
          - "tailwindcss"
          - "tailwindcss-*"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss"
          - "postcss-*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Next.js pinned at 15.1.x — 15.1.7+ breaks JsonLd prerender due to
      # Array.prototype.toJSON regression. See memory
      # `feedback_nextjs_rsc_array_regression.md` + GAP-204.
      - dependency-name: "next"

  - package-ecosystem: npm
    directory: "/kiteclass/kiteclass-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - frontend
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      next-ecosystem:
        patterns:
          - "next-*"
          - "@next/*"
          - "@vercel/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-*"
          - "@react-*"
          - "@types/react*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"
          - "msw"
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "prettier-*"
          - "typescript"
          - "@types/*"
          - "tailwindcss"
          - "tailwindcss-*"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss"
          - "postcss-*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"

  # ==========================================================================
  # GITHUB ACTIONS — all workflows
  # ==========================================================================

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
