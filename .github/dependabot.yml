# Dependabot configuration — security-only mode
#
# Scope: CVE detection + auto-PR for security advisories only.
# Version updates are DISABLED (see case study below).
#
# Rationale: first-run enable with version updates opened 28 PRs in 3 minutes
# (see documents/04-quality/analyses/2026-04-21-dependabot-first-run-incident.md).
# Team does not yet have capacity for weekly dep review. Re-enable version
# updates only after filing a gap + adjusting config with catch-all groups.
#
# Related:
# - GAP-202 (/repo-status skill security checks)
# - GAP-203 (pom.xml CVE fixes — original reason to enable Dependabot)
# - .claude/rules/output-review-mandate.md (health-check standards)
version: 2

updates:
  # Security-only mode: version-update PRs suppressed via limit: 0.
  # Dependabot alerts (security advisories) still flow — they are independent
  # of version-update PRs and enabled via repo Settings → Code security.
  #
  # Each ecosystem below declares coverage so Dependabot scans it on schedule,
  # but produces no PRs for non-security updates.

  - package-ecosystem: maven
    directory: "/kitehub"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0  # version updates disabled; security PRs unaffected
    labels:
      - dependencies
      - security
      - kitehub

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - kiteclass

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-gateway"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - kiteclass

  - package-ecosystem: npm
    directory: "/kitehub/kitehub-frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - frontend

  - package-ecosystem: npm
    directory: "/kiteclass/kiteclass-frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - frontend

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
      - ci
