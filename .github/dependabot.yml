# Dependabot configuration — ONE PR PER SERVICE per week.
#
# Each ecosystem bundles ALL minor+patch version updates into a single group
# PR. Max 6 PRs total per Monday run (1 per ecosystem × 6).
#
# History:
# - 2026-04-21: first enable flooded 28 PRs in 3 min — reverted to security-only.
# - 2026-04-24 (pilot): kiteclass-core maven with 5 groups — produced 5 PRs,
#   merged green.
# - 2026-04-24 (expand): all 6 ecosystems with 4-5 groups each — produced
#   28 PRs because many deps fell outside the named groups (lombok, springdoc,
#   jacoco, tika, aws-sdk for kitehub, etc.) and got individual PRs.
# - 2026-04-24 (simplify): **this config** — collapse each ecosystem to a
#   single `all-deps` group matching `*`. One PR per service, max 6 total.
#
# Trade-off of 1-PR-per-service: atomic blast radius. If one dep in the bundle
# breaks CI, the whole PR blocks. Solo-dev mode accepts this cost for the
# noise reduction.
#
# Escape hatch: if a specific dep needs isolation, add a named group BEFORE
# `all-deps` — Dependabot matches the first group that fits.
#
# Related:
# - Plan: documents/03-planning/plans/plan-dependabot-rollout-2026-04.md
# - Memory: feedback_dependabot_first_run.md (3-stage enable policy)
# - Memory: feedback_nextjs_rsc_array_regression.md (why `next` is pinned)
version: 2

updates:
  # ==========================================================================
  # MAVEN — 3 projects
  # ==========================================================================

  - package-ecosystem: maven
    directory: "/kitehub"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - kitehub
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # GAP-213: Spring Cloud 2025.1.x removed `spring-cloud-starter-gateway`
      # (renamed to `spring-cloud-starter-gateway-server-webflux`). Staying on
      # 2025.0.x until the rename migration ships as a dedicated PR.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-core"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: maven
    directory: "/kiteclass/kiteclass-gateway"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # GAP-213: same as /kitehub — Spring Cloud 2025.1.x removed the old
      # `spring-cloud-starter-gateway` artifact. Pin BOM to 2025.0.x until
      # migration PR lands.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"

  # ==========================================================================
  # NPM — 2 frontends
  # ==========================================================================

  - package-ecosystem: npm
    directory: "/kitehub/kitehub-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - frontend
      - kitehub
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Next.js pinned at 15.1.x — 15.1.7+ breaks JsonLd prerender
      # (Array.prototype.toJSON regression). See memory
      # `feedback_nextjs_rsc_array_regression.md` + GAP-204.
      - dependency-name: "next"

  - package-ecosystem: npm
    directory: "/kiteclass/kiteclass-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - frontend
      - kiteclass
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"

  # ==========================================================================
  # GITHUB ACTIONS — all workflows
  # ==========================================================================

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # GitHub-actions ecosystem ALLOWS major bumps (unlike Maven/npm) because:
      #   1) actions/* are first-party GitHub repos with extensive backwards-compat
      #      testing — major bumps tend to be runtime updates (Node 20 → Node 24)
      #      not breaking API changes.
      #   2) Surface area is small (~5–10 actions); a single failed bump is easy
      #      to revert.
      #   3) GitHub Actions runners DEPRECATE old Node versions on a hard schedule
      #      (e.g., Node 20 → 24 by 2026-09-16). Without major bumps, our workflows
      #      will trigger CI annotation warnings until manual intervention.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
