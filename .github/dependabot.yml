        # See GAP-283 — revisit after MVP soft launch ready (~4-6 weeks).
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Next.js pinned at 15.1.x — 15.1.7+ breaks JsonLd prerender
      # (Array.prototype.toJSON regression). See memory
      # `feedback_nextjs_rsc_array_regression.md` + GAP-204.
      - dependency-name: "next"

  - package-ecosystem: npm
    directory: "/kiteclass/kiteclass-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    labels:
