name: Test — Core Service (KiteClass)

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save
  # resources. PR CI below is sufficient since PR branch = merge candidate.
  # Re-enable push:main when team grows or branch-protection requires it.
  pull_request:
    branches:
      - main
    paths:
      - 'kiteclass/kiteclass-core/**'
      - '.github/workflows/core-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  security-events: write

jobs:
  test:
    name: Test Core Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-core-${{ hashFiles('kiteclass/kiteclass-core/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-core-

      - name: Make Maven wrapper executable
        working-directory: kiteclass/kiteclass-core
        run: chmod +x mvnw

      - name: Build Core Service (strict-warnings profile — GAP-245 Phase 1)
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw clean compile -DskipTests -P strict-warnings

      - name: Run All Tests (Testcontainers, strict-warnings profile)
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw test -P strict-warnings
        # Testcontainers will automatically start PostgreSQL + Redis in Docker
        # strict-warnings: surfaces deprecation/unchecked/rawtypes/cast/overrides
        # in compile output. Phase 1 = show only; Phase 2 (GAP-261) flips to -Werror.

      - name: Generate Test Coverage Report
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw jacoco:report

      - name: Upload OpenAPI Spec Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kiteclass-core-openapi-spec
          path: kiteclass/kiteclass-core/target/openapi-export/openapi.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kiteclass/kiteclass-core/target/surefire-reports/*.xml
          check_name: Core Service Test Results

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        continue-on-error: true
        with:
          files: kiteclass/kiteclass-core/target/site/jacoco/jacoco.xml
          flags: core-service
          name: core-coverage

      - name: Comment Test Summary on PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const testResults = 'Test results available in checks tab';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Core Service CI Results\n\n${testResults}\n\n✅ All tests passed!`
            });

  build:
    name: Build Core Service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        working-directory: kiteclass/kiteclass-core
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-service-jar
          path: kiteclass/kiteclass-core/target/*.jar
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GAP-870: pre-populate Maven cache so Trivy fs scan reads from ~/.m2
      # offline instead of fetching transitive POMs from Maven Central. Without
      # this, Trivy fs hits Maven Central rate-limit (429 Too Many Requests,
      # Retry-After: 1800), blocking Security Scan transient. Per Trivy error
      # hint: "populate the local Maven cache before scanning (e.g. run
      # `mvn dependency:resolve` and cache ~/.m2 in CI)".
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-core-${{ hashFiles('kiteclass/kiteclass-core/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-core-

      - name: Make Maven wrapper executable
        working-directory: kiteclass/kiteclass-core
        run: chmod +x mvnw

      - name: Pre-populate Maven cache (GAP-870 — Trivy fs scan offline)
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw dependency:resolve dependency:resolve-plugins -q

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'kiteclass/kiteclass-core'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Make Maven wrapper executable
        working-directory: kiteclass/kiteclass-core
        run: chmod +x mvnw

      - name: Run SonarQube Analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: kiteclass/kiteclass-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=VictorAurelius_2026-Kite-Class-Platform \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=victoraurelius
        continue-on-error: true  # Don't block CI if SonarCloud has issues
