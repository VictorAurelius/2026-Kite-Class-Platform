name: Core Service CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'review/**'
    paths:
      - 'kiteclass/kiteclass-core/**'
      - '.github/workflows/core-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'kiteclass/kiteclass-core/**'
      - '.github/workflows/core-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  test:
    name: Test Core Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kiteclass_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-core-${{ hashFiles('kiteclass/kiteclass-core/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-core-

      - name: Build Core Service
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw clean compile -DskipTests

      - name: Run Unit Tests
        working-directory: kiteclass/kiteclass-core
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kiteclass_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: ./mvnw test

      - name: Run Security Tests
        working-directory: kiteclass/kiteclass-core
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kiteclass_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: ./mvnw test -Dtest="*SecurityTest,*MultiTenantTest"

      - name: Generate Test Coverage Report
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw jacoco:report

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kiteclass/kiteclass-core/target/surefire-reports/*.xml
          check_name: Core Service Test Results

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: kiteclass/kiteclass-core/target/site/jacoco/jacoco.xml
          flags: core-service
          name: core-coverage

      - name: Comment Test Summary on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const testResults = 'Test results available in checks tab';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Core Service CI Results\n\n${testResults}\n\n✅ All tests passed!`
            });

  build:
    name: Build Core Service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        working-directory: kiteclass/kiteclass-core
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v3
        with:
          name: core-service-jar
          path: kiteclass/kiteclass-core/target/*.jar
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'kiteclass/kiteclass-core'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: kiteclass/kiteclass-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=kiteclass-core \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=kiteclass
        continue-on-error: true
