name: Frontend CI

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  pull_request:
    branches:
      - main
    paths:
      - 'kiteclass/kiteclass-frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: kiteclass/kiteclass-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check || true
        continue-on-error: true

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --run

      - name: Build application
        run: pnpm build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: kiteclass/kiteclass-frontend/.next
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-test
    if: false  # Disabled - E2E tests require full stack (Gateway + Core + DB)

    defaults:
      run:
        working-directory: kiteclass/kiteclass-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e || true
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kiteclass/kiteclass-frontend/playwright-report/
          retention-days: 7
