name: Test — KiteClass Frontend

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  pull_request:
    branches:
      - main
    paths:
      - 'kiteclass/kiteclass-frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: kiteclass/kiteclass-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        # Wave rst-cleanup 2026-05-27: was `pnpm type-check || true` + continue-on-error
        # (both safeguards) — emitted 6 silent annotations on every PR since Wave 105
        # contract sync (GAP-759 User.roles → role drift). Now blocking gate so test
        # fixtures stay in sync with production type contracts. See PR #1891 / #1893.
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --run

      - name: Build application
        run: pnpm build

      - name: Run bundle budget unit tests
        run: pnpm test:budget

      - name: Check bundle budget (First Load JS per route)
        run: pnpm check:budget

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: kiteclass/kiteclass-frontend/.next
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    name: E2E Tests (Playwright — class-lifecycle gate, route-mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-test
    # GAP-454 Phase B Option C.2 — direct-navigation route-mocked gate.
    # Runs ONLY e2e/critical-journeys/class-lifecycle.spec.ts (6 tests, ~17s local).
    # navigateToClassDetail() refactored to page.goto('/classes/1') directly,
    # bypassing flaky Shadcn <Select> + row-action UI chain that 4/6 failed under
    # original listing-flow helper (per GAP-454 §Problem). Full E2E with backend
    # stack still local-only via `pnpm test:e2e`.
    if: true

    defaults:
      run:
        working-directory: kiteclass/kiteclass-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E gate tests (route-mocked class-lifecycle only)
        run: pnpm test:e2e:gates

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kiteclass/kiteclass-frontend/playwright-report/
          retention-days: 7
