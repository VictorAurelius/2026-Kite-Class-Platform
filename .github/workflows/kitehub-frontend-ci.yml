name: KiteHub Frontend CI/CD

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  pull_request:
    branches:
      - main
    paths:
      - 'kitehub/kitehub-frontend/**'
      - '.github/workflows/kitehub-frontend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: kitehub/kitehub-frontend/coverage/
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run bundle budget unit tests
        run: pnpm test:budget

      - name: Check bundle budget (First Load JS per route)
        run: pnpm check:budget

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: |
            kitehub/kitehub-frontend/.next/
            !kitehub/kitehub-frontend/.next/cache
          retention-days: 7

  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          # Repo-root context (per ADR-024 pnpm workspace / GAP-284)
          context: .
          file: ./kitehub/kitehub-frontend/Dockerfile
          push: false
          tags: kitehub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/kitehub-frontend.tar

      - name: Load Docker image
        run: docker load --input /tmp/kitehub-frontend.tar

      - name: Verify image size
        run: |
          IMAGE_SIZE=$(docker image inspect kitehub-frontend:${{ github.sha }} --format='{{.Size}}' | awk '{print $1/1024/1024}')
          echo "Image size: ${IMAGE_SIZE} MB"
          # 220MB limit — raised from 200MB 2026-04-24 after next.js 15.5.15 + axios
          # + vite bumps pushed standalone image to ~206MB. Headroom for future patches.
          # Revisit if image grows past 230MB (then optimize via multi-stage + prune).
          if (( $(echo "$IMAGE_SIZE > 220" | bc -l) )); then
            echo "❌ Image size exceeds 220MB limit"
            exit 1
          fi
          echo "✅ Image size within limits"

      - name: Test container startup
        run: |
          docker run -d --name kitehub-test -p 3001:3001 \
            -e NEXT_PUBLIC_API_URL=http://localhost:9000 \
            kitehub-frontend:${{ github.sha }}

          # Wait for container to be healthy
          timeout 30s bash -c 'until docker exec kitehub-test node -e "require(\"http\").get(\"http://localhost:3001/api/health\", (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"; do sleep 2; done'

          echo "✅ Container started successfully"
          docker logs kitehub-test
          docker stop kitehub-test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # E2E tests should be run locally only to save CI time
    # Run manually with: cd kitehub/kitehub-frontend && pnpm test:e2e:ci
    if: false

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e:ci
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:9000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kitehub/kitehub-frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: kitehub/kitehub-frontend/test-results/
          retention-days: 7
