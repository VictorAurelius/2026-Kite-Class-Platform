name: Test — KiteHub Frontend

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  # Workflow re-run trigger 2026-05-05 — bump to re-validate kitehub-frontend CI pipeline.
  pull_request:
    branches:
      - main
    paths:
      - 'kitehub/kitehub-frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/kitehub-frontend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: kitehub/kitehub-frontend/coverage/
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run bundle budget unit tests
        run: pnpm test:budget

      - name: Check bundle budget (First Load JS per route)
        run: pnpm check:budget

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: |
            kitehub/kitehub-frontend/.next/
            !kitehub/kitehub-frontend/.next/cache
          retention-days: 7

  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          # Repo-root context (per ADR-024 pnpm workspace / GAP-284)
          context: .
          file: ./kitehub/kitehub-frontend/Dockerfile
          push: false
          tags: kitehub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/kitehub-frontend.tar

      - name: Load Docker image
        run: docker load --input /tmp/kitehub-frontend.tar

      - name: Verify image size
        run: |
          IMAGE_SIZE=$(docker image inspect kitehub-frontend:${{ github.sha }} --format='{{.Size}}' | awk '{print $1/1024/1024}')
          echo "Image size: ${IMAGE_SIZE} MB"
          # 320MB limit — raised from 220MB 2026-05-08 (Wave 46 Bucket C):
          # Node base bumped node:20-alpine → node:22-trixie-slim to clear CVE-2026-33845
          # (gnutls in alpine 3.23) + 11 npm-in-base CVE. Debian adds ~60MB; revisit at 340MB.
          if (( $(echo "$IMAGE_SIZE > 320" | bc -l) )); then
            echo "❌ Image size exceeds 320MB limit"
            exit 1
          fi
          echo "✅ Image size within limits"

      - name: Test container startup
        run: |
          docker run -d --name kitehub-test -p 3001:3001 \
            -e NEXT_PUBLIC_API_URL=http://localhost:9000 \
            kitehub-frontend:${{ github.sha }}

          # Wait for container to be healthy
          timeout 30s bash -c 'until docker exec kitehub-test node -e "require(\"http\").get(\"http://localhost:3001/api/health\", (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"; do sleep 2; done'

          echo "✅ Container started successfully"
          docker logs kitehub-test
          docker stop kitehub-test

  e2e:
    name: E2E Tests (Playwright — beta-funnel gate, route-mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # GAP-453 Phase B Option B.2 — narrow-subset gate
    # Runs ONLY route-mocked beta-funnel/ subset (5 tests, ~9s local).
    # Full E2E with backend stack still local-only via `pnpm test:e2e:ci`.
    if: true

    defaults:
      run:
        working-directory: kitehub/kitehub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E gate tests (route-mocked beta-funnel only)
        run: pnpm test:e2e:gates:ci
        env:
          CI: true
          # NEXT_PUBLIC_API_URL kept for parity với manual full-stack run; route-mocked
          # tests don't actually call out to backend — page.route intercepts all /api calls.
          NEXT_PUBLIC_API_URL: http://localhost:9000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kitehub/kitehub-frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: kitehub/kitehub-frontend/test-results/
          retention-days: 7
