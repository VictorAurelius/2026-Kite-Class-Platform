name: actionlint

# Static lint for GitHub Actions workflows.
# Catches: YAML syntax errors, step input type errors, secret/var refs to
# undefined names, expression syntax bugs, shell script issues in run: blocks.
#
# Per .claude/rules/release-fix-retry-budget.md §7.5 — local self-test
# infrastructure (Tier 1 of preflight). Runs on every PR touching workflows.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download actionlint binary
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint --version
      - name: Run actionlint on .github/workflows/**
        run: ./actionlint -color
        # Pinned actionlint binary version emitted on prior step.
        # Avoids raven-actions/actionlint@v2 npm install issue with our
        # pnpm workspace (workspace:* refs in package.json confuse npm).
