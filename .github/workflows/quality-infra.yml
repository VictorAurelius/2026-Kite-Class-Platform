name: Quality — Infra (Alert runbook URL + Helm lint)

# Split from script-quality.yml 21-job bloated workflow (2026-05-22)
# Domain: infrastructure-touching jobs (Prometheus alert annotations + Helm chart lint)
# Sister workflows:
#   - quality-code.yml          — Bash / Python / Java + cross-layer + Mermaid
#   - quality-docs.yml          — Documents / gaps / audits / waves / READMEs
#   - quality-rules-skills.yml  — Rules / skills / Env vars / Meta CSV indexes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/quality-infra.yml'
      - 'infrastructure/helm/**'
      - 'scripts/check-helm-lint.sh'
      - '**/alert-rules.yml'
      - '**/prometheusrule.yaml'
      - 'scripts/check-alert-runbook-url.py'
      - 'scripts/fixtures/alert-runbook-url/**'
      - 'infrastructure/terraform-aws/ecr.tf'
      - '.github/workflows/docker-build-push.yml'
      - 'scripts/check-ecr-lifecycle-coverage.sh'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  alert-runbook-url:
    name: Alert runbook_url (Prometheus alert annotations)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run self-test (4 fixtures — 2 PASS / 2 FAIL incl. Helm-templated)
        run: |
          # Self-test asserts script behavior on synthetic fixtures
          # (good-with-runbook, good-helm-template → PASS;
          #  bad-missing-runbook, bad-empty-runbook → FAIL).
          # Fails fast if regex/scan logic regresses.
          python3 scripts/check-alert-runbook-url.py --self-test

      - name: Validate alert runbook_url annotations (blocking on FAIL)
        run: |
          # Default mode scans:
          #   - kitehub/docker/prometheus/alert-rules.yml
          #   - kiteclass/docker/prometheus/alert-rules.yml
          #   - infrastructure/helm/kitehub/templates/prometheusrule.yaml
          # Workflow paths filter already restricts this job to PRs touching
          # alert YAML files or the validator — no need to re-filter changed files.
          python3 scripts/check-alert-runbook-url.py


  helm-lint:
    name: Helm lint (`infrastructure/helm/kitehub`)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Run helm lint + template (blocking on FAIL)
        env:
          CI: 'true'
        run: |
          # Closes GAP-467 AC #5 — CI guard against Go-templates-in-values.yaml
          # regression. Wave 57 chữa root cause (extract → templates/alertmanager-config.yaml);
          # this job ensures `helm lint` + `helm template` stay clean on main.
          # Workflow paths filter restricts this job to PRs touching
          # infrastructure/helm/** or the validator script.
          bash scripts/check-helm-lint.sh


  promtool-check-rules:
    name: promtool check rules (PrometheusRule syntax + GAP-217 AC #3)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm (template render trước khi promtool check)
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Install promtool (Prometheus CLI)
        run: |
          # Self-hosted runner doesn't have NOPASSWD sudo — install to user-writable dir
          # and prepend to GITHUB_PATH instead of /usr/local/bin (which requires sudo).
          PROM_VERSION="2.54.1"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          PROM_DIR="$RUNNER_TEMP/prometheus-${PROM_VERSION}.linux-amd64"
          chmod 0755 "$PROM_DIR/promtool"
          echo "$PROM_DIR" >> "$GITHUB_PATH"
          "$PROM_DIR/promtool" --version

      - name: Validate PrometheusRule syntax (GAP-217 AC #3)
        run: |
          # Render helm template → extract PrometheusRule body → promtool check rules.
          # Closes GAP-217 AC #3 "Rules tested via promtool check rules in CI".
          # Also validates GAP-122 + GAP-135 + GAP-144 + GAP-466 alert groups stay syntactically clean.
          set -euo pipefail

          # Self-hosted runner HOME (/home/kitedev) isn't writable by the action;
          # point helm config/cache/data at RUNNER_TEMP so `helm repo add` can write.
          export HELM_CONFIG_HOME="$RUNNER_TEMP/.helm/config"
          export HELM_CACHE_HOME="$RUNNER_TEMP/.helm/cache"
          export HELM_DATA_HOME="$RUNNER_TEMP/.helm/data"
          mkdir -p "$HELM_CONFIG_HOME" "$HELM_CACHE_HOME" "$HELM_DATA_HOME"

          # helm repo add required — Chart.yaml deps reference these repos by URL;
          # `helm dependency build` can't resolve them without registering the repos first
          # (self-hosted runner has no persistent repo cache → must add every run).
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          # Build chart dependencies first (kube-prometheus-stack, loki-stack declared in Chart.yaml)
          helm dependency build infrastructure/helm/kitehub

          # Render helm chart với monitoring.enabled=true để PrometheusRule template emit
          mkdir -p /tmp/rendered
          helm template kitehub infrastructure/helm/kitehub \
            --set monitoring.enabled=true \
            --set monitoring.prometheusRule.enabled=true \
            > /tmp/rendered/all.yaml

          # Extract PrometheusRule resource body (skip nested template).
          # PrometheusRule operator CRD wraps rules.groups[*] — promtool expects bare groups[*].
          # Use yq if available; else python-based extraction via -c.
          if command -v yq >/dev/null 2>&1; then
            yq eval 'select(.kind == "PrometheusRule") | {"groups": .spec.groups}' /tmp/rendered/all.yaml > /tmp/rendered/prometheus-rules.yaml
          else
            python3 -c "import yaml; docs = list(yaml.safe_load_all(open('/tmp/rendered/all.yaml'))); rules = []; [rules.extend(d.get('spec', {}).get('groups', [])) for d in docs if d and d.get('kind') == 'PrometheusRule']; yaml.safe_dump({'groups': rules}, open('/tmp/rendered/prometheus-rules.yaml', 'w'), default_flow_style=False); print(f'Extracted {len(rules)} rule group(s)')"
          fi

          # Run promtool — fails non-zero on syntax error / missing field
          promtool check rules /tmp/rendered/prometheus-rules.yaml


  ecr-lifecycle-coverage:
    name: ECR lifecycle coverage (cosign sig/att capped)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (2 fixtures — cosign+rule PASS / cosign-no-rule FAIL)
        run: |
          # Asserts detector fires: a workflow that signs images but an ecr.tf
          # without a sha256- expire rule must FAIL (the 2026-06-10 incident class).
          bash scripts/check-ecr-lifecycle-coverage.sh --self-test

      - name: Validate ECR lifecycle covers every CI-produced tag family (blocking on FAIL)
        run: |
          # If docker-build-push.yml signs/attests images (cosign sha256-*.sig/.att),
          # ecr.tf lifecycle policy MUST cap them. Closes the gap where GAP-402 cosign
          # signing added unbounded image growth. See retention-policy-completeness.md.
          bash scripts/check-ecr-lifecycle-coverage.sh


