name: Deploy to Production (Architecture B — EC2 + docker-compose)

# =============================================================================
# Architecture B per ADR-025 (rewritten from legacy EKS+Helm pattern):
# - kh-backend EC2 (i-...) runs 5 KH services + redis + rabbitmq
# - kc-app EC2 (deferred Phase 7 polish) — KC stack via Vercel until then
# - Trigger: workflow_dispatch (user-initiated; release-deploy-standard.md §9
#   "Deploy execution = SKIP — human executes critical commands")
# - Mechanism: AWS SSM send-command on EC2 → calls scripts/deploy-prod.sh
# - Idempotent: deploy-prod.sh handles ECR login + secrets + compose pull/up
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g., v0.9.0-beta-staging.8)'
        required: true
        type: string
        default: 'v0.9.0-beta-staging.8'
      confirm:
        description: 'Type DEPLOY to confirm production deploy'
        required: true
        type: string

permissions:
  id-token: write     # OIDC for AWS
  contents: read

env:
  AWS_REGION: ap-southeast-1
  # DEPLOY_INSTANCE_ID_KH removed — now looked up dynamically by tag
  # (GAP-482: hardcoded ID stale after EC2 replacement via AMI bump)
  COMPOSE_FILE: /opt/kite-prod/docker-compose.production.yml
  ALB_DNS: kitehub-alb-224105328.ap-southeast-1.elb.amazonaws.com

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy intent
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error ::Confirm input must be 'DEPLOY' verbatim. Got: '${{ github.event.inputs.confirm }}'"
          exit 1
      - name: Validate version format
        run: |
          # semver tag with optional pre-release (handles v0.9.0-beta-staging.8,
          # v1.0.0-rc.1, v2.0.0 etc.); pre-release allows alnum + . + -
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error ::Invalid version format. Expected v0.9.0-beta-staging.8 or v1.0.0 etc. Got: '${{ github.event.inputs.version }}'"
            exit 1
          fi
          echo "Version OK: ${{ github.event.inputs.version }}"

  # Preflight (ECR DescribeImages) removed — kitehub-github-deploy role has
  # only ECR pull perms (BatchCheckLayer/BatchGetImage), not DescribeImages.
  # Adding DescribeImages requires terraform iam.tf change + apply.
  # `docker compose pull` on EC2 will verify image existence at deploy time
  # (uses BatchGetImage which IS in role policy). If image missing → SSM
  # command fails with non-zero exit; workflow surfaces error.

  deploy:
    name: Deploy to kh-backend via SSM
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lookup current kh-backend instance ID (dynamic — survives EC2 replacement)
        id: ec2_lookup
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Name,Values=kitehub-kh-backend" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error ::No running kitehub-kh-backend instance found"
            exit 1
          fi
          echo "Found kh-backend instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Send deploy command via SSM (simple — calls deploy-prod.sh)
        id: ssm
        env:
          KITE_VERSION: ${{ github.event.inputs.version }}
          INSTANCE_ID: ${{ steps.ec2_lookup.outputs.instance_id }}
        run: |
          echo "Deploying ${KITE_VERSION} to ${INSTANCE_ID}..."

          # SSM run-command: EC2 user_data (infrastructure/terraform-aws/ec2.tf
          # `ec2_user_data` local) installs git + clones repo to /opt/kite-prod on
          # boot, so deploy-prod.sh is always available on every replacement EC2
          # (GAP-483 Wave 65 — eliminates one-time manual SSM bootstrap).
          # deploy-prod.sh handles git pull + ECR login + secrets fetch +
          # docker compose pull/up internally.
          # Per release-fix-retry-budget.md §4 pivot: avoid multi-line bash
          # inside JSON inside YAML — use simplest possible SSM call.

          # Use --parameters with simple commands list (CLI accepts shorthand).
          # --cloud-watch-output-config streams stdout/stderr to /aws/ssm/kite-deploy
          # in ~10s chunks DURING execution (GAP-491 Phase 2) so poll loop below
          # can show live progress instead of opaque InProgress. Log group +
          # IAM (CloudWatchAgentServerPolicy on ec2_app role) shipped in
          # GAP-491 Phase 1 (PR #1216 + #1217).
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${KITE_VERSION}" \
            --timeout-seconds 600 \
            --cloud-watch-output-config "CloudWatchLogGroupName=/aws/ssm/kite-deploy,CloudWatchOutputEnabled=true" \
            --parameters commands="sudo KITE_VERSION=${KITE_VERSION} bash /opt/kite-prod/scripts/deploy-prod.sh" \
            --query "Command.CommandId" --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: ${COMMAND_ID}"
          echo "CloudWatch logs: /aws/ssm/kite-deploy stream prefix ${COMMAND_ID}/"

      - name: Poll SSM command status (up to 8 min) + interleave CloudWatch logs
        id: poll
        env:
          INSTANCE_ID: ${{ steps.ec2_lookup.outputs.instance_id }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          # GAP-491 Phase 2: interleave SSM status with CloudWatch log fetch so
          # operator sees live progress instead of opaque InProgress. Without
          # this, a Failed command at 7s shows as InProgress for 2.5min until
          # the next poll catches Failed terminal state (2026-05-12 incident).
          LAST_LOG_TS=$(($(date -u +%s) * 1000))
          for attempt in $(seq 1 48); do
            sleep 10
            NOW_TS=$(($(date -u +%s) * 1000))

            # Fetch new CloudWatch log events since last poll (SSM agent streams
            # in ~10s chunks). Log stream pattern: ${COMMAND_ID}/${INSTANCE_ID}/
            # aws-runShellScript/{stdout,stderr} — prefix-match captures both.
            # Quiet on no-events / no-stream-yet (early polls); ignore errors.
            LOGS=$(aws logs filter-log-events \
              --region "${AWS_REGION}" \
              --log-group-name /aws/ssm/kite-deploy \
              --log-stream-name-prefix "${COMMAND_ID}/" \
              --start-time "${LAST_LOG_TS}" \
              --query 'events[*].message' --output text 2>/dev/null || true)
            if [ -n "${LOGS}" ]; then
              echo "${LOGS}" | sed 's/^/  │ /'
            fi
            LAST_LOG_TS=${NOW_TS}

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            echo "Attempt ${attempt}/48: Status=${STATUS}"
            case "$STATUS" in
              Success)
                echo "::notice ::Deploy succeeded on ${INSTANCE_ID}"
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" --output text | tail -50
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error ::Deploy failed with status ${STATUS}"
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
          done
          echo "::error ::Deploy timed out after 8 min"
          exit 1

      - name: Wait for ALB target group health
        run: |
          echo "Waiting 90s for kh-backend target group health check (2× healthy)..."
          sleep 90

      - name: Smoke test (gateway through ALB)
        run: |
          echo "Health check via ALB..."
          for attempt in 1 2 3; do
            if curl -fsS -o /dev/null -w "HTTP %{http_code} (attempt ${attempt})\n" \
                 "http://${{ env.ALB_DNS }}/actuator/health"; then
              echo "::notice ::Production deploy ${{ github.event.inputs.version }} healthy ✅"
              exit 0
            fi
            sleep 30
          done
          echo "::error ::ALB health check failed after 3 attempts"
          exit 1

  notify:
    name: Notify deploy outcome
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Validate:  ${{ needs.validate.result }}"
          echo "Deploy:    ${{ needs.deploy.result }}"
          echo "Version:   ${{ github.event.inputs.version }}"
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "::notice ::🎉 Production deploy ${{ github.event.inputs.version }} SUCCESS"
          else
            echo "::error ::Deploy did not complete cleanly. Check job logs above."
          fi
