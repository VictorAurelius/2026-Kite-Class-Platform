name: Deploy to Production (Architecture B — EC2 + docker-compose)

# =============================================================================
# Architecture B per ADR-025 (rewritten from legacy EKS+Helm pattern):
# - kh-backend EC2 (i-...) runs 5 KH services + redis + rabbitmq
# - kc-app EC2 (i-...) runs KC stack (self-hosted per ADR-025, Wave 82 pivot)
# - Trigger: workflow_dispatch (user-initiated; release-deploy-standard.md §9
#   "Deploy execution = SKIP — human executes critical commands")
# - Mechanism: AWS SSM send-command on EC2 → calls scripts/deploy-prod.sh
# - Idempotent: deploy-prod.sh handles ECR login + secrets + compose pull/up
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g., v0.9.0-beta-staging.8)'
        required: true
        type: string
        default: 'v0.9.0-beta-staging.8'
      confirm:
        description: 'Type DEPLOY to confirm production deploy'
        required: true
        type: string

permissions:
  id-token: write     # OIDC for AWS
  contents: read

env:
  AWS_REGION: ap-southeast-1
  # DEPLOY_INSTANCE_ID_KH removed — now looked up dynamically by tag
  # (GAP-482: hardcoded ID stale after EC2 replacement via AMI bump)
  COMPOSE_FILE: /opt/kite-prod/docker-compose.production.yml
  ALB_DNS: kitehub-alb-224105328.ap-southeast-1.elb.amazonaws.com

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy intent
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error ::Confirm input must be 'DEPLOY' verbatim. Got: '${{ github.event.inputs.confirm }}'"
          exit 1
      - name: Validate version format
        run: |
          # semver tag with optional pre-release (handles v0.9.0-beta-staging.8,
          # v1.0.0-rc.1, v2.0.0 etc.); pre-release allows alnum + . + -
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error ::Invalid version format. Expected v0.9.0-beta-staging.8 or v1.0.0 etc. Got: '${{ github.event.inputs.version }}'"
            exit 1
          fi
          echo "Version OK: ${{ github.event.inputs.version }}"

  # Preflight (ECR DescribeImages) removed — kitehub-github-deploy role has
  # only ECR pull perms (BatchCheckLayer/BatchGetImage), not DescribeImages.
  # Adding DescribeImages requires terraform iam.tf change + apply.
  # `docker compose pull` on EC2 will verify image existence at deploy time
  # (uses BatchGetImage which IS in role policy). If image missing → SSM
  # command fails with non-zero exit; workflow surfaces error.

  preflight:
    name: Preflight — verify RDS available (GAP-493 Path B)
    runs-on: ubuntu-latest
    needs: validate
    # Fails fast (<30s) if shared production dependencies are stopped
    # (cost-saving scheduler.tf stops RDS on weekday/Friday evenings).
    # Without this, container starts → Spring Boot connects to RDS →
    # PSQLException SocketTimeoutException → 8min crash-restart loop.
    # See documents/04-quality/gaps/GAP-493-container-crash-restart-on-deploy.md
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify RDS kitehub-postgres available
        run: |
          STATUS=$(aws rds describe-db-instances \
            --region "${AWS_REGION}" \
            --db-instance-identifier kitehub-postgres \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || echo "ERROR")
          echo "RDS kitehub-postgres status: ${STATUS}"
          if [ "$STATUS" != "available" ]; then
            echo "::error ::RDS kitehub-postgres is '${STATUS}' (expected: 'available'). Containers would crash-restart in deploy. Run 'bash scripts/start-stack.sh' to start RDS, then retry deploy. See documents/04-quality/gaps/GAP-493-container-crash-restart-on-deploy.md"
            exit 1
          fi
          echo "::notice ::RDS kitehub-postgres available ✅ — proceeding to deploy"

  deploy:
    name: Deploy to kh-backend via SSM
    runs-on: ubuntu-latest
    needs: preflight
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lookup current kh-backend instance ID (dynamic — survives EC2 replacement)
        id: ec2_lookup
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Name,Values=kitehub-kh-backend" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error ::No running kitehub-kh-backend instance found"
            exit 1
          fi
          echo "Found kh-backend instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Send deploy command via SSM (simple — calls deploy-prod.sh)
        id: ssm
        env:
          KITE_VERSION: ${{ github.event.inputs.version }}
          INSTANCE_ID: ${{ steps.ec2_lookup.outputs.instance_id }}
        run: |
          echo "Deploying ${KITE_VERSION} to ${INSTANCE_ID}..."

          # SSM run-command: EC2 user_data (infrastructure/terraform-aws/ec2.tf
          # `ec2_user_data` local) installs git + clones repo to /opt/kite-prod on
          # boot, so deploy-prod.sh is always available on every replacement EC2
          # (GAP-483 Wave 65 — eliminates one-time manual SSM bootstrap).
          # deploy-prod.sh handles git pull + ECR login + secrets fetch +
          # docker compose pull/up internally.
          # Per release-fix-retry-budget.md §4 pivot: avoid multi-line bash
          # inside JSON inside YAML — use simplest possible SSM call.

          # Use --parameters with simple commands list (CLI accepts shorthand).
          # --cloud-watch-output-config streams stdout/stderr to /aws/ssm/kite-deploy
          # in ~10s chunks DURING execution (GAP-491 Phase 2) so poll loop below
          # can show live progress instead of opaque InProgress. Log group +
          # IAM (CloudWatchAgentServerPolicy on ec2_app role) shipped in
          # GAP-491 Phase 1 (PR #1216 + #1217).
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${KITE_VERSION}" \
            --timeout-seconds 600 \
            --cloud-watch-output-config "CloudWatchLogGroupName=/aws/ssm/kite-deploy,CloudWatchOutputEnabled=true" \
            --parameters commands="sudo KITE_VERSION=${KITE_VERSION} bash /opt/kite-prod/scripts/deploy-prod.sh" \
            --query "Command.CommandId" --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: ${COMMAND_ID}"
          echo "CloudWatch logs: /aws/ssm/kite-deploy stream prefix ${COMMAND_ID}/"

      - name: Poll deploy via ALB target health + CloudWatch logs (GAP-498 redesign)
        id: poll
        env:
          INSTANCE_ID: ${{ steps.ec2_lookup.outputs.instance_id }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          TG_NAME: kitehub-kh-backend-tg
        run: |
          # GAP-498 redesign: replace SSM Status field polling (false-InProgress
          # 8min false-failure pattern from 2026-05-13 run 25776387051) with
          # independent ALB target health + smoke verification. Workflow IAM
          # context divergence makes Status field unreliable; ALB is single
          # source of truth — once target healthy + smoke 200, deploy IS done.
          #
          # Preserved from prior versions:
          # - CloudWatch log interleave (GAP-491 Phase 2 — operator visibility)
          # - FAIL marker early-exit (PR #1235 — fast-fail on docker errors)
          #
          # Success criteria (ALL must hold):
          # - ≥60s elapsed since SSM send (containers had time to restart)
          # - ALB target i-${INSTANCE_ID} state = healthy
          # - curl https://api.kitehub.me/actuator/health = 200
          # Failure criteria (ANY triggers exit 1):
          # - FAIL log marker detected (manifest unknown / failed to run commands)
          # - 8min step budget exhausted without success criteria
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${TG_NAME}" \
            --region "${AWS_REGION}" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          echo "Target group: ${TG_NAME} ARN=${TG_ARN}"
          START_TS=$(date -u +%s)
          LAST_LOG_TS=$((START_TS * 1000))
          for attempt in $(seq 1 48); do
            sleep 10
            NOW_TS=$(($(date -u +%s) * 1000))
            ELAPSED=$(( $(date -u +%s) - START_TS ))

            # GAP-491 preserved — CloudWatch log interleave
            LOGS=$(aws logs filter-log-events \
              --region "${AWS_REGION}" \
              --log-group-name /aws/ssm/kite-deploy \
              --log-stream-name-prefix "${COMMAND_ID}/" \
              --start-time "${LAST_LOG_TS}" \
              --query 'events[*].message' --output text 2>/dev/null || true)
            if [ -n "${LOGS}" ]; then
              echo "${LOGS}" | sed 's/^/  │ /'
              # PR #1235 preserved — FAIL marker early-exit
              if echo "${LOGS}" | grep -qE 'failed to run commands: exit status [1-9]|manifest unknown'; then
                echo "::error ::Deploy script reported failure (CloudWatch log marker)"
                exit 1
              fi
            fi
            LAST_LOG_TS=${NOW_TS}

            # GAP-498 new — ALB target health + smoke as success criteria
            TARGET_HEALTH=$(aws elbv2 describe-target-health \
              --target-group-arn "${TG_ARN}" \
              --region "${AWS_REGION}" \
              --query "TargetHealthDescriptions[?Target.Id=='${INSTANCE_ID}'].TargetHealth.State" \
              --output text 2>/dev/null || echo "unknown")
            echo "Attempt ${attempt}/48 (elapsed ${ELAPSED}s): ALB target=${TARGET_HEALTH}"
            if [ "${ELAPSED}" -ge 60 ] && [ "${TARGET_HEALTH}" = "healthy" ]; then
              # Smoke via HTTPS production endpoint (api.kitehub.me) — end-to-end
              # what real users hit. ALB HTTP:80 listener redirects to HTTPS:443
              # (configured per cutover); curl direct to :80 returns 301, not 200.
              # api.kitehub.me proxied through Cloudflare → ALB:443 → kitehub-gateway.
              SMOKE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L \
                "https://api.kitehub.me/actuator/health" 2>/dev/null || echo "000")
              echo "Smoke https://api.kitehub.me/actuator/health → HTTP ${SMOKE}"
              if [ "${SMOKE}" = "200" ]; then
                echo "::notice ::Production deploy ${{ github.event.inputs.version }} healthy ✅ (target=healthy + smoke=200 at ${ELAPSED}s)"
                exit 0
              fi
            fi
          done
          echo "::error ::Deploy timed out after 8min — target never reached healthy + smoke 200"
          # Surface SSM stderr for diagnosis (best-effort)
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" --output text 2>/dev/null || true
          exit 1

  notify:
    name: Notify deploy outcome
    runs-on: ubuntu-latest
    needs: [validate, preflight, deploy]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Validate:  ${{ needs.validate.result }}"
          echo "Preflight: ${{ needs.preflight.result }}"
          echo "Deploy:    ${{ needs.deploy.result }}"
          echo "Version:   ${{ github.event.inputs.version }}"
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "::notice ::🎉 Production deploy ${{ github.event.inputs.version }} SUCCESS"
          else
            echo "::error ::Deploy did not complete cleanly. Check job logs above."
          fi
