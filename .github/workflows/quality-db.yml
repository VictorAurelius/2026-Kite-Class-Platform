name: Quality — Database

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/quality-db.yml'
      - 'scripts/check-rls-coverage.sh'
      - 'kiteclass/kiteclass-core/src/main/resources/db/migration/V*.sql'
      - 'kitehub/kitehub-subscription/src/main/resources/db/migration/V*.sql'

permissions:
  contents: read

jobs:
  db-rls-coverage:
    name: DB RLS coverage
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker version

      - name: Run RLS coverage gate
        run: bash scripts/check-rls-coverage.sh
