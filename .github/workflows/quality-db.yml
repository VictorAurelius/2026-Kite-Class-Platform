name: Quality — Database

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/quality-db.yml'
      - 'scripts/check-rls-coverage.sh'
      - 'scripts/check-migration-replay.sh'
      - 'scripts/check-schema-drift.sh'
      - 'scripts/check-audit-col-uniformity.sh'
      - 'kiteclass/kiteclass-core/src/main/resources/db/migration/V*.sql'
      - 'kitehub/kitehub-subscription/src/main/resources/db/migration/V*.sql'
      - 'kiteclass/kiteclass-core/src/main/java/**/entity/**'
      - 'kitehub/kitehub-platform/src/main/java/**/entity/**'

permissions:
  contents: read

jobs:
  db-rls-coverage:
    name: DB RLS coverage
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker version

      - name: Run RLS coverage gate
        run: bash scripts/check-rls-coverage.sh

  db-migration-replay:
    name: DB migration replay
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker version

      - name: Run migration replay gate
        run: bash scripts/check-migration-replay.sh

  db-schema-drift:
    name: DB schema drift
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker version

      - name: Run schema drift gate
        run: bash scripts/check-schema-drift.sh

  db-audit-col-uniformity:
    name: DB audit column uniformity
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker version

      - name: Run audit column uniformity gate
        run: bash scripts/check-audit-col-uniformity.sh
