name: Gateway Service CI/CD

on:
  # Solo-dev mode (2026-04-24): removed push:main (post-merge redundant with PR CI).
  # Kept push: develop/feature/**/review/** for direct push without PR (rare use case).
  push:
    branches:
      - develop
      - 'feature/**'
      - 'review/**'
    paths:
      - 'kiteclass/kiteclass-gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'kiteclass/kiteclass-gateway/**'
      - '.github/workflows/gateway-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  test:
    name: Test Gateway Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make mvnw executable
        working-directory: kiteclass/kiteclass-gateway
        run: chmod +x mvnw

      - name: Run tests with coverage
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw clean test


      - name: Generate coverage report
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          files: ./kiteclass/kiteclass-gateway/target/site/jacoco/jacoco.xml
          flags: gateway
          name: gateway-coverage

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: |
            kiteclass/kiteclass-gateway/target/surefire-reports/
            kiteclass/kiteclass-gateway/target/site/jacoco/

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Gateway Test Results
          path: kiteclass/kiteclass-gateway/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: kiteclass/kiteclass-gateway/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 80
          title: Gateway Coverage Report
          update-comment: true

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        working-directory: kiteclass/kiteclass-gateway
        run: chmod +x mvnw

      - name: Build application
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kiteclass-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./kiteclass/kiteclass-gateway
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment when ready to push to registry
      # - name: Login to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.REGISTRY_URL }}
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
      #
      # - name: Push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./kiteclass/kiteclass-gateway
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        working-directory: kiteclass/kiteclass-gateway
        run: chmod +x mvnw

      - name: Run checkstyle
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw checkstyle:check
        continue-on-error: true

      - name: Check for compilation warnings
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw clean compile

      - name: Analyze dependencies
        working-directory: kiteclass/kiteclass-gateway
        run: |
          ./mvnw dependency:analyze
        continue-on-error: true
