name: Build — Docker Images (push to ECR)

# Wave 37 Bucket B (GAP-398..402):
# - Region pinned ap-southeast-1 (ADR-025 AWS Singapore)
# - ECR repo naming: kite/<service>
# - 5 KH services + 3 KC services + 2 frontends = 10 images
# - Multi-arch linux/amd64 + linux/arm64
# - Trivy HIGH/CRITICAL fail + SARIF upload (GAP-400)
# - Syft SBOM CycloneDX + Cosign keyless signing (GAP-402)

on:
  # Re-enabled 2026-05-27 per GAP-756 Phase 1 RST PASS (Wave beta-prep-1 main HEAD a64bcef2).
  # Prior disable 2026-05-25 was conditional on GAP-612 RST verify; local RST PASS confirmed
  # 2026-05-27 02:55 UTC — 13/13 services healthy + admin-login HTTP 200 PLATFORM_ADMIN JWT +
  # FE wave routes /waitlist + /legal/privacy + /legal/terms returning 200 + POST
  # /api/v1/auth/request-beta-access HTTP 201 với PDPL consent payload + VN sample data
  # (Trần Thị Smoke / Trung tâm Smoke Test). Re-enable unblocks GAP-756 Phase 2+3 deploy.
  # ECR push only on release tags or manual dispatch (deploy-time) — AWS cost control.
  # Removed `branches: [main]` 2026-06-15: every merge to main pushed 10 multi-arch
  # images → ECR accumulated ~206GB / 2746 imgs unbounded ($43+/mo). Images are now
  # pushed ONLY when deploying (tag v*.*.* or workflow_dispatch). PR still build-only
  # (push:false) for Dockerfile validation. See .claude/rules/aws-cost-guard.md +
  # documents/04-quality/audits/aws-verification/2026-06-15-cost-reduction.md
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - 'docker/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  # ECR repo naming convention: kite/<service> (per CLAUDE.md Docker Naming Convention)
  # KiteClass services (kiteclass-gateway removed per ADR-032 / GAP-001)
  ECR_REPO_KC_CORE: kite/kiteclass-core
  ECR_REPO_KC_FRONTEND: kite/kiteclass-frontend
  # KiteHub services
  ECR_REPO_KH_SUBSCRIPTION: kite/kitehub-subscription
  ECR_REPO_KH_BRANDING: kite/kitehub-branding
  ECR_REPO_KH_EMAIL: kite/kitehub-email
  ECR_REPO_KH_ADMIN: kite/kitehub-admin
  ECR_REPO_KH_GATEWAY: kite/kitehub-gateway
  ECR_REPO_KH_FRONTEND: kite/kitehub-frontend

jobs:
  # ==========================================================================
  # Job 1: Build Docker images on PR (verify Dockerfiles parse + build clean)
  # ==========================================================================
  build-test:
    name: Build Docker Images (Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # KiteClass services
          - service: kiteclass-core
            ecr_repo: kite/kiteclass-core
            context: kiteclass/kiteclass-core
            dockerfile: kiteclass/kiteclass-core/Dockerfile
          - service: kiteclass-frontend
            ecr_repo: kite/kiteclass-frontend
            context: .
            dockerfile: kiteclass/kiteclass-frontend/Dockerfile
          # KiteHub backend services (5; kitehub-platform is shared library, not deployable)
          - service: kitehub-subscription
            ecr_repo: kite/kitehub-subscription
            context: kitehub
            dockerfile: kitehub/kitehub-subscription/Dockerfile
          - service: kitehub-branding
            ecr_repo: kite/kitehub-branding
            context: kitehub
            dockerfile: kitehub/kitehub-branding/Dockerfile
          - service: kitehub-email
            ecr_repo: kite/kitehub-email
            context: kitehub
            dockerfile: kitehub/kitehub-email/Dockerfile
          - service: kitehub-admin
            ecr_repo: kite/kitehub-admin
            context: kitehub
            dockerfile: kitehub/kitehub-admin/Dockerfile
          - service: kitehub-gateway
            ecr_repo: kite/kitehub-gateway
            context: kitehub
            dockerfile: kitehub/kitehub-gateway/Dockerfile
          # KiteHub frontend (if Dockerfile exists; allow missing without failing)
          - service: kitehub-frontend
            ecr_repo: kite/kitehub-frontend
            context: .
            dockerfile: kitehub/kitehub-frontend/Dockerfile
            optional: 'true'
          # KiteHub banner-renderer — Node/Playwright sidecar (GAP-1407; deploys on kc-app EC2)
          - service: kitehub-banner-renderer
            ecr_repo: kite/kitehub-banner-renderer
            context: kitehub/kitehub-banner-renderer
            dockerfile: kitehub/kitehub-banner-renderer/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile presence
        id: dockerfile_check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.optional }}" = "true" ]; then
              echo "::warning ::Optional Dockerfile not present: ${{ matrix.dockerfile }} — skipping"
            else
              echo "::error ::Required Dockerfile missing: ${{ matrix.dockerfile }}"
              exit 1
            fi
          fi

      - name: Set up QEMU (multi-arch emulation)
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.ecr_repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=test

      - name: Build Docker image (no push, single-arch for PR speed)
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # PR builds only amd64 to keep CI fast; main/tag pushes do multi-arch
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            # FE images bake NEXT_PUBLIC_* at build time (Next.js client bundle).
            # Backend Dockerfiles ignore these unused build-args. Production URLs
            # so kite/kitehub-frontend + kite/kiteclass-frontend are deploy-ready.
            NEXT_PUBLIC_API_URL=https://api.kitehub.me
            NEXT_PUBLIC_KITECLASS_URL_PATTERN=https://{subdomain}.kitehub.me
            NEXT_PUBLIC_BETA_PAYMENT_OVERRIDE=false

      - name: Build summary
        if: steps.dockerfile_check.outputs.exists == 'true'
        run: |
          echo "Built: ${{ matrix.service }} -> ${{ matrix.ecr_repo }}"

  # ==========================================================================
  # Job 2: Push to ECR ap-southeast-1 + Trivy scan + SBOM + Cosign sign
  # Only on push to main / version tag, when AWS configured.
  # ==========================================================================
  push-to-ecr:
    name: Push to ECR (ap-southeast-1) + Scan + SBOM + Sign
    runs-on: ubuntu-latest
    needs: build-test
    # Push to ECR ONLY at deploy-time: release tag v*.*.* OR manual workflow_dispatch.
    # `refs/heads/main` removed 2026-06-15 (AWS cost control — see trigger comment above).
    if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch') && vars.AWS_CONFIGURED == 'true'
    permissions:
      id-token: write       # OIDC for AWS + Cosign keyless
      contents: read
      security-events: write  # Trivy SARIF upload
      attestations: write     # Image attestations (SBOM + provenance)
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kiteclass-core
            ecr_repo: kite/kiteclass-core
            context: kiteclass/kiteclass-core
            dockerfile: kiteclass/kiteclass-core/Dockerfile
          - service: kiteclass-frontend
            ecr_repo: kite/kiteclass-frontend
            context: .
            dockerfile: kiteclass/kiteclass-frontend/Dockerfile
          - service: kitehub-subscription
            ecr_repo: kite/kitehub-subscription
            context: kitehub
            dockerfile: kitehub/kitehub-subscription/Dockerfile
          - service: kitehub-branding
            ecr_repo: kite/kitehub-branding
            context: kitehub
            dockerfile: kitehub/kitehub-branding/Dockerfile
          - service: kitehub-email
            ecr_repo: kite/kitehub-email
            context: kitehub
            dockerfile: kitehub/kitehub-email/Dockerfile
          - service: kitehub-admin
            ecr_repo: kite/kitehub-admin
            context: kitehub
            dockerfile: kitehub/kitehub-admin/Dockerfile
          - service: kitehub-gateway
            ecr_repo: kite/kitehub-gateway
            context: kitehub
            dockerfile: kitehub/kitehub-gateway/Dockerfile
          # kitehub-frontend — restored to push matrix per Wave 81 Bucket H investigation
          # (was missing while build-test matrix had it with optional:'true').
          # Bug surfaced 2026-05-15 when staging.14 tag failed to push FE image to ECR.
          - service: kitehub-frontend
            ecr_repo: kite/kitehub-frontend
            context: .
            dockerfile: kitehub/kitehub-frontend/Dockerfile
            optional: 'true'
          # KiteHub banner-renderer — Node/Playwright sidecar (GAP-1407; deploys on kc-app EC2)
          - service: kitehub-banner-renderer
            ecr_repo: kite/kitehub-banner-renderer
            context: kitehub/kitehub-banner-renderer
            dockerfile: kitehub/kitehub-banner-renderer/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile presence
        id: dockerfile_check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.optional }}" = "true" ]; then
              echo "::warning ::Optional Dockerfile not present: ${{ matrix.dockerfile }} — skipping push"
              exit 0
            fi
            echo "::error ::Required Dockerfile missing: ${{ matrix.dockerfile }}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC, ap-southeast-1)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}
          # 2026-05-13: type=sha conditionally disabled on tag events. Otherwise
          # version-released images (e.g. 0.9.0-beta-staging.11) carry sha- tag
          # too → fall under ECR lifecycle "expire sha- count>20" rule → version
          # tag dies when image manifest expires. Tag pushes don't need sha-
          # tag (version tag IS the canonical reference).
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to ECR (amd64 — Phase 1 BETA single-arch)
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Phase 1 BETA: amd64-only (Architecture B EC2 t3.medium = amd64 per ADR-025).
          # arm64 deferred Phase 2+ when Graviton migration considered. Reason: 7 Java
          # services use maven:*-eclipse-temurin-*-alpine base which lacks arm64 manifest
          # on Docker Hub → multi-arch build fails. To restore arm64: switch base images
          # to non-alpine variants OR use eclipse-temurin:*-jdk-alpine (arm64-supported).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            # FE images bake NEXT_PUBLIC_* at build time (Next.js client bundle).
            # Backend Dockerfiles ignore these unused build-args. Production URLs
            # so kite/kitehub-frontend + kite/kiteclass-frontend are deploy-ready.
            NEXT_PUBLIC_API_URL=https://api.kitehub.me
            NEXT_PUBLIC_KITECLASS_URL_PATTERN=https://{subdomain}.kitehub.me
            NEXT_PUBLIC_BETA_PAYMENT_OVERRIDE=false

      - name: Image digest
        run: echo "${{ matrix.service }} digest=${{ steps.build_push.outputs.digest }}"

      # GAP-400: Trivy scan — fail on HIGH/CRITICAL fixable CVEs
      - name: Trivy vulnerability scan (gate per tag class — staging info-only, prod strict)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}
          # Per release-deploy-standard.md §3.1 PRE-RELEASE: "Trivy zero
          # HIGH/CRITICAL recommended không mandatory cho pre-production refs".
          #
          # Shift-left security policy (revised 2026-05-08 per release-fix-retry-budget.md §4):
          # - staging.* tags     → SCAN + REPORT (exit-code 0; visibility-only)
          # - main branch        → SCAN + REPORT (exit-code 0; Phase 1 BETA pre-launch
          #                        — same rationale as staging tags; production gate
          #                        kicks in only at v[0-9]+.* release tag fire)
          # - v[0-9]+.* tags     → SCAN + BLOCK (exit-code 1; HIGH+CRITICAL strict)
          #
          # Phase 1 BETA invite-only ~10-20 tenants (ADR-025) accepts CVE backlog
          # for pre-production refs while we ship dep-bump GAPs (GAP-440 Spring Boot,
          # GAP-441 pom hygiene, GAP-442 alpine 3.23→3.24). Production v1.0.0
          # tag will be gated by the strict bar via this same workflow.
          #
          # Why include `main` in exempt list (added 2026-05-08): main push during
          # Phase 1 BETA pre-launch period = same risk profile as staging tags
          # (no production traffic yet). Strict gate triggered 8 ECR push fails
          # 2026-05-08 post-Wave-45 closure (run 25550657363) = recurrence of
          # Phase 3 staging.1-7 pattern; pivot per §4 matrix "remove the gate"
          # row 5 — release-deploy-standard.md §3.1 explicitly allows softer bar.
          #
          # SARIF still uploaded to GitHub Security tab regardless of gate
          # (next step) — full vulnerability inventory remains visible/triaged.
          severity: 'HIGH,CRITICAL'
          exit-code: ${{ (contains(github.ref, '-staging.') || github.ref == 'refs/heads/main') && '0' || '1' }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          trivyignores: '.trivyignore'

      # Post-push verification artifacts (SARIF / SBOM / Cosign):
      # - staging.* tags  → SKIP entirely. Image push to ECR is the Phase 3 goal;
      #                     verification artifacts defer to production v1.0.0+ tag.
      # - main + v[0-9]+.*→ Full SARIF upload + SBOM (artifact only, NO release
      #                     asset attachment until release-tag.yml creates Release)
      #                     + Cosign keyless sign + SBOM attestation.
      #
      # Rationale per release-fix-retry-budget.md §4 (workflow gate over-spec'd
      # for pre-release tags — observed 5+ retries on Phase 3 staging.1-7):
      # SBOM + Cosign + SARIF require GitHub Release to exist (created by
      # release-tag.yml on production tags only) OR per-step continue-on-error
      # tolerance. For Phase 1 BETA staging, simplest = skip until production.
      #
      # Production hardening (v1.0.0+ launch):
      # - release-tag.yml fires first → creates GitHub Release shell
      # - docker-build-push.yml then attaches SBOMs/signs to that Release
      # - Trivy SARIF gates production strictly (exit-code 1)
      # Skip SARIF upload if Trivy scan didn't run (e.g. earlier step failed
      # due to OIDC/AWS auth — common when AWS account is suspended). Without
      # this guard, GitHub UI surfaces "Code scanning configuration error —
      # Trivy is reporting errors" because upload-sarif fails on missing file.
      # Wave 91 GAP-612 incident 2026-05-17 surfaced cascade pattern.
      - name: Check Trivy SARIF exists
        id: check_sarif
        if: ${{ always() && !contains(github.ref, '-staging.') }}
        run: |
          if [[ -f "trivy-results-${{ matrix.service }}.sarif" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning ::Trivy SARIF missing (likely earlier step failed); skipping upload"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && !contains(github.ref, '-staging.') && steps.check_sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

      # GAP-402: Syft SBOM (CycloneDX) — production tags only
      - name: Generate Syft SBOM (CycloneDX)
        if: ${{ !contains(github.ref, '-staging.') }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          # Don't attach to release until Release object exists (release-tag.yml)
          upload-release-assets: false

      # GAP-402: Cosign keyless signing — production tags only
      - name: Install Cosign
        if: ${{ !contains(github.ref, '-staging.') }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless OIDC)
        if: ${{ !contains(github.ref, '-staging.') }}
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}"

      - name: Attach SBOM as Cosign attestation
        if: ${{ !contains(github.ref, '-staging.') }}
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            --type cyclonedx \
            "${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}"

  # ==========================================================================
  # Job 3: Notify
  # ==========================================================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-test, push-to-ecr]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "=== Build Status ==="
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Push to ECR: ${{ needs.push-to-ecr.result }}"

          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "Docker images build verification failed"
            exit 1
          fi

          echo "Docker images build verification passed"

          case "${{ needs.push-to-ecr.result }}" in
            success)
              echo "Images pushed to ECR ap-southeast-1, scanned, signed, SBOM attached"
              ;;
            skipped)
              echo "ECR push skipped (PR / non-main / AWS not configured)"
              ;;
            *)
              echo "ECR push: ${{ needs.push-to-ecr.result }}"
              ;;
          esac
