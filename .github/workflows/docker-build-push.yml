name: Build and Push Kite Docker Images

# Wave 37 Bucket B (GAP-398..402):
# - Region pinned ap-southeast-1 (ADR-025 AWS Singapore)
# - ECR repo naming: kite/<service>
# - 5 KH services + 3 KC services + 2 frontends = 10 images
# - Multi-arch linux/amd64 + linux/arm64
# - Trivy HIGH/CRITICAL fail + SARIF upload (GAP-400)
# - Syft SBOM CycloneDX + Cosign keyless signing (GAP-402)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'docker/**'
      - 'kiteclass/**'
      - 'kitehub/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - 'docker/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  # ECR repo naming convention: kite/<service> (per CLAUDE.md Docker Naming Convention)
  # KiteClass services
  ECR_REPO_KC_CORE: kite/kiteclass-core
  ECR_REPO_KC_GATEWAY: kite/kiteclass-gateway
  ECR_REPO_KC_FRONTEND: kite/kiteclass-frontend
  # KiteHub services
  ECR_REPO_KH_SUBSCRIPTION: kite/kitehub-subscription
  ECR_REPO_KH_BRANDING: kite/kitehub-branding
  ECR_REPO_KH_EMAIL: kite/kitehub-email
  ECR_REPO_KH_ADMIN: kite/kitehub-admin
  ECR_REPO_KH_GATEWAY: kite/kitehub-gateway
  ECR_REPO_KH_FRONTEND: kite/kitehub-frontend

jobs:
  # ==========================================================================
  # Job 1: Build Docker images on PR (verify Dockerfiles parse + build clean)
  # ==========================================================================
  build-test:
    name: Build Docker Images (Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # KiteClass services
          - service: kiteclass-core
            ecr_repo: kite/kiteclass-core
            context: kiteclass/kiteclass-core
            dockerfile: kiteclass/kiteclass-core/Dockerfile
          - service: kiteclass-gateway
            ecr_repo: kite/kiteclass-gateway
            context: kiteclass/kiteclass-gateway
            dockerfile: kiteclass/kiteclass-gateway/Dockerfile
          - service: kiteclass-frontend
            ecr_repo: kite/kiteclass-frontend
            context: .
            dockerfile: kiteclass/kiteclass-frontend/Dockerfile
          # KiteHub backend services (5; kitehub-platform is shared library, not deployable)
          - service: kitehub-subscription
            ecr_repo: kite/kitehub-subscription
            context: kitehub
            dockerfile: kitehub/kitehub-subscription/Dockerfile
          - service: kitehub-branding
            ecr_repo: kite/kitehub-branding
            context: kitehub
            dockerfile: kitehub/kitehub-branding/Dockerfile
          - service: kitehub-email
            ecr_repo: kite/kitehub-email
            context: kitehub
            dockerfile: kitehub/kitehub-email/Dockerfile
          - service: kitehub-admin
            ecr_repo: kite/kitehub-admin
            context: kitehub
            dockerfile: kitehub/kitehub-admin/Dockerfile
          - service: kitehub-gateway
            ecr_repo: kite/kitehub-gateway
            context: kitehub
            dockerfile: kitehub/kitehub-gateway/Dockerfile
          # KiteHub frontend (if Dockerfile exists; allow missing without failing)
          - service: kitehub-frontend
            ecr_repo: kite/kitehub-frontend
            context: .
            dockerfile: kitehub/kitehub-frontend/Dockerfile
            optional: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile presence
        id: dockerfile_check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.optional }}" = "true" ]; then
              echo "::warning ::Optional Dockerfile not present: ${{ matrix.dockerfile }} — skipping"
            else
              echo "::error ::Required Dockerfile missing: ${{ matrix.dockerfile }}"
              exit 1
            fi
          fi

      - name: Set up QEMU (multi-arch emulation)
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.ecr_repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=test

      - name: Build Docker image (no push, single-arch for PR speed)
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # PR builds only amd64 to keep CI fast; main/tag pushes do multi-arch
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Build summary
        if: steps.dockerfile_check.outputs.exists == 'true'
        run: |
          echo "Built: ${{ matrix.service }} -> ${{ matrix.ecr_repo }}"

  # ==========================================================================
  # Job 2: Push to ECR ap-southeast-1 + Trivy scan + SBOM + Cosign sign
  # Only on push to main / version tag, when AWS configured.
  # ==========================================================================
  push-to-ecr:
    name: Push to ECR (ap-southeast-1) + Scan + SBOM + Sign
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.AWS_CONFIGURED == 'true'
    permissions:
      id-token: write       # OIDC for AWS + Cosign keyless
      contents: read
      security-events: write  # Trivy SARIF upload
      attestations: write     # Image attestations (SBOM + provenance)
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kiteclass-core
            ecr_repo: kite/kiteclass-core
            context: kiteclass/kiteclass-core
            dockerfile: kiteclass/kiteclass-core/Dockerfile
          - service: kiteclass-gateway
            ecr_repo: kite/kiteclass-gateway
            context: kiteclass/kiteclass-gateway
            dockerfile: kiteclass/kiteclass-gateway/Dockerfile
          - service: kiteclass-frontend
            ecr_repo: kite/kiteclass-frontend
            context: .
            dockerfile: kiteclass/kiteclass-frontend/Dockerfile
          - service: kitehub-subscription
            ecr_repo: kite/kitehub-subscription
            context: kitehub
            dockerfile: kitehub/kitehub-subscription/Dockerfile
          - service: kitehub-branding
            ecr_repo: kite/kitehub-branding
            context: kitehub
            dockerfile: kitehub/kitehub-branding/Dockerfile
          - service: kitehub-email
            ecr_repo: kite/kitehub-email
            context: kitehub
            dockerfile: kitehub/kitehub-email/Dockerfile
          - service: kitehub-admin
            ecr_repo: kite/kitehub-admin
            context: kitehub
            dockerfile: kitehub/kitehub-admin/Dockerfile
          - service: kitehub-gateway
            ecr_repo: kite/kitehub-gateway
            context: kitehub
            dockerfile: kitehub/kitehub-gateway/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile presence
        id: dockerfile_check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::error ::Required Dockerfile missing: ${{ matrix.dockerfile }}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC, ap-southeast-1)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to ECR (amd64 — Phase 1 BETA single-arch)
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Phase 1 BETA: amd64-only (Architecture B EC2 t3.medium = amd64 per ADR-025).
          # arm64 deferred Phase 2+ when Graviton migration considered. Reason: 7 Java
          # services use maven:*-eclipse-temurin-*-alpine base which lacks arm64 manifest
          # on Docker Hub → multi-arch build fails. To restore arm64: switch base images
          # to non-alpine variants OR use eclipse-temurin:*-jdk-alpine (arm64-supported).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        run: echo "${{ matrix.service }} digest=${{ steps.build_push.outputs.digest }}"

      # GAP-400: Trivy scan — fail on HIGH/CRITICAL fixable CVEs
      - name: Trivy vulnerability scan (gate per tag class — staging info-only, prod strict)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}
          # Per release-deploy-standard.md §3.1 PRE-RELEASE: "Trivy zero
          # HIGH/CRITICAL recommended không mandatory cho *-staging.* tags".
          #
          # Shift-left security policy:
          # - staging.* tags     → SCAN + REPORT (exit-code 0; visibility-only)
          # - main / v[0-9]+.*   → SCAN + BLOCK (exit-code 1; HIGH+CRITICAL strict)
          #
          # Phase 1 BETA invite-only ~10-20 tenants (ADR-025) accepts CVE backlog
          # for staging tags while we ship dep-bump GAPs (GAP-440 Spring Boot,
          # GAP-441 pom hygiene, GAP-442 alpine 3.23→3.24). Production v1.0.0
          # tag will be gated by the strict bar via this same workflow.
          #
          # SARIF still uploaded to GitHub Security tab regardless of gate
          # (next step) — full vulnerability inventory remains visible/triaged.
          severity: 'HIGH,CRITICAL'
          exit-code: ${{ contains(github.ref, '-staging.') && '0' || '1' }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

      # GAP-402: Syft SBOM (CycloneDX)
      - name: Generate Syft SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      # GAP-402: Cosign keyless signing (sigstore OIDC)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}"

      - name: Attach SBOM as Cosign attestation
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            --type cyclonedx \
            "${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${{ steps.build_push.outputs.digest }}"

  # ==========================================================================
  # Job 3: Notify
  # ==========================================================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-test, push-to-ecr]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "=== Build Status ==="
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Push to ECR: ${{ needs.push-to-ecr.result }}"

          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "Docker images build verification failed"
            exit 1
          fi

          echo "Docker images build verification passed"

          case "${{ needs.push-to-ecr.result }}" in
            success)
              echo "Images pushed to ECR ap-southeast-1, scanned, signed, SBOM attached"
              ;;
            skipped)
              echo "ECR push skipped (PR / non-main / AWS not configured)"
              ;;
            *)
              echo "ECR push: ${{ needs.push-to-ecr.result }}"
              ;;
          esac
