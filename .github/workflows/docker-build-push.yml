name: Build and Push KiteClass Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'docker/**'
      - 'kiteclass/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-push.yml'
  # Narrowed 2026-04-24: previously triggered on every PR touching kiteclass/**
  # (i.e. ~all code PRs). Docker build is ~4-5 min wall-clock and on PRs only
  # verifies Dockerfile parses — it never pushes (push-to-ecr gates on main).
  # Normal code PRs now skip this workflow; only PRs that actually touch the
  # Docker layer still run it as a safety net.
  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - 'docker/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

# Added 2026-04-24: batch-merge sessions (e.g. 7 Wave 5 + Dependabot merges
# within 3 min) used to fire 7 full build-and-push runs — wasteful and only
# the newest ECR image matters. Grouping by ref means a fresh push on main
# cancels any in-progress run on main; PR/tag runs are grouped independently
# so they don't starve each other.
concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_CORE: kiteclass/core
  ECR_REPOSITORY_GATEWAY: kiteclass/gateway
  ECR_REPOSITORY_FRONTEND: kiteclass/frontend

jobs:
  # Job 1: Build Docker images (always run - verify Dockerfiles work)
  build-test:
    name: Build Docker Images (Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        service: [core, gateway, frontend]
        include:
          # frontend uses repo-root context for pnpm workspace (ADR-024 / GAP-284)
          - service: frontend
            context: .
          - service: core
            context: kiteclass/kiteclass-core
          - service: gateway
            context: kiteclass/kiteclass-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: kiteclass/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=test

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: kiteclass/kiteclass-${{ matrix.service }}/Dockerfile
          push: false  # Only build, don't push (no registry needed)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Build summary
        run: |
          echo "✅ Docker image built successfully: ${{ matrix.service }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # Job 2: Push to AWS ECR (only if AWS configured and main branch)
  push-to-ecr:
    name: Push to AWS ECR
    runs-on: ubuntu-latest
    needs: build-test  # Only run after build-test succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_CONFIGURED == 'true'
    permissions:
      id-token: write # Required for AWS OIDC
      contents: read
      security-events: write  # For Trivy SARIF upload

    strategy:
      matrix:
        service: [core, gateway, frontend]
        include:
          # frontend uses repo-root context for pnpm workspace (ADR-024 / GAP-284)
          - service: frontend
            context: .
          - service: core
            context: kiteclass/kiteclass-core
          - service: gateway
            context: kiteclass/kiteclass-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/kiteclass/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to ECR
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: kiteclass/kiteclass-${{ matrix.service }}/Dockerfile
          push: true  # Push to ECR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/kiteclass/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Notify status
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-test, push-to-ecr]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "=== Build Status ==="
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Push to ECR: ${{ needs.push-to-ecr.result }}"

          # CRITICAL FIX: Check build-test result FIRST (blocking)
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "❌ Docker images build verification failed"
            exit 1
          fi

          echo "✅ Docker images build verification passed"

          # Handle push-to-ecr status (informational, never blocks)
          case "${{ needs.push-to-ecr.result }}" in
            success)
              echo "✅ Images pushed to ECR successfully"
              ;;
            skipped)
              echo "⏭️  ECR push skipped (not main branch or PR)"
              ;;
            *)
              echo "⚠️  ECR push: ${{ needs.push-to-ecr.result }} (AWS credentials not configured - expected)"
              ;;
          esac
