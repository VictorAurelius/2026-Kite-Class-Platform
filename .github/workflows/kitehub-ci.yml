name: Test — KiteHub Platform

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  # Path-filter scoped to BACKEND services 2026-05-07 — exclude kitehub-frontend/** which
  # has its own kitehub-frontend-ci.yml. Previously `kitehub/**` matched FE changes and
  # fired 6 backend tests unnecessarily (~40min CI time per FE-only PR).
  pull_request:
    branches:
      - main
    paths:
      - 'kitehub/kitehub-admin/**'
      - 'kitehub/kitehub-base/**'
      - 'kitehub/kitehub-branding/**'
      - 'kitehub/kitehub-email/**'
      - 'kitehub/kitehub-gateway/**'
      - 'kitehub/kitehub-platform/**'
      - 'kitehub/kitehub-subscription/**'
      - 'kitehub/pom.xml'
      - 'kitehub/mvnw'
      - 'kitehub/mvnw.cmd'
      - 'kitehub/.mvn/**'
      - 'kitehub/docker/**'
      - 'kitehub/docker-compose*.yml'
      - '.github/workflows/kitehub-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  security-events: write

jobs:
  test-platform:
    name: Test KiteHub Platform Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build Platform Module (strict-warnings profile — GAP-245 Phase 1)
        working-directory: kitehub
        run: ./mvnw clean install -pl kitehub-platform -am -DskipTests -P strict-warnings
        # strict-warnings surfaces deprecation/unchecked/rawtypes/cast/overrides.
        # Phase 1 = show only; Phase 2 (GAP-261) flips to -Werror after burndown.

  test-subscription:
    name: Test KiteHub Subscription Service
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build and Test Subscription Service (strict-warnings — GAP-245)
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-subscription -am -P strict-warnings

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-subscription
          path: kitehub/kitehub-subscription/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-subscription/target/surefire-reports/*.xml

  test-branding:
    name: Test KiteHub Branding Service
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build and Test Branding Service (strict-warnings — GAP-245)
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-branding -am -P strict-warnings

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-branding
          path: kitehub/kitehub-branding/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-branding/target/surefire-reports/*.xml

  test-admin:
    name: Test KiteHub Admin Service
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      # GAP-382: build-time detector for admin scan drift (recurrence #4 prevention).
      # Fails BEFORE mvn verify when subscription adds entity/repository package
      # without updating KiteHubAdminApplication. See feedback_admin_scan_packages_after_module_add.md.
      - name: Admin scan coverage (drift detector — GAP-382)
        run: bash scripts/check-admin-scan-coverage.sh

      # GAP-241/242/243 closed 2026-04-27: AdminControllerTest now passes (V11 SQL fixed,
      # S3 mock + RabbitTemplate @MockBean wired in @DynamicPropertySource). Run full
      # admin suite (23 tests) without exclusions.
      - name: Build and Test Admin Service (strict-warnings — GAP-245)
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-admin -am -P strict-warnings

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-admin
          path: kitehub/kitehub-admin/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-admin/target/surefire-reports/*.xml

  test-email:
    name: Test KiteHub Email Service
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build and Test Email Service (strict-warnings — GAP-245)
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-email -am -P strict-warnings

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-email
          path: kitehub/kitehub-email/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-email/target/surefire-reports/*.xml

  test-gateway:
    name: Test KiteHub Gateway
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build and Test Gateway (strict-warnings — GAP-245)
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-gateway -am -P strict-warnings

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-gateway
          path: kitehub/kitehub-gateway/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-gateway/target/surefire-reports/*.xml

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [test-subscription, test-branding, test-admin, test-email, test-gateway]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Run Code Quality Checks
        working-directory: kitehub
        run: ./mvnw verify -pl kitehub-subscription -am -DskipTests

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: kitehub/kitehub-subscription/target/site/jacoco/jacoco.xml
          flags: kitehub-subscription

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
        continue-on-error: true

      - name: Check for hardcoded passwords in docker-compose
        run: |
          echo "Checking docker-compose files for hardcoded passwords..."
          FOUND=0
          for file in $(find . -name "docker-compose*.yml" -not -path "./.git/*"); do
            # Check for passwords that are NOT env var references
            if grep -P "PASSWORD:.*[^}]$" "$file" | grep -v '${' | grep -v '#' | grep -qv "CHANGE_ME"; then
              echo "❌ Hardcoded password found in: $file"
              grep -n -P "PASSWORD:.*[^}]$" "$file" | grep -v '${' | grep -v '#'
              FOUND=1
            fi
          done
          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded passwords found in docker-compose files"
          else
            echo "::warning::Hardcoded passwords detected in docker-compose files"
          fi
