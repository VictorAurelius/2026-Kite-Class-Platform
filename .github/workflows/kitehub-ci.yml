name: KiteHub Platform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'kitehub/**'
      - '.github/workflows/kitehub-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kitehub/**'
      - '.github/workflows/kitehub-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  security-events: write

jobs:
  test-platform:
    name: Test KiteHub Platform Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build Platform Module
        working-directory: kitehub
        run: ./mvnw clean install -pl kitehub-platform -am -DskipTests

  test-subscription:
    name: Test KiteHub Subscription Service
    runs-on: ubuntu-latest
    needs: test-platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Build and Test Subscription Service
        working-directory: kitehub
        run: ./mvnw clean test -pl kitehub-subscription -am

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-subscription
          path: kitehub/kitehub-subscription/target/surefire-reports/

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            kitehub/kitehub-subscription/target/surefire-reports/*.xml

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test-subscription

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven wrapper executable
        working-directory: kitehub
        run: chmod +x mvnw

      - name: Run Code Quality Checks
        working-directory: kitehub
        run: ./mvnw verify -pl kitehub-subscription -am -DskipTests

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: kitehub/kitehub-subscription/target/site/jacoco/jacoco.xml
          flags: kitehub-subscription
