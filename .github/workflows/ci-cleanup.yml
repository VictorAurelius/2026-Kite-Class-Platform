# CI History Cleanup — GAP-205 (tightened 2026-04-24 per solo-dev policy)
#
# Weekly scheduled cleanup of old CI runs per CLAUDE.md §CI History Hygiene.
# Runs Monday 04:00 Asia/Ho_Chi_Minh (= Sunday 21:00 UTC).
#
# Retention rules (precedence top → bottom):
#   1. Always preserve 2 newest failed runs on `main` (debug reference)
#   2. Preserve 50 newest runs overall (by createdAt)
#   3. Always delete "Dependabot Updates" failures (pnpm transitive limitation)
#   4. Always delete failed runs on feature branches >1 day old
#   5. Delete everything else not in the preserve set
#
# Also supports on-demand trigger via workflow_dispatch with dry_run preview.

name: Ops — CI History Cleanup

on:
  schedule:
    # Monday 04:00 Asia/Ho_Chi_Minh = Sunday 21:00 UTC
    - cron: '0 21 * * SUN'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (log what would be deleted, do not delete)'
        type: boolean
        default: false
      keep_newest:
        description: 'Override: number of newest runs to preserve (default 50)'
        type: string
        default: '50'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Prune old CI runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute preserve + delete sets
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_N: ${{ github.event.inputs.keep_newest || '50' }}
        run: |
          set -euo pipefail
          ONE_DAY_AGO=$(date -u -d '1 day ago' -Iseconds)

          # Dump all runs once for consistent filtering
          gh run list --limit 1000 \
            --json databaseId,createdAt,conclusion,name,headBranch \
            > /tmp/all-runs.json

          TOTAL=$(jq 'length' /tmp/all-runs.json)
          echo "Total runs: $TOTAL"

          # Preserve set 1: 2 newest failed runs on main
          PRESERVE_FAILED_MAIN=$(jq -r '
            [.[] | select(.conclusion=="failure" and .headBranch=="main")]
            | sort_by(.createdAt) | reverse | .[0:2] | .[].databaseId
          ' /tmp/all-runs.json | sort -u)

          # Preserve set 2: KEEP_N newest runs overall
          PRESERVE_NEWEST=$(jq -r --argjson n "$KEEP_N" '
            sort_by(.createdAt) | reverse | .[0:$n] | .[].databaseId
          ' /tmp/all-runs.json | sort -u)

          # Union of preserve sets
          printf '%s\n%s\n' "$PRESERVE_FAILED_MAIN" "$PRESERVE_NEWEST" \
            | grep -v '^$' | sort -u > /tmp/preserve.txt
          PRESERVE_COUNT=$(wc -l < /tmp/preserve.txt | tr -d ' ')
          echo "Preserve: $PRESERVE_COUNT runs (newest $KEEP_N + failed-main top 2)"

          # Forced-delete set (always): Dependabot Updates failures + feature-branch failures >1d old
          jq -r --arg cutoff "$ONE_DAY_AGO" '
            .[] | select(
              (.conclusion=="failure" and .name=="Dependabot Updates")
              or (.conclusion=="failure" and .headBranch != "main" and .createdAt < $cutoff)
            ) | .databaseId
          ' /tmp/all-runs.json | sort -u > /tmp/force-delete.txt

          # Candidates: all runs NOT in preserve set
          jq -r '.[].databaseId' /tmp/all-runs.json | sort -u > /tmp/all-ids.txt
          comm -23 /tmp/all-ids.txt /tmp/preserve.txt > /tmp/delete-candidates.txt

          # Final delete = candidates ∪ force-delete (force-delete overrides preserve for Dependabot etc.)
          cat /tmp/delete-candidates.txt /tmp/force-delete.txt | sort -u > /tmp/delete-ids.txt

          DELETE_COUNT=$(wc -l < /tmp/delete-ids.txt | tr -d ' ')
          echo "Scheduled for deletion: $DELETE_COUNT runs"
          echo "delete_count=$DELETE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_before=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Delete runs
        if: steps.plan.outputs.delete_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏃 DRY RUN — would delete these runs:"
            cat /tmp/delete-ids.txt
            exit 0
          fi

          DELETED=0
          FAILED=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if gh api --method DELETE "repos/$REPO/actions/runs/$id" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/delete-ids.txt

          echo "✅ Deleted $DELETED runs (started with ${{ steps.plan.outputs.total_before }})"
          [ "$FAILED" -gt 0 ] && echo "⚠️ $FAILED deletions failed (rate limit or already-deleted)"
          echo "Remaining runs: $(gh run list --limit 1000 --json databaseId --jq 'length')"

      - name: Hard-cap safety net (>100 total)
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(gh run list --limit 1000 --json databaseId --jq 'length')
          if [ "$TOTAL" -gt 100 ]; then
            EXCESS=$((TOTAL - 50))
            echo "⚠️ Total ($TOTAL) exceeds hard cap 100. Pruning oldest $EXCESS to reach soft cap 50..."
            gh run list --limit 1000 --json databaseId,createdAt \
              --jq "sort_by(.createdAt) | .[0:$EXCESS] | .[].databaseId" \
              | while IFS= read -r id; do
                  [ -z "$id" ] && continue
                  gh api --method DELETE "repos/$REPO/actions/runs/$id" 2>/dev/null || true
                done
            echo "✅ Hard-cap enforced. Remaining: $(gh run list --limit 1000 --json databaseId --jq 'length')"
          else
            echo "✅ Total runs ($TOTAL) within hard cap 100"
          fi
