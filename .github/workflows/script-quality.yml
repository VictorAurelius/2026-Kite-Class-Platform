name: Script Quality (ShellCheck + Ruff + Rule Frontmatter + Skill Conventions + README Freshness + Alert Runbook URL + Helm Lint + Gap Status CSV)

# Closes GAP-194 — CI enforcement of script standard defined in
# `.claude/skills/quality/script-review/SKILL.md` + `output-review-mandate.md` §5.5.
# Closes GAP-250 — CI enforcement of rule frontmatter spec defined in
# `.claude/rules/rule-change-process.md` §3 (paired with GAP-249 backfill).
# Closes GAP-251 — CI enforcement of skill convention spec defined in
# `.claude/rules/skill-conventions.md` (paired with Move 2 script + fixtures).
# Closes GAP-255 — CI enforcement of README freshness (Last-Updated date check
# 30d WARN / 90d FAIL) per `output-review-mandate.md` §3 row "README freshness".
# Closes GAP-122 Slice A — CI enforcement that every Prometheus alert has a
# non-empty `runbook_url` annotation (paired with Slice B alerts + Slice C runbooks).
# Closes GAP-467 AC #5 — CI guard preventing regression of Go-templates-in-values.yaml
# that broke `helm lint` on main (PR #984). Wave 57 chữa root cause; Wave 58 thêm guard.
#
# Triggered by any change to *.sh, *.py, `.claude/rules/**.md`,
# `.claude/skills/**.md`, or `**/README.md` in scope paths. Non-scope changes skip.
# Baseline (2026-04-20): shellcheck -S error = 0 issues, ruff check = 0 issues.
# Baseline (2026-04-28): rule-frontmatter = 14/14 rules compliant; skill-conventions = 44 PASS / 38 WARN / 0 FAIL; readme-freshness = 4 PASS / 42 WARN / 0 FAIL.

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '**/*.py'
      - '.shellcheckrc'
      - 'ruff.toml'
      - '.github/workflows/script-quality.yml'
      - '.claude/rules/**.md'
      - 'scripts/check-rule-frontmatter.sh'
      - 'scripts/fixtures/rule-frontmatter/**'
      - '.claude/skills/**.md'
      - 'scripts/check-skill-conventions.sh'
      - '.claude/skills/quality/skill-conventions-check/data/fixtures/**'
      - '**/README.md'
      - '**/_README*.md'
      - 'scripts/check-readme-freshness.sh'
      - 'scripts/fixtures/readme-freshness/**'
      - '**/alert-rules.yml'
      - '**/prometheusrule.yaml'
      - 'scripts/check-alert-runbook-url.py'
      - 'scripts/fixtures/alert-runbook-url/**'
      - 'infrastructure/helm/**'
      - 'scripts/check-helm-lint.sh'
      - 'documents/04-quality/gaps/**'
      - 'scripts/check-gap-status-csv.sh'
      - 'scripts/migrate-gaps-to-csv.py'
      - 'documents/02-architecture/adr/**'
      - 'scripts/check-adrs-index-csv.sh'
      - '.claude/rules/**'
      - 'scripts/check-rules-index-csv.sh'
      - 'documents/04-quality/audits/**'
      - 'scripts/check-audits-index-csv.sh'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Need prior commit for "changed files" diff on push events.
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Determine changed shell scripts
        id: changed
        run: |
          # On PR: diff against base. On push: diff against previous commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Fall back to full scope if base SHA missing or identical.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts kitehub/scripts kiteclass/scripts -name '*.sh' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.sh' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .sh files: $FILES"

      - name: Run ShellCheck on changed files (error severity, blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running shellcheck -S error on changed files..."
          # shellcheck-disable: 0. If baseline breaks, fix script or add justified `# shellcheck disable=SCxxxx`.
          # shellcheck reads .shellcheckrc automatically from repo root.
          shellcheck -S error ${{ steps.changed.outputs.files }}

      - name: Run ShellCheck (warning severity, non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Warnings (informational, non-blocking):"
          shellcheck -S warning ${{ steps.changed.outputs.files }} || true

      - name: No shell files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.sh files changed — skipping."

  ruff:
    name: Ruff (Python scripts + hooks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          pip install ruff==0.15.11
          ruff --version

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts .claude/hooks -name '*.py' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $FILES"

      - name: Run Ruff lint on changed files (blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running ruff check (reads ruff.toml from repo root)..."
          ruff check ${{ steps.changed.outputs.files }}

      - name: Run Ruff format check (non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Format diff (informational, non-blocking):"
          ruff format --check --diff ${{ steps.changed.outputs.files }} || true

      - name: No Python files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.py files changed — skipping."

  rule-frontmatter:
    name: Rule frontmatter (`.claude/rules/*.md`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed rule files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find .claude/rules -maxdepth 1 -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '.claude/rules/*.md' | tr '\n' ' ')
          fi
          # Also pick up changes to the validator script or its fixtures —
          # any of those should re-run the full directory scan.
          if git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- 'scripts/check-rule-frontmatter.sh' 'scripts/fixtures/rule-frontmatter' 2>/dev/null | grep -q .; then
            FILES=$(find .claude/rules -maxdepth 1 -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed rule files: $FILES"

      - name: Run self-test (fixtures)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running self-test against synthetic fixtures..."
          bash scripts/check-rule-frontmatter.sh --self-test

      - name: Validate changed rule files (blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Validating frontmatter for changed rule files..."
          bash scripts/check-rule-frontmatter.sh --all --paths "${{ steps.changed.outputs.files }}"

      - name: No rule files changed
        if: steps.changed.outputs.files == ''
        run: echo "No rule files changed — skipping."

  skill-conventions:
    name: Skill conventions (`.claude/skills/**/SKILL.md`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed skill files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find .claude/skills -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '.claude/skills/**' | tr '\n' ' ')
          fi
          # Also re-scan whole skills tree on validator script or fixture changes
          if git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- 'scripts/check-skill-conventions.sh' '.claude/skills/quality/skill-conventions-check/data/fixtures' 2>/dev/null | grep -q .; then
            FILES=$(find .claude/skills -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed skill files: $FILES"

      - name: Validate skill conventions (blocking on FAIL, WARN-only allowed)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running skill-conventions full-repo check..."
          # Script exits 0 on PASS+WARN-only (grandfathered exemptions); exits 1 on any FAIL.
          # See .claude/rules/skill-conventions.md + GAP-251 for spec.
          bash scripts/check-skill-conventions.sh

      - name: No skill files changed
        if: steps.changed.outputs.files == ''
        run: echo "No skill files changed — skipping."

  readme-freshness:
    name: README freshness (`**/README.md`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Run self-test (5 fixtures — 3 dynamic + 2 committed)"
        run: |
          # Self-test asserts script behavior on synthetic fixtures.
          # Fails fast if regex/date logic regresses.
          bash scripts/check-readme-freshness.sh --self-test

      - name: Validate README freshness (blocking on FAIL >90d, WARN-only at 31-90d)
        run: |
          # Default mode: silent PASS ≤30d, WARN 31-90d, FAIL >90d.
          # Workflow paths filter already restricts this job to PRs touching
          # README.md or the validator script — no need to re-filter changed files.
          bash scripts/check-readme-freshness.sh

  alert-runbook-url:
    name: Alert runbook_url (Prometheus alert annotations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run self-test (4 fixtures — 2 PASS / 2 FAIL incl. Helm-templated)
        run: |
          # Self-test asserts script behavior on synthetic fixtures
          # (good-with-runbook, good-helm-template → PASS;
          #  bad-missing-runbook, bad-empty-runbook → FAIL).
          # Fails fast if regex/scan logic regresses.
          python3 scripts/check-alert-runbook-url.py --self-test

      - name: Validate alert runbook_url annotations (blocking on FAIL)
        run: |
          # Default mode scans:
          #   - kitehub/docker/prometheus/alert-rules.yml
          #   - kiteclass/docker/prometheus/alert-rules.yml
          #   - infrastructure/helm/kitehub/templates/prometheusrule.yaml
          # Workflow paths filter already restricts this job to PRs touching
          # alert YAML files or the validator — no need to re-filter changed files.
          python3 scripts/check-alert-runbook-url.py

  helm-lint:
    name: Helm lint (`infrastructure/helm/kitehub`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Run helm lint + template (blocking on FAIL)
        env:
          CI: 'true'
        run: |
          # Closes GAP-467 AC #5 — CI guard against Go-templates-in-values.yaml
          # regression. Wave 57 chữa root cause (extract → templates/alertmanager-config.yaml);
          # this job ensures `helm lint` + `helm template` stay clean on main.
          # Workflow paths filter restricts this job to PRs touching
          # infrastructure/helm/** or the validator script.
          bash scripts/check-helm-lint.sh

  gap-status-csv:
    name: Gap status CSV (`documents/04-quality/gaps/gap-status.csv`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate gap-status.csv (Phase 2 — 100% coverage)
        run: |
          # Phase 2 mode: every active gap file MUST have a CSV row, and every
          # CSV row MUST point to an existing gap file. CSV is canonical for
          # status / priority / phase / completion_pct per
          # `.claude/rules/gap-architecture-v2.md`.
          bash scripts/check-gap-status-csv.sh

  meta-csv-indexes:
    name: Meta CSV indexes (ADRs + Rules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate adrs-index.csv (100% coverage)
        run: |
          # Per `.claude/rules/meta-csv-index-pattern.md`: every ADR file MUST
          # have a CSV row + every row MUST point to existing file. CSV is
          # canonical for ADR enumeration (number, status, date, title).
          bash scripts/check-adrs-index-csv.sh

      - name: Validate rules-index.csv (100% coverage)
        run: |
          # Per `.claude/rules/meta-csv-index-pattern.md`: every rule file MUST
          # have a CSV row. CSV is canonical for rule enumeration. Content
          # validation (Last-Reviewed ≤ today, etc.) handled by separate
          # `rule-frontmatter` job above.
          bash scripts/check-rules-index-csv.sh

  audits-index-csv:
    name: Audits index CSV (`documents/04-quality/audits/audits-index.csv`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate audits-index.csv (100% coverage)
        run: |
          # Per `.claude/rules/meta-csv-index-pattern.md` (Wave 76 Bucket A,
          # GAP-490 Tier 3): every audit file under
          # documents/04-quality/audits/**/*.md (excluding README/template)
          # MUST have a CSV row; every row MUST point to an existing file.
          # CSV is canonical for audit enumeration (id, category, date,
          # status, score). Schema + enums documented in CSV header.
          bash scripts/check-audits-index-csv.sh
