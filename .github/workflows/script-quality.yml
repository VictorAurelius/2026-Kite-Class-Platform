name: Script Quality (ShellCheck + Ruff + Rule Frontmatter)

# Closes GAP-194 — CI enforcement of script standard defined in
# `.claude/skills/quality/script-review/SKILL.md` + `output-review-mandate.md` §5.5.
# Closes GAP-250 — CI enforcement of rule frontmatter spec defined in
# `.claude/rules/rule-change-process.md` §3 (paired with GAP-249 backfill).
#
# Triggered by any change to *.sh, *.py, or `.claude/rules/**.md` in scope paths.
# Non-scope changes skip.
# Baseline (2026-04-20): shellcheck -S error = 0 issues, ruff check = 0 issues.
# Baseline (2026-04-28): rule-frontmatter = 14/14 rules compliant.

on:
  # Solo-dev mode (2026-04-24): post-merge push:main trigger removed to save resources.
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '**/*.py'
      - '.shellcheckrc'
      - 'ruff.toml'
      - '.github/workflows/script-quality.yml'
      - '.claude/rules/**.md'
      - 'scripts/check-rule-frontmatter.sh'
      - 'scripts/fixtures/rule-frontmatter/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Need prior commit for "changed files" diff on push events.
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Determine changed shell scripts
        id: changed
        run: |
          # On PR: diff against base. On push: diff against previous commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Fall back to full scope if base SHA missing or identical.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts kitehub/scripts kiteclass/scripts -name '*.sh' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.sh' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .sh files: $FILES"

      - name: Run ShellCheck on changed files (error severity, blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running shellcheck -S error on changed files..."
          # shellcheck-disable: 0. If baseline breaks, fix script or add justified `# shellcheck disable=SCxxxx`.
          # shellcheck reads .shellcheckrc automatically from repo root.
          shellcheck -S error ${{ steps.changed.outputs.files }}

      - name: Run ShellCheck (warning severity, non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Warnings (informational, non-blocking):"
          shellcheck -S warning ${{ steps.changed.outputs.files }} || true

      - name: No shell files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.sh files changed — skipping."

  ruff:
    name: Ruff (Python scripts + hooks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          pip install ruff==0.15.11
          ruff --version

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts .claude/hooks -name '*.py' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $FILES"

      - name: Run Ruff lint on changed files (blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running ruff check (reads ruff.toml from repo root)..."
          ruff check ${{ steps.changed.outputs.files }}

      - name: Run Ruff format check (non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Format diff (informational, non-blocking):"
          ruff format --check --diff ${{ steps.changed.outputs.files }} || true

      - name: No Python files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.py files changed — skipping."

  rule-frontmatter:
    name: Rule frontmatter (`.claude/rules/*.md`)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed rule files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find .claude/rules -maxdepth 1 -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '.claude/rules/*.md' | tr '\n' ' ')
          fi
          # Also pick up changes to the validator script or its fixtures —
          # any of those should re-run the full directory scan.
          if git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- 'scripts/check-rule-frontmatter.sh' 'scripts/fixtures/rule-frontmatter' 2>/dev/null | grep -q .; then
            FILES=$(find .claude/rules -maxdepth 1 -name '*.md' -type f 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed rule files: $FILES"

      - name: Run self-test (fixtures)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running self-test against synthetic fixtures..."
          bash scripts/check-rule-frontmatter.sh --self-test

      - name: Validate changed rule files (blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Validating frontmatter for changed rule files..."
          bash scripts/check-rule-frontmatter.sh --all --paths "${{ steps.changed.outputs.files }}"

      - name: No rule files changed
        if: steps.changed.outputs.files == ''
        run: echo "No rule files changed — skipping."
