name: Quality — Code (ShellCheck + Ruff + Script tests + Cross-layer drift + Mermaid)

# Split from script-quality.yml 21-job bloated workflow (2026-05-22)
# Domain: code-touching jobs (Bash / Python / Java + cross-layer contract drift + Mermaid diagram syntax)
# Sister workflows:
#   - quality-docs.yml          — Documents / gaps / audits / waves / READMEs
#   - quality-rules-skills.yml  — Rules / skills / Env vars / Meta CSV indexes
#   - quality-infra.yml         — Helm / Prometheus alerts
#
# Baseline (2026-04-20): shellcheck -S error = 0 issues, ruff check = 0 issues.

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '**/*.py'
      - '.shellcheckrc'
      - 'ruff.toml'
      - '.github/workflows/quality-code.yml'
      - 'scripts/tests/**'
      - 'scripts/check-cross-layer-contract-drift.sh'
      - 'scripts/check-be-fe-url-contract.sh'
      - 'scripts/check-stale-domain-references.sh'
      - 'scripts/check-mermaid-sequence-state-br.sh'
      - 'scripts/check-entity-mapper-consistency.sh'
      - 'scripts/check-test-skip-ratio.sh'
      - 'scripts/check-public-page-duplicate-chrome.sh'
      - 'kitehub/kitehub-frontend/src/app/(public)/**'
      - 'kiteclass/kiteclass-frontend/src/**/*.test.tsx'
      - 'kiteclass/kiteclass-frontend/src/**/*.spec.tsx'
      - 'kitehub/kitehub-frontend/src/**/*.test.tsx'
      - 'kitehub/kitehub-frontend/src/**/*.spec.tsx'
      - '**/*Entity.java'
      - '**/V*.sql'
      - '**/*Mapper.java'
      - 'kitehub/**/*.java'
      - 'kiteclass/**/*.java'
      - 'documents/01-business/**/api-contract.md'
      - '**/*.md'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Need prior commit for "changed files" diff on push events.
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          # Self-hosted runner: shellcheck pre-installed in user PATH; skip apt
          # (sudo apt-get needs NOPASSWD which the runner doesn't have).
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already on PATH: $(command -v shellcheck)"
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Determine changed shell scripts
        id: changed
        run: |
          # On PR: diff against base. On push: diff against previous commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Fall back to full scope if base SHA missing or identical.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts kitehub/scripts kiteclass/scripts -name '*.sh' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.sh' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .sh files: $FILES"

      - name: Run ShellCheck on changed files (error severity, blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running shellcheck -S error on changed files..."
          # shellcheck-disable: 0. If baseline breaks, fix script or add justified `# shellcheck disable=SCxxxx`.
          # shellcheck reads .shellcheckrc automatically from repo root.
          shellcheck -S error ${{ steps.changed.outputs.files }}

      - name: Run ShellCheck (warning severity, non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Warnings (informational, non-blocking):"
          shellcheck -S warning ${{ steps.changed.outputs.files }} || true

      - name: No shell files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.sh files changed — skipping."


  ruff:
    name: Ruff (Python scripts + hooks)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          pip install ruff==0.15.11
          ruff --version

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            FILES=$(find scripts .claude/hooks -name '*.py' -type f 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE" "$HEAD" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $FILES"

      - name: Run Ruff lint on changed files (blocking)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Running ruff check (reads ruff.toml from repo root)..."
          ruff check ${{ steps.changed.outputs.files }}

      - name: Run Ruff format check (non-blocking — reports only)
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          echo "Format diff (informational, non-blocking):"
          ruff format --check --diff ${{ steps.changed.outputs.files }} || true

      - name: No Python files changed
        if: steps.changed.outputs.files == ''
        run: echo "No *.py files changed — skipping."


  mermaid-sequence-state-br:
    name: Mermaid `<br/>` in sequence/state diagrams (recurrence #6+#7 prevention)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect `<br/>` in sequence/state diagrams (WARN mode 7-day grace)
        run: |
          # Per `diagram-format-selection.md` v1.0.2 §4 HARD RULE:
          # Mermaid sequence/state parsers unreliable với HTML breaks.
          # flowchart blocks DO support <br/> (not flagged).
          # Triggered by Wave 99B recurrence #6+#7 (multi-tenant §3 + kitehub admin §3.3).
          # Self-test runs locally only (subshell scoping fragile in CI); CI scans real repo.
          bash scripts/check-mermaid-sequence-state-br.sh --warn


  stale-domain-references:
    name: Stale domain references (kiteclass.vn/.com → kitehub.me — GAP-1241)  # stale-domain-ok: detector self-naming
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (FAIL + keep-marker + canonical + archived fixtures)
        run: bash scripts/check-stale-domain-references.sh --self-test

      - name: Detect stale tenant-platform domain (WARN mode — GAP-1241)
        run: |
          # Canonical platform domain = kitehub.me ; tenant landing = {slug}.kitehub.me.
          # Any literal kiteclass.vn / kiteclass.com in active code/docs makes Claude (stale-domain-ok)
          # + readers believe the wrong domain is the product surface. Intentional
          # historical keeps carry an inline `# stale-domain-ok` marker.
          bash scripts/check-stale-domain-references.sh --warn

  cross-layer-contract-drift:
    name: Cross-layer contract drift (controller vs api-contract.md)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (match + drift fixtures)
        run: bash scripts/check-cross-layer-contract-drift.sh --self-test

      - name: Detect drift (WARN mode — heuristic v1)
        run: |
          # Per `contract-first-for-cross-layer.md` §6.2 (closes deferred-detector debt)
          # + Wave 98 GAP-662 incident: EmailController @RequestMapping("/api/platform/emails")
          # vs documented Endpoint /api/email — 3-way drift code/doc/test.
          # Heuristic v1; manual review still recommended for complex paths.
          bash scripts/check-cross-layer-contract-drift.sh --warn


  be-fe-url-contract:
    name: BE→FE URL contract (GAP-802 #2 — controller link path vs Next.js route)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (pass + fail fixtures)
        run: bash scripts/tests/test-check-be-fe-url-contract.sh

      - name: Detect BE→FE URL drift (HARD STOP — GAP-802 #2)
        run: |
          # Per GAP-802 mechanism #2 + GAP-801 incident: BE builds FE-path URL
          # (e.g. /signup/beta) that has no matching Next.js App Router route →
          # invitee email link 404. HARD STOP: scans kitehub-frontend +
          # kiteclass/kiteclass-frontend App Router; /reset-password false-positive
          # resolved (path-scope fix) — check passes clean on main.
          bash scripts/check-be-fe-url-contract.sh


  fe-be-api-contract:
    name: FE→BE API contract (GAP-802 #3 — FE axios/fetch method+path vs BE @Mapping)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (case A flags pre-GAP-1069 drift, case B passes post-fix)
        run: bash scripts/tests/test-check-fe-be-api-contract.sh

      - name: Detect FE→BE API drift (WARN-mode — GAP-1070)
        run: |
          # GAP-1070 + GAP-1069: FE calls GET /api/v1/classes (collection) but BE only
          # exposes /api/v1/classes/{id} → 404 from browser dashboard, invisible to curl.
          # WARN-mode (exit 0); 6 known false-positives (gateway-routed /api/auth/*,
          # cross-service /api/platform/*, singular /api/v1/instance/config). HARD-STOP
          # promotion deferred until FP allowlist lands.
          bash scripts/check-fe-be-api-contract.sh


  dashboard-shell-wrapper:
    name: Dashboard shell-wrapper (GAP-1071 — (dashboard) page wraps shell or marked exempt)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect dashboard pages missing shell wrapper (WARN-mode — GAP-1071)
        run: |
          # GAP-1071: (dashboard)/**/page.tsx must wrap DashboardLayout / ParentShell /
          # StudentMobileShell / TeacherShell / MobileShell OR carry `// shell-exempt:`
          # marker. Missing both → bare layout (no header/sidebar/footer), invisible to
          # curl, surfaced at G2 browser. WARN-mode (exit 0); HARD-STOP deferred.
          bash scripts/check-dashboard-shell-wrapper.sh


  public-page-duplicate-chrome:
    name: (public) page duplicate chrome (GAP-1110 — header/main/footer dup vs PublicLayout)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect duplicate chrome in (public) pages (WARN mode — GAP-1110)
        run: |
          # GAP-1110: pages under kitehub-frontend src/app/(public)/** are wrapped by
          # PublicLayout (header + <main> + Footer). A page rendering its own top-level
          # <header>/<main>/<footer> duplicates the site chrome + nests a 2nd <main>
          # (invalid HTML, visible on SSR/no-JS/bots). Surfaced 2026-06-10 G2 walk on
          # /contact; sweep found /waitlist + homepage (LandingShellSSR) + 5 nested-main
          # pages. Fixed commit 7e6cc613. Per cross-flow-bug-class-sweep.md §4.1
          # (statically-detectable class → persistent detector). WARN-mode (exit 0);
          # HARD STOP (--strict) deferred until 2nd recurrence.
          bash scripts/check-public-page-duplicate-chrome.sh --warn


  entity-mapper-consistency:
    name: Entity ↔ Migration ↔ Mapper triad drift (GAP-743)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (PASS + FAIL fixtures)
        run: bash scripts/check-entity-mapper-consistency.sh --self-test

      - name: Scan repo (WARN mode — heuristic v1 per GAP-743)
        run: |
          # Closes GAP-743 (Wave meta-1 Bucket D). Per audit-1 OPS-BR4-002:
          # Wave br-4 had 60% hotfix rate; hotfix #1784 Course.pricingModel was
          # entity field added without matching Flyway migration column.
          # Heuristic v1: grep-based camelCase→snake_case mapping. Accept
          # moderate FP; HARD STOP defer until 2nd recurrence per
          # `.claude/rules/incident-to-rule-pipeline.md` §3.1.
          # Override: PR body trailer `ENTITY_MAPPER_DRIFT_OVERRIDE: <reason>`.
          bash scripts/check-entity-mapper-consistency.sh --warn


  test-skip-ratio:
    name: Frontend test skip-ratio (GAP-346 — WARN mode)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run self-test (synthetic fixtures)
        run: bash scripts/check-test-skip-ratio.sh --self-test

      - name: Report skip ratio per frontend project (WARN mode — GAP-346)
        run: |
          # Per GAP-346: kiteclass-frontend has a high test skip ratio
          # (vitest reports 26.7% skipped tests). This makes the call-site skip
          # ratio VISIBLE in CI so it can't silently grow. WARN-only — does NOT
          # block. Bulk un-skip (Next.js-15 use(params) describe.skip migration)
          # is DEFERRED to a separate follow-up gap per
          # `incident-to-rule-pipeline.md` premature-rule guard (WARN-first;
          # HARD STOP only after the un-skip backlog is cleared).
          # Override: PR body trailer `TEST_SKIP_RATIO_OVERRIDE: <reason>`.
          bash scripts/check-test-skip-ratio.sh


  script-tests:
    name: Script tests (`scripts/tests/test-*.sh` fixture-based)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run all script tests
        run: |
          # Wave 76 Bucket B — fixture-based tests for scripts/check-*.sh.
          # Each test-*.sh creates synthetic fixture(s) + invokes the check
          # script + asserts exit codes (PASS/FAIL behavior). prune-merged-
          # worktrees tests run --dry-run mode only in isolated temp git
          # repos (NO mutation of real branches).
          bash scripts/tests/run-all.sh

