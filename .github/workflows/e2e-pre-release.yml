name: Test — E2E Pre-release Gate

# GAP-403 — runs full Playwright suite trước khi promote release-candidate tags lên production.
# Trigger:
#   - push tag matching v*.*.*-rc* (e.g., v1.0.0-rc.1, v0.9.0-rc1)
#   - workflow_dispatch (manual)
on:
  push:
    tags:
      - 'v*.*.*-rc*'
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL để Playwright trỏ vào (override default)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.frontend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - kiteclass-frontend
          - kitehub-frontend
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.staging_url || vars.STAGING_URL || 'https://staging.kite.vn' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(pnpm -F ${{ matrix.frontend }} list @playwright/test --depth 0 --json \
            | grep -oE '"version": "[^"]+"' | head -1 | cut -d'"' -f4)
          echo "version=${version:-1.40.0}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F ${{ matrix.frontend }} exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -F ${{ matrix.frontend }} exec playwright install-deps chromium

      - name: Run Playwright (kiteclass-frontend critical-journeys)
        if: matrix.frontend == 'kiteclass-frontend'
        env:
          CI: 'true'
        run: |
          pnpm -F kiteclass-frontend exec playwright test \
            --project=chromium \
            critical-journeys/

      - name: Run Playwright (kitehub-frontend beta-funnel)
        if: matrix.frontend == 'kitehub-frontend'
        env:
          CI: 'true'
        run: |
          pnpm -F kitehub-frontend exec playwright test \
            --project=chromium \
            beta-funnel/

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.frontend }}
          path: |
            ${{ matrix.frontend == 'kiteclass-frontend' && 'kiteclass/' || 'kitehub/' }}${{ matrix.frontend }}/playwright-report/
            ${{ matrix.frontend == 'kiteclass-frontend' && 'kiteclass/' || 'kitehub/' }}${{ matrix.frontend }}/test-results/
          retention-days: 14

  gate-summary:
    name: Pre-release Gate Summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.e2e.result }}" == "success" ]]; then
            echo "::notice::E2E pre-release gate PASSED — tag eligible for production promotion"
          else
            echo "::error::E2E pre-release gate FAILED — tag MUST NOT be promoted to production"
            exit 1
          fi
