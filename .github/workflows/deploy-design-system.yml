name: Deploy Design System to GitHub Pages

# 1-time user setup REQUIRED before this workflow can succeed:
#   1. Repo Settings → Pages → Source = "GitHub Actions"
#   2. Trigger first run: gh workflow run deploy-design-system.yml
#
# After the first successful manual run, change the trigger below to
# include `push:` on `main` for `documents/02-architecture/design-system/ui_kits/**`
# if auto-rebuild on every UI change is desired.
#
# Manual-only trigger keeps CI green until Pages is enabled by repo owner.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload ui_kits artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documents/02-architecture/design-system/ui_kits

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
