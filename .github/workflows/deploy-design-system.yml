name: Build — Design System (GitHub Pages)

# Auto-deploy enabled 2026-05-05 after first successful manual run
# (run #25364989414) confirmed Pages source = "GitHub Actions" wired correctly.
#
# Triggers:
#   - push to main when ui_kits/** changes (auto-rebuild on UI kit changes)
#   - manual workflow_dispatch (kept for ad-hoc re-deploy or rollback)
on:
  push:
    branches: [main]
    paths:
      - 'documents/02-architecture/design-system/ui_kits/**'
      - '.github/workflows/deploy-design-system.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload ui_kits artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documents/02-architecture/design-system/ui_kits

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
