name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'kitehub/**'
      - 'kiteclass/**'
      - 'infrastructure/helm/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER: kitehub-eks
  HELM_NAMESPACE: kitehub

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: staging-${{ github.sha }}
        run: |
          for service in kitehub-subscription kitehub-gateway kitehub-branding kitehub-admin kitehub-email kitehub-frontend; do
            echo "Building $service..."
            docker build -t $REGISTRY/kitehub/$service:$TAG \
              -f kitehub/$service/Dockerfile kitehub/
            docker push $REGISTRY/kitehub/$service:$TAG
          done

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy with Helm
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: staging-${{ github.sha }}
        run: |
          helm upgrade --install kitehub ./infrastructure/helm/kitehub \
            --namespace ${{ env.HELM_NAMESPACE }} --create-namespace \
            --set global.image.registry=$REGISTRY/kitehub \
            --set global.image.tag=$TAG \
            --set global.database.host=${{ secrets.RDS_ENDPOINT }} \
            --set global.redis.host=${{ secrets.REDIS_ENDPOINT }} \
            --wait --timeout 5m

      - name: Smoke test (gateway health quick-check)
        run: |
          GATEWAY_URL=$(kubectl -n ${{ env.HELM_NAMESPACE }} get svc kitehub-gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -sf "http://$GATEWAY_URL:9000/actuator/health" || exit 1
          echo "Staging deployment healthy"

      # GAP-377 (Wave 26 Bucket C) — full post-deploy smoke suite (16+ assertions
      # across health/legal/auth/API/ConsentBanner/error-handling/gateway routing).
      # On failure: log + exit 1. Auto-rollback wiring deferred — track follow-up
      # in `release-1-deploy-plan.md` §3.3 / GAP-378 rollback runbook.
      - name: Post-deploy smoke test (GAP-377)
        run: |
          KH_URL="${{ vars.STAGING_KH_URL }}"
          KC_URL="${{ vars.STAGING_KC_URL }}"
          KH_URL="${KH_URL:-https://staging.kitehub.vn}"
          KC_URL="${KC_URL:-https://staging.kiteclass.vn}"
          echo "Running smoke suite against KH=$KH_URL  KC=$KC_URL"
          ./scripts/smoke-test.sh "$KH_URL" "$KC_URL"

      - name: Notify
        if: always()
        run: echo "Staging deploy ${{ job.status }} - ${{ github.sha }}"
